what: 'Henderson: ''highly probable that they were shown either at the meeting of the Confederate Nobles held on the 4th December,
  or at the meeting of Parliament held on the 15th, or at both''. The Act of 15 Dec was expunged from the records and survives
  because it was printed in 1568. The two descriptions of the letters differ (''subscrivit'' only in the minute).'

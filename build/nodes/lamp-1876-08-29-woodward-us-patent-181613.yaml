what: US 181,613, 'Improvement in Electric Lights', Henry Woodward 'of the city of Toronto, county of York, Province of Ontario',
  application filed 4 Jan 1875, dated 29 Aug 1876; assigned by mesne assignments to R. M. Wells, T. R. Fuller and E. Heimrod
  'of same place' and C. H. Woodward of Lindsay, Canada. A piece of carbon is fitted with electrodes in a globe; the air is
  exhausted and the globe 'filled with a rarefied gas that will not unite chemically with the carbon when hot'; the claim
  is the carbon in combination with a lamp vessel filled with such a gas. No assignment to Edison is shown on the patent.

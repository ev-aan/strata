id: lamp-1893-02-18-colt-rules-on-goebel-defence-boston
rev: 1
type: event
label: '18 Feb 1893: Colt J. (D. Mass.) grants Edison an injunction, finding Goebel''s 1854 lamp ''extremely improbable'''
time: '1893-02-18T12:00:00Z'
precision: day
kind: official
status: single
what: '54 F. 678, on a motion for a preliminary injunction, on about forty affidavits for Goebel and others against: ''It
  is extremely improbable that Henry Goebel constructed a practical incandescent lamp in 1854''; whether he made lamps 1,
  2 and 3 ''it is not necessary to determine. The weight of evidence on this motion is in the direction that he made these
  lamps, or lamps similar in general appearance ... But assuming they were made, they do not anticipate the invention of Edison.
  At most they were experimental toys''; of lamp No. 4: ''It is simply impossible, under the circumstances, to believe that
  a lamp so constructed could have been made by Goebel before 1872.'' The court applied the rule that a new defence against
  a patent already upheld must be proved convincingly. Injunction granted.'

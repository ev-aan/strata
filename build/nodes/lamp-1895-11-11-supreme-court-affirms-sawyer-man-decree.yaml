what: '159 U.S. 465 (argued 29-30 Oct 1894, decided 11 Nov 1895; the scan''s heading misprints the year as ''1815''), Brown
  J.: ''we are all agreed that the claims of this patent, with the exception of the third [carbonised paper], are too indefinite
  to be the subject of a valid monopoly''; the question of priority ''becomes unnecessary''; ''the decree of the Circuit Court
  is Affirmed''. The Court also recounts Edison''s search among ''about forty different kinds of bamboo'' and says he ''despatched
  a man to Japan''.'

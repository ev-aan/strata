what: The Saudi Interior Ministry statement, read in English on the Saudi Press Agency, says the aircraft "landed safely at 9:45 a.m. with 174
  passengers and an eight-member flight crew on board"; the text gives no time zone (Saudi time, UTC+3, is assumed, giving 06:45 UTC), and Al
  Jazeera's rendering adds "local time (06:45 GMT)". Tabuk airport (quoted by Khaleej Times) gives 9:45 a.m. Saudi time and says its air traffic
  control received a distress call at 8:44 a.m. Saudi time (05:44 UTC). CNN gives touchdown at "9:54 a.m."; that is nine minutes after the two
  Saudi sources; CNN's source for the figure is not stated and the difference is not resolved. AirNav Radar's blog says the flight "landed safely
  at Tabuk" with last ADS-B data at about 06:58 UTC, and Khaleej Times says Flightradar24's final signal was at about 10:58 a.m. UAE time (06:58
  UTC); a last signal can come after touchdown, but AirNav's wording equates them. The landing time is therefore open.

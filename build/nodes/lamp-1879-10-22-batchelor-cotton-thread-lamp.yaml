what: 'Edison Papers, Doc. 1831 (Batchelor''s notebook entry, ''[Menlo Park,] Oct 22nd 1879 9 A.M.''): ''some very interesting
  experiments on straight carbons made from cotton thread''; ''a piece of 6 cord thread No 24 ... about 13 thousandths in
  thickness'', carbonised in a closed chamber and put ''in vacuo''; ''it gave a light equal to about 1/2 candle 18 cells'',
  resistance 113 ohms at starting, afterwards 140. ''No 9: On from 1.30 AM till 3 pm 13 1/2 hour and was then raised to 3
  gas jets for 1 hour then cracked glass & busted.'' The Papers'' essay ''The Carbon-Filament Lamp'' says the same. Clock
  times are the notebook''s own; no time zone is given. The notebook image (N-79-07-31, p. 105) was not opened.'

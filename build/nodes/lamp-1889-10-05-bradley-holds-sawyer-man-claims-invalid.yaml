type: event
label: '5 Oct 1889: Circuit court dismisses the Sawyer-Man patent suit (Consolidated Electric Light Co. v. McKeesport Light
  Co.)'
time: '1889-10-05T12:00:00Z'
precision: day
kind: official
status: single
what: '40 F. 21 (C.C.W.D. Pa., 5 Oct 1889), Bradley J.: the Sawyer-Man patent (granted 12 May 1885; application filed 9 Jan
  1880), apart from its third claim which was not in issue, is held to amount to ''the broad claim of the exclusive use, in
  incandescing lamps, of all carbons made of fibrous or textile materials'' (headnote), and is held invalid; the court was
  ''not at all satisfied that Sawyer and Man ever made, and reduced to practical operation, any such invention'', and found
  that the specification had been changed in 1885, after Edison''s work was published, from the arched carbon to all fibrous
  carbons. ''The bill must be dismissed.'' '

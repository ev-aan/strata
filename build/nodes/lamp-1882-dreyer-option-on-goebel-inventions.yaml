kind: witness
status: single
what: '54 F. 678, summarising William G. Dreyer''s affidavit: ''in 1882 he did procure from [Goebel] an option for three months
  of all his inventions relating to electric lighting'' for $500, extended for three months for another $425. Goebel said
  he had made small incandescent lamps called the ''fiddle bow''; Dreyer ''made every effort to find one, but never succeeded''.
  No month is given.'

what: 'Fontaine (1878): ''in 1873 a Russian physicist, M. Lodyguine, resuscitated both [lighting by incandescence and its
  principle], and invented a new lamp''. The St Petersburg Academy''s report by Wild, quoted by Fontaine, says Lodygin replaced
  platinum with small carbon bars heated in a hermetically sealed glass receiver from which oxygen is expelled; Fontaine adds
  ''Nothing is less practical nor less studied than the apparatus of this inventor.'' Kommersant (2024) gives 1872 for the
  first demonstration and says early samples lasted 30-40 minutes.'

what: 'Davy, Elements of Chemical Philosophy, pp. 85-86: with the Royal Institution''s battery of 2000 double plates, pieces
  of charcoal about an inch long and one sixth of an inch across, brought within a thirtieth or fortieth of an inch, gave
  ''a bright spark'', and ''more than half the volume of the charcoal became ignited to whiteness''; drawn apart, ''a constant
  discharge'' formed ''a most brilliant ascending arch of light'' of at least four inches. The book gives no date for the
  experiment.'

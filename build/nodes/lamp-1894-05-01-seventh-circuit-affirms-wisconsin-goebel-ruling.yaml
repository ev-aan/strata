precision: day
kind: official
status: single
what: '61 F. 834 (7th Cir., 1 May 1894), on appeal from the preliminary injunction in 57 F. 616: the right of an owner of
  a patent upheld after protracted litigation to a preliminary injunction can be defeated only by a new defence proved convincingly;
  the court says that, ''without designing to suggest what result should be reached upon final hearing'', the story of Goebel''s
  early lamps ''is surrounded by such an atmosphere of improbability'' that until sifted and sustained at final hearing it
  ought not to invade the patent holder''s monopoly. This is the same case on appeal reviewing a discretionary preliminary
  ruling, not a fourth case.'

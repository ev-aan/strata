what: Abridgment of British patent 9053 (A.D. 1841, August 21), Frederick de Moleyns, 'the production or developement of electricity,
  and the application of electricity for the attainment of illumination and motion'. Its second head is 'a means of generating
  the electric light, by constantly supplying the electrodes at their junction, with pulverized charcoal' from a tube; the
  electrodes are two coils of platinum wire, the lower enclosing spongy platinum, and 'the whole arrangement is enclosed in
  an exhausted glass globe'. The abridgment does not use the words 'glow' or 'incandescent'. The Supreme Court (1895) calls
  it a patent for an incandescent electric lamp using finely pulverized boxwood charcoal or plumbago. The full specification
  was not read.

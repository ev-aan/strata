kind: official
status: single
what: '52 F. 300 (C.C.A. 2d Cir., 4 Oct 1892), Lacombe J.: the second claim of patent 223,898 (carbon filament in an all-glass
  exhausted receiver with the conductors through the glass) is sustained and the decree affirmed. On the patent''s term the
  court holds the patent in suit not affected by the loss of a Swedish patent (directly, or through Canadian patent No. 10,654
  of 17 Nov 1879) and the Commissioner''s attempted ''certificate of correction'' limiting the term ''wholly void''. The decree
  is ''affirmed, with costs''.'

id: period-old-kingdom-egypt
rev: 1
type: event
label: 'Old Kingdom of Egypt: all six authorities cover 2600 to 2190 BCE, but they differ on both ends'
time: -2600-01-01T00:00:00Z
end: -2190-12-31T00:00:00Z
precision: year
date_basis: derived
kind: analysis
status: disputed
what: 'Six authorities define the Egyptian Old Kingdom differently, as recorded in PeriodO: it starts between 2700 and 2600
  BCE and ends between 2190 and 2130 BCE. The bar is the span all six agree on (2600 to 2190 BCE); the pale window is the
  outer bounds across the six (2700 to 2130 BCE). A date inside the period, such as a king''s reign, inherits this uncertainty
  unless it has its own source.'
window:
  earliest: -2700-01-01
  latest: -2130-12-31
  certainly_covers:
    from: -2600-01-01
    to: -2190-12-31
  begin_note: Earliest start 2700 BCE (EAMENA, printed -2700) and latest start 2600 BCE (Freeman 2004, p. 585). Six authorities,
    six different starts.
  end_note: Earliest end 2190 BCE (Gates 2003, p. 78) and latest end 2130 BCE (Freeman 2004). The UCLA Encyclopedia of Egyptology
    says its own chronology may be replaced.

label: 'Early 1885: Commissioner of Patents decides the Edison-Sawyer-Man interference for Sawyer and Man'
time: '1885-01-15T12:00:00Z'
precision: month
kind: official
status: single
what: '40 F. 21: Edison applied in December 1879 (11 Dec) and Sawyer and Man on 9 January 1880; ''in September, 1880, an interference
  was declared between the two applications'' over carbon made from paper; ''The case was not finally decided until the beginning
  of 1885.'' Broadnax, the attorney who prepared the Sawyer-Man application, is quoted as speaking of ''the decision of the
  commissioner of patents of the interference, awarding priority of invention to Sawyer and Man'' and puts the amendments
  that followed in February and March 1885. The Commissioner''s decision itself was not read.'

what: Fontaine (1878) prints a communication he says 'M. Jobart' made 'to the Academy of Sciences on the 27th of February,
  1858'. In it, in de Changy's laboratory, 'a dozen small miner's lamps' were in circuit; 'the lamps, which are enclosed in
  hermetically sealed glass tubes', are lit 'by the incandescence of platinum'; one 'was lit in the hollow of my hand'. Fontaine
  places de Changy 'in Belgium' and Jobard 'of Brussels'. Whether the tubes were exhausted is not stated in the passage. The
  Academy's own report (Comptes rendus) was not read.

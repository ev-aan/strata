what: US 223,898, 'Electric-Lamp', Thomas Alva Edison 'of Menlo Park, in the State of New Jersey', patented 27 Jan 1880. Claim
  1 is a carbon filament of high resistance; claim 2 carbon filaments in a receiver made entirely of glass and exhausted of
  air, with the conductors passing through the glass; the specification names a mercury pump. The place is the inventor's
  address as printed (the scan's OCR of the address is poor; 'Menlo Park, New Jersey' is read from it), not where the patent
  issued.

id: lamp-1893-04-21-hallett-refuses-injunction-goebel-defence-st-louis
rev: 1
type: event
label: '21 Apr 1893: Hallett J. (E.D. Mo.) refuses an injunction on bond: ''a fair preponderance of testimony'' for Goebel'
time: '1893-04-21T12:00:00Z'
precision: day
kind: official
status: single
what: '56 F. 496, on a motion for a preliminary injunction: Goebel ''does not appear to be an adventurer or an impostor'';
  ''there is a fair preponderance of testimony in support of the Goebel claim''; ''a defense which puts the case in doubt
  is sufficient to defeat the application''. Judge Hallett says he does ''not feel compelled to accept the opinion of the
  court in'' the Boston case. The injunction ''will therefore be refused, if the respondents shall give a bond in the sum
  of $20,000''. The ruling does not decide the Goebel claim finally.'

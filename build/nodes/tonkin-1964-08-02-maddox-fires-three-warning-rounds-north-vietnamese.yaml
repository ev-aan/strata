status: reported
what: 'Hanyok: about 1505 Gulf time (08:05 UTC) the Maddox fired three rounds to warn off the boats; the administration did
  not report this and said the Vietnamese boats fired first. Jets from the Ticonderoga arrived within about fifteen minutes;
  one boat was left dead in the water and two damaged.'

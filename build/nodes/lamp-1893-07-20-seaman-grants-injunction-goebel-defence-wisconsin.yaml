rev: 1
type: event
label: '20 Jul 1893: Seaman J. (E.D. Wis.) grants Edison an injunction, following Boston and disapproving St. Louis'
time: '1893-07-20T12:00:00Z'
precision: day
kind: official
status: single
what: '57 F. 616, on a motion for a preliminary injunction against lamp makers at Oconto, Wis.: the headnote states the rule
  that a new defence against a patent upheld ''after protracted and expensive litigation'' can be defeated only by ''convincing
  proof as will raise a presumption that it would have defeated the patent'', every reasonable doubt being resolved against
  it; 54 F. 678 followed, 56 F. 496 ''disapproved''. ''I cannot find that [the new affidavits] remove any of the doubts above
  noted.'' Injunction granted.'

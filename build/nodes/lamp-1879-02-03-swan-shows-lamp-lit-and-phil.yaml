what: 'Swan, lecture of 20 Oct 1880 (Chemical News 42, pp. 227, 230): he began by referring to ''my last lecture on Electric
  Lighting, almost two years ago'', and later said ''there are many here who will remember this little lamp, which I showed
  here two years ago in action'', ''composed entirely of three substances, namely, glass, platinum, and carbon''. No 1879
  report of the showing was found. The dates 3 February 1879 (Newcastle University; Linda Hall Library) and 17 January 1879
  (Histelec) are from secondary pages that were seen only as search summaries.'

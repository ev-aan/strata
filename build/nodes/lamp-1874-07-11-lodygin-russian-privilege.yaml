what: 'Kommersant (St Petersburg, 11 Jul 2024), marking 150 years: on 11 July 1874 the home patent office issued Lodygin privilege
  No. 1619, ''interestingly'' with the priority dated retroactively, from 2 October 1872; the article also says he petitioned
  for a privilege in 1872 and, in another passage, that the first patent for an incandescent lamp ''was received'' that day.
  One later newspaper history; no scan of the privilege. LOW CONFIDENCE (owner decision): the number, the 11 July 1874 date
  and the backdated priority all come from this one newspaper history with no scan of the privilege; the same page says the
  Russian patent came ''only a year'' after the 1872 petition, which does not fit a July 1874 grant, so these details are
  unverified.'

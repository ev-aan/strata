what: 'Abridgment of British patent 10,919 (A.D. 1845, November 4), Edward Augustin King, ''a communication'': ''The application
  of continuous metallic and carbon conductors, intensely heated by the passage of a current of electricity, to the purposes
  of illumination.'' A current is passed through thin platinum foil under a glass shade; where carbon is used it is to be
  enclosed in a ''Torricellian'' vacuum (the abridgment''s scan is damaged at that phrase; 40 F. 21 quotes the specification:
  ''When carbon is used, it becomes necessary ... to exclude from it air and moisture ... it should be inclosed in a Torricellian
  vacuum''). The abridgment does not name Starr; Judge Colt (54 F. 678, 1893) says ''Starr suggested in the King patent a
  lamp composed of a thin pencil of carbon, inclosed in a Torricellian vacuum''. The full specification was not read.'

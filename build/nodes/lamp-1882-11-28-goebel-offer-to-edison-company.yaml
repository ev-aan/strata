what: '54 F. 678, summarising Sherburne B. Eaton''s affidavit: ''On November 28, 1882, Henry Goebel, Jr., called upon him
  ... and made another offer to sell the inventions and good will of his father, naming the price of $20,000''; on 12 December
  1882 he ''was informed that the company did not wish to buy''. This is not the earliest trace of the Goebel claim: Curtis
  (early 1882), the Dickersons'' approach (May 1882) and Dreyer''s option (1882) are earlier.'

what: '54 F. 678, summarising Leonard E. Curtis''s affidavit: he ''first heard of Henry Goebel in the early part of 1882'',
  and Goebel told him he ''had made incandescent lamps like Edison''s as early as about 1850'', used ''for laboratory experiments''
  and not continued ''for more than a year or two after 1850''. Curtis inquired again in 1892 (Sawyer-Man injunction motion)
  and the defence was put forward in the 1893 suits.'

what: 'Chemical News 39: at the Newcastle Chemical Society meeting, Mr. J. W. Swan in the chair (the meeting ''immediately
  preceding Christmas''), the chairman ''described an experiment he had recently performed on the production of light, by
  passing a current of electricity through a slender rod of carbon enclosed in an exhausted globe'', current from a Siemens
  dynamo-electric machine ''of the second or 6000 candle size''. The rod ''glow[ed] with great splendour'', the glass ''became
  coated with a sooty deposit on its inside'', and the rod ''became curved to the form of a bow, as if from softening''. B.
  S. Proctor''s note in the same volume (read 27 Mar 1879) says that ''at our meeting in December, 1878, Mr. J. W. Swan exhibited
  an electric lamp ... which had broken down''. The report prints no day. The `time` is the middle of the December 1878 window;
  no source read gives a day (an earlier 18 Dec came from secondary summaries that were not kept).'

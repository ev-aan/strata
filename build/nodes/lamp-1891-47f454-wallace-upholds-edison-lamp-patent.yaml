label: 'July 1891: Wallace J. holds Edison''s claim 2 valid and infringed (47 F. 454)'
time: '1891-07-15T12:00:00Z'
precision: month
kind: official
status: reported
what: '47 F. 454 (C.C.S.D.N.Y., 1891), Wallace J.: Edison was ''the first to make a carbon of materials and by a process which
  was especially designed to impart high specific resistance to it'', ''the first to make a carbon in the special form for
  the special purpose of imparting to it high total resistance'', and ''the first to combine such a burner with the necessary
  adjuncts of lamp construction to prevent its disintegration and give it sufficiently long life''; ''By doing these things
  he made a lamp which was practically operative and successful''. The reporter prints ''1891'' only; 57 F. 616 says the judgment
  was obtained in July 1891.'

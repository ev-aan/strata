what: 'Chemical News 42 (5 Nov 1880): J. W. Swan, lecture to the Newcastle-upon-Tyne Literary and Philosophical Society, 20
  October 1880. He describes an experiment ''about twenty years ago'' with a carbonised paper arch in a vacuum that ''became
  red-hot'' and bent until it broke; calls it ''the very first instance in which carbonised paper was ever used in the construction
  of an incandescent electric lamp''; and says a Scribner''s article''s statement that Edison was first to use carbonised
  paper ''is incorrect''. It is Swan''s own account, given while he disputed priority with Edison.'

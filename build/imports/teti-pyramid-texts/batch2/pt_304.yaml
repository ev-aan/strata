notes: >
  PT 304 introduces the most concrete physical image of heavenly ascent in the
  corpus — a literal ladder with side rails, celestial guardians, and a gate
  that must be asked to open. Unlike the solar-bark (PT 217), the stellar
  absorption (PT 273–274), or the star-identification (PT 373), the ladder is
  an engineered structure. The king climbs rather than flies, absorbs, or transforms.
  The daughter of Anubis standing at the rails is the most intimate guardian
  figure in the corpus — she is at the exact point of celestial entry, touching
  the infrastructure of heaven.

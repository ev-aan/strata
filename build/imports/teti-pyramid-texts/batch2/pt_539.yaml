lexical_anchors:
  - term_transliteration: "pr r pt"
    semantic_field: "Ascend to / go up to heaven"
    notes: >
      pr = go out, leave, ascend (from house sign O1 with open door).
      r = to, toward.
      pt = sky/heaven.
      'pr r pt' is the standard ascension phrase — the king exits the earthly
      realm and moves toward the sky. In a litany, this phrase (or a variation)
      would repeat across multiple stanzas with different divine destinations
      or different modes of ascent named.
    attestation_range: "pr r pt throughout PT ascension spells and later funerary literature."

  - term_transliteration: "Hsb"
    semantic_field: "Litany / counting formula"
    notes: >
      The litany form in Egyptian ritual is structured around counted or sequenced
      addresses. A PT litany of ascension may address multiple divine beings
      sequentially, with the king's ascension affirmed in relation to each.
      The structural parallel is PT 217's cardinal-direction announcements —
      a proto-litany form already in the first batch. PT 539 may be a fully
      developed litany version of the same ascension-announcement structure.

divergence_points:
  - id: litany_as_genre
    claim: "PT 539 is a 'litany' — a structurally distinct spell type"
    state: proposed
    positions:
      - scholar: "Mercer 1952"
        reading: >
          Chapter XXVIII heading: 'A Litany of Ascension.' This is a generic
          classification — Mercer recognised a formal difference in PT 539
          from surrounding spells.
      - scholar: "Allen 2005 (expected)"
        reading: >
          Allen's wall-sequence analysis may reclassify PT 539 — his approach
          organises by architectural position and thematic function rather than
          formal genre. Whether Allen retains the 'litany' classification: searched_gap.
    note: >
      The genre classification 'litany' carries implications for how the spell
      was performed — orally, with repetition, in a ceremonial context. If Allen
      reclassifies it, the performance register changes. This is a case where
      the classification system itself is an interpretive claim.


notes: >
  PT 539 is included as the representative of the litany genre in the PT corpus —
  a structural form distinct from individual utterances, paired hymn series,
  and ceremonial meal/offering texts. The repetitive litany structure implies
  a different performance context: probably chanted by a lector-priest (xrj-Hbt)
  during the final procession through the pyramid passage. Its high Sethe number
  and single-chapter classification make it one of the most under-documented spells
  in accessible secondary literature. Sethe 1908 vol. 2 is the primary unlock.

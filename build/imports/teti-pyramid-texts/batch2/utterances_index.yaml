# ─── TIMEGRAPH SUMMARY ────────────────────────────────────────────────────────
# All eight utterance entries share the carving date window.
# The timegraph should render:
# 1. A band: -2345 to -2323 (±10 yr) — all carvings
# 2. Discrete nodes within the band for specific innovations:
#    - sarcophagus inscription (PT 1–7): first instance — no predecessor
#    - dd-mdw monogram: first use, same date band
# 3. Transmission nodes AFTER the band:
#    - PT 32 on Pepi I libation table: ~-2289
#    - PT 273–274 as Coffin Text 573: -2055 to -1650
# 4. Discontinuity: PT 273–274 absent from Book of the Dead: ~-1550 onward

timegraph_nodes:
  - id: teti_reign_and_carving
    type: date_range
    start: -2345
    end: -2323
    uncertainty: 10
    label: "Teti pyramid texts carved"
    covers: [pt_001_007, pt_023, pt_032, pt_213, pt_217, pt_246, pt_273_274, pt_373]

  - id: pt32_pepi1_mortuary_temple
    type: transmission_event
    date: -2289
    label: "PT 32 appears outside pyramid — Pepi I mortuary temple libation table"
    significance: "First Pyramid Text utterance in a non-sealed ritual space"

  - id: cannibal_hymn_coffin_texts
    type: transmission_event
    start: -2055
    end: -1650
    label: "PT 273–274 as Coffin Text Spell 573 — private/non-royal use"
    significance: "Royal exclusivity of the Cannibal Hymn broken; content modified"

  - id: cannibal_hymn_dropped
    type: discontinuity
    date: -1550
    label: "Cannibal Hymn absent from Book of the Dead — transmission ends"
    significance: "Active selection against transmission; reason undocumented"

# ─── PRIMARY SOURCE GAPS (consolidated) ───────────────────────────────────────
# These are the single most important source to unlock this dig.
# Ranked by impact on number of searched_gap fields.

primary_source_gaps:
  - rank: 1
    source: "Sethe, K. 1908–1910. Die altägyptischen Pyramidentexte. Leipzig. Vol. 1."
    impact: >
      Resolves: all hieroglyphic_unicode fields, all MdC transliteration fields,
      sethe_phrase_range fields, and several translation divergence points.
      This is the canonical hieroglyphic source for the entire dig.
    confirmed_location_within_source: "pp. 205–216 for PT 273–274; remainder by section."

  - rank: 2
    source: "Allen, J.P. 2005. The Ancient Egyptian Pyramid Texts. SBL Press. pp. 65–96 (Teti corpus)."
    impact: >
      Resolves: allen_2005 translation fields for all utterances, wall sequence
      confirmation for Teti-specific placement, Akhet etymology, Osirian emphasis
      quantification, and concordance between Sethe numbers and Allen's wall-order system.

  - rank: 3
    source: "Leclant, J. et al. Restoration reports (1958–1999). Saqqara pyramid projects."
    impact: >
      Resolves: physical_condition fields for Teti's specific walls.
      The burial chamber north/south wall condition in Teti (vs. Unas) is documented
      only in these reports. Required to assess what is still legible in situ.

# ─── ADDING FUTURE UTTERANCES ─────────────────────────────────────────────────

adding_utterances:
  instruction: >
    To add a new utterance:
    1. Create utterances/pt_{number}.yaml following utterance_schema.yaml
    2. Add an entry to the utterances list above in PT number order
    3. Add any new timegraph nodes to the timegraph_nodes list
    4. Update primary_source_gaps if a new source gap is identified
    5. Do NOT renumber existing entries
    6. All dates must be integers (BCE as negative) for timegraph compatibility

  candidate_utterances:
    - pt: 23
      note: "Already included — note this is a reminder to not duplicate"
    - pt: 260
      note: "Final spell of antechamber west wall — transition to east wall sequence"
    - pt: 301
      note: "Final spell of antechamber east wall — prelude to Cannibal Hymn"
    - pt: 302
      note: "First spell of antechamber north wall — departure from Akhet"
    - pt: 437
      note: "In Praise of Nut — the sky goddess who receives the king"
    - pt: 510
      note: "The king appears as Sobek — animal-form transformation"
    - pt: 534
      note: "For the Protection of the Pyramid Enclosure — apotropaic limit case"


notes: >
  PT 510 is the most theologically unusual utterance in this batch.
  The Sobek transformation, the explicit sexual vocabulary, and the
  'son of Nut' genealogy that contradicts later tradition all make it
  a rich excavation target. Its position beyond the Unas corpus (PT 510 vs.
  Unas's ceiling of ~312) makes it part of the 18 additional Teti spells —
  placing it in the category of Teti-specific or Teti-first attestation.
  The explicit sexual content is not anomalous in the PT corpus — Egyptian
  funerary religion was not prudish — but it is systematically under-documented
  in accessible secondary literature. This makes the Sethe 1908 plates and
  Allen 2005 especially critical for this utterance.

transmission_events:
  - event: "Unas pyramid, antechamber east wall gable"
    date_start: -2375
    date_end: -2345
    note: "First carved instance. Piankoff 1968 plates 28–30, cols 1–29 right-to-left."
    source: "EEF bibliography; pyramidtextsonline.com wall index."
  - event: "Teti pyramid, antechamber east wall gable"
    date_start: -2345
    date_end: -2323
    note: "Second and last Old Kingdom royal instance."
    source: "Wikipedia PT article; Allen 2005."
  - event: "Coffin Texts Spell 573 (private/non-royal)"
    date_start: -2055
    date_end: -1650
    note: >
      Modified form. Appears on private coffins (MzHtj from Asiut, ZAt-HD-Htp
      from El-Bersheh, Iqr from Gebelein). Royal exclusivity broken.
      The modification may reflect deliberate theological revision.
    source: "Barta 1991; Goebs 2004. Cited in CAES Vol. 2, 2016."
  - event: "Book of the Dead — absent"
    note: "Not transmitted. Dropped from the New Kingdom funerary corpus."
    source: "Wikipedia PT article."

parallel_pyramids:
  unas: true
  pepi_i: false
  merenre: false
  pepi_ii: false
  note: "Confirmed: only Unas and Teti. Distribution is a documented archaeological fact."

notes: >
  The Cannibal Hymn is the most extensively studied and debated utterance in the
  Pyramid Texts corpus. Its violence is unparalleled in Egyptian religious literature.
  The scholarly history of its interpretation — from literal cannibalism (Faulkner 1924,
  retracted) to stellar/solar metaphor (Renouf, Allen) to cultural performance
  (Eyre 2002) — is itself a case study in how adoption weight (the 'Cannibal Hymn'
  label) can shape interpretation for 140 years.
  The label 'Cannibal Hymn' was assigned when the text was first published in 1882.
  That label now has massive adoption weight. The Strata dig should treat the label
  itself as a claim requiring examination: is it a 'hymn'? Is it 'cannibal'?
  Renouf raised both questions immediately in the 1880s. They remain open.

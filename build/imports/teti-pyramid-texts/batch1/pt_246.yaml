parallel_pyramids:
  unas: true
  pepi_i: searched_gap
  merenre: searched_gap
  pepi_ii: searched_gap

notes: >
  PT 246 is architecturally the most significant utterance in this set because
  it is the only spell that explicitly identifies its own physical location
  as a theological boundary. The king reads 'stand at the door' while standing
  in the passage that IS the door. This self-referential quality is not found
  elsewhere in the corpus at this level of explicitness.
  The sb3 sign's double meaning (door/star) means the inscription itself
  encodes the transformation: the king is commanded to stand at a door
  that is simultaneously a star. Crossing a threshold and becoming stellar
  are written with the same hieroglyph.

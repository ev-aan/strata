parallel_pyramids:
  unas: true
  pepi_i: searched_gap
  merenre: searched_gap
  pepi_ii: searched_gap

notes: >
  PT 213 is theologically the most important utterance in this initial set.
  The declaration 'you have not gone dead, you have gone alive' is the
  theological inversion at the heart of Egyptian funerary thought: death
  is not an ending but a transition to a different mode of being.
  The Atum limb-formula (§ 135) is remarkable — every part of the king's
  body is identified with Atum (the primordial creator). The king does not
  merely join the gods — he is constituted by divine substance in each limb.
  This is a claim about ontology, not metaphor.

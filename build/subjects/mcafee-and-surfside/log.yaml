  - id: L-09
    date: 2026-10-02
    entry: >
      DRAFTED after the owner confirmed (L-07) and agreed to wait for primary sources (L-08); access was then opened. READ
      DIRECTLY: NIST's Champlain Towers South page (updated 22 June 2026) and its 9 September 2025 update; Snopes (25 Jun 2021);
      PolitiFact (25 and 28 Jun 2021); a USA Today fact check; the AFP report on the Spanish court (29 Sep 2023). NOT READABLE
      FROM HERE: the Internet Archive's capture of @officialmcafee (its availability record exists: 25 Jun 2021 20:38:56 UTC);
      the Miami-Dade property appraiser (bot challenge); the GAO report (403); the Spanish ruling itself. 11 claims, 3 tests, 1
      reception thread, a three-panel timeline, and a sources manifest with authenticity entries (rules A1-A10).
  - id: L-10
    date: 2026-10-02
    entry: >
      MAIN FINDINGS. (1) NIST's own wording: "the collapse began in early June, when two connections between garage columns and
      the pool deck failed", with distress visible in the preceding weeks. McAfee died on 23 June. A link running from his death to
      the failure cannot hold if the failure started earlier. This is a positive, physical anchor, unlike an absence. (2) The
      screenshot of the alleged 8 June tweet was checked by four independent organizations that searched the account's own
      record and third-party archives and found nothing; one reports a genuine 8 June tweet with the same timestamp, which suggests a
      template. It is recorded as forged, strength moderate: the main anchor is an absence (capped), and we have not seen the
      image or read the archive capture. (3) The "31TB" figure comes from a genuine 9 June 2019 tweet that did not say where
      the files were. (4) The AP reviewed property records and found neither McAfee nor his wife listed as owners of any unit; not
      repeated by us; ownership through a company would not show. (5) On McAfee's death, the only forensic and judicial findings
      read say suicide; his widow and lawyer publicly doubted it and no independent review was found. This is filed as a documented
      finding (established) plus a gap (searched_gap); no evidence of homicide was located in what was read.
  - id: L-11
    date: 2026-10-02
    entry: >
      CORRECTIONS AND CARE. (a) Earlier entries described the unit-ownership point as "reported by fact-checkers"; it is: the
      AP and PolitiFact reports, now read. (b) The collapse time is about 1:30 a.m. EDT per NIST and about 1:22 per other reports; both are
      drawn. (c) The address: the fabricated tweet says "88th Street and Collins Avenue" and PolitiFact says that
      is the site's intersection; USA Today quotes the building's address as 8777 Collins Avenue. The two are near, and
      the difference is recorded, not resolved. (d) The claims carry no judgement of McAfee's family, whose doubt is
      recorded respectfully, nor of the Surfside victims.
  - id: L-12
    date: 2026-10-02
    entry: >
      HEADLINE: "Was the Surfside Collapse Tied to John McAfee's Death? No: NIST Says It Began in Early June 2021" (96 characters).
      Backing claim: surfside-deliberate-timed-to-mcafee (refuted, high, evidential weight 4, anchors read directly). headline_status:
      review, pending the owner's approval. Limit stated on the claim: NIST's page summary does not say whether sabotage was
      specifically tested and excluded.
  - id: L-13
    date: 2026-10-02
    entry: >
      TO DO FOR A HUMAN WITH A BROWSER (four short checks that would raise the weaker claims): (1) open the Internet Archive
      capture of @officialmcafee dated 25 Jun 2021 20:38 UTC and scan the timeline for any post about files, a condo or Miami;
      (2) search the Miami-Dade Property Appraiser and Clerk records for owner names McAfee at the building's folios, including
      entities; (3) obtain the Spanish court's ruling of 24 July 2023 and any autopsy summary; (4) read NIST's technical report
      and check which scenarios it excluded, including any external cause.

  - id: mcafee-june8-tweet-posted
    state: refuted
    statement: >
      McAfee posted, on 8 June 2021, a tweet saying "If anything ever happens to me, please know that the 31TB (terabytes) of
      files I have are located on hard drives in my condo near 88th Street and Collins Avenue just north of Miami Beach."
    evidence_class: primary_text
    confidence: moderate
    statement_kind: judgment   # assigned by rule 2026-10-02, to be reviewed
    evidential_weight: 3   # of 5; the main anchor is an absence, capped
    anchor_checked: secondary   # fact-checkers' searches read; our own capture check was blocked
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Circulated as a screenshot on Instagram and Twitter from 25 June 2021.
    would_change_if: >
      an independent capture of his account showing the post, or a platform record that it was posted and deleted
    refutes_target: "McAfee posted the 8 June 2021 tweet about 31TB of files in a Miami condo"
    next_step: >
      Open the Internet Archive's capture of @officialmcafee (25 June 2021, 20:38 UTC; its availability record exists) in a browser and look for the post; ask the platform whether any such post was ever made and deleted.
    anchor:
      type: digital-item-absence-plus-template
      description: >
        Four independent organizations checked: PolitiFact (28 Jun 2021: no June 8 tweet on the verified account's timeline;
        two tweets were sent on June 8, neither about files or a condo; no match in Twitter advanced search or AllMyTweets;
        an emailed platform spokesperson), Snopes (25 Jun 2021: not on the timeline; no retweets or quote tweets; after his death
        users archived hundreds of his tweets on Archive.is and Snopes found no such message), USA Today (a genuine June 8
        tweet has the same timestamp as the screenshot, "indicating it could have been the template for a digitally fabricated
        tweet"), and Check Your Fact (a rating only; its work was not read). The screenshot also quotes "88th Street" while the building's address was given as
        8777 Collins Avenue.
      accessible: true
    basis: >
      # V: four fact-checks read; none of their searches was repeated here. Absence anchors are capped at provisional by the
      #    framework; the template match and the independent searches are what lift this to moderate.
      # AUTHENTICITY: the item is recorded as forged, strength moderate, in sources/MANIFEST.yaml (src-alleged-tweet-image),
      #    under rules A3 (two independent testers) and A8 (independent capture needed; not yet read by us).
      Rule 9 satisfied: names its target. The refutation does not rest on consensus: it rests on searches of the account's own

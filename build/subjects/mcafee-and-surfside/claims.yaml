    would_change_if: >
      an archived copy of the account showing different wording, or no such tweet
    next_step: >
      Open the tweet's archived capture and confirm wording and date.
    anchor:
      type: social-post-via-reports
      description: >
        PolitiFact: "In a June 2019 tweet, McAfee claimed to have '31+' terabytes of 'incriminating data' about government
        corruption and threatened to release it if he was ever arrested." USA Today: "The only McAfee tweet about 31 terabytes
        of files is from June 9, 2019 ... he never said where the files were located." TheCount quotes: "If I'm arrested or
        disappear, 31+ terabytes of incriminating data will be released to the press."
      accessible: true
    basis: >
      # V: three outlets agree on the date and content; the post itself was not read. Per AUTHENTICITY rule A8 a digital item needs
      #    an independent capture; the fact-checkers' agreement is moderate support only.

subject: eikon-basilike
discriminating_tests:
  - id: dt-b1
    bounty_id: DT-B1
    question: "Chapter by chapter, does the first-edition text of Eikon Basilike match the writing habits of Charles I, of John Gauden, or of neither, measured against Jeremy Taylor as a control?"
    retires: eikon-charles-wrote-book
    predicts:
      mostly-charles: "Supports the royalist account; a ghostwriter skilled at imitating the King is not excluded."
      mostly-gauden: "Supports Gauden's claim; he may still have worked from royal papers."
      mixed-by-chapter: "Fits the composite view and shows which chapters to look at."
    method: >
      Burrows' Delta on the 150 most frequent words after spelling normalisation; 2,000-word samples; profiles never include the work tested; the decision bar set from
      calibration, not guessed. Positive control first: the phrase matcher from B-001 must find Pamela's prayer in Arcadia unaided.
    run_history:
      - {finding: F6, what: "First run: 19 of 28 chapters nearest Gauden, many in all 200 resampled runs, but 4 chapters nearest Milton, who cannot have written them.", reading: "A warning, not a finding. Kept on record because a headline built on it would have been wrong."}
      - {finding: F7, what: "Genre check: Queen Henrietta Maria's letters scored strongly 'Charles' (0.606 vs 0.85-0.89 for others); Taylor's letter scored 'Gauden'.", reading: "The first Charles profile detected letters, not Charles. Added Charles's formal argument (Newcastle papers 1646) and Henderson's replies."}
      - {finding: F8, what: "Calibration: Henderson's held-out passages 7/7 correct; Charles's formal passages nearest a Charles profile 5/5, never Gauden; none of 31 passages by other clergy came out as Charles.", reading: "The Charles profile measures Charles, not just 'letters'."}
      - {finding: F9, what: "17 of 31 passages from eight clergy not in the model came out nearest Gauden; Reynolds, Fuller, Hall and Baxter every time.", reading: "'Nearest Gauden' means 'a learned clergyman wrote this'. The 'nearest profile' method was abandoned for a distance comparison."}
    result:
      type: synthetic
      finding: >
        Median Delta distance (lower is closer). Charles's own writing, held out (n=12): to Charles 0.465 (middle half 0.45-0.51), to Gauden 0.744. Gauden's own works (n=25): 0.805 / 0.524
        (0.49-0.58). Eight other clergy (n=31): 0.724 / 0.632 (0.59-0.71). Eikon Basilike (n=29): 0.702 (0.67-0.72) / 0.591 (0.56-0.65).
      reading: "The book's passages are as far from Charles as other clergy are, and the range does not overlap Charles's own. It sits between Gauden's works and other clergy, so it fits Gauden without singling him out."
      chapters: "F12: no chapter of 1,500+ words falls inside Charles's range (0 of 28 in the main check; 0 of 19 in the fair check with formal papers vs a letters profile); at 1,000 words 8 of 26 overlap, so short chapters (about 1, 3, 7, 18, 22, 23, 25) are undecidable."
      accessible: true
      run_files: "questions/eikon-basilike/data-b002/ (README, corpora.py, charles1646.py, delta.py, genre_check.py, genre_matched.py, attractor_check.py, verification.py, pamela_control.py, chapters.py, chapters_fair.py, and their outputs)"
    positive_control:
      finding: F11
      what: "The phrase matcher finds Sidney's prayer unaided: the 1687 'Prayer in time of Captivity' shares 73 six-word phrases with Arcadia, against 0-1 with Gauden, Taylor, Milton or the book's own chapters."
    limits:
      - "Genre: Charles's corpus is private letters (plus 5,900 words of formal prose); Gauden's is sermons and treatises; the book is meditation (gaps G-05, G-06)."
      - "Heavy editing would also remove Charles's habits: the test cannot separate 'someone else wrote it' from 'Charles drafted it and someone else rewrote it'."
      - "Charles's captured letters (The Kings Cabinet Opened) were published by Parliament with annotations; royalists alleged alteration (gap G-02)."
    resolves: "Counts against the book being Charles's own unedited composition. Does not show Gauden wrote it."
    reproduction:
      date: "2026-10-02"
      by: "Strata session, with a delegated helper agent (not an independent review)"
      what: "Downloaded all 32 EEBO-TCP files and the Internet Archive Bruce text; ran the published scripts in README order in a scratch folder, after replacing a hard-coded author path in 8 scripts (scratch copies only; nothing under questions/ touched)."
      result: >
        Exact match on every result line: delta, genre_check, genre_matched, attractor_check, verification (medians to Gauden: Gauden's works 0.524, other divines 0.632, Eikon 0.591, Charles 0.744; to Charles: 0.805,
        0.724, 0.702, 0.465; n = 25/31/29/12), pamela_control (the 487-word prayer: 73 of 482 six-word phrases shared with Arcadia; Gauden 0, Taylor 1, Milton 0, Eikon 1), chapters and chapters_fair.
        Output was identical across three PYTHONHASHSEED values.
      problems:
        - "Eight scripts contain the hard-coded path /home/claude/strata-casket/data-b002, so the published scripts do not run outside the author's machine; the README does not say so."
        - "Run as documented, five outputs carry extra preamble lines (word-count dictionaries) that the published .txt files omit: cosmetic, not numeric."
        - "pamela_control.py finds the prayer by a hard-coded start string and a fixed 2,600-character slice; 'phrases shared' counts distinct n-grams; the 8-word list is cut at 40 hits."
      does_not_show: "That the method is valid, that the genre confound is absent, or that the hard-coded letter selection (KEEP in corpora.py) and line ranges (charles1646.py) are right; those were not audited."
    note: "Not reviewed outside the project: claims stay proposed. A reproduction by the same project shows the code and the published outputs agree; it does not test the method."

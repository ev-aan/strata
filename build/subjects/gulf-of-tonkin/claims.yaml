subject: gulf-of-tonkin
title: "Gulf of Tonkin Incidents (August 1964)"
description: >
  Two separate events are routinely fused: the 2 August 1964 clash between USS
  Maddox and North Vietnamese torpedo boats, and the reported 4 August attack that
  led to the Tonkin Gulf Resolution. Strata keeps them apart. The first happened.
  The second, on the declassified record, did not. Two further questions are kept
  separate again: who inside the intelligence chain skewed the record, and whether
  senior officials KNEW. The first has a documented answer; the second is a genuine
  gap, and it is where conspiracy claims and the evidence part ways. This dig is
  also a calibration case: a real, documented failure of government reporting,
  filed strictly on its own evidence so that it neither inflates nor excuses
  claims in other digs.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (governance, not a claim). Used in every `# V:` line below.
#   V0  recalled or single-source, not confirmed
#   V1  facts agree across 2+ independent search results
#       (secondary reporting; primary document NOT opened)
#   V2  primary document opened and read directly
# STATUS OF THIS DRAFT: the drafting environment blocks every primary host
# (nsa.gov, media.defense.gov, history.state.gov, usni.org, ...), so NOTHING here
# is V2. Best reached is V1. The Hanyok study is therefore known only through
# press and history-site reports of it, which matters for the intent claims below.
#
# QUANTITIES USED (V1 unless noted):
#   Tonkin Gulf Resolution ......... passed 7 Aug 1964; House 416-0 (about 40 min debate),
#                                    Senate 88-2 (about 8 h 40 min debate; Morse, Gruening
#                                    against); signed 10 Aug 1964
#   Contrary SIGINT withheld ....... "almost 90 percent" of intercepts that would have
#                                    conflicted with the attack story did not reach the
#                                    Pentagon/White House (press report of Hanyok; V0 on the
#                                    exact figure until the study is read)
#   Hanyok study ................... written 2001 in the classified Cryptologic Quarterly;
#                                    released 2005
#   Herrick cable .................. flash precedence; received in Washington 13:27 on
#                                    4 August (Washington time); says "No actual visual
#                                    sightings by MADDOX"
#   Giap / McNamara ................ Hanoi, November 1995
#
# SOURCES (search-level):
#   Hanyok study (NSA, and defense.gov mirror):
#     https://www.nsa.gov/portals/75/documents/news-features/declassified-documents/gulf-of-tonkin/articles/release-1/rel1_skunks_bogies.pdf
#     https://media.defense.gov/2021/Jun/29/2002751691/-1/-1/0/SKUNKS.PDF
#   Press and history reports of Hanyok:
#     https://www.sfgate.com/news/article/Tonkin-Gulf-reports-cooked-Historian-s-2598276.php
#     https://www.historynewsnetwork.org/article/17620
#   US Naval Institute, "The Truth About Tonkin":
#     https://www.usni.org/magazines/naval-history-magazine/2008/february/truth-about-tonkin
#   Resolution vote (CFR, Britannica, Senate.gov):
#     https://www.cfr.org/articles/twe-remembers-congress-passes-gulf-tonkin-resolution
#     https://www.senate.gov/artandhistory/senate-stories/chairman-fulbright-and-the-tonkin-gulf-resolution.htm
#   McNamara / Giap, Hanoi 1995:
#     https://archive.seattletimes.com/archive/19951109/2151509/mcnamara-asks-for-truth-about-gulf-of-tonkin----giap-there-was-no-attack
# ---------------------------------------------------------------------------

claims:

  - id: tonkin-aug2-maddox-engaged
    state: established
    statement: >
      On 2 August 1964 North Vietnamese torpedo boats attacked USS Maddox in the
      Gulf of Tonkin; the Maddox and supporting aircraft returned fire.
    evidence_class: primary-text
    confidence: high
    anchor:
      type: contemporaneous-records-plus-adversary-account
      description: >
        US Navy records and the NSA signals intelligence agree, and North Vietnamese
        General Vo Nguyen Giap confirmed the 2 August attack to McNamara in 1995.
      accessible: true
    basis: >
      # V: V1 (Navy history summaries, USNI, Seattle Times and UPI reports agree).
      # TO REACH V2: Naval History and Heritage Command Tonkin Gulf crisis account.
      Established on records from both sides. Giap's statement is testimony and is
      used only as corroboration of the records, never as the anchor.

  - id: tonkin-34a-raids-preceded
    state: established
    statement: >
      South Vietnamese commando raids on North Vietnamese islands under the US-backed
      OPLAN 34A (night of 30-31 July 1964) preceded the Maddox incident, and Hanoi
      associated the American destroyer with those raids.
    evidence_class: primary-text
    confidence: moderate
    anchor:
      type: declassified-operational-record
      description: >
        Declassified accounts describe 34A as conceived and overseen by the Defense
        Department with CIA support and carried out by South Vietnamese forces; the
        Maddox was on an intelligence patrol near the raided islands.
      accessible: true
    basis: >
      # V: V1 (USNI and the OPLAN 34A summaries agree on dates and attribution).
      # TO REACH V2: USNI article; NSA release documents.
      Established as context. It says Hanoi had a reason to attack the Maddox on
      2 August; it does NOT say the US arranged the 2 August clash. See tonkin-bait-order.

  - id: tonkin-aug4-attack-occurred
    state: refuted
    statement: >
      On 4 August 1964 North Vietnamese torpedo boats attacked USS Maddox and USS
      Turner Joy a second time.
    evidence_class: primary-text
    confidence: high
    refutes_target: "A second North Vietnamese attack took place on 4 August 1964"
    anchor:
      type: signals-intelligence-reexamination
      description: >
        NSA historian Robert Hanyok re-examined the full set of intercepts and
        concluded no second attack occurred and no North Vietnamese vessels were
        present; the intercepts presented as 4 August reporting concerned the
        2 August action. Captain John Herrick, the on-scene commander, cabled
        (flash precedence, received in Washington 13:27 on 4 August Washington time):
        "Review of action makes many reported contacts and torpedoes fired appear
        doubtful. Freak weather effects on radar and overeager sonarmen may have
        accounted for many reports ... No actual visual sightings by MADDOX ...
        Suggest complete evaluation before any further action taken."
      accessible: true
    basis: >
      # V: V1 for Hanyok's conclusion (NSA release pages, SFGate, HNN agree), V1 for
      #    the Herrick wording (USNI and others quote it identically), V1 for the
      #    1995 Giap statement ("nothing happened on our side on the 4th of August").
      # TO REACH V2: the Hanyok study (media.defense.gov SKUNKS.PDF) and the Herrick
      #    message text.
      Rule 9 satisfied: names its target and rests on primary documents. Giap's
      statement agrees and is treated as corroboration only.

  - id: tonkin-sigint-selectively-presented
    state: established
    statement: >
      The signals intelligence reaching senior decision-makers about 4 August was
      assembled and presented in a way that omitted contradicting material and did
      not give them the complete picture.
    evidence_class: primary-text
    confidence: moderate
    anchor:
      type: internal-historian-finding
      description: >
        The NSA study concludes that SIGINT "was presented in such a manner as to
        preclude responsible decision makers in the Johnson administration from
        having the complete and objective narrative of events of 4 August 1964."
        A press report of the study says almost 90 percent of the intercepts that
        would have contradicted the attack story were left out of reports to the
        Pentagon and White House, and that forwarded messages contained
        "severe analytic errors, unexplained translation changes, and the
        conjunction of two messages into one translation."
      accessible: true
    basis: >
      # V: V1 for the "preclude" sentence (quoted identically in several places).
      #    V0 for the "almost 90 percent" figure: from one press report, not checked
      #    against the study.
      # TO REACH V2: Hanyok study, sections on omitted and altered intercepts.
      Established that the presentation was selective. This claim does not say who
      did it or why; see tonkin-midlevel-deliberate-skew and tonkin-senior-knowledge.

  - id: tonkin-midlevel-deliberate-skew
    state: proposed
    statement: >
      Mid-level NSA officers deliberately skewed the 4 August intelligence, to cover
      up earlier errors rather than to pursue a political goal.
    evidence_class: synthetic
    confidence: moderate
    anchor:
      type: inference-from-pattern
      description: >
        Hanyok, per press reports, inferred deliberate skewing from a pattern:
        uncorrected translation errors, altered intercept times and selective
        citation. He concluded motive was concealment of earlier errors, and that top
        NSA and defense officials and President Johnson neither knew nor condoned it.
      accessible: true
    basis: >
      # V: V1 for the conclusion as reported (SFGate, HNN and a news summary agree);
      #    V0 for the motive, which is Hanyok's inference, not a document.
      # CORRECTION from first draft: it said the study left "error or design" open
      #    and that the contested question was intent in general. The reported
      #    finding is more specific: deliberate at mid-level, with motive inferred,
      #    and senior officials found not to have known.
      # TO REACH V2: the study's concluding section.
      Held at proposed: intent and motive are inferred from a pattern of documents,
      and the inference comes from a single internal historian.

  - id: tonkin-senior-knowledge
    state: contested
    statement: >
      Senior administration officials knew the 4 August attack was doubtful or false
      when they ordered reprisal strikes and sought the Resolution, as opposed to
      acting on a genuine, if flawed, belief that it happened.
    evidence_class: primary-text
    confidence: low
    anchor:
      type: live-dispute
      description: >
        For knowing: Herrick's doubt cable reached Washington on the day of the
        decision, about 13:27 Washington time on 4 August, before the reprisal
        orders. Against: Hanyok found no senior knowledge of the skewed SIGINT,
        and McNamara later conceded only "serious misjudgments" (Hanoi, 1995).
        Doubts existing in the building is not the same as officials knowing the
        attack was false.
      accessible: true
    basis: >
      # V: V1 for the Herrick receipt time (one source family, USNI-derived; treat as
      #    V0 for the exact clock time until the message is read); V1 for Hanyok's
      #    conclusion and for the 1995 statements.
      # TO REACH V2: dated senior communications between the Herrick cable and the
      #    Resolution (see the open test dt-who-knew-when in tests.yaml).
      Genuinely contested: the documents reviewed so far do not discriminate between
      "should have known" and "knew". Held at contested, low confidence. This is the
      dig's central conspiracy-adjacent gap.

  - id: tonkin-resolution-rested-on-aug4
    state: established
    statement: >
      Congress passed the Tonkin Gulf Resolution (7 August 1964) in response to the
      reported attacks, with the 4 August report central to the administration's case.
    evidence_class: primary-text
    confidence: moderate
    anchor:
      type: legislative-record
      description: >
        House 416-0 and Senate 88-2 on 7 August 1964 (Senators Morse and Gruening
        dissenting); signed 10 August. The text approves "all necessary measures to
        repel any armed attack against the forces of the United States and to prevent
        further aggression," and it was later used as the legal basis for escalation.
      accessible: true
    basis: >
      # V: V1 for the vote counts and dissenters (CFR, Britannica, Senate.gov and
      #    others agree) and the quoted text. CLEARED: the vote counts were V0
      #    recalled figures in the first draft.
      # "Rested on 4 August" is an interpretation of the debate record and has NOT
      #    been checked against the floor debate; that part stays V0, hence moderate.
      # TO REACH V2: archives.gov Tonkin Gulf Resolution; the Congressional Record.

  - id: tonkin-bait-order
    state: searched_gap
    statement: >
      No declassified document located so far shows an order to provoke the 2 August
      clash by sending the Maddox in as bait.
    evidence_class: primary-text
    confidence: low
    anchor:
      type: absence-in-searched-record
      description: >
        Large sets of Tonkin materials have been declassified (including the 2005 NSA
        release), and the sources reviewed do not report such an order. The context
        (tonkin-34a-raids-preceded) makes the suspicion understandable.
      accessible: true
    basis: >
      # V: V0. This is an absence in a record this draft has not read.
      # TO REACH V2: full-text search of the NSA release set and FRUS 1964-68 vol. I
      #    for provocation language.
      A searched gap, not a refutation: absence in what has been released is not
      proof of absence. A found document would move this claim.

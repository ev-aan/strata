        the 4 August intercept could refer to the 2 August attack, and being unable to produce the
        original. Report 13 above is the NSA summary that was relied on; the original it summarized
        is the missing item.
      accessible: true
    basis: >
      An absence is capped as a weaker kind of anchor. This is a documented gap: the study states
      it. It does not show anyone removed the text; it shows the check cannot be completed.

  - id: tonkin-sigint-selectively-presented
    state: established
    statement: >
      The signals intelligence about 4 August reaching senior decision-makers was
      assembled and presented in a way that left out almost all the material showing no
      attack, and did not give them the complete and objective picture.
    evidence_class: interpretive
    confidence: moderate
    evidential_weight: 4   # of 5
    anchor_checked: primary   # the study read; the 122 products not re-audited by us
    adoption_weight: 3   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not measured. Accepted among historians who have read the NSA study; little known to the public.
    would_change_if: >
      an independent audit of the 122 products shows the omitted material did not contradict the attack story
    next_step: >
      Obtain the NSA's declassified set of 140 documents and spot-check Hanyok's account of which products were and were not used.
    anchor:
      nodes: [tonkin-1964-08-08-cia-cover-note-sends-bundy-the-selected]
      type: internal-historian-finding
      description: >
        Hanyok [read]: "SIGINT information was presented in such a manner as to preclude
        responsible decisionmakers in the Johnson administration from having the complete and
        objective narrative of events of 4 August 1964. Instead, only SIGINT that supported the
        claim that the communists had attacked the two destroyers was given to administration
        officials." The withheld information "constituted nearly 90 percent of all available
        SIGINT". The handful of reports supporting an attack "contained severe analytic errors,
        unexplained translation changes, and the conjunction of two unrelated messages". The
        six products used in the NSA chronology are "a bit more than 10 percent of the total
        available"; the other 90 percent was not offered to congressional committees.
      accessible: true
    basis: >
      # V: read directly. CORRECTION: the first draft said the omitted share was "almost 90 percent
      #    of the intercepts that would have contradicted the attack story", from a press summary.
      #    The study's wording is that the withheld material was nearly 90 percent of ALL available
      #    SIGINT on 4 August. This is a count by one analyst, not independently audited.
      # Filed interpretive because it is the analyst's reading and count; independent analyses
      #    (Prados, Jones, Cline, Moise) reach compatible conclusions about the timing and content
      #    of the intercepts, which is why the state is established and not proposed.
      Established that the presentation was selective. This claim does not say why; see
      tonkin-midlevel-deliberate-skew and tonkin-senior-knowledge.

  - id: tonkin-midlevel-deliberate-skew
    state: proposed
    statement: >
      Individuals at NSA deliberately presented only the SIGINT that supported the attack
      claim, in an active effort to make it fit the Navy's account, without manufacturing
      evidence and without a conspiracy at all levels. Hanyok judges that they themselves
      believed the attack had happened and rationalized the contradictory evidence away. The
      exact how and why are not known.
    evidence_class: interpretive
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: primary   # the study read
    adoption_weight: 3   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not measured. Rests on one internal historian's inference; the popular version
      ('manufactured evidence') goes further than the study does.
    would_change_if: >
      a document showing the omissions were mistaken rather than deliberate, or showing direction from outside the NSA personnel, or evidence that intercepts were fabricated
    next_step: >
      Read the oral-history interviews in the NSA's 2005 release and check what participants said about how reports were chosen.
    anchor:
      type: inference-from-pattern
      description: >
        Hanyok [read]: "From this evidence, one can easily deduce the deliberate nature of
        these actions... This was an active effort to make SIGINT fit the claim of what happened
        during the evening of 4 August." And: "This mishandling of the SIGINT was not done in a
        manner that can be construed as conspiratorial, that is, with manufactured evidence and
        collusion at all levels. Rather, the objective of these individuals was to support the
        Navy's claim that the Desoto patrol had been deliberately attacked." On motive: "The
        question why the NSA personnel handled the product the way they did will probably never be
        answered. The notion that they were under 'pressure' to deliver the story that the
        administration wanted simply cannot be supported." Also: the NSA personnel "believed that
        [the attack] had occurred"; "The overwhelming body of reports, if used, would have told the
        story that no attack had happened. So a conscious effort ensued to demonstrate that the
        attack occurred"; "what was issued in the Gulf of Tonkin summaries beginning late on
        4 August was deliberately skewed to support the notion that there had been an attack... That
        the NSA personnel believed that the attack happened and rationalized the contradictory
        evidence away is probably all that is necessary to know in order to understand what was
        done." He finds no "smoking gun" memoranda or notes in the files outlining any plan or
        stating a justification.
      accessible: true
    basis: >
      # V: read directly.
      # CORRECTIONS from the earlier draft, which relied on a press summary: (1) it gave the
      #    motive as "to cover up earlier errors". That is not what the study says; the study
      #    says the objective was to support the Navy's claim and that the reason "will probably
      #    never be answered". (2) It said Hanyok concluded that top officials "neither knew nor
      #    condoned" it; the study text read here says there was no evidence of administration
      #    pressure on NSA, and does not make that exact statement in the passages read.
      Held at proposed: intent is inferred from a pattern, by a single internal historian.

  - id: tonkin-senior-doubts-documented
    state: established
    statement: >
      By 8 a.m. on 5 August 1964, the White House national security adviser told staff that
      the evidence for the second attack was "less than we had yesterday", because of
      "eliminating double counting and mistaken signals", that details such as the number of
      boats and torpedoes were "still somewhat uncertain", and that Hanoi had denied making
      the attack. He also said "This much seemed certain: There was an attack."
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5; one document, a record by an attendee and not a transcript
    anchor_checked: primary   # the memo read
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Known to historians; little known to the public.
    would_change_if: >
      evidence the memorandum is not authentic, or a different record of the same meeting
    anchor:
      nodes: [tonkin-1964-08-05-white-house-staff-meeting-memo-evidence-less]
      type: contemporaneous-memorandum
      description: >
        Memorandum for the Record, White House Staff Meeting, 5 August 1964 [read]: "On the first
        attack, the evidence would be pretty good. On the second one the amount of evidence we
        have today is less than we had yesterday. This resulted primarily from correlating bits
        and pieces of information eliminating double counting and mistaken signals. This much
        seemed certain: There was an attack. How many PT boats were involved, how many torpedoes
        were fired, etc. -- all this was still somewhat uncertain. This matter may be of some
        importance since Hanoi has denied making the second attack."
      accessible: true
    basis: >
      # V: the memorandum was read (OCR; wording cross-checked against Prados's quotation).
      # The author is given as William Y. Smith, a military aide, by Prados (secondary).
      This shows senior doubts about the extent of the attack at the level of the White House
      two days before the Resolution passed. It also shows the speaker still believed an attack
      had happened. Both parts must be kept. It is therefore evidence about doubt, and evidence
      against the stronger claim that he knew nothing had happened.

  - id: tonkin-bundy-welcomed-resolution
    state: established
    statement: >
      At the same meeting, when a new staffer questioned the need for a congressional
      resolution, the national security adviser replied jokingly that the matter should
      perhaps not be thought through too far; as for himself, he "welcomed the recent events
      as justification for a resolution the Administration had wanted for some time."
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5; one attendee's record of a spoken remark
    anchor_checked: primary   # the memo read
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Quoted in historical works; little known to the public.
    would_change_if: >
      a second record of the meeting showing the remark was different or not made
    anchor:
      nodes: [tonkin-1964-08-05-white-house-staff-meeting-memo-evidence-less]
      type: contemporaneous-memorandum
      description: >
        Same memorandum [read]: "Bundy, in reply, jokingly told him perhaps the matter should not
        be thought through too far. For his own part, he welcomed the recent events as
        justification for a resolution the Administration had wanted for some time."
      accessible: true
    basis: >
      # V: read directly.
      Establishes that a senior official described the events as a convenient justification for a
      resolution already wanted. It does not show the events were staged, that he doubted an attack
      occurred, or that anyone lied; the memo says he thought an attack had occurred. It records
      opportunism, which is a different claim from fabrication.

  - id: tonkin-mcnamara-aug4-call
    state: established
    statement: >
      At 9:43 a.m. Washington time on 4 August, before any attack on the destroyers was
      reported, McNamara told President Johnson the ship was "allegedly" to be attacked that
      night, and they discussed what to authorize if it was attacked.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: secondary   # a transcription by Prados read; the audio not heard
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Known to historians.
    would_change_if: >
      the LBJ Library audio or its own transcript differing materially from this transcription
    next_step: >
      Listen to, or read the LBJ Library's own transcript of, the 4 August 9:43 a.m. call.
    anchor:
      nodes: [tonkin-1964-08-04-mcnamara-to-lbj-ship-allegedly-to-be]
      type: recorded-conversation-transcription
      description: >
        McNamara [read, Prados transcription]: "...the tracks are laid down very clearly; they go
        through the three command channels to get out there; this ship is allegedly uh to be
        attacked tonight - we don't like to see a change in operation plan of this kind at this
        time." He then reports a recommendation that the commander "be authorized to pursue the
        attacking vessels in the event he is attacked and destroy their bases."
      accessible: true
    basis: >
      # V: read in a published transcription (primary_text by way of a secondary transcription).
      It shows Washington was already acting on intercepts mistakenly read as pointing to 4 August
      before the alleged action. Conditional planning ("in the event he is attacked") is ordinary
      and is not wrongdoing; the claim is only about timing. Prados's commentary that retaliation
      was discussed "in spite of the fact that no attack has yet occurred" is an interpretation.

  - id: tonkin-mcnamara-34a-testimony
    state: established
    statement: >
      On 3 August 1964 McNamara privately told President Johnson that OPLAN 34-A "had bearing on" the Maddox engagement and
      should be explained to Congress. In formal testimony to the joint Senate committees on 6 August 1964 he said: "Our Navy
      played absolutely no part in, was not associated with, was not aware of, any South Vietnamese action, if there were any."
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5
    anchor_checked: primary   # the 6 Aug wording as read into the 1968 hearing record (text layer); the 3 Aug call via Prados's transcription

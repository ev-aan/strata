      description: >
        Hanyok: "the original decrypted Vietnamese text, and an important translation from San
        Miguel cannot be located." [read] He calls it "unusual" that the original text could not be
        found (and was not used as early as October 1964), and that these are the only missing
        papers in the San Miguel reports "allows for suspicion to shade any further discourses". A

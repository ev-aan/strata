  - id: tonkin-1970-vote-not-clean-measure
    state: established
    statement: >
      In the 24 June 1970 Senate debate on the Dole amendment, the ten senators who voted Nay gave different reasons, or none in the pages
      read. Fulbright said he had intended to vote for repeal and changed his vote after "the assurance of the majority leader" that the
      Mathias concurrent resolution would be brought up. Allen and Hollings spoke against repeal itself. Stennis mixed opposition to repeal with
      a procedural complaint. McGee called the repeal a "political charade". No stated reason was found for Bellmon, Eastland, Ervin, Long and
      McClellan. Several senators who voted Yea (Javits, Moss) said a concurrent resolution would be better but still backed the amendment. A 1970
      vote on this amendment is therefore not a clean measure of a senator's view of the 1964 Resolution.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3   # of 5; Fulbright's words verified on the page image by me; the other senators' reasons by a delegated reading (images checked by that reader, not re-checked by me)
    anchor_checked: primary
    adoption_weight: 1   # of 5

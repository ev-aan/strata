  - id: tonkin-senior-knowledge
    state: contested
    statement: >
      Senior administration officials knew the 4 August attack had not occurred when they
      ordered reprisal strikes and sought the Resolution, as opposed to acting on a genuine,
      if flawed, belief that it happened.
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2   # of 5
    anchor_checked: primary   # the memo, the tape transcription and the study read
    adoption_weight: 3   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not measured. 'They lied us into war' is a popular framing; historians are divided on who knew what.
    would_change_if: >
      a dated senior communication stating, or clearly showing knowledge, that no attack had occurred, or a document showing senior officials were told the SIGINT was being filtered
    next_step: >
      Read FRUS 1964-68 vol. I documents dated 4-7 August 1964 and the LBJ Library tapes for those days; log who said what about whether an attack occurred.
    positions:
      - label: "Knew it was false"
        holder: "The popular 'false flag' claim"
        ground: >
          The Herrick doubt cable (sent 1:27 p.m. Washington time, 4 August) reached Washington;
          McNamara acted on the intercepts before any attack was reported; the adviser
          welcomed the events as justification; McNamara's later statement to Congress about 34-A
          was misleading. Prados argues the record shows Washington "rushing to a judgment".
      - label: "Believed an attack happened, on weak and filtered evidence"
        holder: "Hanyok; the reading of Bundy's memo"
        ground: >
          Bundy recorded "This much seemed certain: There was an attack." Hanyok found only
          SIGINT supporting the attack reached administration officials; he writes that the notion
          NSA staff were under pressure from the administration "simply cannot be supported"; and he
          found no "smoking gun" memoranda or notes in the NSA files outlining a plan or stating a
          justification. The National Security Archive's 2005 posting summarizes the study as
          finding senior officials "none the wiser about the gaps in the intelligence" (secondary).
          Prados's own essay says "senior officials knew of the 'double counting and mistaken
          signals'", which is knowledge of doubt, and not that nothing had happened.
    anchor:
      type: live-dispute
      description: >
        Doubts reached the White House within hours, and a senior official welcomed the events as
        justification. The same record shows that official still thought an attack had happened,
        and the study found the SIGINT reaching senior officials had been filtered. "Knew of doubts"
        and "knew nothing happened" are different claims; the documents read support the first and
        do not settle the second.
      accessible: true
    basis: >
      # V: the memo, the tape transcription of the 4 August call and the study were read directly.
      # The earlier draft carried an exact clock time of "received 13:27" for the Herrick message;
      #    the chronology says it was SENT at 1:27 p.m. Washington time. Correct the earlier text.
      Genuinely contested. Held at contested, low confidence. This remains the dig's central
      conspiracy-adjacent gap, but it is now much narrower than before: the documents show doubt
      and opportunism and do not show knowledge that no attack occurred.


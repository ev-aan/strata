  - id: tonkin-34a-raids-preceded
    state: established
    statement: >
      Covert OPLAN 34-A raids on North Vietnamese coastal targets, including the islands
      Hon Me and Hon Ngu, preceded the Maddox engagement (about half past midnight on
      31 July) and were followed by another raid on the night of 3/4 August. The Maddox's
      mission was to collect North Vietnamese radio and radar emissions, expected to rise
      after a raid. Hanoi associated the destroyer with the raids.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3   # of 5; capped at 4 until the primary documents are read
    anchor_checked: secondary   # McNamara's own recorded words read; operational records not
    adoption_weight: 4   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Not polled. Accepted by historians; less widely known to the public.
    would_change_if: >
      records showing the raids were not 34-A, or that Hanoi did not connect the destroyer to them
    next_step: >
      Read SNIE 50-2-64 (May 1964) and the declassified OPLAN 34-A documents; confirm the raid dates and who controlled the boats.
    anchor:
      nodes: [tonkin-1964-07-30-34-a-raid-on-hon-me-and, tonkin-1964-08-03-second-34-a-raid-night-of-3]
      type: declassified-operational-record
      description: >
        On 3 August McNamara told LBJ the link to OPLAN 34-A should be explained to Congress:
        "There's no question but what that had bearing on. And on Friday night, as you
        probably know, we had four [PT] boats from Vietnam manned by Vietnamese or other
        nationals, attack two islands." [read, transcription]. Prados reports that 34-A was
        directed and paid for by the United States, that the targets were chosen by the CIA,
        and that SNIE 50-2-64 shows the US directed 34-A to pressure Hanoi (secondary); the
        raids are described elsewhere as carried out by South Vietnamese forces.
      accessible: true
    basis: >
      # V: McNamara's words read in a transcription of the tape; the operational detail and the
      #    SNIE are from Prados (secondary). CORRECTION: the first draft said 34-A was
      #    "carried out by South Vietnamese forces"; sources agree South Vietnamese commandos
      #    executed it, but the National Security Archive's reading is that the United States
      #    directed and controlled it. Both are kept in the description.
      Established as context. It says Hanoi had a reason to attack the Maddox on 2 August; it does
      NOT say the US arranged the 2 August clash. See tonkin-bait-order.

  - id: tonkin-aug4-attack-occurred
    state: refuted
    statement: >
      On 4 August 1964 North Vietnamese torpedo boats attacked USS Maddox and USS
      Turner Joy a second time.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5; not 5: the key originals are missing and the re-analysis is Hanyok's
    anchor_checked: primary   # intercept reports and the study read; Herrick message read only as quoted
    adoption_weight: 2   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Historians: a consensus that no second attack occurred (Hanyok's NSA study; Prados; Moise; and
      a Naval Historical Center historian reversed the Navy's earlier account). The public: not
      measured; in 1964 the attack was widely believed.
    would_change_if: >
      new intercepts, ship logs or North Vietnamese records showing boats present and firing on 4 August, or recovery of the missing original Vietnamese text showing it concerned 4 August
    refutes_target: "A second North Vietnamese attack took place on 4 August 1964"
    anchor:
      nodes: [tonkin-1964-08-04-second-attack-reported-then-refuted, tonkin-1964-08-04-herrick-s-doubt-message-sent, tonkin-1964-08-04-report-12-boat-reports-an-enemy-aircraft, tonkin-1964-08-04-report-13-we-shot-at-two-enemy, tonkin-1964-08-04-report-7-boats-told-to-be-ready]
      type: signals-intelligence-reexamination
      description: >
        The intercept reports cited as evidence of 4 August read as follows [read]: Report 7
        (instructions to ready two Swatow boats for "military operations" that night; boat
        T-333 to join if oil can be found); Report 12 (04/1630Z, a Swatow boat reports an
        enemy aircraft "falling into the sea; enemy vessel perhaps wounded"); Report 13
        (04/1644Z, "we shot at two enemy airplanes and at least one was damaged. We sacrificed
        two comrades"). Report 13 mentions aircraft and not ships. Hanyok, who had access to
        122 relevant SIGINT products, concludes: "no attack happened that night", and that
        "Hanoi's navy was engaged in nothing that night but the salvage of two of the boats
        damaged on 2 August" [read]. He also reports: no intercept showed an attack being planned,
        much less carried out [read]. The Navy's on-scene commander, Captain Herrick, sent a flash
        message (1:27 p.m. Washington time, 4 August) that many contacts "appear doubtful",
        that "freak weather effects" and "overeager sonarmen" may account for many reports, and
        that there were "no visual sightings" by the Maddox [quoted by Prados from a 28 Aug 1964
        chronology; secondary]. A pilot overhead, Stockdale, later wrote there was "absolutely no
        gunfire except our own" (secondary). Hanoi has consistently denied any 4 August action;
        Bundy's own staff meeting recorded that "Hanoi has denied making the second attack" [read].
      accessible: true
    basis: >
      # V: the intercept reports and Hanyok's study were read. The Herrick message, Stockdale and
      #    Giap are via Prados (secondary).
      # LIMIT: the refutation's weight rests largely on Hanyok's re-analysis of the intercepts.
      #    Hanyok also reports that the original decrypted Vietnamese text of the key "after-action"
      #    report, and a translation, cannot be located (see tonkin-original-text-missing). We did
      #    not repeat his analysis.
      Rule 9 satisfied: names its target and rests on primary documents (the intercept reports),
      read through a named analysis. Consensus is not the basis. Giap and Stockdale are
      corroboration only.


# ---------------------------------------------------------------------------
# SEARCH HEADLINE (for search engines and AI answer tools; render as <title>,
# <h1>, og:title, and JSON-LD). Rules:
#   1. It states the finding, short and specific, in plain words.
#   2. It may only state a claim that is established or refuted at HIGH confidence.
#   3. `headline_claim` names that claim, so the link can be checked mechanically.
#   4. If that claim's confidence or state changes, the headline must change.
#   5. Publish only after the claim's anchors have been read directly (anchor_checked: primary).
#   6. Plain words only. Name the belief being refuted AND what replaces it, and
#      explain any term a general reader would not know (in the summary if not the title).
#   7. Search wording. A headline should carry the name people actually search for (here
#      "Gulf of Tonkin Incident"), the date or year, and the source of the finding, so a
#      reader can judge it before clicking. Aim for 70-95 characters; the first 60 must make
#      sense on their own because search results cut off there. The summary should open with
#      the question people ask ("Did ... happen?"), answer it in the first clause, and stay
#      under 200 characters. `url_slug` is lowercase words joined by hyphens.
# headline_status values: draft | review | published | parked
#   review = meets rules 2, 3 and 5; waiting for the owner to approve.
# ---------------------------------------------------------------------------
headline: "Gulf of Tonkin Incident: The August 4, 1964 Attack Never Happened, NSA's Own Study Found"
headline_claim: tonkin-aug4-attack-occurred
headline_status: draft           # set back to draft 2026-10-02 by owner: open dig, published as such; return to review when its anchors are read
search_summary: >
  Did a second Gulf of Tonkin attack happen on August 4, 1964? No. NSA's own historian found it never happened, though the August 2 clash was real. What officials knew is still debated.

url_slug: gulf-of-tonkin-incident-no-second-attack-august-4-1964

subject: gulf-of-tonkin
title: "Gulf of Tonkin Incidents (August 1964)"
description: >
  Two separate events are routinely fused: the 2 August 1964 clash between USS
  Maddox and North Vietnamese torpedo boats, and the reported 4 August attack that
  led to the Tonkin Gulf Resolution. Stratah keeps them apart. The first happened.
  The second, on the declassified record, did not. Three further questions are kept
  separate again: how the false 4 August picture was assembled inside NSA, what senior
  officials were told and when, and what they knew. The first two have documented
  answers. The third is a genuine gap, and it is where conspiracy claims and the evidence
  part ways. This dig is also a calibration case: a real, documented failure of
  government reporting, filed strictly on its own evidence so that it neither inflates
  nor excuses claims in other digs.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (governance, not a claim).
#   anchor_checked (per claim):  no | secondary | primary
#     no         not checked, or recalled
#     secondary  agreed across secondary sources; the primary document was not opened,
#                or was opened only in part
#     primary    the primary document was opened and the cited wording read directly
#   `# V:` lines name what was read. Quotations marked [read] were checked against the
#   page text; the pages are scans, so OCR noise is possible (see sources/MANIFEST.yaml).
#
# STATUS as of 2026-10-02 (second verification pass). Sources READ DIRECTLY this pass:
#   [read] Hanyok study, 56 pages (hosted by the National Security Archive; NSA's own servers
#          returned HTTP 403): src-hanyok-2001
#   [read] White House staff meeting memorandum, 5 Aug 1964: src-bundy-memo-1964
#   [read] NSA SIGINT intercept reports, 9 pages: src-intercepts-1964
#   [read] LBJ-McNamara call transcriptions (transcribed by Prados): src-lbj-tapes-transcripts
#   [secondary] Prados essay quoting footnoted primary documents: src-nsarchive-essay-2004
#   NOT yet read: the Herrick message itself; the 28 Aug 1964 chronology; FRUS 1964-68 vol. I
#   (only one document read); the Congressional floor debate; SNIE 50-2-64; the audio of the tapes.
#
# QUANTITIES USED:
#   Tonkin Gulf Resolution ......... passed 7 Aug 1964; House 416-0, Senate 88-2 (Morse and Gruening
#                                    against); signed 10 Aug 1964 (secondary, several sources agree)
#   SIGINT withheld ................ "nearly 90 percent of all available SIGINT" on 4 August was kept
#                                    out of the post-attack summary reports and the October 1964 final
#                                    report [read, Hanyok]. Study reviewed 122 relevant SIGINT
#                                    products; NSA's official version used 15 published reports;
#                                    the six products used in the chronology are "a bit more than
#                                    10 percent of the total available" [read, Hanyok].
#   Herrick message ................ report SENT at 1:27 p.m. Washington time on 4 August
#                                    (Washington, on daylight time, is 11 hours behind the Tonkin Gulf; the Prados essay says 12), per a 28 Aug 1964
#                                    chronology quoted by Prados [secondary]. CORRECTION: the first
#                                    draft said "received" at that time. CLOCK NOTE: Washington was on
#                                    daylight time, so it was 11 hours behind the Gulf, not 12; Prados
#                                    converts at UTC-5, so a Washington clock time may be an hour out.
#   McNamara-LBJ call .............. 9:43 a.m. Washington time, 4 August [read, transcription]
#   Bundy staff meeting ............ 8 a.m., 5 August 1964 [read]
#   Giap ........................... confirmed 2 Aug to McNamara in Hanoi, Nov 1995 (press); at a June
#                                    1997 Hanoi conference said the 2 Aug response was ordered by a
#                                    local naval command and that nothing happened on 4 Aug
#                                    (Prados, an attendee) [secondary]
# ---------------------------------------------------------------------------

divergence_note: >
  Evidence and adoption diverge on three points. On 4 August, historians agree no attack occurred, while the public memory of 1964 is of an attack. On method, the popular framing ('false flag', 'manufactured evidence') is stronger than the record: NSA's own historian found that only the SIGINT supporting the attack claim was passed up, calls the actions deliberate, but writes that this was not conspiratorial and involved no manufactured evidence or collusion at all levels. On knowledge, the documents show doubts reaching the White House within hours and a senior adviser welcoming the events as a justification, while the same documents show that adviser still believed an attack had happened. That gap is the product.


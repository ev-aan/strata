# Timeline data for the Gulf of Tonkin dig. YAML is the source of truth; the diagram is generated by
# build/tools/render_timeline.py. Each dot opens its main source (PDF links go to the page).
# Clock note: Washington was on daylight time (EDT, UTC-4) in August 1964 and the Tonkin Gulf is UTC+7
# (NSA's "G"/Golf time), so the Gulf was 11 hours ahead of Washington. The Prados essay says 12 and
# converts GMT to Washington at UTC-5, which would put Washington clock times an hour off. Events given in
# Washington clock time here use UTC-4 and carry an uncertainty of about one hour. Times drawn are UTC.
timeline:
  id: gulf-of-tonkin
  title: "Gulf of Tonkin, 30 July to 8 August 1964, and after: who did what, and when"
  as_of: "2026-10-02"
  note: >
    Times are UTC. Washington was on daylight time (UTC-4) and the Tonkin Gulf is UTC+7, so the same
    moment reads 11 hours later in the Gulf than in Washington. One source (Prados) converts at UTC-5, which
    would make Washington clock times an hour later than drawn here; events given in Washington clock
    time (the calls, the Herrick message, the staff meeting) therefore carry about one hour of
    uncertainty. Panel B shows both clocks for that reason. Events whose exact time is not given are hollow
    or shown as bars. Quoted facts were read in the cited documents, as marked.

panels:
  - id: overview
    title: "Panel A: 30 July to 8 August 1964 (UTC, one tick per day)"
    start: "1964-07-30T00:00:00Z"
    end:   "1964-08-09T00:00:00Z"
    tick_hours: 24
    lanes: [covert, ships, wh, cong, intel]
  - id: hours
    title: "Panel B: 4 and 5 August 1964 in hours (UTC, with Washington and Gulf clocks)"
    start: "1964-08-04T10:00:00Z"
    end:   "1964-08-05T14:00:00Z"
    tick_minutes: 120
    axes: [{label: "Washington (EDT, UTC-4)", offset_hours: -4}, {label: "Tonkin Gulf (UTC+7)", offset_hours: 7}]
    lanes: [dvr, ships, herrick, nsa_pan, wh]
  - id: after
    title: "Panel C: afterwards, 1964 to 2005 (one tick per five years)"
    start: "1964-01-01T00:00:00Z"
    end:   "2006-06-30T00:00:00Z"
    tick_years: 5
    lanes: [cong, testimony, nsa_internal, declass]

lanes:
  covert:       {label: "Covert OPLAN 34-A raids"}
  ships:        {label: "USS Maddox and Turner Joy"}
  wh:           {label: "White House, McNamara (Washington)"}
  cong:         {label: "Congress"}
  intel:        {label: "CIA and NSA"}
  dvr:          {label: "North Vietnamese navy (as shown in intercepts)"}
  herrick:      {label: "Capt. Herrick (on-scene commander)"}
  nsa_pan:      {label: "NSA and listening posts"}
  testimony:    {label: "Testimony and talks"}
  nsa_internal: {label: "NSA internal record"}
  declass:      {label: "Declassification"}

people:
  - {who: "Lyndon B. Johnson", detail: "President. Spoke with McNamara by phone on 3 and 4 August; the calls are on tape (transcribed by Prados)."}
  - {who: "Robert S. McNamara", detail: "Secretary of Defense. Said privately on 3 August that OPLAN 34-A 'had bearing on' the Maddox engagement; told the Senate on 6 August the Navy 'was not aware of' South Vietnamese actions (via Prados); in the 4 August call said the ship was 'allegedly' to be attacked that night."}
  - {who: "McGeorge Bundy", detail: "National Security Adviser. At the 5 August 8 a.m. staff meeting said the evidence for the second attack was 'less than we had yesterday', that 'There was an attack', and that he 'welcomed the recent events as justification for a resolution the Administration had wanted for some time'."}
  - {who: "Douglass Cater", detail: "New White House staffer who questioned the need for a resolution at that meeting."}
  - {who: "William Y. Smith", detail: "Military aide; named by Prados as the author of the staff-meeting memorandum (the OCR of the scan does not show the author line)."}
  - {who: "Capt. John Herrick", detail: "On-scene commander of the destroyers; his message that contacts 'appear doubtful' is quoted by Prados from a 28 Aug 1964 chronology."}
  - {who: "Cdr. James Stockdale", detail: "Led the Ticonderoga jets overhead on 4 August; later wrote there was 'absolutely no gunfire except our own' (Prados)."}
  - {who: "Adm. Thomas Moorer", detail: "Kept a dud shell from a 2 August boat as a souvenir (Prados)."}
  - {who: "Adm. U.S. Grant Sharp", detail: "Pacific Fleet commander; proceeded as if the attacks were genuine (tapes commentary)."}
  - {who: "Vo Nguyen Giap", detail: "North Vietnam's defense minister; told McNamara in 1995 that nothing happened on 4 August; at a 1997 Hanoi conference said the 2 August action was ordered by a local naval command."}
  - {who: "Sens. Wayne Morse and Ernest Gruening", detail: "The two senators who voted against the Resolution (88-2)."}
  - {who: "J. Norvill Jones and Carl Marcy", detail: "Senate Foreign Relations Committee staff who later saw the intercepts; Jones said the 4 August one 'was a boastful summary of the attack on August 2' (Prados)."}
  - {who: "Dr. Louis Tordella", detail: "NSA deputy director; in 1972 conceded the 4 August intercept could refer to 2 August and could not produce the original (Hanyok's note)."}
  - {who: "Robert J. Hanyok", detail: "NSA historian; wrote the 2001 study, declassified 2005."}
  - {who: "John Prados", detail: "National Security Archive analyst; edited Briefing Book 132 and wrote the 2004 essay used here."}
  - {who: "NSA units", detail: "Phu Bai (Marine detachment, whose analytic error Hanyok says began the 4 August incident), San Miguel (Navy), and the Maddox's own Naval Security Group detachment."}
  - {who: "North Vietnamese boats", detail: "Swatow boats T-142 and T-146 and torpedo boat T-333 appear in the intercepts."}

sources:
  s_hanyok:   {title: "Hanyok, Skunks, Bogies, Silent Hounds, and the Flying Fish (NSA, 2001), National Security Archive copy, 56 pp.", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/relea00012.pdf", authenticity: "authenticated, moderate (copy not byte-compared with NSA's)"}
  s_memo:     {title: "Memorandum for the Record, White House staff meeting, 5 Aug 1964", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin.pdf", authenticity: "authenticated, moderate"}
  s_intercepts: {title: "NSA SIGINT intercept reports, Aug 1964 (declassified 2003)", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin_intercepts.pdf", authenticity: "authenticated, moderate"}
  s_essay:    {title: "Prados, The Gulf of Tonkin Incident, 40 Years Later (2004 essay)", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/essay.htm", authenticity: "a 2004 essay; footnotes primary documents"}
  s_tapes:    {title: "LBJ tapes on the Gulf of Tonkin (transcriptions by Prados)", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tapes.htm", authenticity: "transcription; audio not heard"}
  s_press:    {title: "National Security Archive posting, 1 Dec 2005, on the NSA release", url: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/press20051201.htm", authenticity: "secondary account"}
  s_senate:   {title: "Senate.gov, Chairman Fulbright and the Tonkin Gulf Resolution", url: "https://www.senate.gov/artandhistory/senate-stories/chairman-fulbright-and-the-tonkin-gulf-resolution.htm", authenticity: "official history; vote counts not read in the Record"}
  s_vote_s:   {title: "Voteview, Senate roll call 481, 7 Aug 1964, H.J.Res. 1145 (88 yea, 2 nay)", url: "https://voteview.com/rollcall/RS0880481", authenticity: "dataset of the official roll call; Congressional Record not read"}
  s_vote_h:   {title: "Voteview, House roll call 197, 7 Aug 1964, H.J.Res. 1145 (416 yea, 0 nay)", url: "https://voteview.com/rollcall/RH0880197", authenticity: "dataset of the official roll call; Congressional Record not read"}
  s_crec64:   {title: "Congressional Record, Senate, 7 Aug 1964 (p. 18470: roll call 88-2)", url: "https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf#page=30", authenticity: "GPO bound Record, authenticated, strong"}
  s_crec70:   {title: "Congressional Record, Senate, 24 June 1970 (p. 21132: roll call 81-10)", url: "https://www.govinfo.gov/content/pkg/GPO-CRECB-1970-pt16/pdf/GPO-CRECB-1970-pt16-1-1.pdf#page=32", authenticity: "GPO bound Record, authenticated, strong"}
  s_cfr:      {title: "Council on Foreign Relations, Congress passes the Gulf of Tonkin Resolution", url: "https://www.cfr.org/articles/twe-remembers-congress-passes-gulf-tonkin-resolution", authenticity: "secondary"}
  s_seattle:  {title: "Seattle Times, 9 Nov 1995: McNamara asks for truth about Gulf of Tonkin, Giap: there was no attack", url: "https://archive.seattletimes.com/archive/19951109/2151509/mcnamara-asks-for-truth-about-gulf-of-tonkin----giap-there-was-no-attack", authenticity: "news archive"}

# kind: data | document | official | witness | analysis | media     status: reported | single | disputed | inferred
events:
  # ---------------- Panel A: overview ----------------
  - {id: e1, panel: overview, lane: covert, time: "1964-07-30T17:30:00Z", precision: approx, kind: analysis, status: single, sources: [s_essay],
     label: "34-A raid on Hon Me and Hon Ngu (about 00:30 on 31 July, local)",
     detail: "Prados: the raid 'hit at half past midnight, July 31'. Local time is UTC+7, so about 17:30 UTC on 30 July."}
  - {id: e2, panel: overview, lane: ships, time: "1964-08-02T08:05:00Z", precision: approx, kind: analysis, status: reported, sources: [s_hanyok, s_essay],
     label: "2 Aug: Maddox fires three warning rounds; North Vietnamese boats attack",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/relea00012.pdf#page=17",
     detail: "Hanyok: about 1505 Gulf time (08:05 UTC) the Maddox fired three rounds to warn off the boats; the administration did not report this and said the Vietnamese boats fired first. Jets from the Ticonderoga arrived within about fifteen minutes; one boat was left dead in the water and two damaged."}
  - {id: e3, panel: overview, lane: wh, time: "1964-08-03T14:30:00Z", precision: exact, kind: document, status: reported, sources: [s_tapes, s_essay],
     label: "McNamara to LBJ (10:30 a.m. EDT): explain OPLAN 34-A to Congress",
     detail: "Transcription: 'explain this Op Plan 34-A, these covert operations. There's no question but what that had bearing on.'"}
  - {id: e4, panel: overview, lane: covert, time: "1964-08-03T17:00:00Z", precision: range, end: "1964-08-03T23:00:00Z", kind: analysis, status: inferred, sources: [s_essay],
     label: "Second 34-A raid, night of 3/4 August (time not stated)",
     detail: "Prados: another raid on the night of 3/4 August as the destroyers began their run back up the Gulf. The bar is an inference for the local night, not a stated time."}
  - {id: e5, panel: overview, lane: wh, time: "1964-08-05T12:00:00Z", precision: day, kind: analysis, status: single, sources: [s_hanyok],
     label: "5 Aug: US retaliatory air strikes on North Vietnam",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/relea00012.pdf#page=49",
     detail: "Hanyok refers to 'the retaliatory air strikes of 5 August'. Time of day not given here."}
  - {id: e6, panel: overview, lane: cong, time: "1964-08-06T12:00:00Z", precision: day, kind: analysis, status: single, sources: [s_essay],
     label: "6 Aug: McNamara tells senators the Navy 'was not aware of' South Vietnamese actions",
     detail: "Quoted by Prados from the Senate Foreign Relations Committee's published executive sessions (vol. XVI, p. 293); the record was not read directly."}
  - {id: e7, panel: overview, lane: cong, time: "1964-08-07T12:00:00Z", precision: day, kind: official, status: reported, sources: [s_crec64, s_vote_s, s_vote_h, s_senate, s_cfr], link: "https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf#page=30",
     label: "7 Aug: Tonkin Gulf Resolution passes (House 416-0, Senate 88-2)",
     detail: "Signed 10 August. Senate: read in the Congressional Record, p. 18470 (yeas 88, nays 2: Gruening and Morse; 10 not voting). House: the Record prints 416-0 on Roll No. 210 (p. 18555), under suspension of the rules (see claim tonkin-house-debate-aug7)."}
  - {id: e8, panel: overview, lane: intel, time: "1964-08-08T12:00:00Z", precision: day, kind: document, status: single, sources: [s_essay],
     label: "8 Aug: CIA cover note sends Bundy the selected intercepts",
     detail: "Prados: a cover note of 8 August accompanied the intercepts 'selected by CIA and NSA' that the White House had requested."}
  # ---------------- Panel B: 4-5 August in hours ----------------
  - {id: f1, panel: hours, lane: dvr, time: "1964-08-04T11:40:00Z", precision: exact, kind: document, status: single, sources: [s_intercepts, s_essay],
     label: "Report 7: boats told to be ready for 'military operations' that night",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin_intercepts.pdf#page=4",
     detail: "Read: 'imminent plans of DRV naval action possibly against Desoto mission'; T-142 and T-146 to ready, T-333 to join if oil can be found. Date-time group 04/1140Z per Prados (the OCR of the group is unclear). Hanyok reads later Phu Bai reports as a salvage and tow operation."}
  - {id: f2, panel: hours, lane: ships, time: "1964-08-04T12:40:00Z", precision: exact, kind: analysis, status: single, sources: [s_essay],
     label: "Destroyers' first reported radar sightings (04/1240Z)",
     detail: "Prados. The base of the Swatow boats, Quang Khe, was about 110 nautical miles from Hon Me, too far to reach in the time between the intercept and this report."}
  - {id: f3, panel: hours, lane: wh, time: "1964-08-04T13:43:00Z", precision: exact, kind: document, status: reported, sources: [s_tapes, s_essay],
     label: "McNamara to LBJ (9:43 a.m. EDT): ship 'allegedly' to be attacked tonight",
     detail: "Read in transcription: 'this ship is allegedly uh to be attacked tonight'. Before any attack on the destroyers was reported. Conditional planning followed ('in the event he is attacked')."}
  - {id: f4, panel: hours, lane: wh, time: "1964-08-04T14:53:00Z", precision: exact, kind: document, status: single, sources: [s_tapes],
     label: "McNamara to LBJ (10:53 a.m. EDT): reports the supposed engagement",
     detail: "Per the tapes commentary, McNamara 'mistakenly reports' what the aircraft saw. Details of the call were not read in full."}
  - {id: f5, panel: hours, lane: ships, time: "1964-08-04T16:02:00Z", precision: exact, kind: analysis, status: single, sources: [s_essay],
     label: "Destroyers report evading torpedoes and having 'sunk' a craft (04/1602Z)",
     detail: "Prados. Stockdale, overhead, saw no boats and later wrote 'absolutely no gunfire except our own'."}
  - {id: f6, panel: hours, lane: nsa_pan, time: "1964-08-04T16:30:00Z", precision: exact, kind: document, status: single, sources: [s_intercepts],
     label: "Report 12: boat reports an enemy aircraft falling into the sea",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin_intercepts.pdf#page=6",
     detail: "Read: 'enemy aircraft was observed falling into the sea; enemy vessel perhaps wounded'. Mentions aircraft; the date-time group in the OCR is smudged (04/1630Z per Prados)."}
  - {id: f7, panel: hours, lane: dvr, time: "1964-08-04T16:44:00Z", precision: exact, kind: document, status: reported, sources: [s_intercepts, s_hanyok],
     label: "Report 13: 'we shot at two enemy airplanes... we sacrificed two comrades'",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin_intercepts.pdf#page=7",
     detail: "Read. The report speaks of aircraft, not ships. Hanyok: it appears to combine two separate messages into one translation, and 'comrades' was rendered as 'boats'; the original Vietnamese text cannot be located."}
  - {id: f8, panel: hours, lane: herrick, time: "1964-08-04T17:27:00Z", precision: range, end: "1964-08-04T18:27:00Z", kind: analysis, status: disputed, sources: [s_essay],
     label: "Herrick's doubt message SENT (1:27 p.m. Washington time)",
     detail: "Prados, quoting a 28 Aug 1964 chronology: contacts 'appear doubtful'; 'freak weather effects' and 'over-eager sonarmen'; 'no visual sightings'. DISCREPANCIES: (1) earlier reports said the message was received at 1:27 p.m.; the chronology says sent. (2) The bar spans 17:27 to 18:27 UTC because it is unclear whether 'Washington time' means daylight time (UTC-4) or the UTC-5 that Prados uses to convert. The message itself was not read."}
  - {id: f9, panel: hours, lane: wh, time: "1964-08-05T12:00:00Z", precision: exact, kind: document, status: reported, sources: [s_memo, s_essay],
     label: "White House staff meeting memo (8 a.m. EDT): evidence 'less than we had yesterday'",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin.pdf",
     detail: "Read. Bundy: evidence for the second attack 'less than we had yesterday', 'eliminating double counting and mistaken signals'; 'This much seemed certain: There was an attack.' Also: he 'welcomed the recent events as justification for a resolution the Administration had wanted for some time.'"}
  # ---------------- Panel C: afterwards ----------------
  - {id: g1, panel: after, lane: testimony, time: "1968-02-20T12:00:00Z", precision: day, kind: analysis, status: single, sources: [s_essay],
     label: "1968: McNamara cites 'unimpeachable' intercepts to the Senate; does not leave copies",
     detail: "Opening statement of 20 February 1968, quoted by Prados."}
  - {id: g2, panel: after, lane: nsa_internal, time: "1972-01-20T12:00:00Z", precision: day, kind: analysis, status: single, sources: [s_hanyok],
     label: "1972: NSA's deputy director concedes the 4 Aug intercept could refer to 2 Aug",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/relea00012.pdf#page=51",
     detail: "Hanyok's note 7: a 20 January 1972 meeting between Dr. Louis Tordella and SFRC staff chief Carl Marcy; Tordella could not produce the original."}
  - {id: g3, panel: after, lane: testimony, time: "1995-11-09T12:00:00Z", precision: day, kind: media, status: single, sources: [s_seattle],
     label: "1995: Giap tells McNamara in Hanoi that nothing happened on 4 Aug",
     detail: "Seattle Times report of the 9 Nov 1995 meeting."}
  - {id: g4, panel: after, lane: testimony, time: "1997-06-20T12:00:00Z", precision: range, end: "1997-06-23T12:00:00Z", kind: analysis, status: single, sources: [s_essay],
     label: "1997: Hanoi conference; Giap says 2 Aug was ordered by a local command",
     detail: "Prados attended; he reports Giap's statement to McNamara (his note 13)."}
  - {id: g5, panel: after, lane: nsa_internal, time: "2001-03-01T12:00:00Z", precision: year, kind: document, status: single, sources: [s_hanyok],
     label: "Early 2001: Hanyok study in NSA's classified Cryptologic Quarterly",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/relea00012.pdf#page=3",
     detail: "Per the National Security Archive's 2005 posting."}
  - {id: g6, panel: after, lane: declass, time: "2003-03-15T12:00:00Z", precision: month, kind: document, status: reported, sources: [s_essay, s_intercepts],
     label: "March 2003: the five intercept reports declassified",
     link: "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB132/tonkin_intercepts.pdf#page=2",
     detail: "Prados: declassified in March 2003 on a Mandatory Declassification Review request. The scan carries a NARA review stamp dated 3-13-03."}
  - {id: g7, panel: after, lane: declass, time: "2005-12-01T12:00:00Z", precision: day, kind: document, status: reported, sources: [s_press, s_hanyok],
     label: "1 Dec 2005: NSA declassifies about 140 documents, including the Hanyok study",
     detail: "National Security Archive posting of 1 December 2005."}
  - {id: g9, panel: after, lane: cong, time: "1970-06-24T12:00:00Z", precision: day, kind: official, status: reported, sources: [s_crec70, s_vote_s], link: "https://www.govinfo.gov/content/pkg/GPO-CRECB-1970-pt16/pdf/GPO-CRECB-1970-pt16-1-1.pdf#page=32",
     label: "24 Jun 1970: Senate votes 81-10 to repeal the Tonkin Resolution (Dole amendment)",
     detail: "Read in the Congressional Record, p. 21132 [No. 167 Leg.]. The ten nays include Fulbright, who said in the same debate 'I am going to vote for its repeal' and objected to the procedure (p. 21119). See claim tonkin-resolution-repealed-1970."}

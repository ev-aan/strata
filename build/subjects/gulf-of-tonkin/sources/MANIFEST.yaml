# Provenance of source copies used by this dig. US government documents are public domain.
# All text files marked ocr were produced by machine OCR (tesseract 5.3.4, 150 dpi) from scanned
# pages. OCR is noisy; quotes in claims.yaml were checked against the page text, but any quote
# that matters should be re-read in the PDF. The Hanyok PDF itself (4.7 MB) is not stored here;
# fetch it from the URL and compare the checksum.

subject: gulf-of-tonkin

discriminating_tests:

  - id: dt-aug4-intercept-recheck
    question: >
      Do the intercepts that were cited as proof of a 4 August attack actually
      describe 4 August events?
    retires: tonkin-aug4-attack-occurred
    predicts:
      attack-occurred: >
        IF an attack occurred on 4 August, the intercepts cited for it should describe
        North Vietnamese boat activity at that time, and independent ship records
        (radar, sonar, visual) should support it.
      no-attack: >
        IF no attack occurred, the cited intercepts should turn out to describe the
        earlier 2 August action or non-combat activity, the timing should not fit, and the
        ship records should be doubtful or contradicted.
    result:
      type: primary_text
      finding: >
        The intercept reports themselves were read (nine pages, NSA reports sent to the White
        House). Report 13 (04/1644Z) says a boat "shot at two enemy airplanes and at least one was
        damaged; we sacrificed two comrades"; it mentions aircraft and not ships. Report 12 (04/1630Z)
        describes an enemy aircraft falling into the sea. The reports that spoke of preparations
        (Report 7) describe readying boats for "military operations" that night, which NSA's own
        historian read, with later Phu Bai reports, as a salvage and tow operation. Hanyok, with the
        full set of 122 relevant products, concludes no attack happened and that Hanoi's navy was
        engaged in nothing that night but salvage of two boats damaged on 2 August. The on-scene
        commander's flash message (sent 1:27 p.m. Washington time, 4 August) questioned the
        contacts and reported no visual sightings by the Maddox.
      accessible: true
    resolves: >
      The refutation rests on re-reading the original reports, not on which account is more widely
      believed. LIMITS: we read the reports and the study; we did not repeat the analysis of all 122
      products, and the original Vietnamese text of the key report is missing (tonkin-original-text-missing).
      The Herrick message was read only as quoted in a secondary source.
    note: >
      D3 satisfied. Giap's testimony agrees but is not what retires the claim. The test does NOT
      answer who skewed the record or why, or whether senior officials knew;
      tonkin-midlevel-deliberate-skew stays proposed and tonkin-senior-knowledge stays contested.


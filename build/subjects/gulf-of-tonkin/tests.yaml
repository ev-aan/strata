subject: gulf-of-tonkin

discriminating_tests:

  - id: dt-aug4-intercept-recheck
    question: >
      Do the intercepts that were cited as proof of a 4 August attack actually
      describe 4 August events?
    retires: tonkin-aug4-attack-occurred
    predicts:
      attack-occurred: >
        IF an attack occurred on 4 August, the intercepts cited for it should describe
        North Vietnamese boat activity at that time, and independent ship records
        (radar, sonar, visual) should support it.
      no-attack: >
        IF no attack occurred, the cited intercepts should turn out to describe the
        earlier 2 August action, and the ship records should be doubtful or
        contradicted.
    result:
      type: primary-text
      finding: >
        NSA's re-examination of the full intercept set found the cited reports
        referred to the 2 August action and no North Vietnamese vessels were present
        on 4 August. The on-scene commander's flash message, received in Washington
        the same day, questioned the radar and sonar contacts and reported no
        visual sightings by Maddox.
      accessible: true
    resolves: >
      The refutation rests on re-reading the original records, not on which account
      is more widely believed. Verification level V1 (search-corroborated); the study itself
      has not been opened.
    note: >
      D3 satisfied. Giap's 1995 testimony agrees but is not what retires the claim.
      The test does NOT answer who skewed the record or why, or whether senior
      officials knew; tonkin-midlevel-deliberate-skew stays proposed and
      tonkin-senior-knowledge stays contested.


  - id: L-14
    date: 2026-10-02
    entry: >
      HEADLINE REVISED at the owner's request (the earlier one was too short to be understood or
      found). Earlier: "No second Gulf of Tonkin attack happened on 4 August 1964". Now: "Gulf of Tonkin

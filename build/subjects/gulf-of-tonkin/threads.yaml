subject: gulf-of-tonkin

threads:

  - id: thread-tonkin-popular-framing
    type: reception-overlay
    title: "Tonkin as 'proof' of a government false-flag"
    confers_weight: false   # T4: required for reception overlays
    description: >
      How Tonkin reaches general readers: "the attack that never happened" and the
      "false flag that started the Vietnam War". The first phrase tracks the
      established claim about 4 August. The second adds an intent that the record
      does not yet settle.
    overlay_notes:
      - >
        "The attack never happened" is correct for 4 August and wrong for 2 August.
        Collapsing the two erases the part that did happen (tonkin-aug2-maddox-engaged).
      - >
        "Manufactured evidence" and "false flag" assert deliberate staging by the US. The
        record read supports something narrower: only the SIGINT supporting the attack
        claim reached administration officials (tonkin-sigint-selectively-presented), which
        NSA's own historian calls deliberate on the part of individuals at NSA but "not...
        conspiratorial, that is, with manufactured evidence and collusion at all levels"
        (tonkin-midlevel-deliberate-skew, proposed). He writes that NSA staff believed the
        attack had happened and rationalized the contradictory evidence away.
      - >
        "The administration lied" mixes documented and undocumented parts. Documented: doubts
        reached the White House within hours (tonkin-senior-doubts-documented); a senior
        adviser welcomed the events as justification for a resolution already wanted
        (tonkin-bundy-welcomed-resolution); McNamara's testimony to the Senate about 34-A
        differed from what he told the President privately (tonkin-mcnamara-34a-testimony).
        Not documented in what was read: any statement that no attack had occurred
        (tonkin-senior-knowledge, contested), or an order to provoke the clash
        (tonkin-bait-order). The same adviser's memo says "There was an attack."
      - >
        Tonkin is often cited as general proof that official accounts of any event
        are fabricated. A documented case lends no weight to a different claim;
        apollo-landings, for instance, rests on independent material records and
        is filed on those.
    firewall: >
      This thread records reception. It is mechanically barred (confers_weight: false)
      from lending evidential weight to any claim. A reader arriving with the
      "false flag" framing should see which part is established (4 August did not
      happen; the intelligence was presented selectively; doubts and opportunism are
      documented), which part is proposed (deliberate skewing by individuals at NSA, not
      conspiratorial in the historian's words), which is contested (whether senior officials
      knew nothing had happened), and which is an unfound document (a bait order).

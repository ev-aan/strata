timeline:
  id: votes-johnson-tonkin
  title: Votes touching Vietnam during Johnson's presidency and the repeal of the Tonkin Resolution (1964 to 1970)
  as_of: '2026-10-02'
  note: 'Selection rule (log it): roll calls whose description, question or bill contains vietnam, viet nam, southeast asia, tonkin, indochina or gulf of. This is
    a crude keyword filter: it includes some off-topic votes and will miss Vietnam-related votes that lack those words. Times are not recorded for these votes, so
    each dot is drawn at noon UTC on its date (date precision only). Every dot links to its roll-call page.'

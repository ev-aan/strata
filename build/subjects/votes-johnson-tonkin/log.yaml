subject: votes-johnson-tonkin
dig_status: dataset_built
log:
  - id: L-01
    date: "2026-10-02"
    entry: >
      Owner asked for the same kind of timeline 'over the presidency of the Tonkin project'. Read as: a timeline in the
      same format covering Johnson's presidency (22 Nov 1963 to 20 Jan 1969), with the Vietnam-related recorded votes
      tied to the Gulf of Tonkin dig. The window runs on to 1971 to include the 1970 votes to repeal the Resolution.
      If the owner meant something else this entry is wrong and should be corrected, not edited.
  - id: L-02
    date: "2026-10-02"
    entry: >
      Built with build/tools/build_votes.py (88th to 91st Congress, keyword rule: description, question or bill contains
      vietnam, viet nam, southeast asia, tonkin, indochina or gulf of) and build/tools/votes_to_timeline.py.
      49 roll calls matched. The rule is crude: it includes off-topic votes (for example an education-bill amendment whose
      text mentions Vietnam) and misses votes that lack those words, so this is a candidate set, not the complete record
      of Vietnam votes. Each dot links to the Voteview roll-call page (secondary); the official record before 1990 is the
      Congressional Record, not yet read. Times are not recorded, so dots are date-only.
      FOUND: 7 Aug 1964 Resolution votes (House 416-0, Senate 88-2, matching the Tonkin dig); Senate 24 Jun 1970 vote
      to repeal the Resolution by amendment (81-10); Senate 10 Jul 1970 concurrent resolution to terminate it (57-5).
      The descriptions are Voteview's wording and have not been checked against the Record.
  - id: L-03
    date: "2026-10-02"
    entry: >
      Renderer extended: panels may carry bands (context spans such as presidencies). NEXT: read the Congressional
      Record for the 1970 repeal debates; add actors.yaml (P1-P11) for members who voted No in 1964 and Yes in 1970,
      selected by a rule written first; tie to claim tonkin-resolution-rested-on-aug4.

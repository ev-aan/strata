subject: congress-promise-vote
dig_status: scoping
log:
  - id: L-01
    date: "2026-10-02"
    entry: >
      Owner proposed using timelines to show how politics works (votes, messaging, alliances) and
      whether politicians are true to their constituents. Owner chose: US Congress; question
      "promise to vote to outcome"; neutral fixed-rule selection across both parties.
  - id: L-02
    date: "2026-10-02"
    entry: >
      Feasibility: official House and Senate roll-call XML and the Voteview dataset are reachable
      from the cloud session; a House 2023 roll call parsed correctly (member, party, vote). FEC
      and api.congress.gov need free API keys. congress.gov and OpenSecrets block the cloud session.
  - id: L-03
    date: "2026-10-02"
    entry: >
      Protocol written (protocol.yaml) before any bill or member was chosen. No subject selected
      and no claims filed. Constituent-opinion comparison deliberately left out of the pilot.
      NEXT: owner approves or amends the protocol; then apply the selection rule mechanically
      and log the candidate list before reading any member's record.
  - id: L-04
    date: "2026-10-02"
    entry: >
      Owner asked for consistency between this dig and others that contain votes (Tonkin).
      Added SCHEMA.md 'Actors, statements and votes' (P1 to P7) and an actors.yaml standard.
      Test on Tonkin: the 7 Aug 1964 vote totals were read in Voteview's roll-call data
      (Senate roll 481: 88-2, nays Gruening and Morse; House roll 197: 416-0) and linked from the
      Tonkin timeline. One discrepancy logged: Voteview's per-member Senate file has one more yea
      than its summary row; unresolved.
  - id: L-05
    date: "2026-10-02"
    entry: >
      Owner agreed the authenticity-of-motive idea fits politics, not every kind of dig. Added P9 (inducement
      claims, tiers decisive/supporting/context, default searched_gap), P10 (consistency over time, synthetic,
      cap 3) and P11 (motive and sincerity not assessed) to SCHEMA.md as politics-only rules.
  - id: L-06
    date: "2026-10-02"
    entry: >
      PILOT STARTED. Clarifications to the selection rule, written BEFORE any roll call was fetched, because the
      rule as drafted was ambiguous: (a) 'most recently completed Congress' = the 118th (3 Jan 2023 to 3 Jan 2025);
      the 119th is still sitting. (b) Chamber: the House only, because its official Clerk XML gives member, party
      and vote in one file. (c) 'Final-passage vote' = a recorded House vote whose question is passage of a bill or
      joint resolution (H.R., S., H.J.Res., S.J.Res.), including suspension-and-pass; simple and concurrent resolutions,
      amendments, motions and conference reports are excluded. (d) 'At least 10 members of each party on each side':
      at least 10 Democrats and 10 Republicans voting Yea, and at least 10 of each voting Nay. (e) 'First by roll-call
      number': ascending roll number, 2023 before 2024. (f) Member rule unchanged: first by last name from each party
      whose vote differed from that party's majority on that roll call. Not-voting and Present do not count as
      differing. If a clarification turns out to be wrong it will be logged, not edited.
  - id: L-07
    date: "2026-10-02"
    entry: >
      SELECTION APPLIED mechanically per L-06 (no member record read yet). Fetched all 724 House roll calls of 2023 and
      517 of 2024 from the Clerk's XML (1,241 files). 357 were bill or joint-resolution passage votes; 20 met the
      at-least-10-per-party-per-side test (full list: candidates.yaml). FIRST candidate by roll number: 2023 roll 243,
      31 May 2023, H.R. 3746, 'Fiscal Responsibility Act', On Passage, 314 yea 117 nay (D 165-46, R 149-71), Passed.
      Members (first by last name whose vote differed from their party's majority): DEMOCRAT Barragan (CA, bioguide
      B001300), voted No against a Yea majority; REPUBLICAN Alford (MO, bioguide A000379), voted No against a Yea
      majority. Both selections are final under rule item 5: no swapping if no promise is found.
      NOTE: the rule selects members who differ from their party, so findings describe unusual cases (limit already in protocol).
  - id: L-08
    date: "2026-10-02"
    entry: >
      PILOT BUILT on H.R. 3746 with Barragan (D-CA) and Alford (R-MO): claims.yaml (11 claims), actors.yaml,
      timeline.yaml/html (10 events), sources/MANIFEST.yaml with sha256 for 5 saved records. Read in full: House
      roll calls 243 and 199 (Clerk XML), Public Law 118-5 (govinfo), Barragan's press release and Alford's e-newsletter
      (raw page text from their .house.gov sites; the search-tool summaries were NOT used for quotes because a first
      summary paraphrased). FINDINGS: (1) both votes confirmed against the official record, each against their party's
      majority; (2) both gave public reasons on 1 June 2023, from opposite directions; (3) Alford's '$1.4 billion' IRS
      figure matches Sec. 251 ($1,389,525,000); (4) Alford's quoted pay-go waiver phrase does NOT match Sec. 265 as
      enacted (open: possibly another bill version); (5) no dated pre-vote commitment found for Barragan; Alford's
      promise exists only in his own later statement, so alignment is not scored for either (P2, P4); (6) inducement
      claim (P9) not yet searched, recorded as searched_gap. LIMITS: the rule picks members who differ from their party
      by construction; two cases show the method, not Congress; statements may be staff-written; Senate roll call, floor
      debate, the 28 May bill text and any 2022 campaign pledge are unread; no Wayback snapshots yet. WHAT THE TEST SHOWED
      ABOUT THE METHOD: raw-page capture beats search summaries for quotes; the selection rule needed six clarifications
      before running (L-06) which suggests the protocol should name chamber and bill type up front.
  - id: L-09
    date: "2026-10-02"
    entry: >
      CONFORMANCE FIX (review against CONTRIBUTING.md rules 1 and 3). Three claims
      (pv-barragan-prevote-commitment, pv-alford-promise-undated, pv-inducement-both)
      lacked adoption_weight and would_change_if; both added (adoption not measured,
      weight 1). The dig lacked a divergence_note; one added stating that no gap is
      measurable yet. No claim's state, statement or evidential weight changed.

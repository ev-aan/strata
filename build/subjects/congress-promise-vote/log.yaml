subject: congress-promise-vote
dig_status: scoping
log:
  - id: L-01
    date: "2026-10-02"
    entry: >
      Owner proposed using timelines to show how politics works (votes, messaging, alliances) and
      whether politicians are true to their constituents. Owner chose: US Congress; question
      "promise to vote to outcome"; neutral fixed-rule selection across both parties.
  - id: L-02
    date: "2026-10-02"
    entry: >
      Feasibility: official House and Senate roll-call XML and the Voteview dataset are reachable
      from the cloud session; a House 2023 roll call parsed correctly (member, party, vote). FEC
      and api.congress.gov need free API keys. congress.gov and OpenSecrets block the cloud session.
  - id: L-03
    date: "2026-10-02"
    entry: >
      Protocol written (protocol.yaml) before any bill or member was chosen. No subject selected
      and no claims filed. Constituent-opinion comparison deliberately left out of the pilot.
      NEXT: owner approves or amends the protocol; then apply the selection rule mechanically
      and log the candidate list before reading any member's record.
  - id: L-04
    date: "2026-10-02"
    entry: >
      Owner asked for consistency between this dig and others that contain votes (Tonkin).
      Added SCHEMA.md 'Actors, statements and votes' (P1 to P7) and an actors.yaml standard.
      Test on Tonkin: the 7 Aug 1964 vote totals were read in Voteview's roll-call data
      (Senate roll 481: 88-2, nays Gruening and Morse; House roll 197: 416-0) and linked from the
      Tonkin timeline. One discrepancy logged: Voteview's per-member Senate file has one more yea
      than its summary row; unresolved.
  - id: L-05
    date: "2026-10-02"
    entry: >
      Owner agreed the authenticity-of-motive idea fits politics, not every kind of dig. Added P9 (inducement
      claims, tiers decisive/supporting/context, default searched_gap), P10 (consistency over time, synthetic,
      cap 3) and P11 (motive and sincerity not assessed) to SCHEMA.md as politics-only rules.
  - id: L-06
    date: "2026-10-02"
    entry: >
      PILOT STARTED. Clarifications to the selection rule, written BEFORE any roll call was fetched, because the
      rule as drafted was ambiguous: (a) 'most recently completed Congress' = the 118th (3 Jan 2023 to 3 Jan 2025);
      the 119th is still sitting. (b) Chamber: the House only, because its official Clerk XML gives member, party
      and vote in one file. (c) 'Final-passage vote' = a recorded House vote whose question is passage of a bill or
      joint resolution (H.R., S., H.J.Res., S.J.Res.), including suspension-and-pass; simple and concurrent resolutions,
      amendments, motions and conference reports are excluded. (d) 'At least 10 members of each party on each side':
      at least 10 Democrats and 10 Republicans voting Yea, and at least 10 of each voting Nay. (e) 'First by roll-call
      number': ascending roll number, 2023 before 2024. (f) Member rule unchanged: first by last name from each party
      whose vote differed from that party's majority on that roll call. Not-voting and Present do not count as
      differing. If a clarification turns out to be wrong it will be logged, not edited.

id: pt_217
pt_number: 217
display_name: "PT 217 — Solar Ascent: Cardinal Direction Announcements"
sethe_phrase_range:
  value: "§§ 152a–162c (approximate)"
  state: searched_gap
  required_source: "Sethe, K. 1908. Vol. 1."

# ─── TIMEGRAPH ────────────────────────────────────────────────────────────────

timegraph:
  carved_date_start: -2345
  carved_date_end: -2323
  carved_uncertainty_years: 10
  carved_basis: "Co-extensive with Teti's reign. Shaw 2000."
  later_attestations:
    - source: "Unas pyramid, sarcophagus chamber south wall"
      approximate_date_start: -2375
      approximate_date_end: -2345
      note: "Shared corpus; Unas version is the primary comparison text."

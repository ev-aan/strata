parallel_pyramids:
  unas: true
  pepi_i: searched_gap
  merenre: searched_gap
  pepi_ii: searched_gap

notes: >
  PT 217 is the most architecturally self-aware spell in this initial set.
  The cardinal-direction structure (south → north → west → east) maps onto the
  chamber's physical orientation. The four herald deities correspond to the
  four points of the compass AND the four sons of Horus (though they are not
  the same figures). This is the PT corpus doing what the whole architectural
  program does: using physical space as theological argument.
  The power-formula ('if he wills you die, you die') has no parallel in any
  earlier Egyptian text and represents the most extreme claim of royal
  transcendence in the corpus.

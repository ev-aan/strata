        Allen (2005, note 1) records: 'The earliest instance of a Pyramid Text
        outside the pyramid chambers is a copy of PT 32 on the support for a
        libation table in the mortuary temple of Pepi I's pyramid (Leclant 1990).'
        This makes PT 32 the first PT utterance to appear outside the pyramid

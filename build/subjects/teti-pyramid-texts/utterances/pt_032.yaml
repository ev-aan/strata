    source: "Allen 2005, note 1, citing Leclant 1990."

parallel_pyramids:
  unas: true
  pepi_i: true
  merenre: searched_gap
  pepi_ii: searched_gap

notes: >
  PT 32 is architecturally and ritually central: it is the title-spell of the
  Mouth-Opening Meal, the ritual sequence that enables the deceased king to
  function in the afterlife. Its appearance outside the pyramid chamber
  (Pepi I mortuary temple libation table) shows the spell had active ritual
  use beyond the burial context — it was recited, not just inscribed.
  This dual function (inscribed protection + oral ritual) is a key interpretive
  question for the entire PT corpus.

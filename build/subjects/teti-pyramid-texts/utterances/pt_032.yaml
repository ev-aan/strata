# ─── LOCATION ─────────────────────────────────────────────────────────────────

location:
  chamber: burial_chamber
  wall: north
  column_direction: west_to_east
  note: >
    PT 32 sits within the north wall Offering Ritual complex. In Unas it appears
    on the passage north wall (pyramidtextsonline.com). The precise wall assignment
    in Teti's corpus requires Allen 2005 (Teti section, pp. 65+) to confirm.
  physical_condition: >
    North wall of Teti's burial chamber exists 'mostly as disjointed fragments'

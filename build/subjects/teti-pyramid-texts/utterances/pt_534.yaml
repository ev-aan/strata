timegraph:
  carved_date_start: -2345
  carved_date_end: -2323
  carved_uncertainty_years: 10
  carved_basis: "Co-extensive with Teti's reign. Shaw 2000."
  theological_note: >
    PT 534 is the only spell in Mercer's classification that explicitly
    protects against Osiris. Its title — 'For the Protection of the Pyramid
    Enclosure Against Osiris and His Cycle' — is among the most theologically
    anomalous in the corpus. Osiris is the king's divine template for resurrection
    throughout the PT, yet here he is a force to be protected against.
    This paradox is the primary interpretive problem of PT 534.
  later_attestations:
    - source: "Coffin Texts and later protective spells"
      state: searched_gap
      note: "Whether this anti-Osiris protective tradition persists into CT: searched_gap."


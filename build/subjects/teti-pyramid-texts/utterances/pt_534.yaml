  physical_condition: searched_gap

ritual_class:
  classes:
    - apotropaic
    - protective
  note: >
    PT 534 is classified under 'For The Protection of the Pyramid Enclosure Against
    Osiris and His Cycle' — a category appearing in Mercer's index as Chapter XXVI
    (a single utterance, not a series). The singular 'Utterance 534' under this
    heading suggests PT 534 is the entire protective enclosure corpus for this theme.
    'The pyramid enclosure' (Hw.t nTr = 'the god's mansion' or the entire pyramid
    complex) needs protection — from Osiris himself and from 'his cycle' (his
    divine family/Ennead). This inverts the entire Osirian identification program.


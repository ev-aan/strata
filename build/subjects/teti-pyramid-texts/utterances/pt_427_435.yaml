ritual_class:
  classes:
    - protective
    - osirian
  note: >
    The Nut hymns are protective invocations — calling on Nut to spread over,
    embrace, and protect her divine son (the king). The dominant image is Nut
    as cosmic canopy: 'Nut, spread thyself over thy son, Osiris N.' (PT 427).
    Each short utterance in the series is a variation on the same protective
    theme: Nut protects the king, the king shall not die, Nut is mighty.


notes: >
  PT 427–435 is filed as a single entry because the nine utterances constitute
  a coherent liturgical series — the First Nut Hymn cycle. Individual utterances
  within the series can be split into separate records as the dig deepens.
  PT 435's first-person Nut speech is the most unusual element: a goddess
  speaks in first person to proclaim the king's royal titulary. This is the
  only point in the PT corpus where a deity explicitly recites the five royal
  titles — making PT 435 a coronation-in-absentia embedded in a funerary text.

  theological_note: >
    PT 570 is classified by Mercer under 'New-Birth of the Deceased King as a
    God in Heaven' (Chapter XXXIV — a single utterance). This is the explicit
    new-birth theology: the king is not resurrected (brought back) but born
    again (entirely new existence). The distinction between resurrection and
    new-birth is theologically significant — one is a return, the other is

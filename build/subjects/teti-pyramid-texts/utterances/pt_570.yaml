notes: >
  PT 570 is the theological culmination of the entire burial chamber program —
  the endpoint of the journey begun at PT 213's 'you have not gone dead.'
  The new-birth theology takes the Osirian resurrection (body reconstituted,
  gates opened, stars reached) and transforms it: the king is not the same
  being reanimated but a new divine being born into the stellar order.
  This is the most ambitious claim in the corpus — not that the king survives
  death but that death generates a qualitatively new divine existence.
  Combined with PT 534's protection against Osiris and PT 510's Sobek
  transformation, the high-numbered Teti spells (beyond Unas's range)
  show a theological richness and complexity that the standard resurrection
  narrative does not capture. These are the spells most worth unlocking
  through Sethe 1908 vol. 2.

location:
  chamber: antechamber
  wall: east
  column_direction: west_to_east
  note: >
    PT 301 is the final spell of the antechamber east wall — the last spell
    before the east gable (which bears PT 273–274, the Cannibal Hymn, in Teti).
    Allen (2005) describes the east wall as containing spells 'for control over
    provisions and inimical forces and (in the pyramids of Teti, Pepi I, and
    Merenre) the Morning Ritual.' PT 301 as the final east wall spell precedes
    the east gable and the Cannibal Hymn — it is the last 'provision and control'
    spell before the most theologically extreme utterance in the corpus.
    Its function as prelude to PT 273–274 is architecturally significant.
  physical_condition: searched_gap

ritual_class:
  classes:
    - protective
    - stellar_ascent
  note: >
    The antechamber east wall spells (PT 277–301) include spells for the spirit's
    safe transition through the eastern portal of the Akhet (Allen 2005, p. 12).
    PT 301 as the final east wall spell would be the last protective/transitional
    spell before the Cannibal Hymn's extreme power-absorption imagery.


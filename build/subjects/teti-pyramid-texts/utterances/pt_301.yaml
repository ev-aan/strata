  pepi_i: searched_gap
  merenre: searched_gap
  pepi_ii: searched_gap

notes: >
  PT 301 is included specifically for its position: the final spell before
  the Cannibal Hymn. Understanding the transition from PT 301 to PT 273–274
  is essential for reading the Cannibal Hymn in context — what theological
  preparation does PT 301 provide? Is it a summative protection spell?
  A provision seal? The east gable turn is the most dramatic in the
  antechamber sequence. PT 301's content would illuminate the dramatic logic.

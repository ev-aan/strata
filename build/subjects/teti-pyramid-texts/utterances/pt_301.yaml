lexical_anchors:
  - term_transliteration: "Axt"
    semantic_field: "Akhet — the eastern portal through which the spirit transitions"
    notes: >
      The east wall spells concern the spirit's passage through the eastern limit
      of the Akhet. 'The last spell on the south wall addresses the gateway at the
      eastern limit of the Akhet, and those on the east gable and most of the east
      wall are meant to ensure the spirit's safe transition through this portal.'
      (Allen 2005, p. 12). PT 301 as the east wall's final spell is the last
      'safe passage' assurance before the east gable's Cannibal Hymn.
    source: "Allen 2005, p. 12."

divergence_points:
  - id: east_wall_morning_ritual
    claim: >
      The antechamber east wall in Teti contains the Morning Ritual
      (absent from Unas's corpus).
    state: established
    positions:
      - scholar: "Allen, J.P. 2005"
        reading: >
          'The texts in the second group are somewhat different, consisting of
          spells for control over provisions and inimical forces and (in the
          pyramids of Teti, Pepi I, and Merenre) the Morning Ritual.'
        source: "Allen 2005, p. 12."
    note: >
      This is one of Teti's documented innovations relative to Unas.
      The Morning Ritual occupies part of the east wall in Teti but is absent
      from Unas. PT 301's position as the final east wall spell before the
      east gable places it after the Morning Ritual — making it a seal-spell
      for the Teti-specific ritual addition. Which specific PT numbers constitute
      the Morning Ritual in Teti requires Allen 2005 Teti section to confirm.


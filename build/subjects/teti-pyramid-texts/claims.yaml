    required_source: Eyre, C. 2002; Allen 2005; Goebs 2004.
  positions:
  - scholar: Renouf (1880s); Wikipedia PT article
    reading: >-
      The hymn echoes how the goddess Nut (the sky) causes the stars to disappear at dawn — 'as a sow eating her offspring.' The king
      as the dawn sun 'eating' the stars is the same metaphor. Utterance 217 elsewhere describes the king in stellar form being 'swallowed
      up' at dawn with other stars.
  - scholar: Faulkner 1924; Barta 1979
    reading: >-
      The hymn is primarily about power accumulation — the king absorbs the magical and spiritual power of the gods. The metaphor is
      consumption as absorption of essence, not specifically stellar transit.
  - scholar: Eyre 2002
    reading: >-
      The hymn is a 'cultural and literary study' — its function is as much performative/literary as theological. The extreme violence
      signals a category of royal power that exceeds normal cult language.
  note: >-
    These three readings are not mutually exclusive and may all be simultaneously true. Strata should record them as concurrent proposed
    claims rather than forcing a single resolution.

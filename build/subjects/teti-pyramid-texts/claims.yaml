- id: pt-273-274-stellar-vs-solar-interpretation
  state: proposed
  statement: >-
    The Cannibal Hymn is a stellar ascent text (the king becomes a star by 'consuming' other stars at dawn) rather than a solar power-accumulation
    text.
  evidence_class: interpretive
  confidence: low
  evidential_weight: 1
  anchor_checked: 'no'

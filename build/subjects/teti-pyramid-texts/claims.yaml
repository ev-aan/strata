  - scholar: Standard reading of PT 373
    reading: >-
      Geb (earth god, father of Osiris, Isis, Seth, Nephthys) is identified as the king's divine father. This is consistent with the
      Osirian theology: as Osiris, the king's mythological father is Geb. But the king's actual father (the previous pharaoh) is also

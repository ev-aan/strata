    document_class: primary_text (copies of lost originals)
    authenticity:
      status: unchecked
      strength: weak
      provenance: "Held at the National Archives and Hatfield House; seen in this dig only through Henderson's printing and description."
      tests:
        - "Henderson reports a collation minute of 14 Dec 1568 by the commissioners: 'In collation whereof no difference was found' [read in OCR]. A claim by the commissioners, not a test of the copies."
      tested_by: "not independently tested"
      gaps:
        - "The copies carry 'alterations and corrections' in other hands (Henderson, p. 68); who made them and when is not established here."

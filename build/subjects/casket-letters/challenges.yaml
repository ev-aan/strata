    touches: [casket-authenticity-contested]
    test: "Look for surviving originals and for any published measured comparison."
    result: open
    answer: "No originals survive and only French copies of four letters exist. Contested, low confidence. No computational comparison against Mary's authenticated letters was found."
  - id: ch-04

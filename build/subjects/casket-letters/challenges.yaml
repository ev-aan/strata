    challenge: "Mary was framed by the state."
    raised_by: "Popular framing; no single source"
    touches: [casket-babington-postscript-forged-1586, casket-authenticity-contested]
    test: "Separate the documented 1586 forgery from the 1567 letters."
    result: partly_answered
    answer: "Documented (1586): English intelligence forged text in Mary's correspondence. Unproven (1567-68): that the Casket Letters were forged by the Scottish lords. The sources for the 1586 forgery have not been read directly in this project."
  - id: ch-02
    logged: 2026-10-02
    challenge: "Since the 1586 postscript was forged, the 1567 letters were forged too."
    raised_by: "Common argument by analogy"
    touches: [casket-babington-postscript-forged-1586, casket-authenticity-contested]
    test: "Ask whether a forgery by different people, in another country, 19 years later is evidence about the 1567 letters."
    result: answered
    answer: "It shows forging Mary's letters was possible and was done. It adds no evidence that the 1567 letters were forged."
  - id: ch-03

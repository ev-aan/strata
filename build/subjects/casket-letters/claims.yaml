    state: established
    statement: "The original Casket Letters are lost: only copies, translations and printed versions survive."
    evidence_class: primary_text
    confidence: provisional
    statement_kind: reported   # assigned by rule 2026-10-02, to be reviewed
    assumptions:
      - text: "That no original has been traced since the 1580s means they are lost and not merely unrecognised."
        if_wrong: "An original surfacing and being authenticated would change the claim."
    alternatives:
      - text: "An original survives, unrecognised, in a private or archival collection."
        why_not_preferred: "No source read reports one. The claim rests on absence, so it is held at provisional confidence."
    confidence_reasons:
      start: moderate
      start_because: "The anchor was checked against a secondary source (Henderson 1889, read in OCR)."
      steps:
        - {domain: unreported_negative_results, effect: down1, reason: "The claim rests on the absence of any traced original, which cannot prove absence."}
        - {domain: indirectness, effect: down1, reason: "The account is from 1889. No modern holdings or catalogues were checked."}
      reviewed: false
    evidential_weight: 3   # of 5; absence anchor, capped
    anchor_checked: secondary   # Henderson (1889) read in OCR on its chain of custody
    adoption_weight: 5   # of 5
    adoption_note: "Universal in the literature."
    would_change_if: "an original surfaced and was authenticated"
    next_step: "Read Henderson ch. IV in full and the Bowes correspondence he cites; separate the loss (documented) from who destroyed them (proposed, below)."
    anchor:
      type: absence-in-searched-record
      description: >
        Henderson (1889), ch. II-IV [read in OCR]: Morton kept the casket from 20 June 1567; Regent Moray received it from the Privy Council
        on 16 Sept 1568 and took it to York and Westminster; Morton had it back, and 'after Morton's execution they were delivered by his natural son,
        James, Prior of Pluscardin, to the Earl of Gowrie', then probably passed to Arran; the 'original copies of the Scottish translations
        disappeared completely from human ken'. No original has been traced since.
      accessible: true
      ref: [src-henderson-1889]

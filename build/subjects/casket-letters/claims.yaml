headline: "Casket Letters (Mary Queen of Scots, 1567): No Originals Survive, Only Copies and Translations"
headline_claim: casket-originals-lost
headline_status: draft           # rule 2 needs a claim established or refuted at HIGH confidence; casket-originals-lost is capped at provisional (absence anchor), so this stays draft
assessment:
  question: "Did Mary Queen of Scots write the Casket Letters?"
  answer: unsettled
  headline: "Unsettled. The evidence that would decide it does not survive."
  text: >
    The originals are lost (provisional confidence, because that rests on absence). What survives is a few French copies of four letters, about 1,750 words in all, which is too short for word-frequency tests,
    and Latin and Scots translations of the rest. The one measured comparison we know of leans slightly toward Mary's own phrasing, but it is our own unreviewed result and a difference in kind of writing could explain it.
    Many modern accounts treat the letters as doctored (National Museums Scotland says 'widely thought'), but that is adoption, not a test. The 1586 forgery of a different letter shows forgery was possible; it adds no evidence about 1567.
    We therefore do not say 'genuine' or 'forged'.
  lean:
    toward: "Yes, genuine: written by Mary"
    strength: slight
    because: "The one measurement we have, on the four surviving French letters, finds more shared phrases with Mary's authenticated French letters than with Catherine de Medici's, at levels typical of Mary's own letters (claim casket-french-lean-mary)."
    caveats: "It is our own result and no one outside the project has reviewed it. A difference in kind of writing (private letters against formal papers) could explain it and has not been controlled for. The text is about 1,750 words, too short for the stronger tests. The surviving French copies may themselves be back-translations from Latin (claim casket-french-printed-retranslation, proposed). A lean is not a finding: it stays under 'Unsettled' until a basis claim reaches moderate confidence."
  key_points:
    - "No original letter survives, so the letters themselves cannot be examined."
    - "What survives (French copies of four letters, about 1,750 words, and translations of the rest) is too little for the standard authorship tests."
    - "Our one measurement leans slightly toward Mary, but it is unreviewed and is not a finding."
  basis: [casket-authenticity-contested, casket-originals-lost, casket-too-short-for-wordfreq, casket-french-lean-mary, casket-babington-postscript-forged-1586]
  would_settle: "An authenticated original, or a measured comparison on enough text, with a control of the same kind of writing, that survives review by someone outside the project."
search_summary: >
  Did Mary Queen of Scots write the Casket Letters? Unsettled: no original survives, only copies and translations, so the debate rests on those. The 1586 forgery is a different case.
url_slug: casket-letters-mary-queen-of-scots-no-originals-survive-copies-translations

subject: casket-letters
title: "The Casket Letters (Mary Queen of Scots, 1567 to 1587)"
migrated_from: "questions/casket-letters/index.html (open question Q-001 (formerly bounty B-001), opened 2026-10-01 by the Strata/Stratah project). The page and its run files are unchanged; this subject restates its claims in the YAML standard. Open Question IDs (C-01..C-06, F1..F11, DT-001, DT-002, G-01..G-05) are kept as `bounty_id` so nothing is renumbered."
description: >
  In June 1567 Mary's enemies said they had found a silver casket with letters and sonnets from her to the Earl of Bothwell.
  Read as genuine, the letters tie her to the murder of her husband Lord Darnley. They were shown to Elizabeth I's commissioners
  in 1568 and the originals later vanished. This dig keeps four things apart: that the originals are lost (documented), what the
  surviving copies and translations are (copies of unknown fidelity), whether the letters are genuine (contested; no independent test has
  decided it), and the 1586 forgery in Mary's correspondence (documented, but a different case that lends the 1567 letters no weight).
  A narrow computed test of the four surviving French texts is reported with its limits.
divergence_note: >
  Evidence and belief diverge in two places. First, the composite view (real letters altered or spliced) is the most adopted among modern
  historians but, like the genuine and forged views, rests on interpretation, not an independent test. Second, the popular 'Mary was
  framed' framing borrows credibility from the documented 1586 forgery, which says nothing about the 1567 letters.


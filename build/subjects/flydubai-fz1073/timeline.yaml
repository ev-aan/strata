# kind: data = machine-recorded; official = government or company statement; witness = a person's account;
#       media = a news outlet's own report or inference.
# status: reported = 2+ independent sources agree; single = one source; disputed = sources differ; inferred = our inference.
# date_basis: stated | derived (a time-zone conversion by us) | inferred | publication_proxy | dataset_field.
events:
  # ---------------- Panel A (UTC) ----------------
  - {id: a1,  panel: flight, lane: aircraft, node: fz1073-2026-09-30-departure-dubai, rev: 1,
     note: "CNN's '6:05 a.m. local time' is 03:05 UTC on the UTC+3 clock CNN uses elsewhere, so this is no longer drawn as a discrepancy; CNN's '10:05 p.m. ET' is one hour off (see log L-17)."}
  - {id: a2,  panel: flight, lane: aircraft, time: "2026-09-30T05:21:00Z", precision: exact, date_basis: stated, kind: data,  status: reported, sources: [s_aljazeera, s_khaleej],
     label: "Altitude fluctuations begin; steep descent",
     detail: "Flightradar24: altitude fluctuations from 05:21 UTC (Al Jazeera); steep descent from about 9:21 a.m. UAE time, which is 05:21 UTC (Khaleej Times). Tracking then showed a descent, a climb and a second steep descent; about 15,000 ft by 05:33 UTC (Khaleej Times)."}
  - {id: a3,  panel: flight, lane: aircraft, time: "2026-09-30T05:22:00Z", precision: approx, date_basis: stated, kind: data,  status: disputed, sources: [s_aljazeera, s_cnn, s_airnav, s_reuters],
     label: "Rapid descent (size disputed)",
     detail: "DISCREPANCY BETWEEN SLICES OF ONE DIVE: about 14,000 ft in under 30 seconds (Flightradar24 via Al Jazeera), 16,625 ft in just over 30 seconds (Flightradar24 via Reuters, 2 Oct), 17,400 ft in just under two minutes (CNN), 34,000 to 15,000 ft in a few minutes with a peak of about -30,900 ft/min (AirNav Radar). Only the raw altitude track can settle it; none was read."}
  - {id: a4,  panel: flight, lane: first_officer, time: "2026-09-30T05:22:00Z", precision: approx, date_basis: inferred, kind: media, status: inferred, sources: [s_aljazeera],
     label: "Cockpit struggle (start; time not reported, placed at the drop)",
     detail: "Reports say the struggle began when the captain was stabbed and the jet plunged; the start time is not given. Placed at the time of the drop as an inference."}
  - {id: a5,  panel: flight, lane: captain, time: "2026-09-30T05:22:00Z", precision: approx, date_basis: inferred, kind: official, status: reported, sources: [s_cnn, s_cnn_live, s_aj_saudi],
     label: "Captain injured (time not reported)",
     detail: "Saudi ministry: an assault by the co-pilot on the captain, injuries to both. Israel's Prime Minister and passengers: the captain was stabbed. The time is not reported; placed at the start of the incident as an inference."}
  - {id: a6,  panel: flight, lane: aircraft, time: "2026-09-30T05:31:00Z", precision: exact, date_basis: stated, kind: data,  status: disputed, sources: [s_aljazeera, s_cnn, s_airnav],
     alt_time: "2026-09-30T05:28:48Z", alt_tag: "AirNav", alt_note: "AirNav Radar: squawk 7700 at 05:28:48 UTC",
     label: "Squawk 7700 (emergency)",
     detail: "05:31 UTC per Flightradar24 (Al Jazeera); AirNav Radar says 05:28:48 UTC, about two minutes earlier. CNN's 'distress call at 8:31 a.m.' is this squawk on the UTC+3 clock (05:31 UTC), not the radio call. Why two trackers differ is not known (reception time, delay or a different message)."}
  - {id: a7,  panel: flight, lane: aircraft, time: "2026-09-30T05:38:00Z", precision: exact, date_basis: stated, kind: data,  status: disputed, sources: [s_aljazeera, s_airnav],
     alt_time: "2026-09-30T05:35:00Z", alt_tag: "AirNav", alt_note: "AirNav Radar: squawk 7500 at about 05:35 UTC",
     label: "Squawk 7500 (unlawful interference)",
     detail: "05:38 UTC per Flightradar24 (Al Jazeera); about 05:35 UTC per AirNav Radar. AirNav also reports the code returning to 7700 on approach to Tabuk (7700, 7500, 7700). Who set the codes is not reported."}
  - {id: a14, panel: flight, lane: saudi, time: "2026-09-30T05:44:00Z", precision: exact, date_basis: derived, kind: official, status: single, sources: [s_khaleej],
     label: "Distress call received by Tabuk air traffic control",
     detail: "Tabuk airport statement as quoted by Khaleej Times: its air traffic control centre received a distress call at 8:44 a.m. Saudi time (UTC+3), converted to 05:44 UTC by us."}
  - {id: a8,  panel: flight, lane: passengers, time: "2026-09-30T05:45:00Z", precision: range, end: "2026-09-30T06:10:00Z", date_basis: inferred, kind: witness, status: inferred, sources: [s_cnn, s_cnn_live],
     label: "Passengers and crew enter the cockpit; the co-pilot is restrained (time not reported)",
     detail: "Passenger accounts: a chokehold and removal from the cockpit; tied with headphone cords and zip ties; 'about five others' helped (a passenger to CNN). The time of day is not reported; the bar is an inference between the squawk change and the landing."}
  - {id: a9,  panel: flight, lane: additional_pilots, time: "2026-09-30T05:50:00Z", precision: range, end: "2026-09-30T06:10:00Z", date_basis: inferred, kind: media, status: disputed, sources: [s_cnn, s_flydubai, s_cbs],
     label: "Additional pilots take the controls (time not reported)",
     detail: "DISCREPANCY IN DESCRIPTION: flydubai says 'on-duty flydubai crew travelling on the flight'; Netanyahu says another air crew; CNN says reserve pilots; CBS says off-duty. Accounts differ on who first reached the controls. Time inferred."}
  - {id: a10, panel: flight, lane: israel_mil, time: "2026-09-30T05:40:00Z", precision: range, end: "2026-09-30T06:30:00Z", date_basis: inferred, kind: media, status: single, sources: [s_aljazeera],
     label: "Israeli fighter jets scrambled (time not reported)",
     detail: "Reported by Al Jazeera (via Reuters) without a time; a Jerusalem Post statement from the Air Force describes the procedure for such flights without confirming this one."}
  - {id: a11, panel: flight, lane: aircraft, time: "2026-09-30T06:58:00Z", precision: approx, date_basis: stated, kind: data,  status: single, sources: [s_airnav],
     label: "Last ADS-B message received by AirNav Radar",
     detail: "AirNav Radar: last ADS-B data received 'at approximately 06:58 UTC'. (An earlier version of this timeline gave 06:11 UTC for loss of tracking coverage from an aggregator; that is superseded and not repeated here, see log L-17.)"}
  - {id: a12, panel: flight, lane: saudi, node: fz1073-2026-09-30-landing-tabuk, rev: 3}
  - {id: a13, panel: flight, lane: cabin, time: "2026-09-30T05:45:00Z", precision: range, end: "2026-09-30T06:10:00Z", date_basis: inferred, kind: media, status: single, sources: [s_cnn],
     label: "Cabin crew call for a doctor and a pilot (video; time not reported)",

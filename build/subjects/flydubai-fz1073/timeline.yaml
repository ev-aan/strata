# Timeline data for the Flydubai FZ1073 dig. YAML is the source of truth; the diagram is generated
# by build/tools/render_timeline.py. Nothing here is a finding: every item is a REPORTED fact with its
# sources and a status, and the discrepancies are shown, not resolved.
timeline:
  id: flydubai-fz1073
  title: "Flydubai FZ1073, 30 September 2026: who did what, and when"
  as_of: "2026-10-02"
  note: >
    Live event. Reports are being revised. All clock times are UTC unless a note says otherwise.
    Dubai is UTC+4; Tabuk and Israel are UTC+3 in this period. The suspect is not publicly
    identified by authorities and is not named here. Named people are those whom the cited reports
    name and who spoke publicly or are officials.


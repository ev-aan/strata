# Timeline data for the Flydubai FZ1073 dig. YAML is the source of truth; the diagram is generated
# by build/tools/render_timeline.py. Nothing here is a finding: every item is a REPORTED fact with its
# sources and a status, and the discrepancies are shown, not resolved.
timeline:
  id: flydubai-fz1073
  title: "Flydubai FZ1073, 30 September 2026: who did what, and when"
  as_of: "2026-10-02"
  note: >
    Live event, as of 2026-10-02. Reports are being revised. All clock times are UTC unless a note says otherwise.
    Dubai is UTC+4; Tabuk and Israel are UTC+3 in this period. The co-pilot is not publicly named by any
    authority and is not named here. Named people are officials, and the captain (named by India's government,
    Israel's and the UAE's authorities and all outlets read); passengers are identified by role only.
    Places are given only where a source names them, with coordinates from a gazetteer (orientation only).
    Each event states how its time was arrived at (date_basis).

panels:
  - id: flight
    title: "Panel A: the flight, 30 September (UTC)"
    start: "2026-09-30T01:30:00Z"
    end:   "2026-09-30T07:30:00Z"
    tick_minutes: 30
    axes: [{label: "Dubai time (UTC+4)", offset_hours: 4}]
    lanes: [aircraft, captain, first_officer, additional_pilots, passengers, cabin, israel_mil, saudi]
  - id: aftermath
    title: "Panel B: statements and actions, 29 September to 2 October (times where reported, otherwise the day)"
    start: "2026-09-29T00:00:00Z"
    end:   "2026-10-03T00:00:00Z"
    tick_hours: 12
    lanes: [flydubai, israel_gov, israel_agencies, saudi_gov, uae, us, other]

lanes:
  aircraft:        {label: "Aircraft and tracking data"}
  captain:         {label: "Captain (Indian national)"}
  first_officer:   {label: "First officer (accused by officials, not named)"}
  additional_pilots:  {label: "Two additional pilots (unnamed)"}
  passengers:      {label: "Passengers who intervened"}
  cabin:           {label: "Cabin crew"}
  israel_mil:      {label: "Israeli Air Force"}
  saudi:           {label: "Saudi Arabia (Tabuk)"}
  flydubai:        {label: "Flydubai"}
  israel_gov:      {label: "Israeli government"}
  israel_agencies: {label: "Israeli agencies"}
  saudi_gov:       {label: "Saudi government"}
  uae:             {label: "UAE"}
  us:              {label: "United States"}
  other:           {label: "Others"}

people:
  - {who: "Captain Smit Machchhar", detail: "Indian national, named by India's Ministry of External Affairs, Israel's Prime Minister, the UAE civil aviation authority and all outlets read. Seriously wounded; surgery; reported out of danger (a local politician via CNN); moved to Abu Dhabi 1 Oct; the airline says he has returned to the UAE after medical clearance."}
  - {who: "First officer (co-pilot, accused)", detail: "Not named by any authority and not named here. Described by Israel's Prime Minister and an Israeli official as an Omani national; the Saudi ministry says he assaulted the captain and both were injured. Left Saudi Arabia for Abu Dhabi 1 Oct with an Emirati security team. No charge reported in anything read. An accusation is not a finding."}
  - {who: "Two additional pilots", detail: "Flydubai crew travelling on the flight who landed the aircraft: 'on-duty flydubai crew travelling on the flight' (flydubai); 'another air crew' (Netanyahu); 'reserve pilots' (CNN, Reuters); 'off-duty' (CBS); 'British pilots' (one passenger to CNN). Identities not shared."}
  - {who: "Passengers who intervened", detail: "About five or six passengers entered the cockpit (a passenger to CNN). Identified here by role only; no passenger is named. Accounts by several passengers are quoted by CNN, Haaretz and Ynet. About 170 on board (counts differ), mostly Israeli; four US-Israeli dual citizens; two Australians."}
  - {who: "Cabin crew", detail: "Unnamed; a crew member is seen calling for a doctor and for a pilot in video verified by CNN."}
  - {who: "Benjamin Netanyahu", detail: "Israel's Prime Minister; made the main public claims about the attack, the co-pilot's nationality and 'Islamist radical indoctrination'; also said it was too early to declare a motive or an Iran link (CNN, Al Jazeera). On 29 Sep warned of attacks before the election."}
  - {who: "Isaac Herzog", detail: "Israel's President; called it a 'great miracle'; said Israel and the UAE will 'investigate the incident in depth together'. On BBC Radio 4 (Thursday 1 Oct, per The National) he said the co-pilot is Omani and called him a 'terrorist'; an accusation, not a finding."}
  - {who: "Anwar Gargash", detail: "Described by CNN as a top UAE official; CNN reports that on Friday 2 Oct he described the incident as a 'dangerous terrorist act' (his own words not read); an accusation, not a finding. The UAE's investigation is examining any terrorist link."}
  - {who: "Miri Regev", detail: "Israel's Transportation Minister; asked Shin Bet to halt flydubai's Israel flights and asked the civil aviation authority to look at whether the UAE violated the aviation agreement."}
  - {who: "Israel Katz", detail: "Israel's Defence Minister; called it an 'attempted jihadist terror attack' (Al Jazeera, CNN; no evidence given)."}
  - {who: "Yair Lapid", detail: "Israel's opposition leader; said the 29 Sep warning had nothing to do with planes, and accused Netanyahu of trying to 'hitch a pathetic ride' (Al Jazeera)."}
  - {who: "Donald Trump", detail: "US President; said an Iran link was likely 'based on what I'm hearing', gave no detail (CNN live blog)."}
  - {who: "Penny Wong", detail: "Australian Foreign Minister; confirmed two Australian passengers (CNN)."}
  - {who: "flydubai", detail: "Four numbered statements on its newsroom (read): incident en route; 'an altercation' in the flight deck; Israel flights suspended; CEO statement on 2 Oct."}
  - {who: "Saudi Interior Ministry", detail: "Statement 1 Oct: assault on the captain by the co-pilot, injuries to both; landing 9:45 a.m. local with 174 passengers and eight crew; both left for Abu Dhabi with an Emirati team. Read through Al Jazeera and CNN; the original was not reached."}
  - {who: "UAE authorities", detail: "Attorney-General ordered a Public Prosecution team to investigate (MoFA statement, read); the civil aviation authority called it a 'security incident' and on 2 Oct commended the captain, crew and passengers."}
  - {who: "Israeli agencies", detail: "Shin Bet, Mossad, the military and the transport ministry are involved in the Israeli review (an Israeli official to CNN)."}
  - {who: "Trackers", detail: "FlightAware (read: list page), AirNav Radar (read: blog), Flightradar24 (not reached; known through reports)."}


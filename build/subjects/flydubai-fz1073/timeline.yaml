people:
  - {who: "Captain", detail: "Reported as Capt. Smit Machchhar, from India (CNN). Stabbed; surgery; reported in stable condition (a local politician in his home district, via CNN)."}
  - {who: "First officer (suspect)", detail: "Not publicly identified by authorities. Israel's Prime Minister says he is an Omani national; reported stabbing the captain and trying to crash the plane (Israeli claims); Saudi ministry: 'an assault on the captain by the co-pilot, resulting in various injuries to both'. Taken to Abu Dhabi. Not charged in anything read."}
  - {who: "Two off-duty pilots", detail: "Passengers who took the controls. Netanyahu: 'another air crew'; Flydubai: 'on-duty Flydubai crew travelling on the flight'; CNN: 'reserve pilots', details not shared. Identities unconfirmed."}
  - {who: "Yaniv Hayoun (passenger)", detail: "Says he held the attacker in a chokehold and dragged him from the cockpit, then briefly held the controls (CNN, his own account to Netanyahu)."}
  - {who: "Dr. Shota Musaev (passenger)", detail: "A dentist; says he tied the attacker with headphone cords and zip ties and treated the captain (CNN)."}
  - {who: "Other passengers quoted", detail: "Mika Bauman, Assaf Rajuan (CNN); Dalia Shpigel (Haaretz via Al Jazeera). About 174 on board, 27 children, mostly Israeli; four US-Israeli dual citizens; two Australians."}
  - {who: "Cabin crew", detail: "Unnamed; a crew member is seen calling for a doctor and for a pilot in verified video (CNN)."}
  - {who: "Benjamin Netanyahu", detail: "Israel's Prime Minister; made the main public claims about the attack, the suspect's nationality and 'Islamist radical indoctrination'; also said it was too early to declare a motive (Al Jazeera)."}
  - {who: "Isaac Herzog", detail: "Israel's President; called it a 'great miracle'; said Israel and the UAE will investigate in depth together."}
  - {who: "Miri Regev", detail: "Israel's Transportation Minister; demanded Flydubai's Israel flights be suspended and an inquiry into the UAE agreement (ThePrint)."}
  - {who: "Danny Danon", detail: "Israel's UN ambassador; said there was 'no doubt' it was an attempt to bring the plane down (Al Jazeera)."}
  - {who: "Donald Trump", detail: "US President; said an Iran link was likely 'based on what I'm hearing', gave no detail (CNN live blog)."}
  - {who: "Penny Wong", detail: "Australian Foreign Minister; confirmed two Australian passengers (CNN)."}
  - {who: "Flydubai spokesperson", detail: "'An altercation'; motives 'unknown'; asked all parties to 'refrain from premature speculation' (Al Jazeera)."}
  - {who: "Saudi Interior Ministry", detail: "Statement 1 Oct: assault by the co-pilot on the captain, both injured; both left for Abu Dhabi with an Emirati team (CNN)."}
  - {who: "Israeli agencies", detail: "Shin Bet, Mossad, the military and the transport ministry are involved in the investigation (Israeli official to CNN)."}
  - {who: "UAE authorities", detail: "Say they are investigating whether the violence was linked to terrorism; received the suspect (CNN live blog)."}
  - {who: "Flightradar24", detail: "Tracking-data provider; the source of most timing in Panel A."}


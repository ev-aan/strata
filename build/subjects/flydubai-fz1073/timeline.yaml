  aircraft:        {label: "Aircraft and tracking data"}
  captain:         {label: "Captain (Indian national)"}
  first_officer:   {label: "First officer (accused by officials, not named)"}
  additional_pilots:  {label: "Two additional pilots (unnamed)"}
  passengers:      {label: "Passengers who intervened"}
  cabin:           {label: "Cabin crew"}
  israel_mil:      {label: "Israeli Air Force"}
  saudi:           {label: "Saudi Arabia (Tabuk)"}
  flydubai:        {label: "Flydubai"}
  israel_gov:      {label: "Israeli government"}
  israel_agencies: {label: "Israeli agencies"}
  saudi_gov:       {label: "Saudi government"}
  uae:             {label: "UAE"}
  us:              {label: "United States"}

      An absence anchor is capped at provisional. This is not a finding that the event was real beyond what the statements and reports say; it is a finding that nothing found points the other way. A staging claim would have to explain why independent parties' accounts agree with it: an Indian national hospitalised and speaking to India's Prime Minister, Saudi and UAE statements, tracker reports, hundreds of passengers of several nationalities. It does not address whether anyone arranged or allowed a real attack (fz1073-arranged-or-allowed).
      The cabin observations the owner raised (masks, a clean cabin, helpers on board) do not test it (claims fz1073-masks-clean-cabin, fz1073-surgeon, fz1073-extra-pilots-statistics). The id keeps its original wording; an earlier draft held this claim as refuted at moderate confidence and the reviewer's round 1 (R1-1) moved it to a searched gap.

  - id: fz1073-arranged-or-allowed
    state: searched_gap
    statement: >
      Whether anyone arranged the attack, or knowingly allowed a vetting or rostering failure that let it happen (variants A2 and A3 in the log), cannot be assessed: no roster, vetting record or investigation finding is public, and no evidence for either variant was found.
    evidence_class: synthetic
    confidence: low
    statement_kind: search_result
    absence_anchor: true
    evidential_weight: 1   # of 5
    anchor_checked: no
    adoption_weight: 2   # of 5
    adoption_note: >
      Not polled. The idea is voiced online and by a few commentators; the Israeli Prime Minister is asking whether the co-pilot was "dispatched" by someone else, which is a different question (whether a third party directed him).
    would_change_if: >
      investigation findings on rostering, vetting and any direction; documents or testimony of an arrangement
    next_step: >
      Read the UAE-led investigation's findings; the airline's roster and nationality policy; the Shin Bet or Israeli civil aviation authority review; any court filing. Until then keep the claim open and do not infer from the Omani-pilot question alone.
    anchor:
      type: search-record
      description: >
        Searched CNN, Al Jazeera, Jerusalem Post, Ynet, ThePrint, ABC Verify and ProtoThema [read] for an evidence-based statement that the attack was arranged or the failure allowed: none found. Israeli officials say the vetting question is under investigation (CNN [read]). The log (L-11) lists what each variant would require: for example, deliberate placement would need the roster and vetting records and the cooperation of airline staff;
        a staged event would also need the captain, two or more pilots, cabin crew and passengers, the airline, Saudi and UAE authorities and the trackers to be part of it.
      sources: [src-cnn-live, src-aljazeera-explainer, src-jpost-910405, src-ynet, src-theprint, src-abc-verify, src-protothema]
    basis: >
      An absence anchor is capped at provisional. Not finding evidence is not evidence of absence; it is why this stays open.

  - id: fz1073-reports-inconsistent
    state: proposed
    statement: >
      The owner's third observation, that the reporting looks inconsistent, is correct in part: reports differ on several numbers and labels, but the differences read so far are explained by clocks, slices of one dive, wording or early error, and only some remain unresolved; none is shown to be fabrication.
    evidence_class: interpretive
    confidence: provisional
    statement_kind: judgment
    assumptions:
      - {text: "The outlets read report the same underlying event and quote the same few records.", if_wrong: "If two outlets described different events, the discrepancies below would not be comparable."}
    alternatives:
      - {text: "The discrepancies indicate fabricated or coordinated reporting.", why_not_preferred: "Each resolved item has a simple cause (a time zone, a different slice of the descent, and, for the landing time, no explanation yet, which is listed as open); no evidence of fabrication was found, and a discrepancy alone is not evidence of it."}
    evidential_weight: 2   # of 5
    anchor_checked: no
    adoption_weight: 3   # of 5
    adoption_note: >
      Not polled. "Inconsistent" is the owner's impression and is common online.
    would_change_if: >
      an unresolved discrepancy turning out to be a material misstatement by an official source, or recorder data contradicting the tracker times
    next_step: >
      Resolve each open item against raw data: passenger and crew count (Saudi ministry: 174 passengers and 8 crew; flydubai CEO: 172 passengers and crew; Netanyahu and Reuters: 174), the descent figures, who first took the controls, and the pilots' duty status.
    anchor:
      type: comparison-of-reports
      description: >
        RESOLVED OR EXPLAINED (all [read]; the landing time is listed under STILL OPEN): (1) takeoff: CNN's "6:05 a.m. local time" is 03:05 UTC on the UTC+3 clock CNN uses elsewhere, matching FlightAware (07:05 at +04), AirNav and Flightradar24; CNN's "10:05 p.m. ET" is one hour off (03:05 UTC is 11:05 p.m. EDT), a correction of log L-03 (see L-17). (2) distress call: CNN's 8:31 is the 7700 squawk (05:31 UTC); Tabuk air traffic control logged a radio distress call at 8:44 Saudi time (05:44 UTC). (3) landing time is NOT resolved: 9:45 a.m. local (06:45 UTC) from the Saudi ministry and Tabuk airport, 9:54 from CNN (source not stated), and about 06:58 UTC from AirNav's blog and Flightradar24's final signal (Khaleej Times); a last signal can be later than touchdown, but AirNav's wording equates them.
        (4) squawk times: Flightradar24 (05:31, 05:38) and AirNav Radar (05:28:48, about 05:35) differ by two to three minutes; unexplained but small. (5) the drop: different slices of one dive (see fz1073-descent-magnitude). (6) who said "Omani": Netanyahu, Israel's President (BBC Radio 4, via The National), an Israeli official and Israeli sources; these are several Israeli speakers, not a discrepancy.
        STILL OPEN: (3) the landing time (see above); (4) the first-signal times (two to three minutes apart); (7) 174 passengers plus 8 crew (Saudi) against 172 passengers and crew (airline CEO); (8) the additional pilots described as on-duty crew, reserve pilots, another air crew, off-duty, British; (9) who first reached the controls (passenger accounts differ); (10) the weapon; (11) the early "hijacking ruled out" report and the 7500 squawk; (12) the number of those injured.
      sources: [src-cnn-explainer, src-cnn-live, src-flightaware-history, src-airnav-blog, src-khaleej-timeline, src-aljazeera-saudi, src-flydubai-updates, src-reuters-kfgo, src-national-ag]
    basis: >
      Our own reading of the reports, so capped at provisional. A discrepancy between reports is a discrepancy to resolve; it is not proof of fabrication (docs/NEWS_REVIEW.md guardrail 3).

  # ===================== E. OWNER TESTS OF CABIN DETAILS (log L-15) =====================

  - id: fz1073-masks-clean-cabin

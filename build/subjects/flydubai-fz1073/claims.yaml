      The owner's observations that the cabin looks "very clean" and the air masks did not drop cannot be assessed from text: The Conversation reports early passenger accounts that the masks did not deploy, and says masks are supposed to drop in a rapid descent caused by cabin depressurisation; whether the cabin lost pressure is not shown by anything read.

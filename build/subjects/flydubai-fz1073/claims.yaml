        RESOLVED OR EXPLAINED: D1 takeoff: CNN's "6:05 a.m. local time" is 03:05 UTC on the UTC+3 clock CNN uses elsewhere, matching AirNav and Flightradar24 (and FlightAware's 07:05 at +04, which equals the scheduled time); CNN's "(10:05 p.m. ET)" is one hour off (03:05 UTC is 11:05 p.m. EDT); both CNN errors (that and "touched down at 9:54 a.m.") were still on the explainer at its last edit, 2 Oct 20:43 UTC (page metadata and text). D3b distress call: CNN's 8:31 is the squawk 7700 (05:31 UTC); Tabuk air traffic control logged a radio distress call at 8:44 Saudi time (05:44 UTC, via Khaleej Times). D7 captain's nationality: Indian (Israel's Prime Minister, India's embassy, the UAE civil aviation authority); MiGFlug's first story carries "Israel's Air Defense Forces said the captain is a citizen of the United Arab Emirates" and its page now shows an update banner. D10 flydubai Statement 2 appears at 13:30 (Khaleej Times), 13:40 (CNN entry) and 14:10 (AeroTime) UTC: those are outlets' logging times. D11 Saudi wording: the SPA English text says "an altercation occurred in which the co-pilot assaulted the captain, resulting in injuries to both individuals"; CNN, Al Jazeera and The National print different renderings that omit "altercation" ("revealed an assault on the captain by the co-pilot, resulting in various injuries to both"); the Arabic was not seen. D15 the "second flight FZ1081 turned back" report was called erroneous the same day (Al Jazeera, citing the Times of Israel). D6 narrative: Israeli security sources said hijacking was ruled out (Khaleej Times, 06:57 UTC), CNN logged Israeli suspicion of a hijack (12:36 UTC), Netanyahu told CBS "I don't think it was a hijacking" (CBS, via CBS's 1 Oct piece); the squawk 7500 meant unlawful interference; moved within a day. D22 dates of Herzog's BBC Radio 4 interview ("Thursday", The National) and Gargash's remark ("on Friday", CNN): as printed; originals not read.
        STILL OPEN: D2 landing time (see fz1073-landing-time); D3 squawk times (Flightradar24 05:31 and 05:38; AirNav 05:28:48 and about 05:35; CNN's first entry 05:32); D4 "transmitted an emergency alert shortly after takeoff" in Al Jazeera's first story (its text quotes Reuters and AFP; "according to the airline") and CBS's first story, while takeoff was 03:05 UTC and the codes were squawked from about 05:28, and flydubai Statement 1 says "while en route"; not corrected on the pages read; D5 descent size (see fz1073-descent-magnitude); D8 weapon ("pocket knife" from a passenger via ABC, "knife or an ax", "stabbed or hit with an ax", "emergency axe" via Ynet; none by an authority); D9 replacement flight time (see fz1073-replacement-flight-timing); D12 where Netanyahu first said "Omani": NBC [read] reports he said on "CBS Evening News" on Wednesday night (30 Sep) that the pilot "is an Omani citizen"; Fox on Thursday (Bloomberg reprint, NPR "Fox & Friends"); CNN's interview is undated; anonymous Israeli officials said it hours earlier (CNN 11:24 UTC, 30 Sep): so the earliest on-record Netanyahu statement read is Wednesday night, and the question is which broadcast time, not whether he said it;
        D13 the crew-nationality rule (see fz1073-omani-barred-rule); D14 persons on board (see fz1073-persons-on-board) and passenger injuries (NPR: "no reports of injuries to passengers"; CNN: a 50-year-old man taken to hospital, "light condition"; Al Jazeera: footage of "a passenger with a bloody head wound"; CBS: "No passengers were seriously injured"); D16 headlines rewritten in place: Al Jazeera (slug keeps "diverted ... after emergency alert"; now "Pilot stabbed another in bid to crash Israel-bound Flydubai jet: Netanyahu"), CBS (published 30 Sep 07:59 UTC; now a 1 Oct headline about "radical indoctrination"), Euronews (slug "after-alleged-dispute-between-"; not re-read), the Bloomberg reprint's headline against Bloomberg's own per the manifest; no correction notice was seen on any; D19 the Jerusalem Post's clock: its page metadata prints "+00:00" with the same digits as the displayed time (10:34 on 2 Oct), so whether it is Israel time (07:34 UTC) or UTC is not established, whereas Ynet's metadata shows 21:03:53 local against 18:03:53 UTC (UTC+3 confirmed); D20 the rudder ("ripped off", "significant damage", "part of the rudder broken away") has no technical source; D21 oxygen masks (see fz1073-masks-clean-cabin); D23 the date and place of the captain's call with India's Prime Minister: Al Jazeera says "In a video call from his hospital bed in Saudi Arabia on Thursday"; CNN's explainer says he "made his first public remarks on Friday" and CNN's blog says he had been moved to Abu Dhabi on Thursday; not reconciled.
        D17 and D18 of the research notes (a MiGFlug overstatement; "six days" of Israeli suspension per Ynet via AeroCorner) were not re-checked and are not used. An unverified lead from search snippets only, that Saudi and Jordanian authorities "initially refused" to clear the aircraft, was not found on any page read and is not used; CNN [read] logged only that Saudi Arabia refused an Israeli plane to collect passengers.
      sources: [src-cnn-explainer, src-cnn-live, src-cnn-live-0930, src-flightaware-history, src-airnav-blog, src-khaleej-timeline, src-saudi-moi-original, src-aljazeera-saudi, src-aj-original, src-cbs-first, src-migflug-first, src-flydubai-updates, src-reuters-kfgo, src-national-ag, src-nbc-0930, src-npr-0930, src-abc-au-plunge, src-jpost-910405, src-ynet-cam, src-bloomberg-spokesman]
    basis: >
      Our own reading of the reports, so capped at provisional. A discrepancy between reports is a discrepancy to resolve; it is not proof of fabrication (docs/NEWS_REVIEW.md guardrail 3).

  # ===================== E. OWNER TESTS OF CABIN DETAILS (log L-15) =====================

  - id: fz1073-masks-clean-cabin
    state: searched_gap
    statement: >
      The owner's observations that the cabin looks "very clean" and the air masks did not drop cannot be assessed from text: The Conversation reports early passenger accounts that the masks did not deploy, and says masks are supposed to drop in a rapid descent caused by cabin depressurisation; whether the cabin lost pressure is not shown by anything read.
    evidence_class: interpretive
    confidence: low
    statement_kind: search_result
    absence_anchor: true
    evidential_weight: 1   # of 5
    anchor_checked: no
    adoption_weight: 3   # of 5
    adoption_note: >
      Not polled.
    would_change_if: >
      the flight data recorder's cabin-altitude and acceleration traces, verified cabin video, or seat-belt-sign status
    next_step: >
      Read the preliminary investigation report for cabin altitude and vertical acceleration; read the aircraft maker's description of when passenger masks deploy (not read here).
    anchor:
      type: search-record
      description: >
        The Conversation [read]: "Early reports from passengers suggest in this case, the plane's emergency oxygen masks did not deploy"; "rapid descents ... are usually reserved for an emergency situation where the cabin loses pressure. In this scenario, the plane's emergency oxygen masks are supposed to drop." CNN [read]: verified video shows passengers and a wounded captain; videos were not independently authenticated by us.
        CORRECTION to log L-15: it said masks drop when cabin altitude passes about 14,000 ft; that figure is general knowledge not taken from a source read here and is not used as an anchor (see L-18). A search tool's explainer claiming a news video showed deployed masks was internally contradictory and is not used.
      sources: [src-conversation, src-cnn-explainer]
    basis: >
      No evidence either way. A smooth push-over and pull-out (our arithmetic, L-14) would leave loose items in place, but that is synthetic and not an anchor.


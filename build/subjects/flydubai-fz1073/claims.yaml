  - id: fz1073-extra-pilots-statistics
    state: searched_gap
    statement: >
      The owner's observation that having two additional Flydubai pilots on board is "statistically difficult" cannot be asserted or rejected: the probability depends on the share of staff travellers and of pilots among them, which are not published, and no record says why they were aboard.
    evidence_class: synthetic
    confidence: low
    statement_kind: assumption
    assumptions:
      - {text: "About 180 passengers; staff travel on the airline's own flights; the share of staff travellers and of pilots among them are assumed (log L-15 ran a range).", if_wrong: "If the two pilots were being repositioned on an operational roster, as a CNN analyst says is the usual reason, no rarity argument applies."}
    evidential_weight: 1   # of 5
    anchor_checked: no
    adoption_weight: 3   # of 5
    adoption_note: >
      Not polled.
    would_change_if: >
      the airline's staff-travel or positioning record for the flight, or the pilots' identities and duty status confirmed by the airline
    next_step: >
      Ask the investigation to publish whether the two pilots were positioning (operational) or travelling as staff; compare how often airlines carry extra pilots on this route.
    anchor:
      type: search-record
      description: >
        flydubai [read]: "on-duty flydubai crew travelling on the flight" landed the aircraft. CNN [read]: analyst David Soucie said it was "fairly unusual for additional on-duty pilots to be on flights 'unless they are being repositioned for other flights'", in which case "the pilots are often off-duty"; a passenger described them as two British pilots seated in row six. The identities have not been shared.
        Our illustrative arithmetic in L-15 (about 0.1 to 48 in 100 for at least two staff pilots depending on assumed inputs) is synthetic and is not an anchor; many flights fly each day, so some flight shows any given combination, and helpers are reported because they helped.
      sources: [src-flydubai-updates, src-cnn-explainer, src-cnn-live]
    basis: >

assessment:
  question: "Was the Flydubai FZ1073 cockpit attack of 30 September 2026 manufactured?"
  answer: unsettled
  headline: "Unsettled, leaning slightly no: no evidence of staging was found, but only statements and reports were read. Motive and vetting are open."
  key_points:
    - "Flydubai and the UAE say an altercation; the Saudi ministry's own text says the co-pilot assaulted the captain, injuring both; landing at Tabuk. No raw data."
    - "No evidence was found that anyone staged it or let it happen; the Omani-pilot and timing doubts are open questions, not findings."
    - "No investigating body has given a motive, a weapon, how the co-pilot was rostered, or what the recorders show."
  text: >
    As of 2 October 2026 this is a live event with no investigation findings published. Stated by the airline, the UAE foreign ministry and the Saudi interior ministry (its own English text, read on the Saudi Press Agency), and by Tabuk airport through a news report: flight FZ1073 left Dubai about 03:05 UTC, descended steeply from about 05:21 UTC,
    squawked emergency codes, and landed at Tabuk, Saudi Arabia (9:45 a.m. per the Saudi ministry, which gives no time zone, so 06:45 UTC if Saudi time; AirNav Radar and Al Jazeera's 2 October piece give about 06:58; unresolved). Trackers are read only through their own listings and reports. The Saudi ministry's text says an altercation occurred in which the co-pilot assaulted the captain, injuring both individuals, and says nothing on a stabbing, a weapon, nationality, motive or custody; "seriously wounded" is the wording of India's authorities, Israel's Prime Minister and CNN, not of the Saudi ministry.
    Flydubai crew travelling on the flight helped secure the aircraft, and passengers assisted. The UAE attorney general ordered an investigation into circumstances, motive, any terrorist link and prior planning or direction.
    On the owner's three points. (1) The co-pilot is described as Omani by Israel's Prime Minister and an Israeli official; an unnamed Omani official reportedly told CBS he was born in Oman and holds Omani citizenship; no UAE, Saudi, Flydubai or Omani authority has publicly confirmed it. Whether any instrument bars Omani pilots from the Israel route is unresolved: the Jerusalem Post reports both that Flydubai's own agreement does and that the bilateral agreement does not, which concern different documents that nobody has published.
    A rule breach, if shown, would point to a rostering or vetting failure; it would not by itself show the event was arranged. (2) The timing: the flight fell 27 days before Israel's election and 7 days before the third anniversary of 7 October, and the day after the Prime Minister warned of attacks before the election. Opposition figures say the event is being used politically; that is a claim about use, and can be true without any
    staging. No evidence of foreknowledge or arrangement has been found; the Prime Minister says Israel had no specific warning. A fair test needs a base rate, which has not been computed. (3) Looking inconsistent: the reports differ on several numbers and labels, some explained by clocks, slices of one dive or wording, and several unresolved (landing time, passenger count, descent figures, pilots' duty status). A discrepancy is not evidence of fabrication.
    On who has called it terrorism: officials on both the Israeli side (the Prime Minister, Defence Minister, President) and the UAE side (a top UAE official, as reported by CNN) have used the word; these are accusations, and the airline says motive is unknown while the UAE is investigating it. Israeli officials say Israeli investigators will take part in the UAE-led investigation; the UAE has not said so in anything read. Several viral items about the flight (a deepfake in the style of a BBC report, a 2025 basketball team's video, an unrelated airliner clip) were debunked by fact-checkers; those debunks remove fakes and do not test whether the event was staged. The persons-on-board figure differs between the Saudi ministry (174 passengers and eight crew) and the airline's CEO (172 passengers and crew). What is not known: the weapon, the motive, whether the co-pilot was vetted, the cabin-pressure and acceleration record, and who took the controls first.
  lean:
    toward: "No: the event was not manufactured"
    short: "no"
    strength: slight
    because: "Nothing found points to staging, and the airline, the UAE foreign ministry, the Saudi ministry (as quoted), India's authorities and tracker reports are consistent with a real emergency (claim fz1073-event-simulated, held as a searched gap)."
    caveats: "A lean is not a finding. The records are statements and reports; raw ADS-B, recorders and hospital records were not opened, so a wholly simulated event is not refuted under Rule 9. It says nothing about whether anyone arranged or allowed a real attack, which cannot be tested until the investigation reports."
  basis: [fz1073-diverted-tabuk, fz1073-event-simulated, fz1073-arranged-or-allowed, fz1073-omani-barred-rule, fz1073-timing-convenient, fz1073-reports-inconsistent]
  rated_claim: fz1073-diverted-tabuk
  would_settle: "The UAE-led investigation's findings, the flight data and cockpit voice recorders, the co-pilot's roster and vetting records, the text of any crew-nationality clause, and the raw ADS-B tracks."

    would_change_if: >
      the flight data recorder's cabin-altitude and acceleration traces, verified cabin video, or seat-belt-sign status
    next_step: >
      Read the preliminary investigation report for cabin altitude and vertical acceleration; read the aircraft maker's description of when passenger masks deploy (not read here).
    anchor:
      type: search-record
      description: >
        The Conversation [read]: "Early reports from passengers suggest in this case, the plane's emergency oxygen masks did not deploy"; "rapid descents ... are usually reserved for an emergency situation where the cabin loses pressure. In this scenario, the plane's emergency oxygen masks are supposed to drop." CNN [read]: verified video shows passengers and a wounded captain; videos were not independently authenticated by us.
        CORRECTION to log L-15: it said masks drop when cabin altitude passes about 14,000 ft; that figure is general knowledge not taken from a source read here and is not used as an anchor (see L-18). A search tool's explainer claiming a news video showed deployed masks was internally contradictory and is not used.

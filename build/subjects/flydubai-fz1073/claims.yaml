  # ===================== F. FAKES AND FACT-CHECKS; OPEN PRIMARY RECORDS (added in the deep dive, log L-25 onward) =====================

  - id: fz1073-fakes-debunked
    state: established
    exception: "Established as what the fact-checkers report about each item; their evidence (archives, detector tools, the BBC's and NewsGuard's statements) was read through their pages, and the BBC statement was not seen directly."
    statement: >
      Several items that circulated about FZ1073 have been debunked by fact-checkers: a video styled as a BBC News report (a deepfake, per ABC Verify, Full Fact and TheJournal.ie, with the BBC confirming to Full Fact it is fake); a "passengers celebrating" video that is an Israeli basketball team's flight from August 2025; a "plummeting plane" clip that is an Azul aircraft posted on 18 September; an AI-generated "leaked pilot argument" video with audio from a 2017 road-rage clip; and a fake video credited to NewsGuard, which told Lead Stories it did not make that claim. These are debunks of specific fakes; they do not test whether the event was staged.
    evidence_class: primary_text
    confidence: moderate
    statement_kind: reported
    evidential_weight: 3   # of 5
    anchor_checked: secondary
    adoption_weight: 3   # of 5
    adoption_note: >
      Not polled. The fakes reached hundreds of thousands to over a million views (ABC Verify, TheJournal.ie); reach carries no weight.
    would_change_if: >
      a fact-checker withdrawing a verdict, or an independent check finding the clip genuine
    anchor:
      type: fact-checks
      description: >
        ABC News Verify [read]: a deepfake video purporting to be a BBC News report "appears to have been created using real footage of BBC presenter" [name omitted], "but AI-manipulated with a fake Australian voice and script". Full Fact [read]: "The BBC has confirmed that this video is fake." TheJournal.ie [read]: an AI-altered video styled as a BBC broadcast accompanied a claim "seen hundreds of thousands of times". Lead Stories [each read]: the "big speaker" celebration clip "is from August 2025 and shows members of the Israeli men's basketball team"; the plummeting-plane clip "shows an aircraft operated by Azul Brazilian Airlines" and was on YouTube on 18 September; the leaked-argument video was 95.8 "Likely to be AI-generated" on a detection tool; NewsGuard "did not make such a report".
        France 24 (HTTP 403) and NewsGuard's own page (403) were not read. No fact-check read tests whether the incident itself was staged: they test the items.
      sources: [src-abc-verify, src-fullfact, src-thejournal, src-ls-basketball, src-ls-azul, src-ls-aiaudio, src-ls-newsguard, src-ls-ceiling, src-ibtimes-moon]
    basis: >
      The invented private name in the deepfake is not repeated. Debunking fakes bears on fz1073-event-simulated only by removing items that would otherwise look like evidence of staging; it does not turn that gap into a refutation.


# Guardrails (docs/NEWS_REVIEW.md) are set in log.yaml (header, L-01 to L-12) and apply to every claim here:
#  - the co-pilot is NOT named: no authority has named him, and a nationality is not an identity;
#  - nothing here speculates about anyone's religion, ethnicity or beliefs; what officials SAID about "indoctrination" is recorded as what was said;
#  - an accusation is not a finding; a discrepancy between reports is a discrepancy to resolve, not proof of fabrication;
#  - "manufactured" is tested as claims: who would have had to do what, and what evidence would show it.

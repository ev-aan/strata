      Re-read: CNN's other times (distress call 8:31, touchdown 9:54) are on UTC+3; 6:05 a.m. on UTC+3 is 03:05 UTC, the same instant as FlightAware (07:05 at +04), AirNav Radar and Flightradar24. So the 'local time' is

  - id: L-11
    date: 2026-10-02
    entry: >
      TWO DIFFERENT CLAIMS MUST NOT BE MIXED. (A) The event was manufactured or staged. (B) A real
      event is being used politically, in its timing or its framing. (B) is ordinary politics and can be
      shown from public statements; (A) is an extraordinary allegation about a real attack with a
      seriously wounded captain and about 174 people at risk. Variants of (A) and who would have had to
      take part, drawn from the reporting: (A1) staged entirely: the captain (Indian national, wounded,
      Saudi hospital, surgery), the first officer (in custody), two off-duty pilots, cabin crew, about 174
      passengers of several nationalities including two Australians and four US-Israeli dual citizens,
      Flydubai (a UAE company), Saudi authorities (whose interior ministry reported an assault and
      injuries with a UAE team present) and UAE authorities, plus the trackers' data (two independent trackers
      recorded the dive and the squawk codes). (A2) a real attack deliberately allowed or arranged (a
      vetting failure by design): would require the vetting and rostering records, not yet seen.
      (A3) a real attack with a real vetting failure, later politically exploited. (A4) a real attack and a
      coincidence in timing. The independence of the sources matters: Saudi Arabia, the UAE, Flydubai,
      Indian and Australian officials, and two independent aviation trackers are not the Israeli
      government. A claim that the event was staged by Israeli actors would need to explain why those
      independent parties' records agree with it. This is a statement about what the allegation requires,
      not a finding.

  - id: L-19
    date: 2026-10-02
    entry: >
      WHAT WAS REPORTED WHEN, AND BY WHOM (times as reported; UAE time is UTC+4, Saudi and Israel UTC+3). 30 Sep: 05:21 UTC descent begins (Flightradar24, via Al Jazeera and Khaleej Times); 05:28:48 or 05:31 squawk 7700 (AirNav or Flightradar24); about 05:35 or 05:38
      squawk 7500; 05:44 distress call to Tabuk ATC (Tabuk airport, via Khaleej Times); 06:45 landing (Saudi Interior Ministry, via Al Jazeera). About 10:57 UAE time Israeli security sources said a hijacking was ruled out (Times of Israel, via Khaleej Times; not read). 2:48 p.m. UAE time: Tabuk airport says captain and co-pilot injured and taken to hospital.
      About 5:30 p.m. UAE time flydubai Statement 2: 'an altercation occurred in the flight deck', crew landed it. 9:29 p.m. UAE time: the UAE civil aviation authority calls it a 'security incident'. 11 p.m. UAE time: flydubai suspends Israel flights (Statement 3; the CEO later says at the authorities' request). Late 30 Sep: Netanyahu, in a video, says one pilot stabbed the other and apparently tried to crash the plane; Israeli
      sources tell the Jerusalem Post the co-pilot is believed Omani and a transport ministry source calls it 'a clear breach' of Flydubai's agreement. 1 Oct: the UAE Attorney-General orders an investigation (about 10:57 a.m. UAE time; MoFA statement later); the Saudi ministry says the co-pilot assaulted the captain with injuries to both, and both fly to Abu Dhabi; Netanyahu tells CNN the suspect is Omani and tells Fox he 'underwent Islamist radical indoctrination';
      Trump says an Iran link is likely 'based on what I'm hearing'; a senior Israeli official tells Ynet no Iran link has been found so far and that he most likely acted alone. 2 Oct: the flydubai CEO's first comments (Statement 4); the GCAA commends captain, crew and passengers and will not comment on claims; the Jerusalem Post, from unnamed sources, says the co-pilot held no second nationality and that the Israel-UAE aviation agreement does not require
      pilots from states with ties to Israel; Reuters says Israeli officials are expected to question him in the UAE. Before the flight: 29 Sep Netanyahu says there are signs enemies will try to attack before the election (Jerusalem Post); Lapid says it was not about planes (30 Sep, Al Jazeera). The Israeli election is 27 Oct (Reuters).

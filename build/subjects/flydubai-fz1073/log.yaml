# Append-only excavation log. Corrections are new entries; earlier entries are never edited.
# GUARDRAILS FOR THIS DIG (set before any claim is written):
#  - A captain was seriously wounded, passengers were endangered, and a suspect is in custody and
#    unidentified by authorities. We do not name the suspect, do not speculate about his religion,
#    ethnicity or beliefs, and do not treat an accusation as a finding.
#  - "Manufactured" is a claim to be TESTED. It must say who manufactured what, how, and what
#    evidence would show it. A discrepancy in reporting is not evidence of fabrication; it is a

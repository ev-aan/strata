notes: 'Round 1 of an independent peer review. The reviewer did not write the dig. Verdict: revisions requested (not failed): the core facts (diversion and landing at Tabuk, injuries, UAE investigation, who-said-what on nationality and motive) check out against the sources, but four findings would mislead a reader and the rest are accuracy or hygiene fixes.

  SOURCES OPENED BY THE REVIEWER (all fetched fresh on 2026-10-02, text compared with the quotations): flydubai newsroom statements 1-4 (stored text matches the page); UAE MoFA statement (stored text matches); Emirates 24|7 GCAA text (stored text matches); Al Jazeera (Saudi probe piece, explainer, UAE piece); CNN explainer and CNN live blog; Reuters via KFGO; Jerusalem Post 910076, 910192, 910349, 910405; Ynet; CBS; ThePrint; ABC News Verify; IBTimes UK; ProtoThema; The National; Khaleej Times; AirNav Radar blog; FlightAware history page; Jewish Chronicle (2023). Not reachable or not opened: the Saudi Interior Ministry original (SPA), Tabuk airport original, WAM originals, Flightradar24, raw ADS-B (OpenSky, ADS-B Exchange, AirNav CSV), FlightAware track log, gov.il, Bloomberg, Axios, Times of Israel, Haaretz, the 2020 UAE-Israel air agreement text; The Conversation was not re-opened.

  CLAIMS CHECKED (anchor says what the claim says? source opened / passage found / matches): diverted-tabuk (yes/yes/yes); flight-times (yes/yes/yes; all conversions re-done and correct: 07:05 +04 = 03:05 UTC, 8:44 and 9:45 Saudi = 05:44 and 06:45 UTC, 9:21 UAE = 05:21 UTC); both-pilots-injured (yes/yes/yes; Saudi wording confirmed in Al Jazeera and CNN live blog); weapon-not-established (yes/yes/yes); crew-and-passengers-secured-aircraft (yes/yes/partly, see R1-5); copilot-custody-unnamed (yes/yes/yes); israel-says-omani (yes/yes/yes); omani-nationality-unconfirmed (yes/yes/yes; CBS and JPost wording confirmed); omani-barred-rule (yes/yes/partly, see R1-3); uae-investigation (yes/yes/yes); motive-statements (yes/yes/partly, see R1-2 and R1-4); timing-dates (yes/yes/yes; 27 and 7 days correct, 29 Sep was a Tuesday); political-use-alleged (yes/yes/yes); event-simulated (yes/yes/partly, see R1-1); reports-inconsistent (yes/yes/partly, see R1-7); descent-magnitude (yes/yes/yes; all five figures
  confirmed); transmission.yaml figures (67 minutes, 4,136, 2,963, 1.5 million, 300,000 all confirmed against JPost and ABC; no poster is named).

  Wire reports: Reuters text is counted once (src-reuters-kfgo), and Al Jazeera items that quote Reuters are used for different facts; no double counting found. The five outlets behind israel-says-omani all trace to Israeli officials, which the claim says.

  ASSESSMENT QUESTIONS FROM THE OWNER''S BRIEF. (a) Refuted at moderate on a secondary tracker read: the finding (the event was real) is very likely right, but as written it does not meet Rule 9 (material or primary-text evidence): the legs that are material (raw ADS-B, recorders, hospital records) were not read, and the legs that were read are statements by parties (airline, UAE), reports of statements (Saudi, India) and a list page that shows only a departure row. See R1-1 for the options. (b) Omani rule: sides are attributed correctly in substance but the two Jerusalem Post sources speak about different documents (Flydubai''s own operating agreement versus the bilateral agreement), so they do not actually contradict one another; ''contested'' is the wrong label and the statement is a meta-claim. Low confidence is honest. See R1-3. (c) Guardrails: the co-pilot is not named anywhere; religion and ethnicity are not speculated about; ''indoctrination'', ''terror'' and ''Iran'' are recorded
  as statements. The captain is named in timeline.yaml: he is a victim named by India''s foreign ministry, the UAE civil aviation authority, Israel''s Prime Minister and every outlet, so the guardrail (about suspects and private individuals not named by authorities) is met and I would keep the name there; it is an owner decision whether to also keep it in the manifest titles and URLs, which carry it unavoidably. Passenger names: claims.yaml names one passenger (R1-6). (d) The assessment says slightly more than the claims in two places (R1-8). The headline is 89 characters and still draft. (e) Dates, times and places in the timeline and the three nodes check out (UTC+4 Dubai, UTC+3 Tabuk and Israel on 30 Sep 2026; Israel''s clock change is later in October); two label problems are in R1-9. (f) Log: only the dig_status line changed in L-01 to L-15; L-16 to L-21 are new entries and corrections to earlier readings are new entries (L-17, L-18). The log statement in L-17 and L-20 that passenger
  names were removed is not true of claims.yaml (R1-6).

  Conformance: python3 build/conformance.py reports 0 errors (98 warnings across the repository). This subject is not in build/site.yaml publish, so the publish-gate check does not apply to it. The quote check lists many quotes as unmatched only because just three sources are stored; I matched the ones in the claims by hand against the live pages (see above).'
rounds:
- round: 1
  reviewed_on: '2026-10-02'
  requests:
  - id: R1-1
    target: fz1073-event-simulated
    severity: blocking
    finding: 'The claim is state refuted, evidence_class primary_text, confidence moderate, anchor_checked secondary. Rule 9 needs material or primary-text evidence against the target. What was actually read: (i) the airline and UAE statements, which are statements by interested parties and which NEWS_REVIEW.md calls adoption-class until backed by material; (ii) the Saudi ministry and India''s foreign ministry, read only through CNN and Al Jazeera; (iii) the FlightAware history page, which I opened: the 30 Sep row shows only a scheduled departure (07:05 +04, arrival cell ''(?)'') and the 1 Oct flights as Cancelled; it records no emergency, no diversion and no landing, so it does not contradict a staging claim and the confidence_reasons line that ''three independent trackers each record parts of it'' is overstated for FlightAware; (iv) AirNav''s blog, a company''s description of its own ADS-B (the CSV was not opened), and Flightradar24 only through Al Jazeera, Reuters, CNN and Khaleej Times.
      No raw track, recorder, hospital record or court record was read. Also the confidence arithmetic counts the same independent corroboration inside the ''high'' start and again as up1. The conclusion (the event was real) is probably right, and IBTimes, ABC Verify and many named witnesses support it, but the label ''refuted'' with a lean built on it is stronger than the reading. Either (a) re-state the claim as searched_gap with an absence anchor (''no evidence of staging found; the independent records read through reports agree with the official account'') and keep the lean at ''no'' with lowered strength, or (b) keep refuted only after the raw ADS-B (AirNav CSV or another network) or another material record has been opened and the anchor says so. Do not describe FlightAware as recording the emergency. If kept refuted, change evidence_class honestly and remove the ''independent'' claim for FlightAware.'
  - id: R1-2
    target: fz1073-motive-statements; divergence_note; assessment key point 3
    severity: blocking
    finding: 'The statement says ''the airline and the UAE say motive is unknown and under investigation'', and the divergence_note says ''the UAE and the airline say motive is unknown''. Only flydubai says motive is unknown (statement 2, stored). The UAE MoFA text (stored, which I re-read) says the investigation includes ''any possible connection to terrorist activity or intent'' and does not say motive is unknown. CNN''s explainer, which the author read and cites, reports that Anwar Gargash, a senior UAE official, ''on Friday described the incident as a dangerous terrorist act'', and The National reports Israel''s President calling the co-pilot a ''terrorist''; Gargash''s statement appears nowhere in claims.yaml, the timeline or the log. This is a who-said-what error and an omitted statement from the very authority the dig uses as its counterweight to Israel''s account. Fix: record Gargash''s statement (with the CNN source and the date, as an accusation by a UAE official, not a finding),
      correct ''the UAE says motive is unknown'' to what the UAE actually said (it is examining motives, including terrorism and prior planning), and adjust fz1073-motive-not-established and the divergence_note, which presently treat the Israeli side alone as having ''gone further than any investigating authority''.'
  - id: R1-3
    target: fz1073-omani-barred-rule
    severity: blocking
    finding: 'The state is contested and the statement is a meta-claim about ''the owner''s first observation''. Opening the sources: JPost 30 Sep (910192) says in its own voice (subtitle and body) that ''Flydubai''s agreement to operate in Israel explicitly states that all pilots must be from countries that have normalized relations'', then quotes a ministry source only for ''This is a clear breach of the agreement''; the claim puts ''explicitly states'' in the mouth of the ministry source. JPost 2 Oct (910405) says the bilateral Israel-UAE agreement ''did not stipulate'' this; that is a different instrument, so the two JPost items are not in direct conflict (the dig half-notices this in the disputed_by text but still files both under disputed_by). Netanyahu''s statement (Ynet, Reuters) that such pilots are not permitted, and the Israeli official to CNN who says he ''should not have been allowed'', are a third voice; Reuters wording is ''Netanyahu has said pilots from such countries were
      not permitted''. No source disputes a rule on Flydubai''s own agreement; nobody has published either text. Fix: restate the claim in first order (for example ''A crew-nationality rule bars pilots from states without relations with Israel from flydubai''s Israel flights'') with state proposed or contested only if some named party says it does not exist for that instrument; list each side (Netanyahu, the ministry source, the 2 Oct unnamed sources, ThePrint''s reading of the 2020 agreement, which is secondary and not the agreement) with the instrument each addresses and attribute ''explicitly states'' to the Jerusalem Post. Low confidence is honest and should stay.'
  - id: R1-4
    target: fz1073-motive-statements
    severity: non_blocking
    finding: 'The statement puts in quotation marks that Netanyahu said ''we know that he underwent Islamist radical indoctrination''. No source read has that exact wording: Ynet quotes ''we know that the attacker pilot underwent Islamist radical indoctrination'', CNN''s live blog has ''it has been established that he underwent Islamist radical indoctrination'' (CNN''s wording, not a direct quote), CNN''s explainer has ''undergone Islamist radicalization'' (a video of Friday) and Reuters paraphrases. Quote one source exactly and name it, or paraphrase without quotation marks. Also the statement dates it 1 October and ''whoever sent him will pay a very heavy price'' to 2 October, which matches CBS and CNN.'
  - id: R1-5
    target: fz1073-crew-and-passengers-secured-aircraft
    severity: non_blocking
    finding: 'Established at high confidence with anchor_checked primary, but the statement goes beyond the primary texts: it says passengers ''entered the cockpit'' and that crew helped ''after the captain opened the cockpit door'', and says ''two additional pilots''. The flydubai, MoFA and GCAA texts say only that on-duty crew travelling on the flight secured and landed the aircraft and that passengers assisted or contributed. The door and the number come from Reuters and CBS (I confirmed Reuters: ''a reserve flydubai pilot crew'', no number) and the cockpit entry from passengers via CNN. Split the claim or trim the statement to what the primary texts say and put the rest in a separate secondary-anchored claim; the ''who did what first'' detail is already declared out of scope.'
  - id: R1-6
    target: fz1073-surgeon; log L-17, L-20; timeline people
    severity: non_blocking
    finding: claims.yaml names a private passenger ('Dr. Shota Musaev, a dentist on board', in the anchor description of fz1073-surgeon), while L-17 and L-20 and the timeline note say passenger names were removed and passengers are identified by role only. Remove the name from the claim (the quote can be trimmed to 'a dentist on board'), and note in a new log entry that the statement in L-17 did not hold for claims.yaml. In the timeline people list, 'a plumber who says he held the attacker' and 'a dentist who tied the attacker' combine an occupation with a distinctive act and are identifiable from CNN's own text; consider dropping the occupations (the surgeon claim needs only 'dentist').
  - id: R1-7
    target: fz1073-reports-inconsistent; fz1073-flight-times; node fz1073-2026-09-30-landing-tabuk
    severity: non_blocking
    finding: 'The landing time is listed as resolved (''likely transposed digits'' for CNN''s 9:54 against 9:45). That is a guess, and other sources I opened widen the spread rather than narrow it: AirNav''s blog says the aircraft ''landed at Tabuk at approximately 06:58 UTC'' and Khaleej Times says Flightradar24 received its final signal at about 10.58am UAE time (06:58 UTC), against 06:45 UTC from the Saudi ministry and Tabuk airport. The last-signal time can be later than touchdown, but the AirNav wording equates them. Move landing time to the still-open list, keep 06:45 attributed to the Saudi ministry, and say in the flight-times claim that AirNav''s blog implies a later touchdown. Also the ''established'' state with moderate confidence on tracker listings is defensible given the exception line, but note the first-signal times (05:28:48 versus 05:31) are the same unresolved item.'
  - id: R1-8
    target: assessment (answer, lean, text, key points); fz1073-israel-says-omani
    severity: non_blocking
    finding: 'Where the assessment says more than the claims: (i) the headline ''the attack is well documented'' rests on official statements and reports with no recorder or raw data; consider ''reported by the airline, Saudi and UAE authorities'' in place of ''well documented'', and re-test after R1-1; (ii) the text says ''the Saudi ministry says the co-pilot assaulted the captain and both were injured; the captain was seriously wounded'' without saying that ''seriously'' is not the Saudi wording (it comes from CNN, Indian authorities and Israel''s Prime Minister); (iii) the text and fz1073-israel-says-omani say no Omani authority has publicly confirmed the nationality, but CBS reports an unnamed Omani official confirming birth in Oman and Omani citizenship (the sibling gap claim says so); add one clause to the statement or assessment. (iv) fz1073-israel-says-omani is established at HIGH confidence on a secondary read although the other exception claims are capped at moderate; either cap
      it at moderate or say why a who-said-what claim from several outlets reaches high. All sources trace to the Israeli side, as the claim says.'
  - id: R1-9
    target: timeline.yaml
    severity: non_blocking
    finding: (i) The lane label 'Two off-duty pilots (unnamed)' and the lane id offduty_pilots adopt CBS's description while the airline's own statement (stored) says 'on-duty flydubai crew travelling on the flight'; the same timeline lists the disagreement elsewhere. Use a neutral label ('Two additional pilots'). (ii) The lane label 'First officer (suspect, not named)' uses 'suspect' as a label; the note elsewhere says an accusation is not a finding. Use 'accused' or 'first officer (accused by officials)'. (iii) The description in claims.yaml says the co-pilot 'is in custody in the UAE'; the Saudi wording is 'accompanied by' an Emirati team, and the claim fz1073-copilot-custody-unnamed itself notes that the custody wording is Israeli and Reuters; align the description. (iv) b16 converts the Jerusalem Post page clock (10:34) as Israel time; I could not confirm the zone, which the entry already states. No other time conversion errors found.
  - id: R1-10
    target: log.yaml
    severity: non_blocking
    finding: Add a new entry (append-only) recording the corrections made in response to R1-2, R1-4, R1-6 and R1-7, and the author's responses. Note that L-21 asks the owner whether a moderate-confidence refutation is acceptable; the owner has not answered, and R1-1 gives the reviewer's position. The first 15 entries and header were not rewritten (only the dig_status line changed), which is correct.

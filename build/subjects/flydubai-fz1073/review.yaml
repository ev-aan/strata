notes: 'Round 1 of an independent peer review. The reviewer did not write the dig. Verdict: revisions requested (not failed): the core facts (diversion
  and landing at Tabuk, injuries, UAE investigation, who-said-what on nationality and motive) check out against the sources, but four findings
  would mislead a reader and the rest are accuracy or hygiene fixes.

  SOURCES OPENED BY THE REVIEWER (all fetched fresh on 2026-10-02, text compared with the quotations): flydubai newsroom statements 1-4 (stored
  text matches the page); UAE MoFA statement (stored text matches); Emirates 24|7 GCAA text (stored text matches); Al Jazeera (Saudi probe piece,
  explainer, UAE piece); CNN explainer and CNN live blog; Reuters via KFGO; Jerusalem Post 910076, 910192, 910349, 910405; Ynet; CBS; ThePrint;
  ABC News Verify; IBTimes UK; ProtoThema; The National; Khaleej Times; AirNav Radar blog; FlightAware history page; Jewish Chronicle (2023).
  Not reachable or not opened: the Saudi Interior Ministry original (SPA), Tabuk airport original, WAM originals, Flightradar24, raw ADS-B (OpenSky,
  ADS-B Exchange, AirNav CSV), FlightAware track log, gov.il, Bloomberg, Axios, Times of Israel, Haaretz, the 2020 UAE-Israel air agreement text;
  The Conversation was not re-opened.

  CLAIMS CHECKED (anchor says what the claim says? source opened / passage found / matches): diverted-tabuk (yes/yes/yes); flight-times (yes/yes/yes;
  all conversions re-done and correct: 07:05 +04 = 03:05 UTC, 8:44 and 9:45 Saudi = 05:44 and 06:45 UTC, 9:21 UAE = 05:21 UTC); both-pilots-injured
  (yes/yes/yes; Saudi wording confirmed in Al Jazeera and CNN live blog); weapon-not-established (yes/yes/yes); crew-and-passengers-secured-aircraft
  (yes/yes/partly, see R1-5); copilot-custody-unnamed (yes/yes/yes); israel-says-omani (yes/yes/yes); omani-nationality-unconfirmed (yes/yes/yes;
  CBS and JPost wording confirmed); omani-barred-rule (yes/yes/partly, see R1-3); uae-investigation (yes/yes/yes); motive-statements (yes/yes/partly,
  see R1-2 and R1-4); timing-dates (yes/yes/yes; 27 and 7 days correct, 29 Sep was a Tuesday); political-use-alleged (yes/yes/yes); event-simulated
  (yes/yes/partly, see R1-1); reports-inconsistent (yes/yes/partly, see R1-7); descent-magnitude (yes/yes/yes; all five figures confirmed); transmission.yaml
  figures (67 minutes, 4,136, 2,963, 1.5 million, 300,000 all confirmed against JPost and ABC; no poster is named).

  Wire reports: Reuters text is counted once (src-reuters-kfgo), and Al Jazeera items that quote Reuters are used for different facts; no double
  counting found. The five outlets behind israel-says-omani all trace to Israeli officials, which the claim says.

  ASSESSMENT QUESTIONS FROM THE OWNER''S BRIEF. (a) Refuted at moderate on a secondary tracker read: the finding (the event was real) is very
  likely right, but as written it does not meet Rule 9 (material or primary-text evidence): the legs that are material (raw ADS-B, recorders,
  hospital records) were not read, and the legs that were read are statements by parties (airline, UAE), reports of statements (Saudi, India)
  and a list page that shows only a departure row. See R1-1 for the options. (b) Omani rule: sides are attributed correctly in substance but the
  two Jerusalem Post sources speak about different documents (Flydubai''s own operating agreement versus the bilateral agreement), so they do
  not actually contradict one another; ''contested'' is the wrong label and the statement is a meta-claim. Low confidence is honest. See R1-3.
  (c) Guardrails: the co-pilot is not named anywhere; religion and ethnicity are not speculated about; ''indoctrination'', ''terror'' and ''Iran''
  are recorded as statements. The captain is named in timeline.yaml: he is a victim named by India''s foreign ministry, the UAE civil aviation
  authority, Israel''s Prime Minister and every outlet, so the guardrail (about suspects and private individuals not named by authorities) is
  met and I would keep the name there; it is an owner decision whether to also keep it in the manifest titles and URLs, which carry it unavoidably.
  Passenger names: claims.yaml names one passenger (R1-6). (d) The assessment says slightly more than the claims in two places (R1-8). The headline
  is 89 characters and still draft. (e) Dates, times and places in the timeline and the three nodes check out (UTC+4 Dubai, UTC+3 Tabuk and Israel
  on 30 Sep 2026; Israel''s clock change is later in October); two label problems are in R1-9. (f) Log: only the dig_status line changed in L-01
  to L-15; L-16 to L-21 are new entries and corrections to earlier readings are new entries (L-17, L-18). The log statement in L-17 and L-20 that
  passenger names were removed is not true of claims.yaml (R1-6).

  Conformance: python3 build/conformance.py reports 0 errors (98 warnings across the repository). This subject is not in build/site.yaml publish,
  so the publish-gate check does not apply to it. The quote check lists many quotes as unmatched only because just three sources are stored; I
  matched the ones in the claims by hand against the live pages (see above).


  ROUND 2 (second reviewer, who did not write the dig or round 1). All ten round 1 requests are resolved (see each reviewer_note). Status stays
  revisions_requested because two new blocking requests were found on a fresh pass: R2-1 (the Herzog attribution is called a slip but is a real,
  separate statement) and R2-2 (the headline and key point 1 say the airline and the UAE report an attack or assault; they say altercation). Three
  non-blocking items are R2-3 to R2-5. Rule 9: fz1073-event-simulated is a searched gap with an absence anchor at low confidence and the lean
  (no, slight) matches it. Guardrails: the co-pilot is not named anywhere I grepped; no passenger name in claims, timeline, nodes, manifest or
  transmission (one in log L-15, R2-5); no speculation on religion, ethnicity or beliefs; accusations are recorded as accusations. Times: UTC
  conversions rechecked (07:05 +04 = 03:05; 9.21 UAE = 05:21; 8:44 and 9:45 Saudi = 05:44 and 06:45; 10.58 UAE = 06:58; 10:57 UAE = 06:57; 5:30
  pm UAE = 13:30; 11 pm UAE = 19:00; 10:34 at UTC+3 = 07:34); landing time is left open. Sources opened fresh by this reviewer: flydubai newsroom
  (statements stored text matches the page header; stored MoFA and GCAA text read), CNN explainer and live blog, Al Jazeera (Saudi probe, explainer,
  UAE piece), Khaleej Times, AirNav Radar blog, FlightAware history, Reuters via KFGO, Jerusalem Post 910192, 910405, 910349, 910076, Ynet, ThePrint,
  CBS, ABC News Verify, The National. Not reached or not opened: Saudi Interior Ministry and Tabuk airport originals, WAM, Flightradar24, raw
  ADS-B (OpenSky, ADS-B Exchange, AirNav data file), FlightAware track log, gov.il, Bloomberg, Axios, Times of Israel, Haaretz, IBTimes, Jewish
  Chronicle, ProtoThema, The Conversation. The repository working tree was mid-merge by another agent (conformance.py had conflict markers), so
  conformance and review_dig were run on a clean checkout of the branch tip: 0 errors, 92 warnings (8 for this subject, all established claims
  anchored below primary, each with an exception line); review_dig mechanical checks all pass.'
rounds:
- round: 1
  reviewed_on: '2026-10-02'
  requests:
  - id: R1-1
    target: fz1073-event-simulated
    severity: blocking
    finding: 'The claim is state refuted, evidence_class primary_text, confidence moderate, anchor_checked secondary. Rule 9 needs material or
      primary-text evidence against the target. What was actually read: (i) the airline and UAE statements, which are statements by interested
      parties and which NEWS_REVIEW.md calls adoption-class until backed by material; (ii) the Saudi ministry and India''s foreign ministry, read
      only through CNN and Al Jazeera; (iii) the FlightAware history page, which I opened: the 30 Sep row shows only a scheduled departure (07:05
      +04, arrival cell ''(?)'') and the 1 Oct flights as Cancelled; it records no emergency, no diversion and no landing, so it does not contradict
      a staging claim and the confidence_reasons line that ''three independent trackers each record parts of it'' is overstated for FlightAware;
      (iv) AirNav''s blog, a company''s description of its own ADS-B (the CSV was not opened), and Flightradar24 only through Al Jazeera, Reuters,
      CNN and Khaleej Times. No raw track, recorder, hospital record or court record was read. Also the confidence arithmetic counts the same
      independent corroboration inside the ''high'' start and again as up1. The conclusion (the event was real) is probably right, and IBTimes,
      ABC Verify and many named witnesses support it, but the label ''refuted'' with a lean built on it is stronger than the reading. Either (a)
      re-state the claim as searched_gap with an absence anchor (''no evidence of staging found; the independent records read through reports
      agree with the official account'') and keep the lean at ''no'' with lowered strength, or (b) keep refuted only after the raw ADS-B (AirNav
      CSV or another network) or another material record has been opened and the anchor says so. Do not describe FlightAware as recording the
      emergency. If kept refuted, change evidence_class honestly and remove the ''independent'' claim for FlightAware.'
    author_response:
      action: fixed
      note: 'Re-verified: FlightAware''s page shows a departure row and cancellations only; AirNav''s data file and all raw sources remain unreachable
        (retried OpenSky, ADS-B Exchange, AirNav log, Flightradar24, FlightAware track log, adsb.lol). Restated as a searched_gap with an absence
        anchor (low confidence); lean strength lowered to slight; confidence_reasons arithmetic removed with the refutation; FlightAware no longer
        described as recording the emergency; headline claim moved to fz1073-diverted-tabuk; headline reworded (94 characters, draft). Owner decision
        applied: Rule 9 as written. Log L-22.'
      commit: 8495c38
    resolved: true
    reviewer_note: 'Verified. fz1073-event-simulated is now state searched_gap, absence_anchor true, confidence low, anchor_checked no; its anchor
      lists each leg with its limit, says FlightAware shows only a departure row and cancellations (I re-opened the page: row 30-Sep-2026, later
      flights Cancelled) and records the raw sources as not reached. The assessment lean is ''no'', strength slight, and its caveats say a wholly
      simulated event is not refuted under Rule 9. No leftover ''refuted'', ''three independent trackers'' or ''well documented'' wording in claims,
      timeline, transmission or manifest (grep). Headline claim is fz1073-diverted-tabuk (established, high, primary, two official texts that
      I re-read in the stored files). Raw ADS-B was not reachable for me either; the HTTP 403/429 notes are the author''s and were not re-tested
      by me.'
  - id: R1-2
    target: fz1073-motive-statements; divergence_note; assessment key point 3
    severity: blocking
    finding: 'The statement says ''the airline and the UAE say motive is unknown and under investigation'', and the divergence_note says ''the
      UAE and the airline say motive is unknown''. Only flydubai says motive is unknown (statement 2, stored). The UAE MoFA text (stored, which
      I re-read) says the investigation includes ''any possible connection to terrorist activity or intent'' and does not say motive is unknown.
      CNN''s explainer, which the author read and cites, reports that Anwar Gargash, a senior UAE official, ''on Friday described the incident
      as a dangerous terrorist act'', and The National reports Israel''s President calling the co-pilot a ''terrorist''; Gargash''s statement
      appears nowhere in claims.yaml, the timeline or the log. This is a who-said-what error and an omitted statement from the very authority
      the dig uses as its counterweight to Israel''s account. Fix: record Gargash''s statement (with the CNN source and the date, as an accusation
      by a UAE official, not a finding), correct ''the UAE says motive is unknown'' to what the UAE actually said (it is examining motives, including
      terrorism and prior planning), and adjust fz1073-motive-not-established and the divergence_note, which presently treat the Israeli side
      alone as having ''gone further than any investigating authority''.'
    author_response:
      action: fixed
      note: 'Verified in nat.txt/CNN explainer text: only flydubai says motive is unknown; the UAE MoFA says motives, terrorist link and prior
        planning are being examined. Corrected the statement, divergence_note, motive-not-established and the assessment; recorded Gargash (CNN,
        Friday 2 Oct), Herzog (The National, BBC Radio 4, 1 Oct) and Katz as accusations with who, when and source. Log L-22.'
      commit: 8495c38
    resolved: true
    reviewer_note: 'Verified. Only flydubai Statement 2 says motives are unknown; the UAE MoFA text says it is examining ''all circumstances and
      motives ... including any possible connection to terrorist activity or intent, and whether it involved prior planning or direction'' (stored
      file). Gargash is recorded with CNN as source: CNN explainer, ''Anwar Gargash, a top UAE official, on Friday described the incident as a
      "dangerous terrorist act"'', verbatim. Herzog (BBC Radio 4, Thursday, ''terrorist'') and Katz (''attempted jihadist terror attack'') match
      The National, which I re-opened. Remaining wording problem (CNN says ''a top UAE official'', the assessment text and divergence_note say
      ''senior adviser'') and the missing Gargash/Herzog remarks in timeline.yaml are in R2-3; they do not reopen R1-2.'
  - id: R1-3
    target: fz1073-omani-barred-rule
    severity: blocking
    finding: 'The state is contested and the statement is a meta-claim about ''the owner''s first observation''. Opening the sources: JPost 30
      Sep (910192) says in its own voice (subtitle and body) that ''Flydubai''s agreement to operate in Israel explicitly states that all pilots
      must be from countries that have normalized relations'', then quotes a ministry source only for ''This is a clear breach of the agreement'';
      the claim puts ''explicitly states'' in the mouth of the ministry source. JPost 2 Oct (910405) says the bilateral Israel-UAE agreement ''did
      not stipulate'' this; that is a different instrument, so the two JPost items are not in direct conflict (the dig half-notices this in the
      disputed_by text but still files both under disputed_by). Netanyahu''s statement (Ynet, Reuters) that such pilots are not permitted, and
      the Israeli official to CNN who says he ''should not have been allowed'', are a third voice; Reuters wording is ''Netanyahu has said pilots
      from such countries were not permitted''. No source disputes a rule on Flydubai''s own agreement; nobody has published either text. Fix:
      restate the claim in first order (for example ''A crew-nationality rule bars pilots from states without relations with Israel from flydubai''s
      Israel flights'') with state proposed or contested only if some named party says it does not exist for that instrument; list each side (Netanyahu,
      the ministry source, the 2 Oct unnamed sources, ThePrint''s reading of the 2020 agreement, which is secondary and not the agreement) with
      the instrument each addresses and attribute ''explicitly states'' to the Jerusalem Post. Low confidence is honest and should stay.'
    author_response:
      action: fixed
      note: 'Verified in the JPost 30 Sep and 2 Oct pages: ''explicitly states'' is the paper''s own voice; the 2 Oct sources address the bilateral
        agreement. Claim restated first-order as state proposed, low, with each side tied to its instrument (a flydubai agreement, b bilateral
        agreement, c unnamed instrument, d not read), and an assumption that the two items concern different documents. Log L-22.'
      commit: 8495c38
    resolved: true
    reviewer_note: 'Verified. Claim restated first-order (state proposed, low) with each side tied to its instrument. I re-opened both Jerusalem
      Post pages: 30 Sep (910192) says in its own voice ''Flydubai''s agreement to operate in Israel explicitly states that all pilots must be
      from countries that have normalized relations with Israel'', and quotes the ministry source only for ''This is a clear breach of the agreement'';
      2 Oct (910405) says the sources'' account ''concerned the bilateral aviation agreement'' and did not address a separate operating or security
      arrangement. The assumption that the two items concern different documents is stated with its if_wrong. One nuance for the author, not blocking:
      the 2 Oct piece itself reports the earlier ministry source as saying the agreement ''required'' the rule, so the ''own voice'' reading rests
      on the 30 Sep text only.'
  - id: R1-4
    target: fz1073-motive-statements
    severity: non_blocking
    finding: 'The statement puts in quotation marks that Netanyahu said ''we know that he underwent Islamist radical indoctrination''. No source
      read has that exact wording: Ynet quotes ''we know that the attacker pilot underwent Islamist radical indoctrination'', CNN''s live blog
      has ''it has been established that he underwent Islamist radical indoctrination'' (CNN''s wording, not a direct quote), CNN''s explainer
      has ''undergone Islamist radicalization'' (a video of Friday) and Reuters paraphrases. Quote one source exactly and name it, or paraphrase
      without quotation marks. Also the statement dates it 1 October and ''whoever sent him will pay a very heavy price'' to 2 October, which
      matches CBS and CNN.'
    author_response:
      action: fixed
      note: 'Verified: Ynet''s wording is ''we know that the attacker pilot underwent Islamist radical indoctrination''; CNN''s live-blog wording
        is CNN''s own paraphrase. The statement now quotes only ''underwent Islamist radical indoctrination'' attributed to Fox via Ynet; Ynet''s
        exact sentence and CNN''s labelled paraphrase are in the anchor. Dates 1 and 2 Oct kept (match CBS and CNN).'
      commit: 8495c38
    resolved: true
    reviewer_note: Verified. The statement now quotes only 'underwent Islamist radical indoctrination' (Fox via Ynet) and gives Ynet's full sentence
      ('we know that the attacker pilot underwent Islamist radical indoctrination') and CNN's labelled paraphrase in the anchor; I matched both
      in Ynet and the CNN live blog. 'Whoever sent him will pay a very heavy price' is in CBS as a statement of Friday 2 October, correct. The
      1 October date for the Fox interview is consistent with the CNN live blog of 1 October.
  - id: R1-5
    target: fz1073-crew-and-passengers-secured-aircraft
    severity: non_blocking
    finding: 'Established at high confidence with anchor_checked primary, but the statement goes beyond the primary texts: it says passengers
      ''entered the cockpit'' and that crew helped ''after the captain opened the cockpit door'', and says ''two additional pilots''. The flydubai,
      MoFA and GCAA texts say only that on-duty crew travelling on the flight secured and landed the aircraft and that passengers assisted or
      contributed. The door and the number come from Reuters and CBS (I confirmed Reuters: ''a reserve flydubai pilot crew'', no number) and the
      cockpit entry from passengers via CNN. Split the claim or trim the statement to what the primary texts say and put the rest in a separate
      secondary-anchored claim; the ''who did what first'' detail is already declared out of scope.'
    author_response:
      action: fixed
      note: 'Verified: the primary texts say only that on-duty crew travelling on the flight secured and landed the aircraft and that passengers
        assisted. fz1073-crew-and-passengers-secured-aircraft is trimmed to that (primary, high); the number of pilots, the cockpit door and passenger
        entry moved to the new fz1073-crew-details (secondary, moderate, with an exception line).'
      commit: 8495c38
    resolved: true
    reviewer_note: 'Verified against the stored flydubai, MoFA and GCAA texts: the trimmed claim says only what they say (on-duty flydubai crew
      travelling on the flight secured and landed the aircraft; passengers assisted or contributed; flydubai crew members travelling on board

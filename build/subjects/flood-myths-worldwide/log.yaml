subject: flood-myths-worldwide
dig_status: scoping          # no claims drafted; feasibility and design only
# Append-only excavation log. Corrections are new entries; earlier entries are never edited.
# Name note: the homepage lists a separate "Flood narratives / Mesopotamian texts" dig. This is
# a different dig (cross-cultural). The Gilgamesh dig and retranslation are not in this
# repository and are set aside by the owner for now (L-02).

log:
  - id: L-01
    date: 2026-10-02
    entry: >
      TOPIC OPENED by the owner. The owner's observation: flood stories recur across many
      cultures with shared themes, and variation in chapter order is too easily used to dismiss
      the likeness. Questions raised: do they describe one event, similar events far apart in
      space and time, or something inherited? And is Genesis a collection of narratives from
      many cultures? Scoping only. Facts below are V1 (search results agree) unless marked;
      no primary document was opened.
  - id: L-02
    date: 2026-10-02
    entry: >
      OWNER DECISIONS: (a) the earlier Gilgamesh dig and retranslation are set aside until
      found; they may be on another device and are not in this repository. (b) Wikipedia may
      be linked for orientation but is never a source: no claim may cite it as its anchor, and
      the "List of flood myths" is a pointer to be checked, not a dataset. Proposed as a
      framework rule in docs/COORDINATION.md.
  - id: L-03
    date: 2026-10-02
    entry: >
      THE QUESTION SPLITS INTO FOUR, FILED SEPARATELY (the popular version fuses them):
      Q1 Is the likeness between flood stories greater than chance? (a base-rate question)
      Q2 If so, is it inheritance (diffusion, or a very old shared source) or independent origin?
      Q3 Is there one event behind them, or many? (a physical-evidence question)
      Q4 Is Genesis a collection of narratives from many cultures? (a textual question, handled
         in its own dig, one source unit at a time)
      THIS DIG covers Q1 and Q2 and the corpus they need. Q3 is a separate dig of per-event
      claims. Q4 is a separate dig.
  - id: L-04
    date: 2026-10-02
    entry: >
      FEASIBILITY, EXISTING DATA AND SCHOLARSHIP (V1). (1) Berezkin's folklore and mythology
      catalogue is reported as about 50,000 oral-text abstracts for 945 groups, classified
      into 2,461 motifs, and has been used with genetic data to test population movement
      against cultural diffusion. (2) Michael Witzel proposes a very old "Laurasian" layer of
      mythology that includes flood myths; critics say such ancient diffusion is hard to prove.
      (3) Julien d'Huy has run statistical phylogenetic analyses of flood-myth motifs and
      reports spread with early migrations; the literature notes that fit is uneven (an
      index of contradiction is moderate to high in some regions such as Eurasia) and that
      trees are a poor model where stories mix. Each of these is INTERPRETIVE or SYNTHETIC
      evidence under CONTRIBUTING.md and cannot serve as a refutation or a proof (Rule 9).
      They are the methods and datasets to test, not conclusions to adopt.
  - id: L-05
    date: 2026-10-02
    entry: >
      FEASIBILITY, POSITIVE CONTROLS (V1). The method must find known answers it was not
      pointed at. Two candidates: (1) the 1700 Cascadia earthquake: Native oral histories,
      Japan's "orphan tsunami" records, buried-forest radiocarbon dates and tree rings agree on
      the evening of 26 January 1700; a story-plus-independent-record case with a precise date.
      (2) Nunn and Reid (Australian Geographer, 2016): 21 coastal Aboriginal stories read as
      memories of postglacial sea-level rise, 7,000 to 13,000 years old. It is one team's
      study, and no replication was found in the sources reviewed; it is a candidate control,
      not an established one. NEGATIVE CONTROL still needed: pairs of traditions known to be
      unconnected, which this dig must find before it sets any threshold.
  - id: L-06
    date: 2026-10-02
    entry: >
      FEASIBILITY, DOCUMENTED CASES OF BORROWING (V1). Proverbs 22:17-23:11 and the Egyptian
      Instruction of Amenemope (about 1100 BCE; British Museum papyrus): nearly all scholars
      accept a literary relationship, as a deliberate adaptation and not a translation. Use:
      a known-dependence positive control for the text-comparison method, and an example of the
      kind of evidence (a dated manuscript, saying-by-saying parallels) that dependence claims
      must meet. Whether Genesis draws on several cultures is Q4, not decided here.
  - id: L-07
    date: 2026-10-02
    entry: >
      CORPUS DESIGN (to be written down BEFORE any data is collected, per CONTRIBUTING.md
      section 4). Entry fields: culture or people; earliest record and its date; record type
      (written, oral transcribed, oral recorded); source and evidence class of that record;
      POST-CONTACT FLAG (recorded after sustained contact with Abrahamic traditions or
      missionary activity, yes, no or unknown); flood cause; warning given; survivors and how;
      vessel or refuge; bird or animal release; offering after the flood; later covenant or
      consequence. INCLUSION RULES: set before collecting; a story counts as a flood story only
      if water destroys human settlement and some people survive; stories that mention water
      only in passing are excluded and LISTED with the reason. CONTROL CORPUS: non-flood
      catastrophe stories (fire, drought, darkness) coded with the same fields, so the question
      is whether flood motifs co-occur beyond what catastrophe stories in general do.
  - id: L-08
    date: 2026-10-02
    entry: >
      METHOD OPTIONS (not chosen). (a) Motif co-occurrence against a null model built from the
      control corpus. (b) Distance in coded features compared across regions, as in the
      King's Book test. (c) Phylogenetic trees (d'Huy), treated with caution because stories
      mix and trees assume descent. DECISION RULE: thresholds are set from the positive and
      negative controls, never guessed (CONTRIBUTING.md item 3). Any result from this dig is
      synthetic and stays proposed until outside review.
  - id: L-09
    date: 2026-10-02
    entry: >
      KNOWN RISKS (logged now). Post-contact contamination of recorded oral stories; selection
      bias if only striking matches are collected; coding bias, since the person coding motifs
      knows the hypothesis; translation loss; the base rate (floods are the commonest natural
      hazard, so independent invention is expected in river and coastal peoples); and the
      Wikipedia list's mixed quality. Mitigations to design: blind or second coding of a
      sample; the post-contact flag; a published list of excluded stories.
  - id: L-10
    date: 2026-10-02
    entry: >
      NOT YET KNOWN, STATED PLAINLY: the corpus size we can realistically code; whether the
      Berezkin catalogue's flood motifs map onto our fields; whether any robust negative
      control exists; and whether the base-rate test can separate inheritance from independent
      invention at all. If it cannot, the dig files Q2 as a searched_gap and says exactly why.
  - id: L-11
    date: 2026-10-02
    entry: >
      NEXT STEPS (not started, blocked on source access): read Berezkin's catalogue
      documentation; read the d'Huy synthesis and a critique; read Nunn and Reid and a
      Cascadia primary paper; write the test down; then build the corpus. Hosts needed beyond the
      earlier list: wikipedia.org (links and orientation only), ruthenia.ru,
      folkloredatabase.com, biorxiv.org, helsinki.fi, scientificamerican.com, usgs.gov,
      researchgate.net.
  - id: L-12
    date: 2026-10-02
    entry: >
      DESIGN PRINCIPLE, set by the owner: do not root the dig in the biblical record just
      because it survives and is easy to read. The aim is neither to disprove it nor to
      confirm it. The aim is to find what the evidence supports, with the biblical account as
      ONE entry among many. Binding rules that follow:
      (1) Genesis is coded with the same fields, the same inclusion rules and the same evidence
      class rules as every other entry; it gets no special field, no default position and no
      template role.
      (2) SURVIVAL BIAS is named as a risk: a text survives, is edited, translated and indexed
      because an institution kept it, not because it is more original. Easy access must not
      become extra weight. Earliest surviving record is also not the same as earliest origin;
      a tradition we cannot read is not a younger one.
      (3) EVERY RESULT IS REPORTED THREE WAYS: with all entries, with Genesis removed, and with
      the whole connected Near Eastern cluster removed. A result that depends on Genesis being
      present, or on that cluster, is reported as such.
      (4) NO PSEUDO-REPLICATION: traditions in contact (Mesopotamia, the Levant, Greece,
      Egypt) are grouped into one region cluster for counting, so connected stories are not
      tallied as independent confirmations of one another.
      (5) NEUTRAL WORDING: no result is written as a verdict on any scripture's truth; the dig
      speaks of texts, dates, motifs and dependence.
  - id: L-13
    date: 2026-10-02
    entry: >
      CORRECTION TO L-07 (appended; L-07 stays as written): the inclusion rule and several
      fields in L-07 are shaped like the Noah story. "Some people survive", a vessel, a bird
      release, an offering and a later covenant are features of the Mesopotamian and biblical
      versions. Using them as filters or required fields would find Noah-shaped stories by
      construction and hide flood stories with other shapes (for example flood as the end of an
      age, no survivors, or survivors by other means). REVISED DESIGN: (a) inclusion rests only
      on "a narrative of a past catastrophe in which water destroys or reshapes human
      settlement"; survival, vessel, birds, offerings and covenant become CODED FIELDS with
      values including "absent" and "not stated", never filters. (b) The field list is drawn
      from a standard cross-cultural motif index (the Berezkin catalogue and the Thompson
      index) plus a pre-pass reading a spread of traditions chosen without reference to
      Genesis, and includes an open "other motifs" field. (c) Fields are fixed and logged
      before coding starts.
  - id: L-14
    date: 2026-10-02
    entry: >
      CONSEQUENCE FOR THE TESTS: the likeness question is now two questions that must not be
      mixed. (i) Do flood stories share a broad core (water catastrophe, survival, warning)
      beyond what catastrophe stories in general share? (ii) Do particular DETAILED sequences
      (the same ordered steps) recur beyond chance? Detail matching is the stronger signal and
      is where connected traditions are expected to match; broad-core matching is the weaker
      signal and is where independent origins are expected too. Variation in order or chapter
      is coded, not dismissed, and the dig states what level of variation each possible result
      would and would not exclude, before running anything.
  - id: L-15
    date: 2026-10-02
    entry: >
      OWNER SUPPLIED the earlier Mesopotamian corpus (Sumerian Flood Story, Atra-hasis,
      Enuma Elish, threads, thread validator), imported unedited at
      build/imports/mesopotamia-corpus/. These give dated, claim-by-claim anchors for the
      NEAR EASTERN CLUSTER of this dig's corpus: for example the Nippur tablet CBS 10673
      (about 1600 BCE), a bilingual Nineveh fragment (about 600 BCE), and the Atra-hasis
      colophon dated to the reign of Ammi-saduqa (1646-1626 BCE). Under L-12 rule (4) these
      three still count as ONE region cluster for counting. Their corpus already files the
      biblical link as a reception overlay with no evidential weight, which fits L-12. The
      Genesis flood text will be entered in this dig as its own entry with its own claims, and
      any dependence on Mesopotamian texts will be tested as a claim, not assumed as an overlay.
      The Gilgamesh subject file and the retranslation have not yet been received.
  - id: L-16
    date: 2026-10-02
    entry: >
      RECOVERED CHAT (owner paste): an earlier chat planned a 'Flood Excavation' (a YAML source of truth, a synthesis and an HTML parallel reader) running geology first, then written
      sources in order, then 'global convergence'. It ended at 'I'll build it section by section': no files were produced in what was pasted. The owner's stated aim there was to align the
      narratives with actual history and 'find the historical event beneath the religious narrative'. CRITIQUE (this dig's rules, L-12 to L-14): (1) the chat's premise 'multiple independent cultures
      wouldn't all invent the same story unless something real happened' treats the NUMBER of tellings as evidence. Under this dig that is adoption weight, not evidential weight: floods are common,
      stories travel, collectors over-recorded Genesis-like versions, and variants of one textual lineage are not independent witnesses (L-12 rule 4). (2) Its plan to 'propose a mechanism' and
      to date the 'real event' from the stories starts from the answer; this dig asks first whether the stories share more than catastrophe stories in general (L-14), and uses geology as a separate
      line of evidence that does not borrow from the stories. (3) 'Mesoamerica and the Pacific as independent witnesses' needs each tradition's recording history (who wrote it down, when, and how Genesis could
      have shaped it) before it counts as independent. Nothing was built from that chat. The owner's wish to see timelines of real events and of narratives side by side is met by the atlas (real-world
      and narrative axes kept separate), not by this dig's claims.

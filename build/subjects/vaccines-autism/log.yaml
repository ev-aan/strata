  - id: L-18
    date: 2026-10-02
    entry: >
      REVISION ROUND 3 (second author pass, merged on top of L-16 and L-17; corrections only, no
      earlier entry edited). While this pass was being prepared, revision round 1 (L-16) landed on
      the branch from another author pass; this pass was merged onto it and keeps its claim ids
      (va-wakefield-records-mismatch, va-wakefield-referral-description) and its responses. What
      this pass adds or corrects, each checked against the source named. (B2) The Guardian of 2 Feb
      2010 was opened (it was not before): it reports the retraction followed the GMC's findings of
      28 Jan 2010, quotes the editor ("utterly false"), and places the "earlier investigation" as
      the 2004 Royal Free inquiry that "found no problems". va-retraction-reasons now gives these
      and no longer quotes the 2010 notice, which still could not be read (thelancet.com and
      bmj.com refused); the 2004 paper-not-withdrawn point is explicit. (B3) The 2019 opinion
      describes the Board's grounds second-hand; the licence appeal itself, Geier v. Md. State Bd.
      of Physicians, 223 Md. App. 404 (No. 1095, filed 29 May 2015), was found and read in full: it
      quotes the Board's order of 22 Aug 2012 (Lupron outside approved use without adequate
      examination; chelation without documented reason; consent forms "misleading and in at least
      one case blatantly false"). va-geier-licence and timeline a22 are re-anchored to it; its text
      is stored for the quote check. (B1) va-wakefield-referral-description now carries paras 156 to
      158 of [2012] EWHC 503 (the panel's charges, "generated by the concerns of parents", the four
      referral letters) and is held at moderate confidence, weight 3, primary. N2 Simpsonwood: the
      chair's request to treat the data as embargoed until the public ACIP release of 21-22 June
      2000 (read in the transcript) is added; it is a confidentiality request before a planned
      release, not a withholding. F2/F4: NPR's "possible ... may have exacerbated" and CNN's
      "concluded ... significantly aggravated" are both given and the Poling statement no longer
      carries the Salon-only wording; the "more than 5,000 filed" and "about 4,800 pending"

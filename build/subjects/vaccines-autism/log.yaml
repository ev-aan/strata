subject: vaccines-autism
# Append-only excavation log. Corrections are new entries; earlier entries are never edited.

log:
  - id: L-01
    date: 2026-10-02
    entry: >
      Dig opened at the owner's request: "does vaccines cause autism?" First scope agreed was
      the MMR and Wakefield core only. Repository schema read (build/SCHEMA.md,
      build/conformance.py, CONTRIBUTING.md) and apollo-landings and gulf-of-tonkin used as
      templates.
  - id: L-02
    date: 2026-10-02
    entry: >
      OWNER DECISIONS. (1) Scope widened: Wakefield is the founding core, and the dig also
      covers ingredients (thimerosal, aluminum), schedule and timing, insider and legal claims,
      and prevalence and institutions. (2) Open questions are filed as searched gaps. (3) Every
      claim shows the "No" case and the "Yes" case where one exists, and the dig answers in the
      form "No, except in this particular case". Implemented as a `short_answer` block naming
      the claims behind each exception, and `positions` with Yes and No labels on each claim.
  - id: L-03
    date: 2026-10-02
    entry: >
      Source pass in five parallel reading streams (origin; MMR studies; ingredients and
      schedule; insider and legal; prevalence and institutions), plus congenital rubella and
      mitochondrial disease. Reachable: PubMed Central and Europe PMC, the UK National
      Archives case-law service, NHS Digital, Eurosurveillance, the US Senate site, the
      Maryland courts, Cornell LII, eCFR, Salon. Refused this environment: thelancet.com,
      bmj.com (partly), nejm.org, acpjournals.org, jamanetwork.com, the UK Government Web
      Archive (GMC documents), archive.org, hrsa.gov, publications.aap.org, the Court of
      Federal Claims PDF host (for direct download). Nothing was obtained through mirrors.
  - id: L-04
    date: 2026-10-02
    entry: >
      VERIFICATION RULE used in this dig. anchor_checked: primary only where the full document
      was downloaded and read directly (sha256 in sources/MANIFEST.yaml). Documents read only
      through a summarizing fetch tool, as abstracts, or as quoted by others are `secondary`,
      even when the whole document passed through the tool. Under this rule the headline claim
      is secondary, so the headline stays draft.
  - id: L-05
    date: 2026-10-02
    entry: >
      OPEN DESIGN QUESTION for the owner. Rule 9 lets a refutation rest only on material or
      primary-text evidence, and CONTRIBUTING.md classes statistics as `synthetic`. The
      population studies that answer this dig are statistics. Result: the general claims
      ("MMR causes autism", "the rise proves vaccines") cannot be filed as refuted, however
      strong the evidence. They are filed as `proposed` at weight 1 with `retired_by` naming
      the discriminating test. Options: (a) keep this, and say so on the page; (b) treat
      register records of vaccination and diagnosis as material and the computed estimate as
      the reading of them; (c) add the statistical temple with its own refutation bar
      (pre-registered analysis, replication in an independent population). Recommendation:
      (c), since this dig cannot be done fully honestly in the forensic temple alone.
  - id: L-06
    date: 2026-10-02
    entry: >
      Headline drafted ("Do Vaccines Cause Autism? No, Large Studies Find; Two Narrow
      Exceptions Explained") and held as draft. To publish: read the full texts of Hviid 2019
      and Madsen 2002 (publisher sites refused here; a local session with a browser should
      reach them), then move va-mmr-no-detectable-increase to anchor_checked: primary.

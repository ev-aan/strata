      the 2009 and 2010 review outcomes are no longer stated (the decisions were not opened; the
      court's decision list was). F5: the leftover "policy decision" wording in the Vaccine Injury
      Table basis is replaced (42 U.S.C. 300aa-14(c) read: set by statute, changed by rulemaking
      with public comment); the IOM's role in Table changes is not verified and not stated. F1/N1:
      timeline events a03 ("as a precaution", a word the MMWR text does not use) and b06 (31
      studies) are corrected. Also, independently of this pass's content changes: the WHO page
      count (20 of 31 null, 11 suggesting an association, 9 of them from one US group, all 5
      meta-analyses null) and the MMWR 1999 text were re-read directly and match what the dig now

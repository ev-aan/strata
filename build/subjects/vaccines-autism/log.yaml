      was a potential test case, and calls it the best-known case, not a count; NPR now opened.
      F3: mitochondrial count is "at least 5 children in two reports". F5, F6: Injury Table and
      Bruesewitz wording qualified. F7: the expression of concern is attributed to the 2020 paper.
      N1: MMWR 1999 read in full; quoted exactly; the methylmercury-guideline point added to the
      Yes side. N2: Simpsonwood transcript read in full (260 pages; autism p. 44); "generation zero"

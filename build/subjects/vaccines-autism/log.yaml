      moved out of the anchors of the MMR, thimerosal, aluminum and small-effect claims into
      adoption notes; independence of populations stated (Danish register vs UK and US studies).
      F1: WHO removed from the first-screen figures; the WHO count is now stated accurately where
      kept (20 of 31 null, 11 suggesting an association, all 5 meta-analyses null); the Taylor 2014

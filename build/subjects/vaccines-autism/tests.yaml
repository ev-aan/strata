subject: vaccines-autism

discriminating_tests:

  - id: dt-mmr-cohorts
    question: >
      Among children whose vaccinations and diagnoses are both recorded, are those who got
      MMR diagnosed with autism more often than those who did not?
    retires: va-mmr-causes-autism
    predicts:
      mmr-causes-autism: >
        IF MMR caused a meaningful share of autism, vaccinated children should show a clear
        excess, larger in the months after vaccination, and present in every large cohort.
      no-effect: >
        IF not, estimates should sit near 1 with no clustering after vaccination.
    result:
      type: synthetic
      finding: >
        Denmark 1991-1998 (537,303): adjusted RR 0.92 (0.68 to 1.24). Denmark 1999-2010
        (657,461): HR 0.93 (0.85 to 1.02), no clustering after vaccination, no increase in
        subgroups with a sibling with autism. UK GPRD: OR 0.86 (0.68 to 1.09). All abstracts.
      accessible: true
    resolves: >
      Retires the general claim at the population level. It does not test a very rare
      susceptible group (va-small-effect-not-excludable).
    note: >
      Statistical evidence, class synthetic. Under Rule 9 it retires but is not filed as
      refuting (owner decision, log L-19: statistics show no evidence supports the claim; no rule change). Abstracts only; full texts to be read before the headline publishes.

  - id: dt-high-risk-siblings
    question: >
      In the group most likely to carry autism genes (younger siblings of children with
      autism), does MMR raise the risk?
    retires: null
    predicts:
      susceptible-group: >
        IF a genetic susceptibility made MMR harmful, the excess should be largest here.
      no-effect: >
        IF not, the relative risk should be near 1 in this group too.
    result:
      type: synthetic
      finding: >
        Jain et al. 2015, 95,727 US children with older siblings; among the 1,929 with an
        affected older sibling: 1 dose by age 2, RR 0.76 (0.49 to 1.18); 2 doses by age 5,
        RR 0.56 (0.31 to 1.01). No increase [abstract]. Hviid 2019 sibling subgroup: no
        increase [abstract].
      accessible: true
    resolves: >
      Tests one named susceptible group; finds no excess. The intervals are wide and below 1.
      Strata's interpretation, not the paper's finding: families may have delayed vaccination
      after an affected child (selection), so the result supports "no increase", not
      "protection".
    note: "An erratum to Jain 2015 exists (JAMA 2016;315:204) and was not read."

  - id: dt-time-window
    question: >
      Do autism onset or regression cluster in the weeks and months after MMR, more than age
      alone predicts?
    retires: va-timing-shows-cause
    predicts:
      timing-is-cause: >
        IF vaccination triggered onset, onset and regression should cluster after it in a
        self-controlled case series.
      coincidence: >
        IF not, onset should follow age, with no excess after vaccination.
    result:
      type: synthetic
      finding: >
        Taylor et al. 1999, 498 cases: onset within 1 year of MMR, relative incidence 0.94
        (0.60 to 1.47); regression within 2 months 0.92 (0.38 to 2.21). One significant
        clustering (parents' first concern within one 6-month interval), which the authors
        judged an artifact of dating onset [abstract]. Ozonoff 2010 shows signs emerging in
        the same months regardless [read].
      accessible: true
    resolves: >
      The regression interval is wide; the test retires timing as proof, not every possible
      timed effect. The single clustering is recorded, not dropped.
    note: "See va-mito-fever-regression for the one timed mechanism that remains untested."

  - id: dt-withdrawal-natural-experiments
    question: >
      When a vaccine or ingredient was withdrawn from a whole population, did autism
      diagnoses fall in the birth cohorts that followed?
    retires: va-rise-proves-vaccines
    predicts:
      vaccine-drives-rise: >
        IF MMR or thimerosal drove the rise, diagnoses should level off or fall after withdrawal.
      other-causes: >
        IF not, diagnoses should keep rising.
    result:
      type: synthetic
      finding: >
        Yokohama, Japan: MMR uptake fell from 1988 and no MMR was given from 1993; cumulative
        autism incidence kept rising, most steeply from the 1993 birth cohort [abstract].
        Denmark: thimerosal removed in 1992; incidence kept rising [abstract]. California:
        thimerosal removed 1999-2001; caseloads at every age kept rising through 2007 [abstract].
      accessible: true
    resolves: >
      Ecological designs: they show withdrawal did not reverse the trend, which is what the
      claim predicts would happen. They do not exclude a small individual-level effect.
    note: "Honda 2005 figures were not read; only the abstract's description is used."

  - id: dt-measles-rna-blinded
    question: >
      Do children with autism and bowel symptoms carry measles vaccine RNA in the gut more
      often than children with bowel symptoms alone, when laboratories do not know which is which?
    retires: va-measles-rna-gut
    predicts:
      persistent-measles: "IF the mechanism is real, RNA should be found mostly in cases."
      no-mechanism: "IF not, rates should be low and similar."
    result:
      type: material
      finding: >
        Hornig et al. 2008: 1 of 25 cases (4%) and 1 of 13 controls (8%), tested in three
        blinded laboratories including the original one [read].
      accessible: true
    resolves: "Refutes the gut-persistence mechanism on material evidence (Rule 9 satisfied)."
    note: "Small study; held at weight 4."


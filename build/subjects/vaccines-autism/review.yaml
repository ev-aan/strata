notes: >
  Conformance: python3 build/conformance.py --base origin/main reports 0 errors for this subject
  (11 established claims below primary are warnings). python3 build/tools/review_dig.py vaccines-autism:
  every mechanical check passes; the quote check matched 5 quotes and could not match 24 (the
  stored text covers only some sources); the unmatched quotes were checked by hand where the
  source could be opened. Opened and read by me (all matched unless a request says otherwise):
  [2012] EWHC 503 paras 1, 7, 153, 156-159, 186-187; Guardian 2 Feb 2010; Indian J Psychiatry 2011
  (Europe PMC); Europe PMC records for Lancet 1998, 2004 and 2010; Md. Ct. Spec. App. Nos. 1095
  (full), 722/2256 and 338 (passages); WHO GACVS statement; MMWR 1999;48(26); Simpsonwood transcript
  (full PDF, pp. 44, 255-256); CNN and NPR on the compensation concession; 42 U.S.C. 300aa-14(c); Bruesewitz (Cornell
  LII syllabus, opinion, dissent n.25); SAGE expression of concern and Hooker & Miller 2021;
  Thompson 2014 PDF; CDC 2004 study statement; CDC autism page (22 Jul 2026); STAT 21 Nov 2025 and
  26 Mar 2025; Salon 16 Jan 2011; IOM 2004 summary; Federal Circuit opinions 2010-5004 (Cedillo) and
  2009-5128 (Hazlehurst); Court of Federal Claims decision list; Europe PMC abstracts for Madsen 2002,
  Hviid 2019 (6,517 cases, 5,025,754 person-years, HR 0.93, 0.85-1.02), Taylor 1999, Smeeth 2004,
  Jain 2015, Taylor 2014 (1,256,407 and 9,920), Cochrane 2021 (1,194,764; RR 0.93, 0.85-1.01),
  Hviid 2003, Madsen 2003, Schechter 2008, Price 2010, DeStefano 2004 and 2013, Honda 2005, Chess
  1978, Andersson 2025, Hansen 2015, ADDM 2022, Shoffner 2010, the 2006 case report; full text of Rossignol
  and Frye 2012, Hornig 2008, Ozonoff 2010; the Henry Ford draft (Tables 2 and 3, follow-up). All
  numbers, dates, case ids and quotations checked in these sources matched the dig, with the
  exceptions listed in round 3.
  Rule 9: every refuted claim names its target and rests on primary-text or material evidence
  (ethics statement: court text; measles RNA: laboratory results; thimerosal removal: MMWR text;
  Henry Ford: the draft's own tables; Simpsonwood: the transcript). The general 'no link' claim stays
  proposed (va-mmr-causes-autism), as the owner has not changed Rule 9. No percentage appears in the
  assessment; it has exactly three key points. Fairness: the strongest opposing items are present
  and no claim says vaccines are safe or that no harm occurs; 'not a proof that none ever did' is
  stated. statement_kind assignments are plausible (reported for what a source says, judgment
  for conclusions, search_result for gaps).
  Not reached by me: thelancet.com and bmj.com (403) so the Lancet 2004 and 2010 notices and the BMJ
  2011 and 2010 pieces; pmc.ncbi.nlm.nih.gov blocks scripted fetches (Europe PMC used instead);
  supremecourt.gov (404), Justia (403) and the court's own decision PDFs (404). Not re-opened by me:
  NHS immunisation statistics, Eurosurveillance full text, the UKHSA table, eCFR 42 CFR 100.3, IOM
  2013, Henry Ford Health statement, Siri testimony, EO 14420, Annenberg, Reuters and Live Science,
  ACP injunction report, Mawson 2017, Mold 2018, Hooker 2014 and its retraction note, Chess 1977,
  Berger 2011, Sandin 2017, Bai 2019, Modabbernia 2017, Shattuck 2006, ADDM 2007, DSM-5 review,
  Verstraeten 2003, and the second group of test cases (King, Mead, Dwyer).
  Round 4 (fourth reviewer, head b20ad59): conformance 0 errors (11 warnings for this subject, all
  established claims anchored below primary); review_dig.py all mechanical checks pass (5 quotes
  matched, 26 not matched in stored text). Opened and read by me: WHO GACVS statement of 11 Dec 2025
  (sha256 matches the manifest); CNN 6 Mar 2008 and NPR 7 Mar 2008; the stored Simpsonwood text at
  the embargo passage; Federal Circuit opinions 10-5004 (Cedillo) and 09-5128 (Hazlehurst) in full
  text (sha256 of both match the manifest); Rossignol and Frye 2012 full text (Europe PMC); and I
  re-ran the Europe PMC search of va-whole-schedule-gap (22 hits, as recorded; none a whole-schedule
  autism study). Read through a fetch tool only: the CDC autism page (dated 22 Jul 2026; a direct
  download returned 403) and the IOM 2004 Executive Summary. Key point 2 (health bodies) is labelled
  adoption, is not in basis, and matches the WHO statement and the CDC page; exactly three key points,
  no percentage. The child in the 2007 case is not named in claims, threads, timeline or manifest.
rounds:
- round: 1
  reviewed_on: 2026-10-02
  head: 491a12d
  source: docs/reviews/vaccines-autism-round-1.md
  requests:
  - id: B1
    target: va-wakefield-paper-account-accurate
    severity: blocking
    finding: 'The statement bundles referral, ethics approval and onset; only the ethics limb is settled by a primary read ([2012] EWHC 503 para 153). Para 157 reads "consecutively referred" narrowly and rejects the GMC panel''s reading for Walker-Smith. Onset and diagnosis rest only on BMJ material read through a fetch tool. Split into ethics (primary), records (secondary, interpretive) and referral (contested).'
    author_response: {action: fixed, note: 'Claim narrowed to the ethics statement (refuted, primary, para 153). New va-wakefield-records-mismatch (proposed, interpretive, secondary: BMJ 2011) and va-wakefield-referral-description (contested; para 157 and the GMC panel and Lancet notice as quoted; disputed_by names both). Assessment, short answer and key points now say "a court found its ethics statement untrue" rather than that the account did not match the records. Log L-16.', commit: 6446a36}
    resolved: true
    reviewer_note: "Verified against [2012] EWHC 503 (Admin) on the National Archives site. Para 153: 'This statement was untrue and should not have been included in the paper.' (verbatim; the judge's own words after unchallenged evidence from Murch and Walker-Smith). Para 156 quotes charges 31-32 (children 1, 9, 5, 10; 'irresponsible', 'misleading'). Para 157: 'means no more than that the children were referred successively, rather than as a single batch', 'It was a referral generated by the concerns of parents about a possible link'. Para 158: 'factually accurate ... but of no significance'. The three-way split is right: ethics refuted on a primary read, records proposed on a secondary anchor, referral contested on a primary read with both readings given. Not reached by me: BMJ 2011 (Deer, Godlee; bmj.com refused) and the Lancet 2010 notice; the dig labels both as not read."
  - id: B2
    target: va-retraction-reasons
    severity: blocking
    finding: 'The 2010 notice was never read; the gloss "the earlier investigation was the GMC hearing" is unsupported (the Guardian, 2 Feb 2010, places it as the 2004 Royal Free inquiry). In 2004 the paper was not withdrawn, only its interpretation. The 2004 Lancet admission of undisclosed funding is omitted.'
    author_response: {action: fixed, note: 'GMC gloss removed; the claim now says which investigation the notice means is not stated in what was read, and that a 2011 review (Indian J Psychiatry, now read in full) says the Lancet''s 2004 statement had cleared the authors of ethical violations. "Withdrawn in two steps" replaced by "interpretation retracted in 2004 and the paper in 2010". The 2004 admission that the paper failed to disclose financial interests is added, as described in that review. The Guardian could not be opened from here (site blocked), so its account is not used. The manifest publication reason now says "as quoted" (F8). Log L-16.', commit: 6446a36}
    resolved: true
    reviewer_note: "Opened the Guardian of 2 Feb 2010: Horton says the statements in the paper were 'utterly false' and 'I feel I was deceived'; the 2004 Royal Free letter (Prof. Hodgson) 'had found no problems'. Opened Indian J Psychiatry 2011 (Europe PMC full text): 'no causal link was established between MMR vaccine and autism as the data were insufficient'; the Lancet admission that Wakefield et al. failed to disclose financial interests; the Lancet exonerated the authors of ethical violations in 2004. Europe PMC record of Lancet 2004;363:750 lists 10 authors, so 10 of 13 signed (not Wakefield, Linnell, Harvey); Lancet 2010;375:445 (PMID 20137807, Feb 2010) exists. The GMC gloss is gone and the claim says the 2010 notice was not read, which is accurate. The 2004 and 2010 notices themselves remain unread by me (thelancet.com and bmj.com return 403). Non-blocking, see R3-5: the claim statement says 'The Lancet said ... failed to disclose' without 'as described in a 2011 review', and confidence is high on a secondary anchor."
  - id: B3
    target: va-geier-licence; timeline a22
    severity: blocking
    finding: 'The cited 2015 Maryland opinion supports the date, the 27 Apr 2011 suspension and the charges, but contains no "Lupron", no "misleading" and no "standard of care"; the 2017 and 2019 opinions are named in the manifest but not given.'
    author_response: {action: fixed, note: 'The reviewer is right about the 2015 opinion. The wording is in the 2019 opinion (Court of Special Appeals, No. 338, Sept. Term 2018, p. 13), which describes the Board''s conclusion: he "failed to meet the standard of adequate care in using his Lupron protocol to treat autistic children" and committed unprofessional conduct "by using misleading methods to obtain parental consent". That opinion is now a manifest source with URL and sha256 (67b37693...), its text is stored in sources/, and the anchor says the wording is the court''s description of the Board''s decision. The 2017 opinion is no longer claimed. IOM removed from the anchor. Timeline a22 updated. Naming living persons: left to the owner.', commit: 6446a36}
    resolved: true
    reviewer_note: "Opened the PDF from the manifest URL (mdcourts.gov 1095s14.pdf; sha256 846e651c... matches the manifest). It is Geier v. Maryland State Board of Physicians, No. 1095, Sept. Term 2014, 'Filed: May 29, 2015'. It states: Board's Final Decision and Order of 22 Aug 2012 revoked the licence; Lupron 'not approved by the U.S. Food and Drug Administration ... for use on children in the absence of precocious puberty' without an adequate examination; chelation 'without documenting a reason ... and without adequate documented informed consent', which 'violated the standard of quality care'; and in the sanction passage consent forms 'misleading and in at least one case blatantly false'. The 1 Oct 2015 opinion (No. 722/2256) gives the 27 Apr 2011 summary suspension and cites 223 Md. App. 404. The 2019 opinion (No. 338) has 'failed to meet the standard of adequate care in using his Lupron protocol to treat autistic children' and 'misleading methods to obtain parental consent'. Claim and timeline a22 match. IOM is out of the anchor. The Board's own order was not read by anyone; the dig says so. 'Author of the main early papers reporting a vaccine-autism link' in the statement is a characterisation not anchored in a source read (minor). Naming a living person stays an owner decision."
  - id: B4
    target: va-mmr-no-detectable-increase, va-thimerosal-no-detectable-increase, va-aluminum-no-detectable-increase, va-small-effect-not-excludable, va-geier-licence
    severity: blocking
    finding: 'IOM 2004 and WHO GACVS 2025 are used as anchor evidence; both are adoption. The Danish evidence is overlapping registers from one group; name the independent replications.'
    author_response: {action: fixed, note: 'IOM and WHO removed from every anchor description and anchor source list; their statements now sit in adoption_note. va-small-effect-not-excludable re-anchored to Hviid 2019 and the method itself (now secondary, since the IOM was its only primary read). Basis of the MMR claim now states independence: Denmark (one register, one group; the meta-analysis cohorts largely Danish) vs the UK (Taylor 1999, Smeeth 2004) and the US (Jain 2015, DeStefano 2004); thimerosal names Denmark vs the US (Price 2010, Schechter 2008).', commit: 6446a36}
    resolved: true
    resolved_in_round: 4
    reviewer_note_round_4: "Verified at f71be42 and b20ad59: va-thimerosal-no-detectable-increase anchor.sources is [src-hviid-2003, src-price-2010, src-schechter-2008, src-madsen-2003, src-verstraeten-2003]; a scripted scan of every anchor finds no IOM, WHO, CDC or HHS source in the anchor of any B4 claim. The agencies are in adoption_note. Further adoption in anchors outside B4's list: R4-6 (non-blocking)."
    reviewer_note: "Mostly fixed, one residue. Verified: IOM 2004 and WHO GACVS 2025 are out of the anchor descriptions and sources of the MMR, aluminum, small-effect and Geier claims and sit in adoption_note; va-small-effect-not-excludable is re-anchored to Hviid 2019 and Jain 2015; independence is stated (Danish register and one group vs UK and US for MMR; Denmark vs US for thimerosal, checked against the Hviid 2003, Madsen 2003, Price 2010 and Schechter 2008 abstracts). Still wrong: va-thimerosal-no-detectable-increase lists src-hhs-thimerosal-2025 (an HHS release adopting an ACIP vote) and src-cdc-thimerosal (the CDC page) in anchor.sources although the description does not use them. Both are adoption sitting in an anchor. Remove them from anchor.sources (they can stay in adoption_note). Tracked as R3-1."
  - id: N1
    target: va-thimerosal-removed-because-harmful
    severity: non_blocking
    finding: '"Precautionary" is not in the MMWR text; quote exactly; add the methylmercury-guideline point, which is the strongest version of the opposing view. MMWR is reachable, so this can go to primary.'
    author_response: {action: fixed, note: 'MMWR 1999 downloaded and read in full (sha256 a31e97f1...; text stored). Anchor quotes "no data or evidence of any harm", "because any potential risk is of concern" and "should be removed as soon as possible", and the guideline sentence; "precautionary" removed. The Yes position now carries the guideline point. anchor_checked primary, weight 5.', commit: 6446a36}
    resolved: true
    reviewer_note: "Downloaded MMWR 1999;48(26) (mm4826.pdf). Verbatim: 'there are no data or evidence of any harm caused by the level of exposure that some children may have encountered', 'because any potential risk is of concern', 'should be removed as soon as possible', and the methyl mercury guideline sentence. 'Precautionary' occurs 0 times. The refutation target and the Yes position (guideline point) are fair."
  - id: N2
    target: va-simpsonwood-autism-hidden
    severity: non_blocking
    finding: 'The whole 259-page transcript is downloadable; re-anchor to primary. "Generation zero" is not in the transcript; keep it unverified.'
    author_response: {action: fixed, note: 'Full PDF downloaded (sha256 c2b0333f...; 260 pages); text extracted and stored; every passage mentioning autism read (eight). Autism result is on p. 44. "Generation zero" occurs 0 times; the Yes position says so. anchor_checked primary, confidence high, weight 4.', commit: 6446a36}
    resolved: true
    reviewer_note: "Downloaded the CDC Stacks PDF (sha256 c2b0333f... matches). p. 44: 'This is the result for autism, in which we don't see much of a trend except for a slight, but not significant, increase for the highest exposure. The overall test for trend is statistically not significant.' Later 'a relative risk that is no different than one'. 'Generation zero' occurs 0 times. 'Embargoed ... very highly protected ... until it is made public on June 21 and 22 at the ACIP' is at transcript pp. 255-256. Two nits (R3-4): the speaker is Dr. Bernier, not 'the chair'; the PDF has 259 pages (pdfinfo), not 260."
  - id: N3
    target: va-poling-concession
    severity: non_blocking
    finding: 'Core supported by CNN, but the fuller quoted phrase rests on Salon "not re-checked", and "government conceded" is the family lawyer''s account. State that the Rule 4(c) wording is unverified; established on a secondary anchor is borderline.'
    author_response: {action: fixed, note: 'Anchor now leads with the sourced CNN wording and NPR (now opened), says the fuller phrase is known only as quoted in Salon and not re-checked, and says the Rule 4(c) report and 2010 decision were not read. statement_kind reported. State kept at established/moderate with the conformance warning; the reviewer may prefer proposed, which the author would accept.', commit: 6446a36}
    resolved: true
    reviewer_note: "Opened CNN (6 Mar 2008): program 'concluded last November' that her underlying illness was 'significantly aggravated'; potential test case (lawyer); concession shortly before an expert-testimony deadline (lawyer's account); Gerberding 'absolutely no statement indicating that vaccines are a cause of autism'; 'nearly 5,000 other autism claims are pending'. Opened NPR (7 Mar 2008): 'in its ruling, the government said it was possible that the vaccines [the child] received may have exacerbated that disorder'. Both wordings are given; the Salon-only wording is no longer in the statement. Established at moderate on two independent news reports is acceptable with the stated limit. Unsourced word elsewhere: see R3-2."
  - id: N4
    target: va-signs-emerge-in-schedule-window
    severity: non_blocking
    finding: 'Stated more firmly than one 25-infant sibling study allows; the same paper reports 11 children with clear signs before the first birthday and no regression.'
    author_response: {action: fixed, note: 'Statement now names the single study and its sibling sample, and adds that by parent report 11 showed clear signs before the first birthday and 4 lost skills (verified in PMC2923050). Weight lowered from 4 to 3.', commit: 6446a36}
    resolved: true
    reviewer_note: "Read the Ozonoff 2010 author manuscript (PMC2923050): 11 of 23 with ADI-R reported clear signs before the first birthday and no regression; 4 reported loss of skills; 19 of 22 declined on the prospective measures; infant-sibling sample. Statement and weight 3 match."
  - id: N5
    target: va-omnibus-test-cases
    severity: non_blocking
    finding: 'Label "Yes, the question stays open" overstates Sotomayor footnote 25.'
    author_response: {action: fixed, note: 'Relabelled "A caution, not a finding either way"; the ground already quotes "uniformly rejected".', commit: 6446a36}
    resolved: true
    reviewer_note: "Label now 'A caution, not a finding either way'. Bruesewitz dissent n.25 verbatim: special masters 'uniformly rejected the alleged causal link between vaccines and autism', 'those rulings do not necessarily mean that no such causal link exists'."
  - id: N6
    target: va-rise-mostly-reporting
    severity: non_blocking
    finding: 'Danish 60% covers births 1980-1991 and two named changes; it does not show the share of the US rise.'
    author_response: {action: fixed, note: 'Statement scoped to Denmark; the US ADDM series is described as uninterpretable for this purpose because its definitions, sources and sites changed.', commit: 6446a36}
    resolved: true
    reviewer_note: "Hansen 2015 abstract: births 1980-1991, n=677,915; 60% (95% CI 33%-87%) from the two changes. The statement is now scoped to Denmark and says the US series cannot be read for this. ADDM 2022 abstract: 32.2 per 1,000; the 6.7 for 2000 (ADDM 2007) was not re-read by me."
  - id: N7
    target: va-measles-rna-gut
    severity: non_blocking
    finding: '"High" confidence on one 38-child replication is a little firm.'
    author_response: {action: fixed, note: 'Confidence lowered to moderate; weight stays 4.', commit: 6446a36}
    resolved: true
    reviewer_note: "Confidence is moderate, weight 4. Hornig 2008 (Europe PMC full text): 25 cases, 13 controls, three blinded laboratories including the original; MMR before GI onset 12 of 25 vs 3 of 13, P=0.13; earlier report 75% vs 6% cited."
  - id: N8
    target: va-aluminum-no-detectable-increase
    severity: non_blocking
    finding: 'The autism-only figure is not in the abstract; keep the press-release caveat. WHO''s aluminium review is about chronic and systemic disease, not autism.'
    author_response: {action: fixed, note: 'Caveat kept in the statement and anchor ("not in the abstract"); WHO moved to adoption_note with the note that its aluminium review is not autism-specific.', commit: 6446a36}
    resolved: true
    reviewer_note: "Andersson 2025 abstract: 1,224,176 children, any neurodevelopmental disorder HR 0.93 (0.90-0.97); ASD is among the 50 disorders measured; the autism-only figure is not in the abstract and the caveat stays. WHO is in adoption_note. See R3-7: the WHO page also mentions two ecological studies that reported an association with ASD prevalence, which the note leaves out."
  - id: N9
    target: va-destefano-race-subset; va-thompson-subgroup-real
    severity: non_blocking
    finding: 'Add the abstract''s result that age cutoffs of 18 and 24 months showed no association, including in regression subgroups. Thompson''s source URL is only a site root.'
    author_response: {action: fixed, note: 'Abstract result added (re-read). Thompson copy re-downloaded from its exact URL, same sha256 as the copy read; manifest and timeline carry the full URL.', commit: 6446a36}
    resolved: true
    reviewer_note: "DeStefano 2004 abstract: 'No significant associations for either of these age cutoffs [18, 24 months] were found for specific case subgroups, including those with evidence of developmental regression'; OR 1.49 (1.04-2.14) before 36 months, attributed to early-intervention requirements. The Thompson PDF at the manifest URL downloads with sha256 3bed9a71..., matching the manifest; 'my coauthors and I omitted statistically significant information in our 2004 article' is verbatim. The CDC archive page and both STAT URLs resolve."

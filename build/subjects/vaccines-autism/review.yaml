  - id: FORMAT
    target: claims.yaml, taxonomy.yaml, sources/MANIFEST.yaml
    severity: blocking
    finding: '38 anchors use ref:; no assessment; no taxonomy entry; no statement_kind; va-henry-ford-why-unpublished has no disputed_by; three manifest URLs do not resolve; src-poling-npr-2008 cited but not opened.'
    author_response: {action: fixed, note: 'ref: to sources: and assessment, taxonomy and disputed_by in d5f441d (log L-15). statement_kind on every claim, assigned by rule and marked to be reviewed; URLs for src-thompson-2014, src-cdc-2004-study-statement and src-stat-geier-2025 corrected; NPR opened, in 6446a36 (L-16). review_dig: conformance, assessment, key points, taxonomy and statement_kind now pass.', commit: 6446a36}

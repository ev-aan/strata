notes: >
  Conformance: python3 build/conformance.py --base origin/main reports 0 errors for this subject
  (11 established claims below primary are warnings). python3 build/tools/review_dig.py vaccines-autism:
  every mechanical check passes; the quote check matched 5 quotes and could not match 24 (the
  stored text covers only some sources); the unmatched quotes were checked by hand where the
  source could be opened. Opened and read by me (all matched unless a request says otherwise):
  [2012] EWHC 503 paras 1, 7, 153, 156-159, 186-187; Guardian 2 Feb 2010; Indian J Psychiatry 2011
  (Europe PMC); Europe PMC records for Lancet 1998, 2004 and 2010; Md. Ct. Spec. App. Nos. 1095
  (full), 722/2256 and 338 (passages); WHO GACVS statement; MMWR 1999;48(26); Simpsonwood transcript
  (full PDF, pp. 44, 255-256); CNN and NPR on Poling; 42 U.S.C. 300aa-14(c); Bruesewitz (Cornell
  LII syllabus, opinion, dissent n.25); SAGE expression of concern and Hooker & Miller 2021;
  Thompson 2014 PDF; CDC 2004 study statement; CDC autism page (22 Jul 2026); STAT 21 Nov 2025 and
  26 Mar 2025; Salon 16 Jan 2011; IOM 2004 summary; Federal Circuit opinions 2010-5004 (Cedillo) and
  2009-5128 (Hazlehurst); Court of Federal Claims decision list; Europe PMC abstracts for Madsen 2002,
  Hviid 2019 (6,517 cases, 5,025,754 person-years, HR 0.93, 0.85-1.02), Taylor 1999, Smeeth 2004,
  Jain 2015, Taylor 2014 (1,256,407 and 9,920), Cochrane 2021 (1,194,764; RR 0.93, 0.85-1.01),
  Hviid 2003, Madsen 2003, Schechter 2008, Price 2010, DeStefano 2004 and 2013, Honda 2005, Chess
  1978, Andersson 2025, Hansen 2015, ADDM 2022, Shoffner 2010, Poling 2006; full text of Rossignol
  and Frye 2012, Hornig 2008, Ozonoff 2010; the Henry Ford draft (Tables 2 and 3, follow-up). All
  numbers, dates, case ids and quotations checked in these sources matched the dig, with the
  exceptions listed in round 3.
  Rule 9: every refuted claim names its target and rests on primary-text or material evidence
  (ethics statement: court text; measles RNA: laboratory results; thimerosal removal: MMWR text;
  Henry Ford: the draft's own tables; Simpsonwood: the transcript). The general 'no link' claim stays
  proposed (va-mmr-causes-autism), as the owner has not changed Rule 9. No percentage appears in the
  assessment; it has exactly three key points. Fairness: the strongest opposing items are present
  and no claim says vaccines are safe or that no harm occurs; 'not a proof that none ever did' is
  stated. statement_kind assignments are plausible (reported for what a source says, judgment
  for conclusions, search_result for gaps).
  Not reached by me: thelancet.com and bmj.com (403) so the Lancet 2004 and 2010 notices and the BMJ
  2011 and 2010 pieces; pmc.ncbi.nlm.nih.gov blocks scripted fetches (Europe PMC used instead);
  supremecourt.gov (404), Justia (403) and the court's own decision PDFs (404). Not re-opened by me:
  NHS immunisation statistics, Eurosurveillance full text, the UKHSA table, eCFR 42 CFR 100.3, IOM
  2013, Henry Ford Health statement, Siri testimony, EO 14420, Annenberg, Reuters and Live Science,
  ACP injunction report, Mawson 2017, Mold 2018, Hooker 2014 and its retraction note, Chess 1977,
  Berger 2011, Sandin 2017, Bai 2019, Modabbernia 2017, Shattuck 2006, ADDM 2007, DSM-5 review,
  Verstraeten 2003, and the second group of test cases (King, Mead, Dwyer).

    target: va-aluminum-no-detectable-increase
    severity: non_blocking
    finding: 'The autism-only figure is not in the abstract; keep the press-release caveat. WHO''s aluminium review is about chronic and systemic disease, not autism.'
    author_response: {action: fixed, note: 'Caveat kept in the statement and anchor ("not in the abstract"); WHO moved to adoption_note with the note that its aluminium review is not autism-specific.', commit: 6446a36}
    resolved: false
  - id: N9
    target: va-destefano-race-subset; va-thompson-subgroup-real
    severity: non_blocking

- round: 2
  reviewed_on: 2026-10-02
  head: d43c49a
  source: docs/reviews/vaccines-autism-round-2.md
  requests:
  - id: F1
    target: short_answer.summary and summary_figures
    severity: blocking
    finding: '"31 studies and 5 meta-analyses, no causal relationship" reads as 31 of 31 null; WHO says 20 of 31 found none and 11 (nine from one US group) suggested an association, very low strength, high risk of bias; all 5 meta-analyses null. It is also adoption shown as a first-screen figure. The 1,266,327 total is a sum made here and is not labelled.'
    author_response: {action: fixed, note: 'WHO page downloaded and read in full (sha256 0012b1a3...). WHO removed from the first-screen summary, figures and assessment; the summary says agency statements are recorded separately as adoption. Where WHO is kept (the institutional thread, the CDC-page claim, adoption notes) it is stated as 20 of 31 null, 11 suggesting an association, all 5 meta-analyses null. Taylor 2014 given as 5 cohort studies (1,256,407) and 5 case-control studies (9,920), no total. The first-screen institution question stays an owner decision; this follows the reviewer''s recommendation in the meantime.', commit: 6446a36}
    resolved: true
    reviewer_note: "Read the WHO statement at the manifest URL (sha256 0012b1a3... matches): 31 primary studies (16 thiomersal, 15 broader); 20 of 31 and all five meta-analyses found no association; the other 11 (nine from one US group) suggested one, 'very low strength of evidence and a high risk of bias'. The first-screen summary, summary_figures and assessment carry no WHO figure; Taylor 2014 is given as 1,256,407 (5 cohort) and 9,920 (5 case-control) per the abstract, with no sum. The institution question on the first screen stays an owner decision. Nit: divergence_note says the WHO 'say[s] there is no link' without the 20-of-31 qualifier (R3-6)."
  - id: F2
    target: va-poling-concession what_it_is; short_answer compensation-concession item
    severity: blocking
    finding: '"Made under no-fault rules where causation can be presumed" is in no source read; "decision not to contest" understates CNN''s "concluded ... significantly aggravated".'
    author_response: {action: fixed, note: 'Both places now use CNN''s wording ("concluded" ... "significantly aggravated") and say the program is no-fault but that whether its presumption applied here was not checked. The No position no longer says "compensated under the injury table''s presumption".', commit: 6446a36}
    resolved: true
    reviewer_note: "Statement and the short answer use CNN's 'concluded' and 'significantly aggravated', and give NPR's 'possible ... may have exacerbated'. No presumption line remains in the concession claim."
  - id: F3
    target: short_answer mitochondrial scale

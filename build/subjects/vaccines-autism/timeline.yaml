events:
  # ---------------- Panel A ----------------
  - {id: a01, panel: years, lane: origin, time: "1998-02-28T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-wakefield-1998], flagged_sources: [src-wakefield-1998],
     label: "28 Feb 1998: Lancet publishes Wakefield et al. (12 children)",
     detail: "RETRACTED in 2010. Parents linked onset to MMR in 8 of 12 [abstract]."}
  - {id: a02, panel: years, lane: research, time: "1999-06-12T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-taylor-1999],
     label: "Jun 1999: Taylor et al. find no clustering of autism after MMR (498 cases)",
     detail: "Regression within 2 months: relative incidence 0.92 [abstract]."}
  - {id: a03, panel: years, lane: institutions, time: "1999-07-09T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-mmwr-1999],
     label: "9 Jul 1999: AAP and US Public Health Service ask for thimerosal to be removed as soon as possible",
     detail: "The statement says there were 'no data or evidence of any harm' at the exposure in use, and that some children could exceed a federal methylmercury guideline [read directly]."}
  - {id: a04, panel: years, lane: institutions, time: "2000-06-07T00:00:00Z", end: "2000-06-08T23:59:00Z", precision: range, kind: official, status: reported, sources: [src-simpsonwood-2000],
     label: "7-8 Jun 2000: Simpsonwood meeting reviews preliminary thimerosal data",
     detail: "Autism (transcript p. 44): 'a slight, but not significant, increase' at the highest exposure [read]."}
  - {id: a05, panel: years, lane: research, time: "2002-11-07T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-madsen-2002],
     label: "Nov 2002: Madsen et al., 537,303 Danish children, RR 0.92",
     detail: "No association with MMR [abstract]."}
  - {id: a06, panel: years, lane: research, time: "2004-02-01T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-destefano-2004],
     label: "Feb 2004: DeStefano et al. (CDC), age at MMR and autism",
     detail: "Whole-sample OR 1.49 for vaccination before 36 months, attributed to early-intervention requirements [abstract]."}
  - {id: a07, panel: years, lane: origin, time: "2004-03-06T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-murch-2004],
     label: "6 Mar 2004: 10 of the 13 authors retract the paper's interpretation",
     detail: "Wakefield, Linnell and Harvey are not among the signatories [author list read]."}
  - {id: a08, panel: years, lane: origin, time: "2003-04-01T00:00:00Z", end: "2004-03-31T23:59:00Z", precision: range, kind: data, status: reported, sources: [src-nhs-immunisation-2004-05],
     label: "2003-04: MMR coverage at age 2 in England bottoms out at 79.9%",
     detail: "Down from 91.8% in 1995-96 [read]."}
  - {id: a09, panel: years, lane: institutions, time: "2004-06-30T12:00:00Z", precision: year, kind: official, status: reported, sources: [src-iom-2004],
     label: "2004: IOM: the evidence favors rejecting a causal link (MMR and thimerosal)",
     detail: "Leaves a very small susceptible subset unexcluded, with no evidence for it [read]."}
  - {id: a10, panel: years, lane: media, time: "2005-06-15T12:00:00Z", precision: month, kind: media, status: reported, sources: [src-salon-2011],
     label: "Jun 2005: 'Deadly Immunity' published by Salon and Rolling Stone",
     detail: "Corrected five times; Salon removed it in Jan 2011 [read]."}
  - {id: a11, panel: years, lane: legal, time: "2007-11-15T12:00:00Z", precision: month, kind: official, status: reported, sources: [src-poling-cnn-2008],
     label: "Nov 2007: US government concedes a compensation claim",
     detail: "CNN: the program 'concluded' the vaccinations 'significantly aggravated' an underlying illness; NPR: 'possible' they 'may have exacerbated' a mitochondrial disorder. Both read; the decision itself was not."}
  - {id: a12, panel: years, lane: origin, time: "2008-06-20T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-eurosurv-2008],
     label: "20 Jun 2008: HPA reports measles endemic again in the UK",
     detail: "Attributed to almost a decade of low MMR coverage [read, as quoted by Eurosurveillance]."}
  - {id: a13, panel: years, lane: research, time: "2008-09-04T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-hornig-2008],
     label: "Sep 2008: Hornig et al. find no persistent measles RNA in the gut (4% vs 8%)",
     detail: "Three blinded labs, including the original one [read]."}
  - {id: a14, panel: years, lane: legal, time: "2009-02-12T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-oap-decisions, src-cafc-cedillo-2010, src-cafc-hazlehurst-2010],
     label: "12 Feb 2009: special masters deny the first three autism test cases (Cedillo, Hazlehurst, Snyder)",
     detail: "Denials confirmed in the Federal Circuit opinions 10-5004 and 09-5128 (footnote 1 of the first), which also say the Court of Federal Claims affirmed Hazlehurst and Snyder and that the Petitioners' Steering Committee proposed the test-case approach [opened]; the special masters' decisions themselves were not opened."}
  - {id: a15, panel: years, lane: origin, time: "2010-02-02T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-guardian-lancet-2010, src-lancet-retraction-2010],
     label: "2 Feb 2010: The Lancet retracts the 1998 paper",
     detail: "Announced days after the GMC's findings of fact of 28 Jan 2010; the editor called the paper's statements 'utterly false' [Guardian, read]. The notice itself (6 Feb 2010 issue) was not read."}
  - {id: a16, panel: years, lane: legal, time: "2010-03-12T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-oap-decisions],
     label: "12 Mar 2010: special masters' decisions in three further test cases (King, Mead, Dwyer)",
     detail: "Listed in the court's decision list with this date; the decisions were not opened and their outcome is not stated here."}
  - {id: a17, panel: years, lane: origin, time: "2010-05-24T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-bmj-gmc-2010, src-walker-smith-2012],
     label: "24 May 2010: GMC strikes off Wakefield and Walker-Smith",
     detail: "Murch not guilty of serious professional misconduct [judgment para 1; BMJ]."}
  - {id: a18, panel: years, lane: legal, time: "2010-08-27T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-oap-decisions, src-cafc-cedillo-2010],
     label: "27 Aug 2010: Federal Circuit affirms Cedillo",
     detail: "Hazlehurst had been affirmed on 13 May 2010; Snyder was not appealed (Federal Circuit 10-5004, footnote 1) [opened]."}
  - {id: a19, panel: years, lane: media, time: "2011-01-05T12:00:00Z", precision: day, kind: media, status: reported, sources: [src-deer-2011, src-godlee-2011],
     label: "5 Jan 2011: BMJ publishes Deer's records comparison; its editors call the paper fraudulent",
     detail: "Deer: 3 of 9 'regressive autism' children had no autism diagnosis in the records [read via fetch tool]. The fraud judgment is the editorial's (Godlee et al.)."}
  - {id: a20, panel: years, lane: legal, time: "2011-02-22T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-bruesewitz],
     label: "22 Feb 2011: Bruesewitz v. Wyeth: design-defect suits preempted; no autism finding",
     detail: "Autism appears only in the dissent's footnote 25 [read]."}
  - {id: a21, panel: years, lane: origin, time: "2012-03-07T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-walker-smith-2012],
     label: "7 Mar 2012: High Court quashes Walker-Smith's striking-off",
     detail: "The judge found the panel's reasoning inadequate and its determination on Walker-Smith could not stand (paras 186-187) [read]."}
  - {id: a22, panel: years, lane: legal, time: "2012-08-22T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-geier-md-2015-licence, src-geier-md-2015, src-geier-md-2019],
     label: "22 Aug 2012: Maryland revokes Mark Geier's licence",
     detail: "The Board found he gave Lupron to autistic children outside its approved use without adequate examination, and used consent forms it called misleading and in one case blatantly false (223 Md. App. 404, quoting the Board's order) [read]."}
  - {id: a23, panel: years, lane: media, time: "2014-08-27T12:00:00Z", precision: day, kind: witness, status: single, sources: [src-thompson-2014, src-cdc-2004-study-statement],
     label: "27 Aug 2014: CDC co-author William Thompson says a subgroup result was omitted from DeStefano 2004",
     detail: "Read in a third-party copy; the CDC's response addresses the same point [read]."}
  - {id: a24, panel: years, lane: research, time: "2014-10-03T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-hooker-2014-retraction],
     label: "3 Oct 2014: Hooker's reanalysis of the CDC data retracted",
     detail: "Undeclared competing interests; concerns about methods and statistics [read]."}
  - {id: a25, panel: years, lane: research, time: "2015-04-21T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-jain-2015],
     label: "Apr 2015: Jain et al.: no increase in children with an affected older sibling",
     detail: "95,727 children [abstract]."}
  - {id: a26, panel: years, lane: research, time: "2017-04-24T12:00:00Z", precision: day, kind: analysis, status: reported, sources: [src-mawson-2017],
     label: "24 Apr 2017: Mawson et al. survey reports OR 4.2 for autism",
     detail: "Self-selected online survey; 3 unvaccinated cases [read]."}
  - {id: a27, panel: years, lane: research, time: "2019-03-05T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-hviid-2019],
     label: "Mar 2019: Hviid et al., 657,461 Danish children, HR 0.93",
     detail: "No increase in subgroups; no clustering after vaccination [abstract]."}
  # ---------------- Panel B ----------------
  - {id: b01, panel: recent, lane: research, time: "2025-07-15T12:00:00Z", precision: month, kind: analysis, status: reported, sources: [src-andersson-2025],
     label: "Jul 2025: Danish aluminum cohort (1,224,176 children): no increase",
     detail: "Autism HR 0.93 per mg [press release]."}
  - {id: b02, panel: recent, lane: institutions, time: "2025-08-01T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-livescience-2025],
     label: "1 Aug 2025: HHS Secretary calls for the aluminum paper's retraction",
     detail: "Reported by Reuters and Live Science."}
  - {id: b02b, panel: recent, lane: research, time: "2025-08-11T12:00:00Z", precision: day, kind: media, status: reported, sources: [src-livescience-2025],
     label: "11 Aug 2025: the journal's editor says she sees no reason for retraction",
     detail: "Reported by Reuters (11 Aug) and Live Science (13 Aug)."}
  - {id: b03, panel: recent, lane: institutions, time: "2025-09-09T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-henry-ford-draft],
     label: "9 Sep 2025: unpublished Henry Ford draft entered into a Senate hearing record",
     detail: "Its autism result: adjusted HR 0.62 (0.10 to 3.69), 23 vs 1 cases [read]."}
  - {id: b04, panel: recent, lane: media, time: "2025-09-26T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-henry-ford-statement],
     label: "26 Sep 2025: Henry Ford Health says the draft was shelved for data and methods problems",
     detail: "[read via fetch tool]"}
  - {id: b05, panel: recent, lane: institutions, time: "2025-11-20T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-stat-cdc-page-2025],
     label: "19-20 Nov 2025: CDC page changed: 'vaccines do not cause autism' called not evidence-based",
     detail: "Kennedy said he ordered the change (STAT, 21 Nov 2025)."}
  - {id: b06, panel: recent, lane: institutions, time: "2025-12-11T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-who-gacvs-2025],
     label: "11 Dec 2025: WHO safety committee: no evidence of a causal relationship",
     detail: "20 of 31 primary studies and all 5 meta-analyses null; 11 studies (9 from one US group) suggested an association, rated very low strength and high risk of bias [page read]. Adoption, not evidence."}
  - {id: b07, panel: recent, lane: legal, time: "2026-03-16T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-acp-injunction-2026],
     label: "16 Mar 2026: federal court stays the new schedule and the new ACIP's votes (AAP v. Kennedy)",
     detail: "On appeal to the First Circuit; the order was not read."}
  - {id: b08, panel: recent, lane: research, time: "2026-05-18T12:00:00Z", precision: day, kind: document, status: reported, sources: [src-hooker-miller-2020-eoc],
     label: "18 May 2026: expression of concern on Hooker & Miller 2020",
     detail: "The article is under investigation [read]."}
  - {id: b09, panel: recent, lane: institutions, time: "2026-07-22T12:00:00Z", precision: day, kind: official, status: reported, sources: [src-cdc-autism-page],

timeline:
  id: vaccines-autism
  title: "Vaccines and autism: the claim, the tests and the institutions (1998 to 2026)"
  as_of: "2026-10-02"
  note: >
    Times are UTC; every event here is known to the day, month or year only, so dots are
    hollow or drawn as bars. Publication dates are issue or online dates as given in the
    cited record. Events marked "single" or "reported" rest on one source or on reporting
    rather than a document read for this dig. Panel B enlarges 2025-2026, when the US
    institutional position changed.
panels:
  - id: years
    title: "Panel A: 1998 to 2020 (one tick per two years)"
    start: "1998-01-01T00:00:00Z"
    end:   "2020-12-31T00:00:00Z"
    tick_years: 2
    lanes: [origin, research, legal, institutions, media]
  - id: recent
    title: "Panel B: June 2025 to October 2026 (one tick per two months)"
    start: "2025-06-01T00:00:00Z"
    end:   "2026-10-15T00:00:00Z"
    tick_hours: 1464
    lanes: [research, legal, institutions, media]
lanes:
  origin:       {label: "The 1998 paper and the UK"}
  research:     {label: "Studies"}
  legal:        {label: "Courts and compensation"}
  institutions: {label: "Health agencies"}
  media:        {label: "Media and statements"}
people:
  - {who: "Andrew Wakefield", detail: "Lead author of the 1998 paper; struck off the UK register in May 2010 (BMJ c2803); abandoned his appeal ([2012] EWHC 503 para 1)."}
  - {who: "John Walker-Smith", detail: "Senior co-author; struck off in 2010; the High Court quashed that decision on 7 Mar 2012."}
  - {who: "Brian Deer", detail: "Journalist whose comparison of the paper with hospital records was published by the BMJ in Jan 2011."}
  - {who: "William W. Thompson", detail: "CDC scientist and co-author of DeStefano 2004; issued a statement through his lawyers on 27 Aug 2014."}
  - {who: "A child (the 2007 compensation case)", detail: "Not named here: a minor at the time and the injured party (owner rule, log L-19). Child whose compensation case the US government conceded in Nov 2007 (as reported)."}
  - {who: "Robert F. Kennedy Jr.", detail: "Author of 'Deadly Immunity' (2005); US Secretary of Health and Human Services from 2025; said he ordered the Nov 2025 CDC page change (STAT)."}
  - {who: "Mark Geier", detail: "Co-author of papers reporting an association; Maryland licence revoked 22 Aug 2012 (court record)."}

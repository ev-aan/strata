  - id: va-signs-emerge-in-schedule-window
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In one prospective study of 25 infants later diagnosed with autism (mostly younger
      siblings of children with autism), social behaviours were comparable with other infants
      at 6 months and declined between about 6 and 18 months, the same period in which many
      vaccines are given. In the same study, parents reported clear signs before the first
      birthday in 11 children, and a loss of skills in only 4.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5; one small prospective study
    anchor_checked: primary   # Ozonoff 2010 author manuscript read in full
    adoption_weight: 2   # of 5
    adoption_note: "Not measured."
    would_change_if: "larger prospective studies find signs reliably present from birth or at 6 months"
    anchor:
      type: prospective-infant-cohort
      description: >
        Ozonoff et al. 2010: 25 infants later diagnosed with autism and 25 typically
        developing infants, assessed at 6, 12, 18, 24 and 36 months. Gaze to faces, social
        smiles and vocalizations were highly comparable at 6 months and declined afterwards
        in most of the autism group (19 of 22). By parent report, 11 showed clear signs before
        the first birthday and no regression, and 4 lost skills [read].
      accessible: true
      sources: [src-ozonoff-2010]
    basis: >
      The study did not look at vaccines. It explains why parents so often see onset after a
      vaccination: the two happen in the same months. It does not by itself test cause.


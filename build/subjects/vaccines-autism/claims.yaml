# ---------------------------------------------------------------------------
# SEARCH HEADLINE: rules as in gulf-of-tonkin/claims.yaml (1-7).
# It may only state a claim that is established or refuted at HIGH confidence with
# anchor_checked: primary. The headline claim (va-mmr-no-detectable-increase) is
# anchored only to abstracts so far (secondary), so the headline stays DRAFT until
# the full texts of Madsen 2002 and Hviid 2019 are read (see log L-06).
# ---------------------------------------------------------------------------
headline: "Do Vaccines Cause Autism? No, Large Studies Find; Two Narrow Exceptions Explained"
headline_claim: va-mmr-no-detectable-increase
headline_status: draft          # draft until the headline claim reaches anchor_checked: primary
search_summary: >
  Do vaccines cause autism? No: studies of millions of children find no link. One narrow legal case and one open question about mitochondrial disease are shown.
url_slug: do-vaccines-cause-autism

# ---------------------------------------------------------------------------
# ASSESSMENT (SCHEMA N23): the "Where it stands" box the site shows first.
# Drawn from short_answer below; no percentages (N23).
# ---------------------------------------------------------------------------
assessment:
  question: "Do vaccines cause autism?"
  answer: "no"
  headline: "No. Large studies of children's records find no link (high confidence); a 2007 legal concession and an untested question about mitochondrial disease are explained below."
  text: >
    Two nationwide Danish cohorts following 1,194,764 children found no more autism after MMR,
    and studies in the UK (1,294 cases) and the US (95,727 children with older siblings) agree.
    Children exposed to more thimerosal or aluminum were not diagnosed with autism more often.
    The 1998 paper that started the scare was retracted in 2010; a court later found its
    ethics statement untrue, and a 2011 BMJ investigation reported that its account of the
    children did not match their records. In 2007 the US government conceded one family's
    compensation claim for a child with a pre-existing mitochondrial disorder; that was a legal
    decision, not a scientific finding. Whether fever after vaccination can trigger regression
    in children with mitochondrial disease has not been tested in a controlled study. Two
    limits: no study can show an effect is exactly zero, and no large record-based study has yet
    compared fully unvaccinated children with vaccinated ones. Studies of records are statistics:
    they cannot prove a claim false, but they can show that no evidence supports it, so the
    general claim "vaccines cause autism" is filed as unsupported, not as refuted. The reverse link is established:
    rubella in pregnancy can cause autism, and the vaccine prevents it. What health bodies say
    is shown separately because it is adoption, not evidence: the US Institute of Medicine
    (2004) said the evidence "favors rejection of a causal relationship" for MMR and for
    thimerosal-containing vaccines, and the WHO's vaccine safety committee (December 2025)
    found no evidence of a causal link; since
    November 2025 the CDC's page has said the "no link" statement is not evidence-based, a
    change the US Health Secretary said he ordered (va-cdc-page-2025).
  key_points:
    - "Two Danish cohorts (1,194,764 children) and studies in the UK and US found no more autism in children who got MMR."
    - "Health bodies (adoption, not evidence): WHO's safety committee found no evidence of a causal link (2025); since Nov 2025 the CDC's page disputes the 'no link' statement."
    - "The 1998 paper behind the scare was retracted. Open: a 2007 legal concession (not science) and an untested question on fever in mitochondrial disease."
  basis: [va-mmr-no-detectable-increase, va-thimerosal-no-detectable-increase, va-aluminum-no-detectable-increase, va-wakefield-paper-account-accurate, va-poling-concession, va-mito-fever-regression, va-small-effect-not-excludable]
  # Key point 2 states institutional positions on the first screen by owner decision 2026-10-02 (log L-19). They are adoption, not basis.
  rated_claim: va-mmr-no-detectable-increase
  would_settle: >
    A large record-based study finding clearly more autism after vaccination; a controlled study of
    fever-related regression in mitochondrial disease; or a national register comparison of fully
    unvaccinated children showing an excess.

# ---------------------------------------------------------------------------
# SHORT ANSWER (owner decision 2026-10-02, log L-02): every dig answers the question
# with "No" or "Yes" AND names the exceptions where they exist. Each line points to the
# claim that carries its weight. The answer is only as strong as those claims.
# ---------------------------------------------------------------------------
short_answer:
  question: "Do vaccines cause autism?"
  answer: "No, to the best of our knowledge."
  # The summary below is the first thing a reader sees. Every figure is tied to a source
  # and a verification level; nothing is added up across studies that may share children.
  summary: >
    Across studies following more than a million children's records, vaccines have not been
    found to cause autism. Two nationwide Danish cohorts following 1,194,764 children found no
    more autism after MMR; studies in the UK and the US agree; and a 2014 analysis pooling 5
    cohort studies (1,256,407 children) and 5 case-control studies (9,920 children) found no
    association. These figures are studies; what health agencies say is recorded separately, as
    adoption.
  summary_figures:
    - figure: "1,194,764 children, no increase after MMR"
      detail: >
        Madsen 2002 (537,303 children born in Denmark 1991-1998; RR 0.92) and Hviid 2019
        (657,461 born 1999-2010; HR 0.93, 95% CI 0.85 to 1.02). The two birth cohorts do not
        overlap. Both come from the same national register and research group.
      source: [src-madsen-2002, src-hviid-2019]
      checked: abstract
    - figure: "UK and US studies, no increase after MMR"
      detail: >
        UK: Smeeth 2004, 1,294 cases and 4,469 controls, OR 0.86 (0.68 to 1.09); Taylor 1999,
        498 cases, no clustering after MMR. US: Jain 2015, 95,727 children with older
        siblings, no increase including among 1,929 whose older sibling had autism.
      source: [src-smeeth-2004, src-taylor-1999, src-jain-2015]
      checked: abstract
    - figure: "5 cohort studies (1,256,407 children) and 5 case-control studies (9,920 children), no association"
      detail: >
        Taylor, Swerdfeger & Eslick 2014. The two groups are given separately, as in the
        abstract; their cohort children are largely Danish.
      source: src-taylor-2014
      checked: abstract
    - figure: "Not summed"
      detail: >
        These counts are not added together. Many of the same Danish children appear in more
        than one study (the thimerosal cohort, born 1990-1996, and the aluminum cohort, born
        1997-2018, overlap the MMR cohorts' birth years), and the meta-analysis includes
        Danish data, so a combined total would count the same children more than once.
  basis: >
    For MMR, studies following more than a million children find no more autism among
    vaccinated than unvaccinated children (va-mmr-no-detectable-increase). For thimerosal
    and aluminum, children with more exposure were not diagnosed with autism more often
    (va-thimerosal-no-detectable-increase, va-aluminum-no-detectable-increase). The paper
    that started the scare was retracted; a court found its ethics statement untrue
    (va-wakefield-paper-account-accurate), and a BMJ investigation reported that its account
    of the children did not match their records (va-wakefield-records-mismatch). No large record-based study has yet compared
    fully unvaccinated children with vaccinated ones (va-fully-unvaccinated-gap).
  except:
    - claim: va-poling-concession
      text: >
        What remains open, 1: a legal concession. In 2007 the US government conceded, in one
        child's compensation case, a link between vaccines and her injury (CNN: the program
        "concluded" they "significantly aggravated" an underlying illness, a mitochondrial
        disorder, that had predisposed her to symptoms of autism). This was a compensation
        decision, not a scientific finding that vaccines cause autism.
      scale: >
        The best-known concession, not a count: other compensated cases with autism-like
        features were not checked. Her case had been designated a potential test case before
        the concession. The Federal Circuit describes the proceeding as addressing approximately
        5,000 autism claims; the first three test cases were denied and the denials upheld on
        review (Federal Circuit opinions opened), and three more decided in March 2010 were not
        opened.
      scale_sources: [src-poling-cnn-2008, src-bruesewitz, src-oap-decisions, src-cafc-cedillo-2010, src-cafc-hazlehurst-2010]
      what_it_is:
        - "A concession by the US government in one family's compensation claim: the program concluded her underlying illness was 'significantly aggravated' by vaccines (as reported by CNN)."
        - >
          Made inside a no-fault program built to pay faster and more easily than a court
          case (see va-compensation-program); whether its presumption for listed injuries
          applied in her case was not checked.
        - "A statement about one child, who had a pre-existing mitochondrial disorder."
      what_it_is_not:
        - "Not a scientific study, and not a test of whether vaccines cause autism."
        - "Not a finding about any other child, or about children without mitochondrial disease."
        - >
          Not an admission that vaccines cause autism: the CDC director said so at the time,
          and autism is not on the government's list of compensable vaccine injuries.
        - "Not a court ruling after a trial of the evidence: the government conceded before one."
    - claim: va-mito-fever-regression
      text: >
        What remains open, 2: an untested question. In children with mitochondrial disease (about 5 in 100 children
        with autism), small case series report regression after fever, including a few
        after a fever that followed a routine vaccination. No controlled study has tested this.
      scale: >
        Mitochondrial disease affects about 1 in 10,000 people overall. Reports of regression
        after a post-vaccination fever found so far: at least 5 children in two reports (4 in one
        series of 28, and one case report), as collected in one review; this is not a systematic
        count. No rate per vaccination can be calculated from evidence this small.
      scale_sources: [src-rossignol-frye-2012, src-shoffner-2010, src-poling-2006]
    - claim: va-small-effect-not-excludable
      text: >
        A limit, not an exception. No study can prove an effect is exactly zero. The largest
        MMR study rules out anything but a very small average increase; smaller studies have
        wider margins; and population data cannot by themselves rule out a very rare
        susceptible group.
      scale: >
        In the largest study, any average effect of MMR would be at most about 2 or 3 extra
        autism diagnoses per 100,000 children per year, against about 130 per 100,000 per year
        from all causes. This is Strata's own arithmetic from the study's figures (an upper
        bound of 2% applied to its overall rate of 129.7 per 100,000 person-years), not a figure
        the study reports, and it is a ceiling, not an estimate: the study's best estimate is no
        increase.
      scale_sources: [src-hviid-2019]
  also_true:
    - claim: va-rubella-causes-autism-vaccine-prevents
      text: >
        The reverse is established. Rubella infection in pregnancy can cause autism in the
        child, and the rubella vaccine (the R in MMR) prevents it.
      scale: >
        About 7 in 100 children with congenital rubella had autism in the classic follow-up of
        243 children. One US model estimates rubella vaccination prevented about 1,228 autism
        cases from 2001 to 2010 (range 830 to 6,225).
      scale_sources: [src-chess-1978, src-berger-2011]

# ---------------------------------------------------------------------------
# SOURCE NOTICES (rule PS4): shown first on the page, above every other section.
# ---------------------------------------------------------------------------
source_notices:
  - source: src-wakefield-1998
    notice: >
      RETRACTED. The 1998 Lancet paper by Wakefield et al. that started the MMR-autism scare
      was fully retracted by The Lancet in February 2010. It is not a valid study and is cited
      here only as the origin of the claim.
  - source: src-hooker-2014
    notice: >
      RETRACTED. Hooker's 2014 reanalysis of CDC data on MMR and African-American boys was
      retracted by its journal in October 2014. It is cited here only to record the claim it made.
  - source: src-henry-ford-draft
    notice: >
      UNPUBLISHED. The Henry Ford Health vaccinated-versus-unvaccinated study is a draft that was
      never peer reviewed or published. It is read here only to check what it says about autism.

subject: vaccines-autism
title: "Do Vaccines Cause Autism? (1998 to the present)"
description: >
  The question is resolvable at the population level and partly standing at the level of
  rare individual cases. This dig keeps four things apart: (1) what the population
  studies measured, which is statistical evidence and filed as `synthetic`; (2) what the
  primary documents show about the 1998 paper, the court cases and the insider claims;
  (3) the narrow items that remain open (one legal concession, one untested hypothesis, and
  the limits of what population data can show), filed so they cannot be smoothed away; and
  (4) the institutional record, which in 2025-2026 split for the first time, filed as
  adoption, never as evidence, in both directions.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS used below (see log L-04):
#   anchor_checked: primary    the full document was fetched and read directly (shell copy, sha256 in sources/MANIFEST.yaml)
#   anchor_checked: secondary  read only as an abstract, through a summarizing fetch tool, or as quoted by others
#   anchor_checked: no         not read
# Evidential weight is capped at 4 unless anchor_checked is primary (SCHEMA rule 11, proposed).
# Population statistics are filed as `synthetic` (CONTRIBUTING: statistics and computed results).
# ---------------------------------------------------------------------------

divergence_note: >
  For twenty years evidence and institutional adoption pointed the same way, and public
  belief lagged behind both: in August 2026, asked whether vaccines for diseases like
  measles, mumps and rubella cause autism, 13% of US adults said true, 68% false and 19%
  were unsure (Annenberg). Since November 2025 the gap has a new
  shape. The US health department's own CDC page now calls "vaccines do not cause autism"
  not an evidence-based claim, while the WHO's safety committee (20 of 31 primary
  studies found no association; the other 11 suggested one, with very low strength of
  evidence), the AAP and the
  studies themselves find no evidence of a link. Nothing in the evidence changed between those two dates; what changed was
  adoption by an institution. Strata records both statements, and gives neither of them
  evidential weight. The real open edges are narrow: a very rare susceptible group cannot
  be excluded by population data, fever-related regression in mitochondrial disease is
  untested, the whole schedule has never been studied as one exposure, and in the one
  national analysis of the rise, part of it (about 40%, somewhere between 13% and 67%) is
  not explained by the two reporting changes it measured.

claims:

  # =====================================================================
  # A. THE CORE QUESTION
  # =====================================================================

  - id: va-mmr-no-detectable-increase
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In population studies covering more than a million children, children who received
      MMR were diagnosed with autism no more often than children who did not. The largest
      single study (657,461 Danish children, 6,517 autism diagnoses) found a fully adjusted
      hazard ratio of 0.93 (95% CI 0.85 to 1.02).
    evidence_class: synthetic
    confidence: high
    evidential_weight: 4   # of 5; capped at 4 while anchor_checked is secondary
    anchor_checked: secondary   # abstracts read for Madsen 2002, Hviid 2019, Smeeth 2004, Jain 2015, Taylor 1999, Taylor 2014, Cochrane 2021
    adoption_weight: 4   # of 5, shown separately; never combined with evidential_weight
    adoption_note: >
      Annenberg ASAPH, fielded 4-17 Aug 2026 (n=1,904): asked whether vaccines for diseases
      like measles, mumps and rubella cause autism, 68% of US adults said false, 13% true,
      19% unsure. Institutions: the IOM (2004) said the evidence "favors rejection of a causal
      relationship"; the WHO's safety committee (Dec 2025) found no evidence of a causal
      relationship; the CDC's own page has disputed the "no link" statement since Nov 2025 (see
      va-cdc-page-2025). Adoption is information, not evidence.
    would_change_if: >
      a register-based cohort of comparable size finds a hazard ratio clearly above 1 with
      a confidence interval that excludes 1; or a full-text reading of Madsen 2002 or Hviid
      2019 shows their abstracts misstate the results; or an independent re-analysis of the
      Danish registers fails to reproduce them
    anchor:
      type: multi-cohort-convergence
      description: >
        Denmark 1991-1998: 537,303 children, adjusted RR for autistic disorder 0.92 (0.68 to
        1.24) [abstract]. Denmark 1999-2010: 657,461 children, HR 0.93 (0.85 to 1.02); "no
        increased risk" was "consistently observed" in subgroups with a sibling with autism or
        other risk factors, and no clustering after vaccination [abstract]. UK GPRD case-control: 1,294 cases, 4,469
        controls, OR 0.86 (0.68 to 1.09) [abstract]. US children with older siblings (95,727,
        of whom 1,929 had an older sibling with autism): no increase at age 2 or 5 in either
        group [abstract; the JAMA 2016 erratum, "Incorrect Variable Description", could not be
        read, so the abstract figures are not checked against it]. Meta-analysis (cohort data on 1,256,407 children): MMR OR 0.84
        (0.70 to 1.01) [abstract]. Cochrane 2021: rate
        ratio 0.93 (0.85 to 1.01), 2 studies, 1,194,764 children, moderate certainty
        [abstract].
      accessible: true
      sources: [src-madsen-2002, src-hviid-2019, src-smeeth-2004, src-jain-2015, src-taylor-2014, src-cochrane-2021, src-taylor-1999, src-destefano-2004]
    positions:
      - label: "No"
        holder: "The register and claims-database studies above; IOM 2004; Cochrane 2021; WHO GACVS 2025"
        ground: >
          Every large study with recorded vaccination and recorded diagnosis finds an
          estimate at or below 1. The largest has an upper bound of 1.02.
      - label: "Yes (what exists)"
        holder: "Signals cited for a link"
        ground: >
          Taylor 1999 found one significant clustering: parents' first concern within one
          6-month interval after MMR; the authors judged it an artifact of dating symptom
          onset. DeStefano 2004 found more cases than controls vaccinated before 36 months
          (OR 1.49, 1.04 to 2.14), which the authors attributed to vaccination being required
          for early-intervention programs. Hooker 2014 reported RR 3.36 in one subgroup; the
          paper was retracted (see va-thompson-subgroup-real). None of these is a population
          estimate above 1 that has survived.
    basis: >
      Two cautions travel with this claim. (1) Several estimates fall below 1 (Smeeth 0.86;
      meta-analysis case-control pools 0.85 to 0.90, p<0.05). Nobody claims MMR prevents
      autism; estimates below 1 show bias in the designs (for example families delaying
      vaccination after early signs), and that bias runs in both directions. The
      meta-analysis case-control pools (0.85 to 0.90) combine MMR, thimerosal and mercury
      exposures and are not MMR estimates. (2) Cochrane's 2-study estimate (0.93, 0.85 to
      1.01, 1,194,764 children) matches the sum of the two Danish cohorts above (657,461 +
      537,303 = 1,194,764; our arithmetic, the abstract does not name the studies). It is not
      an independent line of evidence. (3) Independence: the large Danish studies come from
      one national register and one research group, and the meta-analysis's cohort children
      are largely Danish. The independent populations are the UK (Taylor 1999; Smeeth 2004)
      and the US (Jain 2015; DeStefano 2004), and they agree. TO REACH PRIMARY: read the full texts of Hviid 2019 (Ann Intern Med) and Madsen
      2002 (NEJM); both publishers refused this environment.

  - id: va-mmr-causes-autism
    state: proposed
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      The MMR vaccine causes autism.
    evidence_class: interpretive
    confidence: provisional
    evidential_weight: 1   # of 5
    anchor_checked: secondary
    adoption_weight: 2   # of 5
    adoption_note: >
      13% of US adults say vaccines for diseases like MMR cause autism (Annenberg, Aug 2026). Promoted by the current US
      Health Secretary; the President linked schedule changes to "a massive reduction in
      autism" on 18 Sep 2026 (secondary: Forbes).
    would_change_if: >
      a large cohort with recorded vaccination and diagnosis finds a clear excess after MMR,
      or a mechanism is shown in controlled human or experimental data
    retired_by: dt-mmr-cohorts
    anchor:
      type: case-series-and-surveys
      description: >
        Rests on the 1998 case series of 12 children, in which parents (or, in the full
        text, parents or physicians) linked onset to MMR in 8, and on later parent surveys.
        See va-wakefield-paper-account-accurate and va-vax-unvax-surveys.
      accessible: true
      sources: [src-wakefield-1998, src-mawson-2017, src-hooker-miller-2021]
    flagged_sources: [src-wakefield-1998]   # retracted; shown beside this claim (rule PS3)
    positions:
      - label: "Yes"
        holder: "Wakefield et al. 1998; parent surveys; the current HHS leadership"
        ground: >
          Parents saw onset soon after MMR; some surveys report higher autism among
          vaccinated children.
      - label: "No"
        holder: "Population cohorts; IOM 2004; WHO GACVS 2025"
        ground: "See va-mmr-no-detectable-increase and the discriminating tests."
    basis: >
      Filed as `proposed` rather than `refuted`. Rule 9 lets a refutation rest only on
      material or primary-text evidence, and the population studies that retire this claim
      are statistics, which CONTRIBUTING.md classes as `synthetic`. This is an open design
      question for the method (log L-05), not a sign that the claim is live: it is retired
      by dt-mmr-cohorts at evidential weight 1.

  # =====================================================================
  # B. THE ORIGIN: THE 1998 LANCET PAPER
  # =====================================================================

  - id: va-wakefield-paper-account-accurate
    state: refuted
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    refutes_target: >
      Wakefield AJ et al., Lancet 1998;351:637-41: the paper's statement that its
      investigations were approved by the Royal Free ethics committee
    statement: >
      The 1998 Lancet paper's statement that its investigations had ethics approval was true.
      (Narrowed on 2026-10-02, log L-16: this claim first bundled ethics approval, referral and
      onset. Referral is now va-wakefield-referral-description; diagnosis and onset are
      va-wakefield-records-mismatch.)
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5, for the refutation
    anchor_checked: primary   # Walker-Smith v GMC [2012] EWHC 503 (Admin) read in full
    adoption_weight: 1   # of 5
    adoption_note: "Not measured. The paper was retracted in 2010; few now defend it."
    would_change_if: >
      the Royal Free ethics committee records show the investigations were approved as the
      paper stated
    anchor:
      type: court-record
      description: >
        Walker-Smith v GMC [2012] EWHC 503 (Admin), para 153: the paper's ethics statement
        "was untrue and should not have been included in the paper" [read]. The same judgment
        quashed the GMC's findings against Walker-Smith on other grounds (paras 186-187) and
        did not disturb this one. The paper itself (abstract) and the GMC findings (not
        reachable) were not read.
      accessible: true
      sources: [src-walker-smith-2012]
    positions:
      - label: "Yes (true)"
        holder: "The Lancet's 2004 statement, as described in a 2011 review"
        ground: >
          In 2004 the Lancet cleared the authors of ethical violations (as described in Indian
          J Psychiatry 2011 [read]; the 2004 statement itself was not read).
      - label: "No (untrue)"
        holder: "The High Court (2012)"
        ground: "The ethics statement was untrue (para 153) [read]."
    basis: >
      Held at weight 5 because the narrowed statement rests on one primary document read in
      full. refutation_class is not set (log L-07). The earlier, wider statement overstated
      what para 153 supports (review round 1, B1).

  - id: va-wakefield-records-mismatch
    state: proposed
    statement: >
      The 1998 paper's account of its 12 children's diagnoses and of when their symptoms began
      did not match their hospital records: of 9 described as having regressive autism, 3 had
      no autism diagnosis, and 5 of the 12 described as previously normal had documented
      earlier developmental concerns.
    statement_kind: reported
    evidence_class: interpretive
    confidence: provisional
    evidential_weight: 3   # of 5; one investigator's comparison with records, read only as a summary
    anchor_checked: secondary   # BMJ summary box and editorial read through a fetch tool; the records were not seen
    adoption_weight: 4   # of 5
    adoption_note: >
      Not measured. Widely reported since 2011; the BMJ's editors endorsed it and called the
      paper fraudulent [read via fetch tool]. Endorsement is adoption, not evidence.
    would_change_if: >
      the children's records, or a second independent comparison of them, show the published
      account was accurate
    anchor:
      type: investigative-records-comparison
      description: >
        Deer, BMJ 2011;342:c5347, summary box: "Three of nine children reported with
        regressive autism did not have autism diagnosed at all"; five of the 12 described as
        previously normal "had documented pre-existing developmental concerns"; some onsets
        reported as within days of MMR were recorded as months later [read via fetch tool].
        Godlee et al., BMJ 2011;342:c7452: none of the 12 cases was free of misrepresentation
        or undisclosed alteration [read via fetch tool].
      accessible: true
      sources: [src-deer-2011, src-godlee-2011]
    positions:
      - label: "Accurate"
        holder: "Wakefield (his statements were not read for this dig)"
        ground: "He has disputed the BMJ's findings; his response was not read here."
      - label: "Not accurate"
        holder: "Deer; the BMJ editors"
        ground: "The records comparison above."
    basis: >
      Split from va-wakefield-paper-account-accurate (review round 1, B1). Filed as proposed:
      it is one investigator's comparison, endorsed by a journal, whose underlying records are
      confidential and were not seen. TO STRENGTHEN: read the full BMJ articles and the GMC
      findings of fact, which examined the same records.

  - id: va-wakefield-referral-description
    state: contested
    statement: >
      The 1998 paper's description of its children as "consecutively referred" was misleading.
    statement_kind: judgment
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3   # of 5; raised from 2 in round 3: the panel's charge wording is quoted in the judgment read in full
    anchor_checked: primary   # the High Court judgment read in full, including the panel's charges 31-32 as quoted at para 156; the Lancet notice and the panel's own findings only as reported
    adoption_weight: 2   # of 5
    adoption_note: "Not measured."
    would_change_if: "the GMC findings of fact or the Lancet's 2010 notice are read and change the picture"
    disputed_by:
      - {who: "Mr Justice Mitting, High Court of England and Wales", kind: person, position: "'Consecutively referred' meant only that the children were referred successively; the panel's contrary reading was rejected for Walker-Smith.", source_read: true, via: src-walker-smith-2012}
      - {who: "The Lancet editors (2010 retraction, as quoted)", kind: institution, position: "The 'consecutively referred' statement was incorrect.", source_read: false, via: src-lancet-retraction-2010}
    anchor:
      type: live-dispute
      description: >
        [2012] EWHC 503 (Admin), para 156 (quoting the panel's charges 31-32 against
        Walker-Smith): the panel found that "consecutively referred" implied a routine referral,
        that the referrals of four children (1, 5, 9, 10) were not routine, and that the
        description was "irresponsible" and "misleading" [read]. Para 157: the phrase "means no
        more than that the children were referred successively, rather than as a single batch ...
        The words did not imply routine referral", and the paper "made it clear that this was not
        a routine referral. It was a referral generated by the concerns of parents about a
        possible link" [read]. Para 158: that four referral letters did not mention intestinal
        symptoms was "factually accurate ... but of no significance", because Walker-Smith
        elicited gastrointestinal symptoms at clinic [read]. The 2010 Lancet notice is reported
        to name the statement as incorrect [secondary: BMJ c696, not re-read; the notice was not
        read]. The panel's own findings were not reachable.
      accessible: true
      sources: [src-walker-smith-2012, src-lancet-retraction-2010]
    positions:
      - label: "Misleading"
        holder: "The GMC panel (2010); The Lancet's 2010 notice (as quoted)"
        ground: >
          A general reader would take "consecutively referred" to mean routine referral with no
          active part played by the investigators (the panel's reading, quoted at para 156).
      - label: "Not shown to be misleading"
        holder: "The High Court (2012), for Walker-Smith"
        ground: "The words meant only 'referred successively' (para 157), and the paper itself made clear the referral came from parents' concerns."
    basis: >
      Split from va-wakefield-paper-account-accurate (review round 1, B1). Genuinely contested
      on the documents read. Both sides agree the children were not routine referrals; the
      dispute is about what the printed words conveyed. The High Court's ruling is in
      Walker-Smith's case; it quashed the panel's decision on him and did not rule on Wakefield,
      whose appeal was abandoned.

  - id: va-retraction-reasons
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      The paper's interpretation was retracted in 2004 and the paper itself in 2010, for
      different reasons, and the records problems were documented separately. In 2004, 10 of
      its 13 authors retracted its interpretation, saying no causal link was established
      because the data were insufficient, and, as described in a 2011 review, The Lancet said the
      paper had failed to disclose financial interests (the paper itself stayed in the journal). In February 2010, days after
      the GMC's findings of fact of 28 January 2010, The Lancet retracted the whole paper; its
      editor said the statements in the paper were "utterly false". The notice's own wording was
      not read. Evidence that its diagnoses and onset dates did not match the children's records
      was published afterwards, in the BMJ in January 2011, and is the BMJ's finding, not The
      Lancet's.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5; capped: both Lancet notices known only as quoted
    anchor_checked: secondary   # notices known as reported (Indian J Psychiatry 2011 and the Guardian of 2 Feb 2010 read directly in round 3; BMJ c696 not reachable); author list read
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Commonly compressed into "retracted for faked data", which merges the
      2010 retraction with the 2011 findings.
    would_change_if: "the Lancet notices themselves give different reasons from how they are quoted"
    anchor:
      type: journal-notices-as-quoted
      description: >
        2004: "no causal link was established between MMR vaccine and autism as the data were
        insufficient", and The Lancet's admission that the authors had failed to disclose
        financial interests, as described in Indian J Psychiatry 2011 [read; the 2004 notices
        themselves were not read]. Signatories: 10 of the 13 authors, not Wakefield, Linnell or
        Harvey [author list read]. 2010: the Lancet retracted the whole paper, announced on 2 Feb
        2010 (notice in the 6 Feb 2010 issue, Lancet 2010;375:445), after the GMC's findings of
        fact of 28 Jan 2010 ([2012] EWHC 503, para 1, read); the editor, Richard Horton, told the
        Guardian "the statements in the paper were utterly false" and "I feel I was deceived"
        [Guardian, 2 Feb 2010, read directly in round 3]. The notice itself was NOT read, so its
        wording is not quoted here; the earlier pass's quotation of it (via BMJ c696, "contrary to
        the findings of an earlier investigation", naming the referral and ethics-approval claims)
        could not be re-checked and the gloss is not used. For context, the Guardian reports that
        in 2004 the Lancet asked the Royal Free to investigate and the Royal Free's Prof. Hodgson
        wrote that it "had found no problems": the 2004 inquiry, not the GMC hearing, is the
        "earlier investigation" in that account. 2011: the BMJ records comparison and the editors'
        fraud judgment [read via fetch tool; see va-wakefield-records-mismatch].
      accessible: true
      sources: [src-murch-2004, src-indian-jpsych-2011, src-guardian-lancet-2010, src-lancet-retraction-2010, src-walker-smith-2012, src-deer-2011, src-godlee-2011]
    positions:
      - label: "Yes, pulled because of data problems"
        holder: "Common account"
        ground: >
          The data were insufficient (2004), and the records did not match the paper (2011).
      - label: "Not as stated in the retraction"
        holder: "The 2010 retraction, as reported (the notice was not read)"
        ground: >
          The Lancet retracted after the GMC's findings about the paper's statements (its editor
          called them "utterly false"). The records evidence came a year later and is the BMJ's
          finding, not the Lancet's.
    basis: >
      Both halves of the common account are true; they belong to different documents and
      dates. Keeping them apart matters because "retracted over ethics paperwork" is used to
      wave the case away, and "retracted for fraud" credits the retraction with a finding it
      did not make. An earlier version of this claim said the "earlier investigation" was the
      GMC hearing; that gloss was unsupported and is removed (review round 1, B2). TO REACH
      PRIMARY: read the 2004 and 2010 notices in The Lancet.

  - id: va-measles-rna-gut
    state: refuted
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    refutes_target: >
      The mechanism proposed by the Wakefield group (1998-2002): persistent measles vaccine
      virus in the gut of children with autism and bowel symptoms
    statement: >
      Children with autism and bowel symptoms carry persistent measles virus in the gut,
      linking MMR to their condition.
    evidence_class: material
    confidence: moderate
    evidential_weight: 4   # of 5; a small study (38 children), but blinded and including the original laboratory
    anchor_checked: primary   # Hornig 2008 full text read
    adoption_weight: 1   # of 5
    adoption_note: "Not measured."
    would_change_if: >
      a blinded multi-laboratory study finds measles vaccine RNA in gut biopsies of
      children with autism and bowel symptoms at clearly higher rates than in controls
    anchor:
      type: blinded-multi-laboratory-replication
      description: >
        Gut biopsies from 25 children with autism and bowel symptoms and 13 controls with
        bowel symptoms only were tested for measles RNA in three laboratories blinded to
        diagnosis, one of them the laboratory that made the original finding. Measles RNA
        was found in 1 case (4%) and 1 control (8%). MMR before bowel-symptom onset: 12 of 25
        cases vs 3 of 13 controls (P=0.13). The earlier report had found measles RNA in the
        ileum of 75% of children with autism vs 6% of controls [read, as cited in the paper].
      accessible: true
      sources: [src-hornig-2008]
    positions:
      - label: "Yes"
        holder: "The earlier report cited by Hornig (75% vs 6%)"
        ground: "Measles RNA reported in most children with autism and bowel symptoms."
      - label: "No"
        holder: "Hornig et al. 2008"
        ground: "Blinded testing in three laboratories, including the original one, found 4% vs 8%."
    basis: >
      Material evidence (biopsies tested by RT-PCR), read in full. Small, so held at weight 4.

  - id: va-wakefield-sanctions
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Andrew Wakefield was struck off the UK medical register in May 2010 and did not
      complete his appeal, so the decision stands. John Walker-Smith's striking-off was
      quashed by the High Court in March 2012. Murch was found not guilty of serious
      professional misconduct.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5
    anchor_checked: primary   # the 2012 judgment read in full
    adoption_weight: 3   # of 5
    adoption_note: "Not measured. The Walker-Smith outcome is often cited as vindication."
    would_change_if: "a later court or GMC decision reverses either outcome"
    anchor:
      type: court-judgment
      description: >
        [2012] EWHC 503 (Admin), Mitting J, 7 March 2012: "The panel's determination cannot
        stand. I therefore quash it" (para 187); Wakefield "has subsequently abandoned his
        appeal" (para 1); the GMC hearing began 16 July 2007 and decided on 24 May 2010
        (para 1) [all read].
      accessible: true
      sources: [src-walker-smith-2012, src-bmj-gmc-2010]
    positions:
      - label: "Yes, this vindicates the work"
        holder: "Common reading in vaccine-sceptic media"
        ground: "A senior co-author's sanction was overturned on appeal."
      - label: "No, it does not"
        holder: "The judgment itself"
        ground: >
          The judge quashed the panel's decision for "inadequate and superficial reasoning and,
          in a number of instances, a wrong conclusion" about Walker-Smith (para 186). He
          ruled on the panel's handling of Walker-Smith's case, not on the science. (His
          remark on the state of medical opinion, para 7, is a court's view, not evidence about
          vaccines, and is not used.)
    basis: >
      Professional sanctions are not evidence about vaccines in either direction. They are
      filed because both sides cite them.

  - id: va-uk-mmr-uptake-fall
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In England, MMR coverage by the second birthday fell from 91.8% in 1995-96 to 79.9% in
      2003-04, then began to rise. In 2008 the Health Protection Agency reported that
      measles was again endemic in the UK, attributing it to almost a decade of low MMR
      coverage.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5 for the figures
    anchor_checked: primary   # NHS Immunisation Statistics 2004-05 and Eurosurveillance 2008 read in full
    adoption_weight: 3   # of 5
    adoption_note: "Not measured."
    would_change_if: "the published coverage figures are revised"
    anchor:
      type: official-statistics
      description: >
        NHS Immunisation Statistics, England 2004-05, Table 2: 91.8% (1995-96), 88.3%
        (1998-99), 84.1% (2001-02), 81.8% (2002-03), 79.9% (2003-04), 80.9% (2004-05) [read].
        Eurosurveillance, 3 July 2008, reporting the HPA: measles endemic again 14 years after
        local transmission had stopped; 461 confirmed cases in England and Wales to the end
        of May 2008 [read]. Notifications in England and Wales: 3,670 (2007), 5,088 (2008)
        [read, UKHSA table].
      accessible: true
      sources: [src-nhs-immunisation-2004-05, src-eurosurv-2008, src-ukhsa-measles-historic]
    basis: >
      The figures show the fall in coverage and the return of measles. That the 1998 paper
      caused the fall is the HPA's and most observers' reading, and is plausible on timing,
      but these figures do not by themselves prove the cause: coverage had begun to slip
      before the paper (91.8% in 1995-96, 90.8% in 1997-98). Kept as a consequence, not as
      evidence about autism.

  # =====================================================================
  # C. INGREDIENTS
  # =====================================================================

  - id: va-thimerosal-no-detectable-increase
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Children exposed to more thimerosal (a mercury-based preservative) in vaccines were not
      diagnosed with autism more often, and autism diagnoses kept rising after thimerosal
      was removed from routine childhood vaccines (Denmark 1992; United States 1999-2001).
    evidence_class: synthetic
    confidence: high
    evidential_weight: 4   # of 5
    anchor_checked: secondary   # abstracts; IOM 2004 summary read in full
    adoption_weight: 4   # of 5
    adoption_note: >
      Not measured separately. The IOM (2004) said the evidence "favors rejection" for
      thimerosal-containing vaccines [read]. In July 2025 HHS adopted an ACIP vote to use only
      thimerosal-free flu vaccines, citing the 1999 pledge [read via fetch tool; src-hhs-thimerosal-2025].
      The CDC and FDA thimerosal pages (src-cdc-thimerosal) are agency statements of the same
      kind. All of this is adoption, not an anchor: information, not evidence.
    would_change_if: >
      a cohort with individual exposure records finds autism rising with thimerosal dose,
      or diagnoses fall in birth cohorts after removal once reporting changes are accounted for
    anchor:
      type: cohort-case-control-and-natural-experiment
      description: >
        Denmark, 467,450 children: autism RR 0.85 (0.60 to 1.20), and 0.98 (0.90 to 1.06)
        per 25 micrograms of ethylmercury [abstract]. US case-control with clinically
        confirmed cases (256 cases, 752 controls): no increased risk at any exposure window
        [abstract]. California caseload kept rising through 2007 after removal [abstract].
        Danish incidence rose after removal in 1992 [abstract]. Independent populations:
        Denmark (Hviid 2003; Madsen 2003) and the US (Price 2010; Schechter 2008).
      accessible: true
      sources: [src-hviid-2003, src-price-2010, src-schechter-2008, src-madsen-2003, src-verstraeten-2003]
    positions:
      - label: "No"
        holder: "Hviid 2003, Price 2010, Schechter & Grether 2008, Madsen 2003, IOM 2004"
        ground: "No dose-response; no fall after removal."
      - label: "Yes (what exists)"
        holder: "Verstraeten (preliminary screen, 2000); Geier & Geier (2003, 2004)"
        ground: >
          The first phase of the CDC's Vaccine Safety Datalink screen found associations with
          tics (HMO A, RR 1.89) and language delay (HMO B, RR 1.13), not with autism, and they
          did not replicate in the second phase [abstract]. The Geier papers reported positive
          associations; the IOM called them "uninterpretable, and therefore noncontributory" [read].
    basis: >
      The Danish trend after 1992 is weakened by a register change in 1995, when outpatient
      diagnoses were added; the individual-level studies do not share that weakness.

  - id: va-thimerosal-removed-because-harmful
    state: refuted
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    refutes_target: >
      The claim that thimerosal was removed from US childhood vaccines in 1999-2001 because

      description: >
        Mawson 2017: anonymous online survey of homeschooling mothers, 666 children; autism
        19/405 vaccinated (partly or fully) vs 3/261 unvaccinated, OR 4.2 (1.2 to 14.5); the
        ADHD row of the same table shows identical figures; diagnoses could not be checked
        against records [read]. Hooker & Miller 2021: voluntary parent survey, 1,565 children
        of whom only 136 fully vaccinated; autism OR 5.03 (1.64 to 15.5) for fully vaccinated;
        in the subset whose diagnoses were confirmed in the participating practices' electronic
        records, autism 27/403 in children with any vaccine vs 3/737 unvaccinated, OR 13.0
        (3.73 to 45.0); no correction for multiple tests; recall and selection bias
        acknowledged [read].
      accessible: true
      sources: [src-mawson-2017, src-hooker-miller-2021, src-hooker-miller-2020-eoc, src-henry-ford-draft]
    positions:

        holder: "Mawson et al. 2017; Hooker & Miller 2021"
        ground: >
          Both report several-fold higher autism among vaccinated children; Hooker & Miller's
          excess holds in the chart-confirmed subset.
      - label: "No"
        holder: "Henry Ford draft (2020); register studies of MMR"
        ground: >

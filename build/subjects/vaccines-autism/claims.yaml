    anchor:
      type: primary-policy-statement
      description: >
        AAP and US Public Health Service, MMWR 1999;48(26): "there are no data or evidence of
        any harm caused by the level of exposure that some children may have encountered";
        nevertheless, "because any potential risk is of concern", thimerosal-containing
        vaccines "should be removed as soon as possible". The same statement says some children
        "could be exposed to a cumulative level of mercury over the first 6 months of life that
        exceeds one of the federal guidelines on methyl mercury" [read].
      accessible: true
      sources: [src-mmwr-1999, src-fda-thimerosal]
    positions:
      - label: "Yes (what is real)"
        holder: "Common reading: removal as an admission"
        ground: >
          The 1999 statement itself says some infants could exceed one federal guideline for
          methylmercury, and removal followed.
      - label: "No"
        holder: "The 1999 statement itself"
        ground: >
          It says there were no data or evidence of harm at the exposure levels in use, and
          that removal was recommended because any potential risk is of concern.
    basis: >
      The statement records what the agencies said at the time. It does not show what each
      official privately believed.

  - id: va-aluminum-no-detectable-increase
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In a cohort of 1,224,176 Danish children, more aluminum from vaccines in the first two
      years was not associated with more neurodevelopmental disorders (hazard ratio 0.93 per
      milligram, 95% CI 0.90 to 0.97); the reported figure for autism alone is the same
      (0.93, 0.89 to 0.97), read so far only in the journal's press release.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5; the autism figure itself was read only in a press release
    anchor_checked: secondary
    adoption_weight: 3   # of 5
    adoption_note: >
      The US Health Secretary called for the paper's retraction in August 2025; the editor
      declined [secondary: Reuters, Live Science]. The WHO's safety committee (Dec 2025) cited
      a review of 10 trials and 7 cohort studies finding no association between aluminium
      adjuvants and chronic or systemic disease generally, not autism specifically; the same
      WHO statement says two studies reported an association between cumulative aluminium
      exposure from vaccination and ASD prevalence, but both were ecological, judged at critical
      risk of bias and rated very low evidence, and unable by design to inform causality [read].
      Executive Order 14420 (Aug 2026) orders HHS to pursue alternatives to aluminum adjuvants
      without citing autism [read via fetch tool]. Adoption is information, not evidence.
    would_change_if: >
      the paper's full text, its published correction or its updated supplement shows an
      autism association in the main analysis (a 2026 reanalysis says the updated supplement
      does); or another cohort with recorded doses finds one
    anchor:
      type: national-cohort
      description: >
        Andersson et al., Ann Intern Med 2025: 1,224,176 children born 1997-2018; any
        neurodevelopmental disorder HR 0.93 (0.90 to 0.97) per mg [abstract]; autism spectrum
        disorder HR 0.93 (0.89 to 0.97) [secondary: ACP press release; not in the abstract].
        A 2026 BMJ systematic review found no association [abstract].
      accessible: true
      sources: [src-andersson-2025, src-doyon-plourde-2026, src-jablonowski-2026]
    positions:
      - label: "No"
        holder: "Andersson 2025 main analysis; WHO GACVS 2025; Doyon-Plourde 2026"
        ground: "No increase with dose."
      - label: "Yes (what exists)"
        holder: "HHS Secretary Kennedy; Jablonowski & Hooker 2026"
        ground: >
          A supplementary analysis of the 2007-2018 births found a higher hazard for Asperger
          syndrome (cited as 67%, CI 1% to 177%, 51 cases) [secondary: FactCheck.org]; the
          main analysis and the other subgroups did not. A 2026 reanalysis says the updated
          supplement shows autism associations [abstract only; not checked]. Mold 2018: see
          va-aluminum-brain-tissue.
    basis: >
      Compares children by dose, not vaccinated with unvaccinated: almost every child in the
      cohort was vaccinated. A published correction exists (PMID 40674587) whose content was
      not read. The estimate below 1 is not protection. TO REACH PRIMARY: read the paper, its
      correction and supplement.

  - id: va-aluminum-brain-tissue
    state: proposed
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Aluminum found in brain tissue from people with autism shows that vaccine aluminum
      contributes to autism.
    evidence_class: interpretive
    confidence: provisional
    evidential_weight: 1   # of 5
    anchor_checked: secondary   # abstract and article page read
    adoption_weight: 2   # of 5
    adoption_note: "Not measured. Widely shared in 2017-2018."
    would_change_if: >
      a controlled study shows higher brain aluminum in autism than in matched controls and
      traces it to vaccines
    anchor:
      type: uncontrolled-tissue-series
      description: >
        Mold et al. 2018 measured aluminum in brain tissue from 5 donors with autism (mean
        2.30 to 3.82 micrograms per gram by lobe, with standard deviations larger than the
        means in three lobes) and imaged tissue from 10 donors. There was no control tissue
        from people without autism, and the paper did not trace the aluminum to any source
        [abstract and article page].
      accessible: true
      sources: [src-mold-2018]
    positions:
      - label: "Yes"
        holder: "Mold, Umar, King, Exley 2018"
        ground: "High aluminum content in some samples."
      - label: "No"
        holder: "Critics quoted by Retraction Watch and BuzzFeed (2017)"
        ground: "No controls, five donors, large variation between replicates; no link to vaccines."
    basis: >
      Not refuted, because no controlled study has tested it; it is unsupported. No
      correction or expression of concern was found. An image-duplication allegation
      sometimes repeated online was searched for and not found, so it is not filed.


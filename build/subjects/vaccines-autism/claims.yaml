        Thompson, 27 Aug 2014: "my coauthors and I omitted statistically significant
        information in our 2004 article" [read, third-party copy of the law firm's page]. The
        CDC's archived statement agrees that race was reported only for the birth-certificate
        sample and says the data remain available for reanalysis [read]. The paper's whole

      sources: [src-bruesewitz]
    what_it_is:
      - "A ruling that families cannot sue vaccine makers over a vaccine's design; such claims go to the compensation program."
      - >
        Based on the 1986 Act's wording that makers are not liable for side effects that were
        "unavoidable" in a properly made and labelled vaccine.
    what_it_is_not:
      - "Not a finding that vaccines are unsafe or that any particular injury happened."
      - "Not about autism: the case concerned seizures and developmental delay after DTP."
      - "Not immunity from all suits: manufacturing-defect claims are not barred, and failure-to-warn claims are barred only where the maker complied with regulatory requirements and gave the warning."
    basis: "Filed because both sides cite it; it bears on liability, not on causation."

  - id: va-vicp-table-no-autism
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Autism is not on the US Vaccine Injury Table. Encephalopathy or encephalitis within 5 to
      15 days of a measles-containing vaccine is. Whether the Poling concession fell under a
      Table injury was not checked: the Table in force when it was decided was not read.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5
    anchor_checked: primary   # 42 CFR 100.3 read in full (eCFR, as of 30 Sep 2026)
    adoption_weight: 2   # of 5
    adoption_note: "Proposals to add autism were reported in 2026 [secondary]; no rule was found."
    would_change_if: "HHS amends the Table"
    anchor:
      type: regulation
      description: >
        42 CFR 100.3 (version effective 3 Jan 2022): no entry contains "autism"; the MMR entry
        lists encephalopathy or encephalitis at 5-15 days [read]. A search of the Federal
        Register for rules amending the Table since 2023 found none [searched].
      accessible: true
      sources: [src-vicp-table]
    what_it_is:
      - "A list of injuries that the compensation program presumes are vaccine-caused when they appear within set time windows."
    what_it_is_not:
      - "Not a scientific list of what vaccines cause: it is a legal list, informed by but not the same as scientific findings."
      - "Not a bar to claims: families can still try to prove an unlisted injury."
    basis: >
      The Table is a compensation list, written to pay quickly with a low bar. It is set by
      statute and changed by rulemaking with notice, a public hearing and at least 180 days of
      public comment, on petition of the Advisory Commission on Childhood Vaccines or anyone else
      (42 U.S.C. 300aa-14(c), read on Cornell LII). Whether an injury is on it is a legal matter,
      informed by but not the same as a scientific finding that the vaccine does or does not
      cause the injury. The role of Institute of Medicine reviews in changing the Table was not
      verified here.

  - id: va-geier-licence
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Mark Geier, co-author of papers reporting an association (see
      va-thimerosal-no-detectable-increase), had his
      Maryland medical licence revoked by the State Board of Physicians on 22 August 2012. The
      Board found, among other things, that he treated autistic children with the drug Lupron
      outside its approved use without adequate examination, started chelation without
      documenting a reason, and provided "informed consent" forms it called misleading and in
      at least one case blatantly false.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5
    anchor_checked: primary   # Geier v. Md. State Bd. of Physicians, 223 Md. App. 404 (29 May 2015, No. 1095) read in full in round 3; the 1 Oct 2015 and 2019 opinions read earlier
    adoption_weight: 2   # of 5
    adoption_note: "Not measured."
    would_change_if: "the revocation is overturned"
    anchor:
      type: court-record
      description: >
        Geier v. Maryland State Board of Physicians, 223 Md. App. 404, 116 A.3d 1026 (Court of
        Special Appeals, No. 1095, Sept. Term 2014, filed 29 May 2015), the appeal of the
        licence revocation [read in full]: the Board's Final Decision and Order of 22 Aug 2012
        revoked the licence. The Board found that he treated patients with Lupron, "a medication
        that was not approved by the U.S. Food and Drug Administration ... for use on children in
        the absence of precocious puberty", without an adequate examination; that he prescribed
        chelation "without documenting a reason ... and without adequate documented informed
        consent", which "violated the standard of quality care"; and, in setting the sanction,
        that he provided "informed consent" forms that were "misleading and in at least one
        case blatantly false". The circuit court affirmed on 9 Apr 2014. The charges included
        failing to keep adequate medical records. The 1 Oct 2015 opinion (Nos. 722 and 2256, a
        later suit by the Geiers against the Board) gives the summary suspension of 27 Apr 2011
        and the same dates, and the 2019 opinion (No. 338) describes the Board's conclusion in
        similar words [read]. The Board's own order was not read.
      accessible: true
      sources: [src-geier-md-2015-licence, src-geier-md-2015, src-geier-md-2019]
    basis: >
      The revocation concerns clinical practice, not the validity of the Geiers' data; their
      papers are weighed on their own methods. The IOM's 2004 appraisal of those specific
      papers ("uninterpretable, and therefore noncontributory") is an appraisal, not evidence
      about vaccines, and is kept out of the anchor. Motive is not assessed. Separately, in March
      2025 HHS reportedly engaged David Geier to study vaccine data [secondary: STAT]; HHS has
      not published his role. Whether living persons stay named here is an owner decision
      (review round 1, section 6).

  # =====================================================================
  # F. PREVALENCE AND CAUSES
  # =====================================================================

  - id: va-rise-mostly-reporting
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In Denmark, changes in diagnostic criteria and the inclusion of outpatient diagnoses
      explain about 60% (95% CI 33% to 87%) of the rise in autism diagnoses among children born
      1980-1991. In the US, the CDC surveillance series rose from 6.7 to 32.2 per 1,000 between
      2000 and 2022 while its definitions, record sources and sites changed, so the share of the
      US rise due to reporting cannot be read from it.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: secondary   # abstracts; DSM review read in full
    adoption_weight: 3   # of 5
    adoption_note: "Not measured."
    would_change_if: "a study using constant criteria and case-finding shows a rise of similar size"
    anchor:
      type: register-and-surveillance-analyses
      description: >
        Hansen et al. 2015: 677,915 Danish children; 60% of the increase attributable to the
        two reporting changes [abstract]. US special education 1994-2003: autism rose from
        0.6 to 3.1 per 1,000 while intellectual disability and learning disability declined
        [abstract]. CDC surveillance (8-year-olds): 6.7 per 1,000 in 2000 to 32.2 per 1,000
        (one in 31) in 2022, across a series whose definition, sources and sites changed
        (DSM-5 from 2016; record-based case definition from 2018; 6 to 16 sites) [abstracts].
        DSM-5 (2013) merged several diagnoses into one autism spectrum [read].
      accessible: true
      sources: [src-hansen-2015, src-shattuck-2006, src-addm-2007, src-addm-2025, src-rosen-2021]
    basis: >
      The famous "1 in 150" for 2000 is CDC framing; the report itself gives 6.7 per 1,000.
      Site-level figures in 2022 range from 9.7 to 53.1 per 1,000, which shows how much case
      finding moves the number.

  - id: va-rise-remainder-unexplained
    state: searched_gap
    statement_kind: search_result   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In the Danish analysis of children born 1980-1991, part of the rise in autism diagnoses
      (about 40%, with a range from 13% to 67%) is not explained by the two reporting changes
      measured, and its causes are not known.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 3   # of 5
    anchor_checked: secondary
    adoption_weight: 3   # of 5
    adoption_note: "Not measured. The unexplained share is where vaccine explanations are usually placed."
    would_change_if: "a study accounts for the remainder"
    next_step: >
      Repeat the Danish decomposition for birth cohorts after 1991 with later criteria
      changes, and add measured candidate factors (parental age, preterm survival, awareness
      and screening) to see how much of the remainder they explain.
    anchor:
      type: residual
      description: "Hansen 2015: 60% explained, interval 33% to 87%; the rest unexplained [abstract]."
      accessible: true
      sources: [src-hansen-2015]
    basis: >
      Any vaccine explanation for the remainder would have to fit the null individual-level
      results above and the natural experiments in tests.yaml.

  - id: va-rise-proves-vaccines
    state: proposed
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      The rise in autism diagnoses alongside an expanding vaccine schedule shows that vaccines
      cause autism.
    evidence_class: interpretive
    confidence: provisional
    evidential_weight: 1   # of 5
    anchor_checked: secondary
    adoption_weight: 3   # of 5
    adoption_note: "Not measured. A central argument in US policy statements of 2025-2026."
    would_change_if: >
      diagnoses fall in birth cohorts after a vaccine is withdrawn, once reporting changes
      are accounted for
    retired_by: dt-withdrawal-natural-experiments
    anchor:
      type: coincident-trends
      description: "Both trends rose over the same decades; see va-rise-mostly-reporting."
      accessible: true
      sources: [src-addm-2025, src-honda-2005, src-schechter-2008, src-madsen-2003]
    positions:
      - label: "Yes"
        holder: "Current HHS leadership; vaccine-sceptic organizations"
        ground: "Two trends rose together."
      - label: "No"
        holder: "Honda 2005 (Japan); Schechter 2008 and Madsen 2003 (thimerosal)"
        ground: >
          When Yokohama stopped giving MMR entirely from 1993, autism incidence kept rising,
          most steeply from that birth cohort onward [abstract]; diagnoses kept rising after
          thimerosal was removed in Denmark and the US [abstracts].
    basis: "Two rising trends do not show cause; the withdrawal natural experiments test it directly."

  - id: va-heritability-high
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Most of the variation in autism risk between people is genetic: heritability is
      estimated at about 80% (83% in Sweden; a median of 80.8% across five countries).
    evidence_class: synthetic
    confidence: high
    evidential_weight: 4   # of 5
    anchor_checked: primary   # Sandin 2017 and Bai 2019 read in full
    adoption_weight: 3   # of 5
    adoption_note: "Not measured."
    would_change_if: "large family studies with different designs give much lower estimates"
    anchor:
      type: family-registers
      description: >
        Sandin et al. 2017: 37,570 twin pairs and over 2.6 million sibling pairs; heritability
        0.83 (0.79 to 0.87) [read]. Bai et al. 2019: 2,001,631 children in five countries;
        median 80.8% (73.2% to 85.5%), from 50.9% (Finland) to 86.8% (Israel) [read].
      accessible: true
      sources: [src-sandin-2017, src-bai-2019]
    basis: >
      Heritability describes variation in a population; it does not mean 80% of each case is
      genetic, and it leaves room for environmental factors, including ones that act with
      genes. Context for the question of causes, not a test of vaccines.

  - id: va-known-environmental-factors
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Some non-genetic factors are reliably associated with autism: older parents, valproate
      taken in pregnancy (likely causal), and birth complications involving lack of oxygen.
      A review of systematic reviews classed vaccination as unrelated to autism risk.
    evidence_class: synthetic
    confidence: moderate
    evidential_weight: 4   # of 5
    anchor_checked: primary   # Modabbernia 2017 read in full
    adoption_weight: 2   # of 5
    adoption_note: "Not measured."
    would_change_if: "newer reviews reverse these associations"
    anchor:
      type: review-of-reviews
      description: >
        Modabbernia et al. 2017: each 10 years of maternal or paternal age raises risk by 18%
        and 21%; all studies of prenatal valproate found strong associations, likely causal;
        vaccination, thimerosal and maternal smoking classed as unrelated [read].
      accessible: true
      sources: [src-modabbernia-2017]
    basis: "Published 2017; it does not cover later work on acetaminophen or preterm cohorts."

  - id: va-causes-largely-unknown
    state: searched_gap
    statement_kind: search_result   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      For most individual children with autism, the specific cause has not been identified.
    evidence_class: synthetic
    confidence: high
    evidential_weight: 3   # of 5
    anchor_checked: secondary
    adoption_weight: 4   # of 5
    adoption_note: "Stated on the CDC page (Jul 2026) and by the NIH Director (Aug 2026) [secondary]."
    would_change_if: "large genetic and exposure cohorts assign causes to most cases"
    next_step: >
      Combine genome sequencing with prospectively recorded exposures (including vaccination
      dates and fevers) in existing birth cohorts such as Norway's MoBa and the US SPARK
      study, so specific causes can be tested case by case.
    anchor:
      type: stated-limit
      description: "Heritability is high but explains variation, not individual cases (see va-heritability-high)."
      accessible: true
      sources: [src-sandin-2017]
    basis: "Not knowing the cause is not evidence for any particular cause, vaccines included."

  # =====================================================================
  # G. EXCEPTIONS, OPEN QUESTIONS AND LIMITS
  # =====================================================================

  - id: va-rubella-causes-autism-vaccine-prevents
    state: established
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Rubella infection in pregnancy can cause autism in the child. In a follow-up of 243
      children with congenital rubella, 7% had autism in the preschool years. The rubella
      vaccine, part of MMR, prevents congenital rubella; one US model estimates about 1,228
      autism cases prevented in 2001-2010 (range 830 to 6,225).
    evidence_class: material
    confidence: moderate
    evidential_weight: 4   # of 5; Chess read as abstracts; the model read in full
    anchor_checked: secondary
    adoption_weight: 1   # of 5
    adoption_note: "Not measured; little known outside medicine."
    would_change_if: "re-examination of congenital rubella cohorts finds autism no more common than expected"
    anchor:
      type: clinical-cohort-and-model
      description: >
        Chess 1977 and Chess, Fernandez, Korn 1978: 243 children with congenital rubella;
        7% had autism at preschool age; at re-examination of 205 at ages 8 to 9 there were two
        remissions and three new cases [abstracts]. Berger, Navar-Boggan, Omer 2011: a simple mathematical model
        (7.4% of congenital rubella cases presenting with autism, range 3.0% to 10.0%) estimates
        16,600 congenital rubella cases and 1,228 autism cases prevented in the US in
        2001-2010 [read].
      accessible: true
      sources: [src-chess-1977, src-chess-1978, src-berger-2011]
    basis: >
      The clinical finding is material (examined children); the prevention figure is a model
      (synthetic) and carries the model's assumptions. This is the one established causal
      link between MMR's target diseases and autism, and it runs the other way: the vaccine
      prevents autism caused by the virus.

  - id: va-mito-fever-regression
    state: proposed
    statement_kind: judgment   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In children with mitochondrial disease, fever, including fever after a routine
      vaccination, may trigger autistic regression.
    evidence_class: synthetic
    confidence: provisional
    evidential_weight: 2   # of 5
    anchor_checked: secondary   # the review read in full; the case series as abstract and as cited
    adoption_weight: 1   # of 5
    adoption_note: "Not measured; known mainly through the Poling case."
    would_change_if: >
      a prospective study of children with confirmed mitochondrial disease records fevers
      from all causes and finds regression clustering after them, or finds none
    next_step: >
      Prospective follow-up of children with confirmed mitochondrial disease, recording every
      fever with its cause (infection or vaccination) and any regression, with blinded
      assessment; test whether post-vaccination fevers differ from infection fevers.
    anchor:
      type: case-series-and-review
      description: >
        Rossignol & Frye 2012 (meta-analysis): mitochondrial disease in 5.0% (3.2% to 6.9%) of
        children with autism, against about 0.01% in the general population; in one series of
        28 children with both, 17 regressed, 12 of them with a fever over 101F, including 4 of
        those 12 after a fever following routine vaccination, and one further child in a case
        report regressed after a post-vaccination fever; the reviewers state it is not
        clear whether mitochondrial dysfunction contributed to or caused the regression [read].
        Shoffner et al. 2010 (that series): none regressed with vaccination unless a fever was
        present [abstract].
      accessible: true
      sources: [src-rossignol-frye-2012, src-shoffner-2010, src-poling-2006]
    positions:
      - label: "Yes (possible)"
        holder: "Shoffner 2010; Poling et al. 2006 (case report); the Poling concession"
        ground: >
          Regression after fever is documented in this group, a few after post-vaccination
          fevers.
      - label: "No (not shown)"
        holder: "No controlled study exists; the population cohorts did not look at this group"
        ground: >
          The evidence is small, uncontrolled and retrospective. The review that collects it
          says it is not clear whether mitochondrial dysfunction contributed to or caused the
          reported regressions; in the same discussion it says that, because regression is known
          to occur with stressors such as fever and infection in mitochondrial disease and is about
          twice as common in children with both conditions, "it is likely that the regression
          reported in at least a subset of children with ASD/MD is related to mitochondrial
          dysfunction" (related to the mitochondrial disease, not shown to be related to
          vaccination); and that the studies' authors stressed vaccination's role in
          preventing life-threatening disease [read]. One review author (Frye) discloses
          expert-witness work for children with mitochondrial disorders who may have been
          injured by vaccines.
    basis: >
      This is the only specific, testable mechanism by which a vaccine could contribute to
      autism-like regression in a subgroup. Filed as proposed: a real hypothesis, untested by
      any controlled study. It is the open question in the short answer.

  - id: va-small-effect-not-excludable
    state: searched_gap
    statement_kind: search_result   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    gap_type: structural
    gap_reason: >
      No study can show that an effect is exactly zero. The largest MMR cohort (HR 0.93, 95%
      CI 0.85 to 1.02) is compatible with at most about a 2% relative increase; smaller
      studies have wider margins (upper bounds 1.09 to 1.24 for MMR and thimerosal); and
      population data cannot by themselves rule out an effect confined to a very rare
      susceptible group.
      The IOM said so in 2004, adding that there was no evidence for such a group either.
    statement: >
      Population studies cannot rule out a very small average effect, or an effect confined
      to a very rare susceptible group.
    evidence_class: synthetic
    confidence: high
    evidential_weight: 4   # of 5
    anchor_checked: secondary   # Hviid 2019 abstract; the limit itself is a property of any null result
    adoption_weight: 3   # of 5
    adoption_note: >
      The IOM (2004) said it could not rule out that vaccines contribute to autism in some
      small subset or very unusual circumstances, and that there was no evidence for that
      either [read]. The CDC page has cited the same limit since Nov 2025 as the reason "vaccines
      do not cause autism" is not evidence-based (see va-cdc-page-2025). Adoption, not evidence.
    would_change_if: "never fully closed by population data; narrowed by tests of named subgroups (see va-mito-fever-regression)"
    anchor:
      type: stated-limit
      description: >
        Hviid 2019: HR 0.93 (0.85 to 1.02), an upper bound of about a 2% relative increase
        [abstract]. Named subgroups tested so far (siblings of children with autism; children
        with other risk factors) showed no increase [abstracts]. That a null result cannot show
        an effect is exactly zero is a property of the method, not a finding of any study.
      accessible: true
      sources: [src-hviid-2019, src-jain-2015]
    basis: >
      This is true of every null result in medicine. What matters is how large an effect has
      been ruled out: for MMR in the largest study, nothing larger than a very small relative
      increase on average.

  - id: va-cdc-page-2025
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      Since 19-20 November 2025 the CDC's "Autism and Vaccines" page has said the claim
      "vaccines do not cause autism" is not evidence-based because studies have not ruled out
      the possibility that infant vaccines cause autism. Health Secretary Kennedy said he
      personally ordered the change.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4   # of 5, for what the page says
    anchor_checked: secondary   # live page read through a fetch tool, 2 Oct 2026
    adoption_weight: 3   # of 5
    adoption_note: >
      Contradicted by the WHO Global Advisory Committee on Vaccine Safety (11 Dec 2025), the AAP
      and the Autism Science Foundation [read via fetch tool; secondary].
    would_change_if: "the page is changed again"
    anchor:
      type: the-document-itself
      description: >
        cdc.gov/vaccine-safety/about/autism.html, dated 22 Jul 2026: the key point quoted above;
        also that studies supporting a link "have been ignored by health authorities"; the
        heading "Vaccines do not cause Autism*" is kept, with a footnote that scientists have
        not identified the root causes of autism [read via fetch tool]. First changed 19-20 Nov
        2025; Kennedy said he ordered it [secondary: STAT, 21 Nov 2025]. Revised again about
        22 Jul 2026 [secondary].
      accessible: true
      sources: [src-cdc-autism-page, src-stat-cdc-page-2025]
    positions:
      - label: "Yes, a link is possible"
        holder: "HHS and the current CDC page"
        ground: "Studies have not ruled out that infant vaccines cause autism."
      - label: "No link"
        holder: "WHO GACVS (Dec 2025); AAP"
        ground: >
          No evidence of a causal relationship. The WHO's review counted 20 of 31 primary
          studies finding no association and all 5 meta-analyses null; the other 11 studies,
          nine from one US group, suggested an association and were rated very low strength
          with a high risk of bias [read].
    basis: >
      Filed as a fact about an institution's statement. Under rule 2 it confers no evidential
      weight in either direction; neither does the CDC's earlier statement that there is no
      link, nor the WHO's. Strata's own reading, labelled as interpretation: the page's stated
      reason is true of every null result (va-small-effect-not-excludable); what it leaves out
      is how small an effect the studies have ruled out.

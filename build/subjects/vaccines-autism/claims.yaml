  - id: va-compensation-program
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      The US Vaccine Injury Compensation Program is a no-fault scheme, designed to pay injured
      people faster and more easily than a lawsuit. For an injury on its Table that appears
      within the listed time window, the claimant does not have to prove the vaccine caused it;
      the government has to disprove causation. For other injuries the claimant must prove
      causation. Payments come from an excise tax on each vaccine dose.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5   # of 5
    anchor_checked: primary   # Bruesewitz v. Wyeth opinion and syllabus read in full; 42 CFR 100.3 read
    adoption_weight: 2   # of 5
    adoption_note: >
      Not measured. Payments and concessions are widely read as admissions of causation.
    would_change_if: "Congress changes the Act's burden of proof"
    anchor:
      type: statute-as-described-by-the-supreme-court
      description: >
        Bruesewitz v. Wyeth (2011), majority opinion: the Act "establishes a no-fault
        compensation program" designed to work faster and with greater ease than the tort
        system; for Table injuries "no showing of causation is necessary; the Secretary bears
        the burden of disproving causation"; for unlisted injuries "the claimant must prove
        causation"; claimants need not show the vaccine was defective [read]. The syllabus:
        compensation is paid out of a fund created by an excise tax on each vaccine dose [read].
      accessible: true
      sources: [src-bruesewitz, src-vicp-table]
    what_it_is:
      - "A compensation system with a deliberately low bar, so injured people are paid quickly."
      - "A legal presumption of causation for listed injuries within set time windows."
    what_it_is_not:
      - >
        Not a scientific finding. Being paid, or having a claim conceded, shows the legal test
        was met or not contested; it does not show the vaccine caused the injury.
      - >
        Not an admission of fault: no one has to show the vaccine was defective, and the
        program does not decide whether it was.
    basis: >
      This is the frame for every legal item in the dig (va-poling-concession,
      va-omnibus-test-cases, va-vicp-table-no-autism, va-bruesewitz-no-autism-finding). The
      program's low bar is intended: it trades proof for speed. That is why its outcomes are
      evidence about the law, not about biology, in either direction.

  - id: va-poling-concession
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In late 2007 the US government conceded, in one child's vaccine-compensation case (the Poling
      case), a link between her vaccinations and her injury. CNN reports that the program "concluded"
      the vaccinations "significantly aggravated" an underlying illness (a mitochondrial
      disorder) that had predisposed her to symptoms of autism; NPR reports the government said
      it was possible the vaccines "may have exacerbated" the disorder. The two reports word it
      differently and the government's report was not read.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4   # of 5; capped: the concession is known only as quoted
    anchor_checked: secondary   # CNN and NPR opened directly (revision round 3); the sealed decision and the Rule 4(c) report were not read
    adoption_weight: 3   # of 5
    adoption_note: "Not measured. Often cited as 'the government admitted vaccines cause autism'."
    would_change_if: "the Rule 4(c) report itself says something different from how it was quoted"
    anchor:
      type: concession-as-reported
      description: >
        CNN (6 Mar 2008): the program concluded in November 2007 that the child's underlying
        illness was "significantly aggravated" by vaccines; her case had been designated a
        potential test case before the concession, made shortly before a deadline for expert
        testimony (the family lawyer's account); CDC director Julie Gerberding said the
        government had made "absolutely no statement indicating that vaccines are a cause of
        autism" [read directly in round 3]. NPR (7 Mar 2008): lawyers for HHS "agreed to pay"
        and "in its ruling, the government said it was possible that the vaccines [the child] received
        may have exacerbated that disorder" [read directly in round 3]. The two reports therefore
        word the concession differently ("concluded ... significantly aggravated" versus
        "possible ... may have exacerbated"); the statement above gives both. The fuller wording
        ("an underlying mitochondrial disorder ... features of autism spectrum disorder") is
        known only as quoted in Salon (Mar 2008) and was not re-checked. The Rule 4(c) report
        and the 2010 decision were not read.
      accessible: true
      sources: [src-poling-cnn-2008, src-poling-npr-2008]
    what_it_is:
      - "A concession by the US government in one family's compensation claim, reported in March 2008: the program concluded her underlying illness was 'significantly aggravated' by vaccines."
      - "About one child with a pre-existing mitochondrial disorder."
      - "Made inside a no-fault compensation program (va-compensation-program); whether a Table presumption applied in her case was not checked."
    what_it_is_not:
      - "Not a scientific finding that vaccines cause autism, in her or anyone else."
      - "Not a verdict after the evidence was tried; it was conceded."
      - "Not a precedent: the test cases on autism theories that were checked were all denied (va-omnibus-test-cases)."
    positions:
      - label: "Yes"
        holder: "Common reading of the case"
        ground: "The government accepted that vaccines led to this child's autism-like condition."
      - label: "No, not in general"
        holder: "CDC director Julie Gerberding (Mar 2008)"
        ground: >
          The concession concerned aggravation of one child's pre-existing mitochondrial
          disorder; the government made no statement that vaccines cause autism.
    basis: >
      This is the one legal item the short answer lists, and it is a legal concession, not a
      scientific test; it is not an exception to the finding that large studies find no link. The compensation rules allow a presumption of causation for listed
      injuries; whether it applied here was not checked. Other compensated cases with
      autism-like features may exist and were not checked, so this is the best-known case,
      not a count. It points to the open question in va-mito-fever-regression. TO REACH
      PRIMARY: obtain Poling v. Secretary of HHS, No. 02-1466V, from the Court of Federal
      Claims (the posted PDF has moved).

  - id: va-omnibus-test-cases
    state: established
    statement_kind: reported   # assigned by rule on 2026-10-02 (log L-16); to be reviewed
    statement: >
      In the US vaccine court's Omnibus Autism Proceeding, which the Federal Circuit describes
      as addressing approximately 5,000 autism claims, the Petitioners' Steering Committee
      proposed a test-case approach. In the first group of three test cases (Cedillo,
      Hazlehurst, Snyder; Cedillo and Snyder argued MMR plus thimerosal-containing vaccines, and
      the Hazlehursts, after first arguing the same, relied on MMR alone in post-hearing
      briefing), the special masters denied all three petitions in 2009 and the Court of Federal Claims affirmed; the Federal Circuit
      affirmed Hazlehurst (13 May 2010) and Cedillo (27 Aug 2010), and Snyder was not appealed.
      In Cedillo the special master found the evidence did not show "that the MMR vaccine alone
      or in combination with TCVs can cause autism in general".
      The court's list also shows decisions in three further cases (King, Mead, Dwyer) dated
      12 Mar 2010; those were not opened and their outcome is not stated here, beyond the
      remark in Bruesewitz n.25 that the special masters "have thus far uniformly rejected" the
      alleged link.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4   # of 5; capped while anchor_checked is secondary
    anchor_checked: secondary   # decisions read through a fetch tool (the court CDN refused direct download)
    adoption_weight: 3   # of 5
    adoption_note: "Not measured."
    would_change_if: "a later decision reopens the theories on new evidence"
    anchor:
      type: court-decisions
      description: >
        Federal Circuit, Cedillo v. HHS, No. 2010-5004 (decided 27 Aug 2010) [opened; passages
        read]: counsel for the Petitioners' Steering Committee "proposed a 'test case' approach";
        Cedillo, Hazlehurst and Snyder "were also designated as test cases"; in footnote 1, "The
        Special Masters in Hazlehurst and Snyder denied the respective petitions and the Court
        of Federal Claims affirmed in both cases. Snyder ... was not appealed to this court"; the
        court affirmed in Cedillo and, "while this appeal was pending", in Hazlehurst (604 F.3d
        1343, 13 May 2010). Federal Circuit, Hazlehurst v. HHS, No. 2009-5128 [opened]: the
        omnibus proceeding was "an effort ... to identify and adjudicate certain test cases as a
        means of addressing the principal issues in approximately 5,000 autism claims that have
        been filed under the Vaccine Act"; the Cedillo and Snyder petitioners presented a theory
        based on MMR plus thimerosal; the court affirmed. The court's decision list (read
        directly) also gives special-masters' decisions of 12 Mar 2010 in King, Mead and Dwyer;
        they were not opened. Cedillo: the evidence was "overwhelmingly contrary to the
        petitioners' contentions" [as read through a fetch tool in an earlier pass; not
        re-checked]. Bruesewitz dissent n.25 records that "Respondent notes that there are some
        5,000 petitions" pending: that is the respondent's figure, quoted by the dissent, not a
        finding. CNN 2008 (the family lawyer): "nearly 5,000 other autism claims are pending".
        The figures "more than 5,000 filed" and "about 4,800 pending" were found in no source
        read and are dropped.
      accessible: true
      sources: [src-oap-decisions, src-cafc-cedillo-2010, src-cafc-hazlehurst-2010]
    what_it_is:
      - "Decisions by special masters, upheld on review in the three cases checked, that the families' theories were not proved to the legal standard (more likely than not)."
      - "Test cases proposed by the Petitioners' Steering Committee, the families' own counsel."
    what_it_is_not:
      - "Not a scientific proof that no child's autism was ever caused by a vaccine."
      - "Not a judgment on the families' honesty or on their children's suffering."
      - "Not a ruling on the later test cases (King, Mead, Dwyer): those decisions were not opened."
    positions:
      - label: "A caution, not a finding either way"
        holder: "Justice Sotomayor's dissent in Bruesewitz (2011), n.25"
        ground: >
          The footnote notes the special masters "have thus far uniformly rejected" the link, and
          adds that those rulings do not necessarily mean no causal link exists [read]. It also
          quotes the respondent's figure of some 5,000 pending petitions.
      - label: "No"
        holder: "The special masters"
        ground: "The families' experts did not show causation by the legal standard."
    basis: >
      A failure of proof by a preponderance of the evidence is a legal finding, not a
      scientific proof of no link. MMR alone was argued in Hazlehurst and rejected; the
      Federal Circuit affirmed (No. 2009-5128, read).


    would_change_if: "a later version of the study with more cases reports an autism association"
    anchor:
      type: the-document-itself
      description: >
        Table 2: 23 autism cases among 16,511 vaccinated children and 1 among 1,957
        unvaccinated; IRR 1.16 (0.16 to 8.62). Table 3: adjusted HR 0.62 (0.10 to 3.69),
        p=0.60. The authors write that no significant association was found between vaccine
        exposure and autism, adding that the number of cases was small [read].
      accessible: true
      sources: [src-henry-ford-draft]
    positions:
      - label: "Yes (what the draft does show)"
        holder: "How the draft is cited"
        ground: >
          It reports significant excesses in vaccinated children for related outcomes: any
          chronic condition (adjusted HR 2.54), the neurodevelopmental group (5.53, 2.91 to
          10.51), developmental delay (3.28, 1.13 to 9.55), speech disorder, and ADHD (262

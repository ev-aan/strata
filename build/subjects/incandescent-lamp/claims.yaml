  # =========================== UNITED STATES: EDISON ===========================

  - id: lamp-edison-oct-1879-test
    state: established
    statement: >
      Charles Batchelor's laboratory notebook for 22 October 1879 records a carbonised cotton thread
      lamp that burned for 13 1/2 hours before being pushed brighter, after which it cracked about an
      hour later. Edison's laboratory dated its first lamp that "answers the purpose", a carbonised
      cardboard horseshoe, to 16 November 1879.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Popular accounts give 13.5 or 40 hours, and 21 or 22 October. 40 hours was not found in any source opened."
    would_change_if: "the notebook page (Edison Papers N052105) is read and gives a different figure"
    anchors:
      - {class: primary_text, ref: "Batchelor notebook, 22 Oct 1879, as transcribed in the Edison Papers essay 'The Carbon Filament Lamp'", source: src-edison-papers-essay}
    basis: >
      # V: V1. The Edison Papers is the documentary edition, so its transcription is strong, but the
      #    page itself was behind a browser check and was not opened. The 1892 appeals court (52 F. 300,
      #    V2) agrees that a stable carbon filament was "not gained until October, 1879".

  - id: lamp-edison-patent
    state: established
    statement: >
      Edison's US patent 223,898, "Electric-Lamp", was filed on 4 November 1879 and granted on
      27 January 1880. Its first claim is a carbon filament of high resistance; its second is carbon
      filaments in a receiver made entirely of glass, exhausted of air, with wires sealed through the glass.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 5
    adoption_note: "The patent is the anchor of the popular story; few readers know what it actually claims."
    would_change_if: "the USPTO record is shown to be misread"
    anchors:
      - {class: primary_text, ref: "US 223,898, full specification and claims", source: src-us223898}
      - {class: primary_text, ref: "52 F. 300 (1892): 'application filed November 4, 1879'", source: src-52f300}
    basis: >
      # V: V2. The specification names a "mercury-pump" and a vacuum of "one-millionth of an
      #    atmosphere"; it does not name Sprengel (see lamp-sprengel-link).

  - id: lamp-edison-high-resistance
    state: established
    statement: >
      What set Edison's lamp apart, as his patent and the courts described it, was high resistance (about
      100 ohms and up) in a thin carbon filament in an all-glass high-vacuum bulb, which let many lamps run
      side by side ("in multiple arc") from one supply without enormous copper mains. The high-resistance
      idea itself was not unique to him: the 1891 court noted Lane-Fox's 1878 British patents and Edison's
      own French patent of May 1879.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Popular accounts credit Edison with the bulb, rarely with the electrical reason it worked as a system."
    would_change_if: "the 1891-92 opinions are shown to rest the patent on something else"
    anchors:
      - {class: primary_text, ref: "US 223,898 specification", source: src-us223898}
      - {class: primary_text, ref: "47 F. 454 (1891), Wallace J.", source: src-47f454}
    basis: >
      # V: V2. The courts upheld the patent on a specific combination, not on the principle of glowing
      #    carbon in a vacuum, which they accepted was old.

  - id: lamp-menlo-park-dec-1879
    state: contested
    statement: >
      Whether Edison gave a public demonstration on New Year's Eve 1879. The New York Herald of 21 December
      1879 announced one; the New York Tribune of 1 January 1880 reported crowds at Menlo Park with
      "no public exhibition promised or given" and called the announcement unauthorized.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Popular accounts name 31 December 1879 as the public unveiling."
    would_change_if: "an Edison laboratory record or third newspaper settles the event's nature"
    positions:
      - {label: "Public exhibition on 31 Dec", holder: "NY Herald, 21 Dec 1879; later popular accounts", ground: "the Herald's announcement"}
      - {label: "Open-house crowds, no formal exhibition", holder: "NY Tribune, 1 Jan 1880; NY Herald, 31 Dec 1879 ('crowds thronging' from 30 Dec)", ground: "same-week reports"}
    anchors:
      - {class: primary_text, ref: "NY Herald, 21 Dec 1879, p. 5", source: src-herald-1879-12-21}
      - {class: primary_text, ref: "NY Herald, 31 Dec 1879, p. 3", source: src-herald-1879-12-31}
      - {class: primary_text, ref: "NY Tribune, 1 Jan 1880, p. 8", source: src-tribune-1880-01-01}
    basis: >
      # V: V2 (OCR of Chronicling America scans). Not disputed: lamps were lit and seen by many visitors
      #    at Menlo Park in the last days of 1879. The Herald article is unsigned in the scan; the usual
      #    attribution to Marshall Fox is not confirmed. It leads with carbonised paper, not thread.

  - id: lamp-edison-bamboo
    state: established
    statement: >
      Edison's commercial lamps of 1880 onward used carbonised bamboo, chosen after trials of many
      fibres; he sent an agent to Japan who sent back about 40 kinds of bamboo.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "The popular figure of 1,200 hours of lamp life was not found in any source opened."
    would_change_if: "Edison laboratory or factory records give a different material or date"
    anchors:
      - {class: primary_text, ref: "159 U.S. 465 (1895), the Court's account of Edison's bamboo search", source: src-scotus-1895}
    basis: >
      # V: V2 for the Court's account, which rests on trial testimony. A court-built lamp to the 1880
      #    design lasted 600 hours (52 F. 300, expert testimony, V2). Lamp-life claims are filed only at
      #    that strength.

  - id: lamp-pearl-street
    state: established
    statement: >
      Edison's company turned on its first central-station district service from Pearl Street, New York,
      at 3 p.m. on 4 September 1882.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Well known; often presented as the moment 'the light bulb' arrived, which conflates lamp and system."
    would_change_if: "company records give a different date"
    anchors:
      - {class: primary_text, ref: "NY Tribune, 5 Sep 1882, p. 8", source: src-tribune-1882-09-05}
    basis: "# V: V2. Generation, wiring and metering were the commercial invention; the lamp was one part."

  - id: lamp-sprengel-link
    state: searched_gap
    statement: >
      The common statement that Edison's vacuum came from Hermann Sprengel's mercury pump (1865) is not
      yet anchored. Edison's patent and the 1879 Herald say only "mercury pump".
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Stated as fact in most technical histories."
    would_change_if: "an Edison laboratory record or Francis Upton letter names the Sprengel design"
    next_step: "Search the Edison Papers for 'Sprengel' (1879), and read Sprengel's 1865 paper in J. Chem. Soc."
    anchors:
      - {class: primary_text, ref: "US 223,898: 'mercury-pump', no name", source: src-us223898}
    basis: "Plausible and widely agreed, but nothing read names the source of the pump."

  # =========================== THE PATENT FIGHT ===========================

  - id: lamp-sawyer-man-priority
    state: established
    statement: >
      In the US Patent Office, an interference declared in September 1880 between Edison and William Sawyer
      and Albon Man, over carbon made from paper, ended in early 1885 with the Commissioner of Patents
      awarding priority to Sawyer and Man. Their resulting patent (317,076) was then held invalid in 1889
      as claiming too broadly, and the Supreme Court affirmed on 11 November 1895.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Almost unknown outside patent history; it cuts against both 'Edison won everything' and 'Edison stole it'."
    would_change_if: "the Patent Office interference record is read and disagrees with the 1889 opinion's account"
    anchors:
      - {class: primary_text, ref: "Consolidated Electric Light Co. v. McKeesport Light Co., 40 F. 21 (1889)", source: src-40f21}
      - {class: primary_text, ref: "The Incandescent Lamp Patent, 159 U.S. 465 (1895)", source: src-scotus-1895}
    basis: >
      # V: V2. The priority award is recorded in testimony quoted in the 1889 opinion, not in the
      #    Commissioner's decision itself (not read). Some popular accounts date the Patent Office ruling
      #    to 1883; the 1889 opinion says the case was not decided until early 1885.

  - id: lamp-edison-patent-upheld
    state: established
    statement: >
      Edison's lamp patent was upheld in court: in Edison Electric Light Co. v. United States Electric
      Lighting Co., the second claim (carbon filaments in an all-glass exhausted bulb) was held valid and
      infringed in 1891, and the appeals court affirmed on 4 October 1892.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Rarely mentioned; the US patent ran out in November 1894, two years later."
    would_change_if: "the opinions are misread"
    anchors:
      - {class: primary_text, ref: "47 F. 454 (C.C.S.D.N.Y. 1891)", source: src-47f454}
      - {class: primary_text, ref: "52 F. 300 (2d Cir. 1892)", source: src-52f300}
    basis: >
      # V: V2. Claim 1 was held not infringed. Expiry on 17 Nov 1894 is derived from the 1892
      #    opinion's tie to Canadian patent 10,654; no opinion read states that date (V1, derived).

  # =========================== GERMANY: GÖBEL ===========================

  - id: lamp-goebel-claim
    state: refuted
    refutes_target: "Heinrich Göbel built practical carbon-filament lamps in New York in 1854, before Edison"
    refutation_class: motivated_error
    statement: >
      The claim that Göbel made practical carbon-filament lamps in 1854 has no record before 1882 and
      was found improbable by three of the four US courts that heard it in 1893-94. It surfaced in
      patent-market dealings in 1882 and was put forward in 1893 as a defence against Edison's patent.
      One exhibit, lamp No. 4, the Boston court found could not have been made before 1872.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: >
      Taught in Germany for over a century (streets and schools named for Göbel; promoted under the Nazi
      state, per V0 sources). His hometown, Springe, still calls the question "debatable" (springe.de, read).
    would_change_if: >
      a dated document from before 1879 (newspaper, advertisement, letter, patent caveat) describing
      Göbel's lamp is found
    anchors:
      - {class: primary_text, ref: "54 F. 678 (D. Mass., 18 Feb 1893), Colt J.: 'extremely improbable'", source: src-54f678}
      - {class: primary_text, ref: "57 F. 616 (E.D. Wis., 20 Jul 1893), Seaman J.", source: src-57f616}
      - {class: primary_text, ref: "61 F. 834 (7th Cir., 1 May 1894): 'an atmosphere of improbability'", source: src-61f834}
      - {class: primary_text, ref: "US 266,358 (1882): Göbel's own lamp patent is a socket detail, its second claim rejected over Edison", source: src-us266358}
      - {class: primary_text, ref: "COUNTER-RECORD: 56 F. 496 (E.D. Mo., 21 Apr 1893), Hallett J., found the Göbel testimony credible enough to refuse an injunction", source: src-56f496}
    basis: >
      # V: V2 for all opinions and the patent. Counter-record kept visible: in St. Louis, Judge Hallett
      #    (56 F. 496, 21 Apr 1893) found "a fair preponderance of testimony" for Göbel and refused an
      #    injunction. All four were preliminary rulings on affidavits, not full trials, so confidence is
      #    moderate, not high.
      Class motivated_error, not fabrication: the dig has not read evidence that Göbel invented the
      story. Rohde (2007) reportedly found the false details came largely from the lawyers' presentation
      (V0; book not read). Göbel's 1882 patent on a small lamp part sits badly with having invented the
      whole lamp 28 years earlier.

  - id: lamp-goebel-rohde
    state: searched_gap
    statement: "What Hans-Christian Rohde's 2007 study of the court record found about how the Göbel story was built."
    evidence_class: synthetic
    confidence: low
    evidential_weight: 2
    anchor_checked: no
    adoption_weight: 2
    adoption_note: "Accepted in German history-of-technology writing; Springe has not retracted."
    would_change_if: "the book is read"
    next_step: >
      Read Rohde, Die Göbel-Legende (zu Klampen, 2007), and Dittmann's review in Technikgeschichte 74(2), 2007,
      pp. 149-160 (paywalled).
    anchors:
      - {class: synthetic, ref: "Rohde 2007, via lerncafe.de, goebel-projekt, radiomuseum.org (V1 that it refutes Göbel)", source: src-rohde-2007}
    basis: "Synthetic class: a modern study of the record. Cannot serve as a primary refutation (Rule 9)."

  # =========================== ATTRIBUTION MYTHS ===========================

  - id: lamp-latimer-patent
    state: established
    statement: >
      Lewis Latimer's US patent 252,386, "Process of Manufacturing Carbons" (filed 19 February 1881,
      granted 17 January 1882), improves how carbon filaments are made: blanks are carbonised inside
      cardboard envelopes so they do not break or warp. It was assigned to the United States Electric
      Lighting Company, Hiram Maxim's firm and a rival of Edison's.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Often retold as 'Latimer invented the carbon filament' or 'improved Edison's bulb'."
    would_change_if: "the patent record is misread"
    anchors:
      - {class: primary_text, ref: "US 252,386", source: src-us252386}
    basis: "# V: V2. His later work for Edison's companies is real in secondary accounts but not anchored here; see lamp-latimer-edison-role."

  - id: lamp-latimer-edison-role
    state: searched_gap
    statement: "Latimer's later role with the Edison companies (engineering staff, patent expert witness, Edison Pioneers)."
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Widely stated; well supported in secondary accounts."
    would_change_if: "Edison company records or court testimony naming him are read"
    next_step: "Read the Latimer papers (Queens Borough Public Library) and the Edison Papers for Latimer, 1884-1912."

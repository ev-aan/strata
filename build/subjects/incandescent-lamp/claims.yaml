  - id: lamp-edison-high-resistance
    state: established
    statement: >
      What set Edison's lamp apart, as his patent and the courts described it, was high resistance (100 to 500 ohms in the patent's
      example) in a thin carbon filament in an all-glass high-vacuum bulb, which let many lamps run
      side by side ("in multiple arc") from one supply without enormous copper mains. The high-resistance
      idea itself was not unique to him: the 1891 court noted Lane-Fox's 1878-79 British patents and a letter of his to the Times of
      December 1878, and the 1892 appeals court noted Edison's own French patent of May 1879 (a platinum burner) as already stating it.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Popular accounts credit Edison with the bulb, rarely with the electrical reason it worked as a system."
    would_change_if: "the 1891-92 opinions are shown to rest the patent on something else"
    anchor:
      type: primary_text
      description: "US 223,898 specification; 47 F. 454 (1891), Wallace J. (Lane-Fox patents and letter); 52 F. 300 (1892), Lacombe J. (Edison's French patent No. 130,910 of 28 May 1879)."
      sources: [src-us223898, src-47f454, src-52f300]
    basis: >
      # V: V2. In the courts' words (not this dig's): Wallace J. held Edison "the first to make a carbon of materials and by a process which was
      #    especially designed to impart high specific resistance to it", the first to make it in a form with "high total resistance", and
      #    the first to combine such a burner with "the necessary adjuncts of lamp construction"; Colt J. (54 F. 678) records the earlier ruling as
      #    holding that claim 2 "covered a broad and fundamental invention, namely, an incandescent lamp, composed of a carbon filament,
      #    hermetically sealed in an all glass chamber exhausted to a practically perfect vacuum, and having leading-in wires of platinum".
      #    The first version said the courts upheld the patent "on that specific combination, not on the idea of the lamp"; that paraphrase
      #    is replaced by these quotations.


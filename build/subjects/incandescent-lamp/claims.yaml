  - id: lamp-latimer-invented-claim
    state: refuted
    refutes_target: "Lewis Latimer invented the light bulb or the carbon filament"
    refutation_class: misattribution
    statement: >
      Latimer did not invent the light bulb or the carbon filament. His 1882 patent is a manufacturing
      improvement filed in 1881, after carbon filaments had been patented by Edison (applied for November 1879, granted 1880) and carbon in
      a vacuum by King (1845); his other 1881 patent with Nichols is for mounting the carbon on the wires. His real contribution was making
      carbons more reliably, first for a rival company.
    statement_kind: judgment
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "A modern corrective story that overshoots; it grows out of real neglect of Latimer's work."
    would_change_if: "an earlier Latimer document claiming the filament or lamp itself is found, or US 247,097 or 252,386 is read as claiming the lamp"
    anchor:
      type: primary_text
      description: "US 252,386 (1882) and US 247,097 (1881) against US 223,898 (1880) and the 1845 King patent (abridgment, p. 97)."
      sources: [src-us252386, src-us247097, src-us223898, src-abridgments-1859]
      nodes:
        - {node: lamp-1882-01-17-latimer-patent-252386, verb: supports}
        - {node: lamp-1881-09-13-nichols-latimer-patent-247097, verb: supports}
        - {node: lamp-1880-01-27-edison-patent-223898-granted, verb: supports}
    basis: >
      The attribution moves from a process patent to the whole invention. Recognition of his actual work stands. "A rival company" rests on the
      Queens Library essay (secondary) and on the company's name in the Edison suits.

  - id: lamp-10000-ways-quote
    state: refuted
    refutes_target: "Edison said 'I have not failed, I've just found 10,000 ways that won't work' about the light bulb"
    refutation_class: narrative_drift
    statement: >
      The earliest version found is in Dyer and Martin's 1910 biography, where Walter Mallory recalls Edison saying "I know several
      thousand things that won't work" about the nickel-iron storage battery after "over nine thousand experiments", not about the lamp; Mallory
      adds that the experiments later "had run up to over ten thousand". The "10,000 ways" wording has not been found in anything
      earlier than the modern forms traced by Quote Investigator (1946, 1982).
    statement_kind: search_result
    evidence_class: primary_text
    confidence: provisional
    confidence_reasons:
      start: high
      start_because: "The 1910 text was read directly in a scan of the book (anchor checked: primary)."
      steps:
        - {domain: unreported_negative_results, effect: down1, reason: "The claim that the 10,000-ways wording about the lamp is not documented earlier rests on not finding it. The dig has not searched Edison's own papers, newspapers or letters of his lifetime, so absence cannot be shown."}
        - {domain: indirectness, effect: down1, reason: "The 1910 text records Mallory's recollection, written down by Edison's authorised biographers; it is not Edison's own record and it says nothing about what he said about the lamp."}
        - {domain: risk_of_bias, effect: down1, reason: "One recollection in an authorised biography is the only anchor; Quote Investigator, a secondary tracing, is kept out of the anchors."}
      reviewed: false
    evidential_weight: 3
    anchor_checked: primary
    absence_anchor: true
    adoption_weight: 5
    adoption_note: "One of the most repeated quotations in English; nearly always attached to the light bulb."
    would_change_if: "an earlier printed or manuscript version about the lamp is found, or Edison's own record of the remark is found"
    anchor:
      type: primary_text
      description: 'Dyer and Martin, Edison: His Life and Inventions (Harper, 1910), vol. II, pp. 615-616, read in OCR of the Internet Archive scan.'
      sources: [src-dyer-martin-1910]
    basis: >
      # V: V2 for the 1910 text, the only anchor. Quote Investigator (secondary) traces the later "999" (1946) and "10,000" (1982)
      #    forms; that history is in transmission.yaml (tx-10000-ways), not here, and is not used for the refutation.
      #    Quote Investigator (secondary, read) also reports a 1921 American Magazine interview in which Edison recounts the incident without a number
      #    and an 1882 Christian Union article by Edison ("the enormous number of things that won't work"); neither was read directly; both are in the
      #    transmission chain, and the claim says only "earliest version found", not that Edison never spoke of it.
      #    Reworded in the revision: the first version said the wording was "not documented in Edison's lifetime". The 1910 book was itself
      #    published in Edison's lifetime (he died in 1931), and one book cannot show what was or was not said or printed about the lamp in the
      #    other twenty-odd years or earlier. The claim now says only "earliest version found" and is held at provisional confidence as an
      #    absence claim.


  - id: lamp-edison-sole-inventor
    state: refuted
    refutes_target: "Thomas Edison invented the light bulb (as its first or only inventor)"
    refutation_class: narrative_drift
    statement: >
      Edison did not invent the incandescent lamp from nothing and was not its first or only inventor. British patents of 1841 (de Moleyns) and
      1845 (King, for Starr) already described, respectively, an electric light fed with powdered charcoal in an exhausted globe and a heated carbon conductor in a vacuum; Woodward
      patented a carbon lamp in rarefied gas in 1874-76; and Swan reported a glowing carbon rod in an exhausted globe in December 1878,
      a rod that blackened its globe. Edison's own patent (1880) was upheld by US courts for a high-resistance carbon filament in an
      all-glass exhausted bulb; in Wallace J.'s words Edison made "a lamp which was practically operative and successful" (47 F. 454, 1891), and
      Colt J. records that the earlier ruling held claim 2 to cover "a broad and fundamental invention, namely, an incandescent lamp, composed
      of a carbon filament, hermetically sealed in an all glass chamber exhausted to a practically perfect vacuum, and having leading-in
      wires of platinum" (54 F. 678). Whether Edison or Swan was first to a practical lamp, and a complete wired system (Pearl Street, 1882),
      are separate claims (lamp-first-practical-priority, lamp-pearl-street).
    statement_kind: judgment
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 5
    adoption_note: "The default answer in the US and much of the world; reinforced by schoolbooks and the quote myth."
    would_change_if: >
      the 1845 patent is shown not to describe a heated carbon conductor in a vacuum (or the 1841 patent not to describe a light in an exhausted globe), or the courts are shown to
      have upheld Edison's patent as the first lamp of any kind
    anchor:
      type: primary_text
      description: 'British patents 9053 (1841) and 10,919 (1845), Patent Office abridgments; Chemical News 39 (1879): Swan''s December 1878 rod lamp; US 181,613 (Woodward); 47 F. 454 (1891) and 52 F. 300 (1892); 54 F. 678 (1893), Colt J.; US 223,898.'
      sources: [src-abridgments-1859, src-chemnews-1879, src-us181613, src-47f454, src-52f300, src-54f678, src-us223898]
      nodes:
        - {node: lamp-1841-08-21-de-moleyns-patent-9053, verb: supports}
        - {node: lamp-1845-11-04-king-starr-patent-10919, verb: supports}
        - {node: lamp-1878-12-swan-rod-lamp-newcastle-chemical-society, verb: supports}
        - {node: lamp-1891-47f454-wallace-upholds-edison-lamp-patent, verb: qualifies}
    basis: >
      The true core is large and is kept in lamp-edison-patent, lamp-edison-high-resistance, lamp-edison-patent-upheld and
      lamp-pearl-street. The drift is from "made a lamp the courts called practical, and a system to run it" to
      "invented it". Under the dig's standard (S2, S3) the refutation rests on dated documents (patents, a society report, a court
      opinion) that show earlier descriptions and an earlier reported experiment, not on any claim that a lamp was built before Edison's
      beyond Swan's reported rod. The first version also said lamps were "built" by Lodygin and by Woodward and Evans before Edison, and
      that Edison's team "made first a lamp practical to manufacture and sell ... by 1882"; neither was anchored to this claim and
      both are removed (Lodygin: lamp-lodygin-1872-74; Woodward: lamp-woodward-evans-patent, lamp-woodward-evans-performance; the practical lamp
      and sale: lamp-first-practical-priority; Pearl Street: lamp-pearl-street).

  # =========================== THE PATENT FIGHT ===========================

  - id: lamp-sawyer-man-priority
    state: established
    statement: >
      In the US Patent Office, an interference declared in September 1880 between Edison (application of December 1879) and William Sawyer
      and Albon Man (application of 9 January 1880), over carbon made from paper, was "not finally decided until the beginning of 1885",
      when the Commissioner of Patents awarded priority of invention to Sawyer and Man (as 40 F. 21 recounts it). Their patent (No. 317,076,
      granted 12 May 1885) was held invalid in 1889: apart from its third claim (carbonised paper), it amounted to a claim to all fibrous
      carbons. The Supreme Court affirmed the decree on 11 November 1895, holding that the claims "with the exception of the third, are too
      indefinite to be the subject of a valid monopoly" and that the question of priority "becomes unnecessary"; it did not itself decide that
      Sawyer and Man's third claim was invalid, which was admitted not to be infringed by the Edison lamp.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 1
    adoption_note: "Almost unknown outside patent history; it cuts against both 'Edison won everything' and 'Edison stole it'."
    would_change_if: "the Patent Office interference record is read and disagrees with the 1889 opinion's account"
    anchor:
      type: primary_text
      description: "Consolidated Electric Light Co. v. McKeesport Light Co., 40 F. 21 (1889), Bradley J.; The Incandescent Lamp Patent, 159 U.S. 465 (1895), Brown J., headnote and the passages 'we are all agreed that the claims of this patent, with the exception of the third, are too indefinite' and 'becomes unnecessary'."
      sources: [src-40f21, src-scotus-1895]
      nodes:
        - {node: lamp-1885-early-sawyer-man-win-interference, verb: supports}
        - {node: lamp-1889-10-05-bradley-holds-sawyer-man-claims-invalid, verb: supports}
        - {node: lamp-1895-11-11-supreme-court-affirms-sawyer-man-decree, verb: supports}
    basis: >
      # V: V2. The priority award is recorded in testimony quoted in the 1889 opinion, not in the
      #    Commissioner's decision itself (not read). Some popular accounts date the Patent Office ruling
      #    to 1883; the 1889 opinion says the case was not decided until the beginning of 1885.
      #    Corrected in the revision (see log): the first version, and a first draft of the log, overstated what the Supreme Court held. The scan's
      #    heading misprints the decision date as 1815 and the headnote the patent date as 14 May; the term, the argument dates and 40 F. 21 fix 1895 and 12 May.


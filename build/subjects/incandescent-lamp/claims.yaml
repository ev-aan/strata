# ---------------------------------------------------------------------------
# SEARCH HEADLINE (rules as in apollo-landings/claims.yaml). DRAFT until owner review.
# ---------------------------------------------------------------------------
headline: "No one person invented the light bulb. Edison made the first one that was practical to sell and wire into a system."
headline_claim: lamp-edison-sole-inventor
headline_status: draft
dig_status: open
search_summary: >
  Patents from 1841 and 1845, Swan's 1878 lamp and four 1890s court cases show at least six people
  built incandescent lamps before Edison's. What Edison made first was a practical system. See the evidence.

subject: incandescent-lamp
question: "Who invented the light bulb?"
title: "Who invented the light bulb? (the invention era, 1802-1895)"
description: >
  "Who invented the light bulb?" has a famous answer (Edison) and several national counter-answers
  (Swan for Britain, Woodward and Evans for Canada, Göbel for Germany, Lodygin for Russia, de Changy
  for Belgium). This dig treats every one of those answers the same way: each is a claim that must
  be anchored to a dated document from the time. The founding core runs from Davy's battery lights
  to the 1895 Supreme Court ruling that closed the patent fight. Later metal filaments (tungsten,
  1900s) are out of scope for now except where a claimant's own patent reaches into them.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (as in apollo-landings):
#   V0 single source | V1 2+ independent secondary sources agree | V2 primary document opened and read
# What was opened at V2 in this session (2026-10-02):
#   US patents 223,898 (Edison), 181,613 (Woodward), 252,386 (Latimer), 47,632 and 266,358 (Göbel),
#     575,002 (Lodygin): USPTO image server and Google Patents
#   Court opinions: 40 F. 21 (1889), 47 F. 454 (1891), 52 F. 300 (1892), 54 F. 678, 56 F. 496,
#     57 F. 616 (all 1893), 61 F. 834 (1894): Caselaw Access Project / law.resource.org scans
#   Supreme Court, The Incandescent Lamp Patent, 159 U.S. 465 (decided 11 Nov 1895): LoC scan
#   British patent abridgments, Electricity and Magnetism (1859): de Moleyns 1841, King 1845
#   Chemical News 39 (1879) and 42 (1880): Swan's demonstrations and his own 1880 lecture
#   Scientific American 12 Sep 1874: Canadian patent 3,738 listing
#   NY Herald 21 and 31 Dec 1879; NY Tribune 1 Jan 1880 and 5 Sep 1882 (Chronicling America)
#   Davy, Elements of Chemical Philosophy (1812); Fontaine, Electric Lighting (1878 trans.)
#   Dyer and Martin, Edison: His Life and Inventions (1910), vol. II pp. 615-616
#   Electrical World and Engineer, 14 Apr 1900
# Blocked: Google Patents (intermittently), Espacenet, Library and Archives Canada,
#   the Edison Papers notebook viewer (browser challenge, not bypassed). No Edison notebook page
#   was opened directly; notebook facts come from the Edison Papers' own editorial essays (V1).
# ---------------------------------------------------------------------------

divergence_note: >
  Adoption says "Edison" almost everywhere, and in each claimant's country it says "ours". The evidence
  says the question is badly formed: "invented" covers at least five different firsts (light from
  electric heating, a patent, a working carbon lamp in a vacuum, a lamp practical to make and sell,
  a complete wired system), and they have different answers. The national stories each hold one true
  fact (a real patent, a real demonstration) and then stretch it into "first". The two loudest
  priority claims against Edison, Göbel's 1854 lamps and the Canadian sale, are the two with the
  weakest records: nothing dated before 1882 for Göbel, and no document of a sale for Woodward and
  Evans. The gap left open is honest: Swan's 1850s work survives only in his own 1880 account.

claims:

  # =========================== PRECURSORS ===========================

  - id: lamp-davy-arc
    state: established
    statement: >
      Humphry Davy published an account of a brilliant arc of light between two charcoal points,
      powered by the Royal Institution's 2,000-plate battery. This is an arc light, not an
      incandescent lamp: the light comes from a spark jumping a gap, not from a solid glowing inside a bulb.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: >
      "Davy invented the first electric light" is common in school material, often run together
      with the bulb.
    would_change_if: >
      an earlier published description of a sustained carbon arc is found (claims of earlier arcs
      by others exist and are not yet dug)
    anchors:
      - {class: primary_text, ref: "Davy, Elements of Chemical Philosophy (London, 1812), pp. 85-86", source: src-davy-1812}
    basis: >
      # V: V2 for the text. The book gives no date for the demonstration; 1808, 1809 and 1810
      #    all trace to later histories. Date filed as a gap (lamp-davy-dates).
      Proves electricity could make useful light by 1812. Does not bear on the incandescent lamp.

  - id: lamp-davy-dates
    state: searched_gap
    statement: >
      The date of Davy's first arc demonstration (given variously as 1808, 1809 or 1810) and whether
      his 1802 papers describe wires or charcoal glowing as a light source are not yet read in the
      original.
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Popular accounts give a single confident year; they do not agree on which."
    would_change_if: "the Journals of the Royal Institution (1802) and the Royal Institution's lecture records are read"
    next_step: >
      Read Davy's 1802 papers in the Journals of the Royal Institution, vol. 1 (the University of
      Pennsylvania transcription returned 403 from here; try the Royal Institution archive or a Google Books scan).
    anchors:
      - {class: primary_text, ref: "Journals of the Royal Institution, vol. 1 (1802), not read", source: src-davy-1812}
    basis: "A search snippet quotes iron wire 'rendered white-hot'. Not read; V0."

  - id: lamp-de-la-rue-1840
    state: searched_gap
    statement: >
      The often-repeated claim that Warren de la Rue made a platinum-coil lamp in an evacuated tube in
      1840 has no primary record found. The trail leads to a 1927 history that dates a de la Rue lamp
      to 1820 and says its vacuum is unexplained, while a 1923 Smithsonian history credits the 1840
      platinum-coil lamp to William Grove instead.
    evidence_class: synthetic
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: >
      Very widely repeated online and in school material as the "first light bulb", usually with
      the 1840 date and no citation.
    would_change_if: >
      a paper, notebook or lecture report by de la Rue from 1820-1850 describing the lamp is found,
      or Grove's own 1840 description is read and shows the attribution swapped
    next_step: >
      Search de la Rue's and Grove's papers in Philosophical Magazine and Proceedings of the Royal
      Society, 1838-1845, for a platinum lamp; then check which history first wrote "de la Rue, 1840".
    anchors:
      - {class: synthetic, ref: "Howell and Schroeder, History of the Incandescent Lamp (1927): 'De la Rue ... 1820'", source: src-howell-schroeder-1927}
      - {class: synthetic, ref: "Schroeder, History of Electric Light (Smithsonian, 1923): Grove, 1840", source: src-schroeder-1923}
    basis: >
      # V: V2 for what the two histories say; V0 or less for the lamp itself.
      Fontaine (1878), Hammer (1900) and the 1859 British patent abridgments do not mention a de la
      Rue lamp. Absence is not refutation, so this stays a gap, not refuted. The likeliest reading is a
      merge of the 1820 de la Rue story with Grove's 1840 lamp, which is itself unread.

  - id: lamp-de-moleyns-patent
    state: established
    statement: >
      Frederick de Moleyns received British patent No. 9053 on 21 August 1841 for a lamp in which
      powdered charcoal falls between two platinum coils inside an exhausted glass globe and glows
      when current passes.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Known to historians of the lamp; almost absent from popular accounts."
    would_change_if: "the full specification shows a different design from the abridgment"
    anchors:
      - {class: primary_text, ref: "Patents for Inventions: Abridgments of Specifications relating to Electricity and Magnetism (1859), pp. 62-63", source: src-abridgments-1859}
      - {class: primary_text, ref: "159 U.S. 465 (1895) cites the de Moleyns patent as prior art", source: src-scotus-1895}
    basis: >
      # V: V2 for the abridgment (the Patent Office's own published summary). The full specification
      #    was not read.
      Whether this is the first such patent is a separate, absence-based claim: lamp-earliest-patent.

  - id: lamp-earliest-patent
    state: established
    statement: >
      No incandescent-lamp patent earlier than de Moleyns's of 1841 has been found. The 1859 British
      abridgments list none earlier, and Fontaine's 1878 search found nothing before King's 1845 patent
      (he had missed de Moleyns too).
    evidence_class: primary_text
    confidence: provisional   # absence anchor: capped at provisional
    evidential_weight: 3
    anchor_checked: primary
    absence_anchor: true
    adoption_weight: 2
    adoption_note: "Histories that mention de Moleyns usually call his the first patent."
    would_change_if: >
      an earlier patent (in Britain, France, the US or elsewhere) for a lamp lit by an electrically
      heated solid is found
    anchors:
      - {class: primary_text, ref: "Abridgments ... Electricity and Magnetism (1859): no earlier lighting entry", source: src-abridgments-1859}
      - {class: primary_text, ref: "Fontaine (1878): earliest document found was King's 1845 patent", source: src-fontaine-1878}
    basis: >
      Two searched absences in two countries' records (British abridgments; a French engineer's survey).
      French and US patent indexes before 1841 were not searched.

  - id: lamp-starr-king-patent
    state: established
    statement: >
      British patent No. 10,919 of 4 November 1845, issued to Edward Augustin King "(a communication)",
      covers a lamp with a carbon rod enclosed in a Torricellian vacuum (the empty space above a column
      of mercury). The inventor behind the communication is identified by later sources as John
      Wellington Starr of Cincinnati.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Known to specialists; Starr is sometimes promoted as the 'American before Edison'."
    would_change_if: >
      the full specification shows something other than a carbon conductor in a vacuum, or the Starr
      identification is contradicted by a document from the 1840s
    anchors:
      - {class: primary_text, ref: "Abridgments ... Electricity and Magnetism (1859), p. 97", source: src-abridgments-1859}
      - {class: primary_text, ref: "54 F. 678 (1893) at 680-681: the court discusses Starr's lamp as prior art", source: src-54f678}
    basis: >
      # V: V2 for the patent abridgment and for the 1893 court's discussion. The Starr identity is V1
      #    (Hammer 1900, Schroeder 1923, Judge Colt). Carbon in a vacuum, the core idea of the later
      #    lamp, is patented here 34 years before Edison's US patent.

  - id: lamp-de-changy-belgium
    state: established
    statement: >
      By 1858 the Belgian inventor de Changy had made platinum incandescent lamps sealed in glass,
      intended for mines, as reported to the Paris Academy of Sciences by Marcellin Jobard in a letter
      dated 27 February 1858.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Promoted in Belgium; Howell and Schroeder (1927) call de Changy French."
    would_change_if: "Jobard's report in the Comptes rendus (1858) is read and says otherwise"
    anchors:
      - {class: primary_text, ref: "Jobard's 1858 report, quoted in Fontaine, Electric Lighting (1878), pp. 186-187", source: src-fontaine-1878}
    basis: >
      # V: V2 for Fontaine's quotation; the Comptes rendus original not opened, so anchor_checked is
      #    secondary. A Belgian patent No. 3244 of 28 Aug 1856 is cited by Hammer (1900) only (V0).
      INSULARITY FLAG: this claim and lamp-lodygin-1872-74 both rest on one book, Fontaine (1878). One
      contemporary engineer quoting two reports is a single channel; re-anchor each to its original
      (Comptes rendus 1858; the Academy's 1874 report) before raising either.
      A separate claim that Jobard made a carbon-in-vacuum lamp in 1838 was not found in Fontaine,
      Hammer, Schroeder or the abridgments, and is not filed as a claim here.

  # =========================== RUSSIA: LODYGIN ===========================

  - id: lamp-lodygin-1872-74
    state: established
    statement: >
      Alexander Lodygin built carbon-rod lamps in a sealed vessel without oxygen in St Petersburg
      in 1872-73 and received the Lomonosov Prize of the St Petersburg Academy of Sciences in 1874.
      A Russian privilege (patent) followed in 1874.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Standard in Russian textbooks and media; little known elsewhere."
    would_change_if: "the Academy's 1874 prize report or the privilege itself is read and disagrees"
    anchors:
      - {class: primary_text, ref: "Academy report by Wild, quoted in Fontaine (1878), pp. 171-173", source: src-fontaine-1878}
      - {class: synthetic, ref: "Russian privilege No. 1619, 11 July 1874, priority 2 Oct 1872 (Kommersant; lamptech)", source: src-kommersant-lodygin}
    basis: >
      # V: V2 for Fontaine. Privilege number and dates V1. Dates disagree: Fontaine says 1873,
      #    Russian accounts 1872. The often-quoted 50,000-rouble prize is not supported: Fontaine says
      #    only "a high prize" and one family source says 1,000 roubles.
      INSULARITY FLAG: the primary-text anchor is Fontaine alone (shared with lamp-de-changy-belgium);
      the privilege details come from a newspaper. Next step: read the Academy's 1874 prize report.
      Fontaine, a contemporary, called the apparatus "nothing less practical". Rods in a sealed
      vessel are real prior art; they did not last.

  - id: lamp-lodygin-first-claim
    state: refuted
    refutes_target: "Lodygin was the first inventor of the incandescent lamp"
    refutation_class: narrative_drift
    statement: >
      Lodygin did make carbon incandescent lamps before Edison, but he was not the first: British
      patents of 1841 (de Moleyns) and 1845 (King for Starr) already cover glowing conductors in
      evacuated glass, the second using carbon.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: >
      Widely taught in Russia. A Russian newspaper history (Kommersant) places the strongest
      "Lodygin before Edison" push in the 1947-48 campaign against "kowtowing to the West"; that
      placement is V0 and not used as evidence here.
    would_change_if: "the 1841 or 1845 patents are shown not to describe working incandescent lamps"
    anchors:
      - {class: primary_text, ref: "British patents 9053 (1841) and 10,919 (1845), abridgments", source: src-abridgments-1859}
    basis: >
      The true part ("before Edison") is kept in lamp-lodygin-1872-74. The drift is from "before
      Edison" to "first". Class narrative_drift, not institutional_propaganda: the Soviet campaign
      is reported but not anchored here.

  - id: lamp-lodygin-refractory-metals
    state: established
    statement: >
      Lodygin's US patent 575,002 (filed 4 January 1893, granted 12 January 1897) covers lamp
      filaments of refractory metals including tungsten and molybdenum.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Cited in Russian accounts as 'Lodygin invented the tungsten filament'."
    would_change_if: "the patent text is shown to cover something other than metal filaments"
    anchors:
      - {class: primary_text, ref: "US 575,002, Illuminant for incandescent lamps", source: src-us575002}
    basis: >
      # V: V2. Outside this dig's founding core (metal filaments are the 1900s); filed because it is
      #    Lodygin's own record. The story that he sold tungsten rights to General Electric in 1906 is
      #    V1 with no document and no price; filed as a gap.

  - id: lamp-lodygin-ge-sale
    state: searched_gap
    statement: "Whether, when and for what Lodygin sold patent rights to General Electric (often given as 1906)."
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Repeated in Russian popular histories; no price or document cited."
    would_change_if: "a USPTO assignment record or GE document is found"
    next_step: "Search USPTO assignment records for patent 575,002 and the GE archives (Schenectady) for Lodyguine."
    anchors:
      - {class: synthetic, ref: "skillbox.ru; minervaclassics.com (no documents cited)", source: src-kommersant-lodygin}
    basis: "V1 only as repetition."

  # =========================== CANADA: WOODWARD AND EVANS ===========================

  - id: lamp-woodward-evans-patent
    state: established
    statement: >
      Henry Woodward and Mathew Evans of Toronto received Canadian patent No. 3,738 on 3 August 1874
      for an electric light. Woodward alone received US patent 181,613 (filed 4 January 1875, dated
      29 August 1876). The lamp is a shaped carbon rod between two electrodes in a glass globe that is
      emptied of air and refilled with a thin gas that will not react with carbon. It has no thin
      filament and no high vacuum.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "Widely taught in Canada, on CBC, Canada's History and The Canadian Encyclopedia."
    would_change_if: "the Canadian specification itself (not read) describes a different lamp from the US patent"
    anchors:
      - {class: primary_text, ref: "US 181,613 (1876), full specification read", source: src-us181613}
      - {class: primary_text, ref: "Scientific American 31:11 (12 Sep 1874), Canadian patent list: No. 3,738, Aug. 3, 1874", source: src-sciam-1874}
    basis: >
      # V: V2 for the US patent and for the 1874 listing. The Library and Archives Canada record
      #    returned 403. The 24 July 1874 filing date is V0 (Canadian Encyclopedia only).
      The US patent names later assignees in Toronto and Lindsay, Ontario, not Edison.

  - id: lamp-woodward-evans-performance
    state: established
    statement: >
      The Woodward and Evans lamp was not developed into a product. A 1900 trade-press account based
      on Toronto informants called the first lamp "a very crude affair" and said investors would not
      put up more money; the French engineer Fontaine, touring the US in 1876-77, mentions the patent
      only briefly.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 3
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Popular Canadian accounts say it was 'more effective than any' earlier light; no source given."
    would_change_if: "a contemporary 1874-79 report of the lamp working in use is found"
    anchors:
      - {class: primary_text, ref: "Electrical World and Engineer 35:15 (14 Apr 1900)", source: src-elecworld-1900}
      - {class: primary_text, ref: "Fontaine, Electric Lighting (1878), p. 190", source: src-fontaine-1878}
    basis: >
      # V: V2 for both texts; the 1900 piece is second-hand testimony 25 years on, so anchor_checked
      #    is secondary. No record of commercial production found.

  - id: lamp-edison-bought-woodward
    state: searched_gap
    statement: >
      Whether Edison bought the Woodward and Evans patent rights, and when and for how much (popular
      accounts: 1879, $5,000). No document of a purchase was found.
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: no
    adoption_weight: 4
    adoption_note: >
      Stated as fact by CBC (2017), Canada's History and The Canadian Encyclopedia; none cites a document.
      One site gives both 1879 and 1885.
    would_change_if: "an assignment, contract, payment record or Edison letter about Woodward is found"
    next_step: >
      Search the Edison Papers (Rutgers) for "Woodward" (blocked here by a browser check), the USPTO
      assignment digests for patent 181,613 after 1876, and Library and Archives Canada assignment
      records for Canadian patent 3,738.
    anchors:
      - {class: primary_text, ref: "Electrical World 1900: purchase reported second-hand, no date or price", source: src-elecworld-1900}
    basis: >
      The earliest trace found is 1900, second-hand, from two Toronto electrical men. The 1876 US patent
      shows no assignment to Edison. A purchase is plausible (Edison bought other patents to clear
      the field) but unproven.

  - id: lamp-canada-invented-claim
    state: refuted
    refutes_target: "Woodward and Evans invented the light bulb, and Edison's lamp was built on their patent"
    refutation_class: narrative_drift
    statement: >
      Woodward and Evans did not invent the incandescent lamp (carbon in a vacuum was patented in
      Britain in 1845), and their patented lamp is a different design from the one Edison patented: a
      carbon rod in thin gas, against Edison's thin high-resistance carbon filament in an all-glass
      high-vacuum bulb.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "See lamp-woodward-evans-patent; the claim is common in Canadian media and heritage material."
    would_change_if: >
      a document shows Edison used the Woodward patent's design, or the Canadian specification
      describes a filament in high vacuum
    anchors:
      - {class: primary_text, ref: "US 181,613 (1876) vs US 223,898 (1880), both read", source: src-us181613}
      - {class: primary_text, ref: "US 223,898", source: src-us223898}
      - {class: primary_text, ref: "British patent 10,919 (1845)", source: src-abridgments-1859}
    reception_records:   # what the popular claim says; carries no weight
      - src-cbc-2017
      - src-canadas-history
      - src-canadian-encyclopedia
    basis: >
      The true core (a real 1874 Canadian patent for an electric lamp) is kept. The drift is twofold:
      "a lamp" becomes "the lamp", and a possible patent purchase becomes "Edison's breakthrough".
      The Canadian Encyclopedia's "stronger vacuum than Swan's" is contradicted by the patent, which
      refills the globe with gas.

  # =========================== BRITAIN: SWAN ===========================

  - id: lamp-swan-1850s
    state: searched_gap
    statement: >
      Joseph Swan's experiments with carbonised paper in a vacuum "about twenty years" before 1880 are
      known only from his own lecture of 20 October 1880. No record from the 1850s or early 1860s was found.
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "British accounts commonly state 1850 or 1860 as fact."
    would_change_if: "a dated notebook, letter or society report from 1850-1865 is found"
    next_step: >
      Search Swan's papers (Tyne and Wear Archives) and the 1929 memoir by his children (not on
      archive.org) for contemporaneous records.
    anchors:
      - {class: primary_text, ref: "Swan, lecture of 20 Oct 1880, Chemical News 42 (5 Nov 1880), pp. 227-230", source: src-chemnews-1880}
    basis: >
      # V: V2 for the lecture. He says the carbon arch "became red-hot" and broke. This is a
      #    self-account given while he was disputing priority with Edison, so it is a primary text for
      #    what Swan claimed, not for what happened in the 1850s.

  - id: lamp-swan-1878
    state: established
    statement: >
      Shortly before Christmas 1878, Swan described to the Newcastle Chemical Society an experiment with
      a slender carbon rod in an exhausted glass globe, powered by a Siemens dynamo. The rod glowed
      brightly, but the glass was coated inside with a sooty deposit and the rod bent into a bow.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Popular accounts say Swan 'demonstrated a working light bulb' in December 1878."
    would_change_if: "the Society's own minutes show a different lamp or a live, durable demonstration"
    anchors:
      - {class: primary_text, ref: "Chemical News 39 (28 Mar 1879) p. 133 and (18 Apr 1879) p. 168", source: src-chemnews-1879}
    basis: >
      # V: V2. The exact day, 18 December, is V1 (Grace's Guide; Histelec). The report says he
      #    "described an experiment"; it does not clearly say the lamp was lit before the members.
      A working principle with a known failure (blackening), not a lasting lamp.

  - id: lamp-swan-early-1879
    state: established
    statement: >
      In early 1879 Swan showed an incandescent lamp in action to a large audience at the Newcastle
      Literary and Philosophical Society, a lamp made only of glass, platinum and carbon.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: "British accounts treat 3 February 1879 as the date the light bulb was first shown."
    would_change_if: "Society records show no such demonstration in 1879"
    anchors:
      - {class: primary_text, ref: "Swan's own reference, 20 Oct 1880, to 'this little lamp, which I showed here two years ago in action'", source: src-chemnews-1880}
    basis: >
      # V: V2 that Swan said so in 1880; the date is disputed (3 Feb 1879 per Newcastle University and
      #    the Linda Hall Library; 17 Jan 1879 per Histelec). No 1879 report found in Nature (Dec 1878 to
      #    Mar 1879 searched) or Chemical News. See lamp-swan-litphil-date.

  - id: lamp-swan-litphil-date
    state: searched_gap
    statement: "The exact date and content of Swan's early-1879 Literary and Philosophical Society demonstration."
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "3 February 1879 is widely given as fact."
    would_change_if: "the Society's 1879 minutes or a Newcastle newspaper report is read"
    next_step: "Read the Lit and Phil's 1879 minute book or annual report, and the Newcastle Daily Chronicle for Jan-Feb 1879."
    anchors:
      - {class: synthetic, ref: "Newcastle University Special Collections blog; Linda Hall Library; Histelec (dates disagree)", source: src-linda-hall-swan}
    basis: "Two secondary dates, no primary."

  - id: lamp-swan-before-edison
    state: contested
    statement: >
      Whether Swan, not Edison, should be credited with the incandescent lamp. Swan showed a carbon lamp
      in a vacuum (Dec 1878, early 1879) before Edison's first long-burning test (Oct 1879), but his
      1878 lamp used a rod that blackened the glass, his practical treated-thread lamp came in 1880,
      and he took no patent on the basic lamp before Edison's British patent of November 1879.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "Split by country: 'Swan' in Britain, 'Edison' in the US."
    would_change_if: "Swan's 1879 lamp is shown to have lasted in use, or an earlier Swan patent on the basic lamp is found"
    positions:
      - {label: "Swan first", holder: "Swan himself (Chemical News, Nov 1880); British popular accounts", ground: "public demonstrations a year before Edison's test"}
      - {label: "Edison first to a practical lamp", holder: "US courts (47 F. 454; 52 F. 300)", ground: "patent on a high-resistance filament in an all-glass high vacuum, Nov 1879"}
      - {label: "Neither first; both improvers", holder: "this dig's reading", ground: "carbon in a vacuum patented 1845; each solved different problems"}
    anchors:
      - {class: primary_text, ref: "Chemical News 1879 and 1880", source: src-chemnews-1879}
      - {class: primary_text, ref: "US 223,898", source: src-us223898}
    basis: >
      Contested on what "credit" means, not on the facts. The facts in each position are anchored.
      Swan's own patents begin with British No. 4933 of 27 Nov 1880 (V1, not read); Grace's Guide
      mentions 1860 and 1878 patents with no numbers (V0, doubtful).

  - id: lamp-swan-in-use
    state: established
    statement: >
      Swan lamps were in practical use in Britain by 1880-81: at Cragside, Lord Armstrong's house, in 1880,

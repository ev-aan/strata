      - {class: synthetic, ref: "Edison Papers page hosting a Queens Library exhibit (not read in depth)", source: src-edison-papers-essay}
    basis: "Gap, not doubt: the secondary record is consistent."

  - id: lamp-latimer-invented-claim
    state: refuted
    refutes_target: "Lewis Latimer invented the light bulb or the carbon filament"
    refutation_class: misattribution
    statement: >
      Latimer did not invent the light bulb or the carbon filament. His 1882 patent is a manufacturing
      improvement filed in 1881, after carbon filaments had been patented by Edison (1879-80) and carbon in
      a vacuum by King (1845). His real contribution was making carbons more reliably, first for a rival company.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: "A modern corrective story that overshoots; it grows out of real neglect of Latimer's work."
    would_change_if: "an earlier Latimer document claiming the filament or lamp itself is found"
    anchors:
      - {class: primary_text, ref: "US 252,386 (1882) against US 223,898 (1880)", source: src-us252386}
    basis: "The attribution moves from a process patent to the whole invention. Recognition of his actual work stands."

  - id: lamp-10000-ways-quote
    state: refuted
    refutes_target: "Edison said 'I have not failed, I've just found 10,000 ways that won't work' about the light bulb"
    refutation_class: narrative_drift
    statement: >
      The earliest version found is in Dyer and Martin's 1910 biography, where Walter Mallory recalls Edison
      saying "I know several thousand things that won't work" during work on the nickel-iron storage battery,
      not the lamp. The "10,000 ways" wording is not documented in Edison's lifetime.
    evidence_class: primary_text
    confidence: moderate
    evidential_weight: 4
    anchor_checked: primary
    adoption_weight: 5
    adoption_note: "One of the most repeated quotations in English; nearly always attached to the light bulb."
    would_change_if: "an earlier printed version about the lamp is found"
    anchors:
      - {class: primary_text, ref: "Dyer and Martin, Edison: His Life and Inventions (Harper, 1910), vol. II, pp. 615-616", source: src-dyer-martin-1910}
    basis: >
      # V: V2 for the 1910 text, the only anchor. Quote Investigator (secondary) traces the later
      #    "999" (1946) and "10,000" (1982) forms; that history is in transmission.yaml (tx-10000-ways),
      #    not here, and is not used for the refutation. Confidence moderate because "Edison never said it about the lamp"
      #    partly rests on the absence of an earlier version.

  # =========================== THE HEADLINE ===========================

  - id: lamp-edison-sole-inventor
    state: refuted
    refutes_target: "Thomas Edison invented the light bulb (as its first or only inventor)"
    refutation_class: narrative_drift
    statement: >
      Edison did not invent the incandescent lamp from nothing: incandescent lamps were patented in Britain
      in 1841 and 1845, and lamps were built by Lodygin (1872-73), Woodward and Evans (1874) and Swan (1878)
      before his. What Edison's team made first was a lamp practical to manufacture and sell, with a
      high-resistance carbon filament in an all-glass high vacuum, designed for a parallel distribution
      system, running from a central station by 1882. The courts upheld his patent on that specific
      combination, not on the idea of the lamp.
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 5
    adoption_note: "The default answer in the US and much of the world; reinforced by schoolbooks and the quote myth."
    would_change_if: >
      the 1841 and 1845 patents are shown not to describe incandescent lamps, or the courts are shown to
      have upheld Edison's patent on the general principle
    anchors:
      - {class: primary_text, ref: "British patents 9053 (1841) and 10,919 (1845)", source: src-abridgments-1859}
      - {class: primary_text, ref: "Chemical News 39 (1879): Swan's 1878 lamp", source: src-chemnews-1879}
      - {class: primary_text, ref: "47 F. 454 (1891) and 52 F. 300 (1892)", source: src-47f454}
      - {class: primary_text, ref: "US 223,898", source: src-us223898}
    basis: >
      The true core is large and is kept in lamp-edison-patent, lamp-edison-high-resistance and
      lamp-pearl-street. The drift is from "made the first practical one and a system to run it" to
      "invented it". Edison's own patent does not claim the general idea.

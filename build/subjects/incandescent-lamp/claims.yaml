  # =========================== GERMANY: GÖBEL ===========================

  - id: lamp-goebel-claim
    state: contested
    statement: >
      Whether Heinrich (Henry) Göbel built practical carbon-filament lamps in New York in 1854, before Edison. No dated document from
      before 1882 that records such lamps has been found, on either side. On motions for preliminary injunctions, the Boston court (54 F.
      678, Colt J.) found it "extremely improbable that Henry Goebel constructed a practical incandescent lamp in 1854" while saying the
      weight of evidence "is in the direction that he made" the three early "fiddle bow" lamps or similar ones, but "assuming they were
      made, they do not anticipate the invention of Edison. At most they were experimental toys"; and found it "simply impossible, under
      the circumstances, to believe that a lamp so constructed [lamp No. 4] could have been made by Goebel before 1872" (a finding on
      credibility). The Wisconsin court (57 F. 616, Seaman J.), and the Seventh Circuit on appeal in the
      same case (61 F. 834), held the new defence not proved on the motion (the Seventh Circuit saying it was "without designing to suggest what result should be reached upon final hearing"); the St. Louis court (56 F. 496, Hallett J.) found "a fair preponderance of
      testimony in support of the Goebel claim" and refused an injunction on condition of a $20,000 bond. That is two cases against one, on a preliminary
      record and under different burdens of proof.
    statement_kind: judgment
    evidence_class: primary_text
    confidence: low
    evidential_weight: 3
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: >
      Taught in Germany for over a century (streets and schools named for Göbel; promoted under the Nazi
      state, per V0 sources). His hometown, Springe, is reported in the first version of this dig to call the question "debatable" (springe.de);
      that wording could not be found again on 2026-10-02 and is unverified.
    would_change_if: >
      a dated document from before 1879 (newspaper, advertisement, letter, patent caveat) describing
      Göbel's lamp is found, or a full trial record tests the affidavits
    positions:
      - {label: "Improbable or not proved", holder: "Colt J. (D. Mass.), Seaman J. (E.D. Wis.), Seventh Circuit", ground: "the state of the art, the lamps' defective vacuum, lamp No. 4's impossible date, and the rule that a new defence against an upheld patent needs convincing proof"}
      - {label: "A fair preponderance of testimony for Göbel", holder: "Hallett J. (E.D. Mo.)", ground: "affidavits of witnesses 'of good repute', recent test lamps 'reasonably effective', and a defence that 'puts the case in doubt' sufficing to refuse an injunction"}
      - {label: "No dated document before 1882 either way", holder: "this dig's reading", ground: "the earliest dated traces are Curtis (early 1882), Eaton (May 1882), Dreyer's option (1882) and the 28 Nov 1882 offer; Göbel's only lamp patent (1882) is a socket detail"}
    disputed_by:
      - {who: "Colt J. (54 F. 678)", kind: person, position: "Extremely improbable that Göbel built a practical lamp in 1854; lamps 1 to 3, if made, were experimental toys that do not anticipate Edison", source_read: "54 F. 678 (D. Mass., 18 Feb 1893)", via: "preliminary injunction on affidavits"}
      - {who: "Seaman J. (57 F. 616) and the Seventh Circuit (61 F. 834)", kind: institution, position: "The Göbel defence is not proved by convincing evidence; the story is surrounded by 'an atmosphere of improbability'", source_read: "57 F. 616 and 61 F. 834", via: "one case, preliminary injunction and appeal"}
    anchor:
      type: primary_text
      description: "54 F. 678 (D. Mass., 18 Feb 1893), Colt J.; 56 F. 496 (E.D. Mo., 21 Apr 1893), Hallett J.; 57 F. 616 (E.D. Wis., 20 Jul 1893), Seaman J.; 61 F. 834 (7th Cir., 1 May 1894); US 266,358 (1882), Göbel's lamp patent, a socket detail; US 47,632 (1865), Göbel's sewing-machine hemmer."
      sources: [src-54f678, src-56f496, src-57f616, src-61f834, src-us266358, src-us47632]
      nodes:
        - {node: lamp-1893-02-18-colt-rules-on-goebel-defence-boston, verb: disputes}
        - {node: lamp-1893-04-21-hallett-refuses-injunction-goebel-defence-st-louis, verb: supports}
        - {node: lamp-1893-07-20-seaman-grants-injunction-goebel-defence-wisconsin, verb: disputes}
        - {node: lamp-1894-05-01-seventh-circuit-affirms-wisconsin-goebel-ruling, verb: disputes}
        - {node: lamp-1882-early-curtis-hears-goebel-story, verb: qualifies}
        - {node: lamp-1882-05-eaton-told-of-goebel-claim, verb: qualifies}
        - {node: lamp-1882-dreyer-option-on-goebel-inventions, verb: qualifies}
        - {node: lamp-1882-10-24-goebel-patent-266358, verb: qualifies}
        - {node: lamp-1882-11-28-goebel-offer-to-edison-company, verb: qualifies}
        - {node: lamp-1865-05-09-goebel-sewing-machine-hemmer-patent, verb: qualifies}
    basis: >
      # V: V2 for all opinions and both patents. Changed from "refuted" in the revision of 2026-10-02, under the dig's single standard
      #    (S2, S4): a refutation needs a dated document read directly that shows the claim false; the record has the court rulings and
      #    no dated document either way before 1882. The rulings are findings on affidavits, preliminary and not a trial; the absence of a
      #    pre-1882 document does not refute (the same reason the dig keeps de la Rue, Davy and Swan's 1850s as gaps). The first version also
      #    counted "four courts" and "three of four"; the Seventh Circuit appeal is the same case as the Wisconsin ruling, so it is
      #    two against one. About forty affidavits, five of them by Göbel's children and one by a niece, put his lamps between 1850 and
      #    1882 (Colt J.); the Edison side's affidavits deny lamp displays about 1860 and say lamps 1-3 were never practically operative.
      #    Göbel's 1882 patent on a small lamp part sits badly with having invented the whole lamp 28 years earlier, but that is an inference.
      #    Rohde (2007) reportedly found the false details came largely from the lawyers' presentation (V0; book not read).
      #    The earliest dated traces are not the 28 Nov 1882 offer alone: Curtis first heard of Göbel "in the early part of 1882" (he made further
      #    inquiries in 1892; the defence was put forward in the 1893 suits), Eaton was told in May 1882, and Dreyer took an option in 1882.


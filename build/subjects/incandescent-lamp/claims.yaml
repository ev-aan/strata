headline: "No one person invented the bulb: carbon lamps were patented by 1845; Edison v Swan is unsettled"
headline_claim: lamp-edison-sole-inventor
headline_status: draft
dig_status: open
search_summary: >
  Who invented the light bulb? Not Edison alone: a British patent of 1841 covers an electric light fed with powdered charcoal in an
  exhausted globe, a British patent of 1845 covers a heated carbon conductor in a vacuum, Swan reported a glowing carbon rod in
  1878, and Edison's 1880 patent was upheld by US courts for a high-resistance carbon filament in an all-glass bulb. Whether Edison or Swan first made a practical lamp is unsettled.

assessment:
  question: "Who invented the light bulb?"
  answer: partly
  headline: "Partly Edison, but not him alone: patents for electric lamps go back to 1841, and whether Edison or Swan first made a practical lamp is unsettled."
  text: >
    "The light bulb" covers at least four different firsts: a patent for an electric light or lamp, a lamp with a heated carbon conductor in
    a vacuum, a lamp practical to make and use, and a lamp run from a central supply. On the first two, the documents read here put others
    ahead of Edison: de Moleyns's British patent of 1841 (an electric light fed with powdered charcoal in an exhausted globe, which the
    Supreme Court calls incandescent but whose abridgment does not), King's of 1845 (heated carbon conductors, carbon in a vacuum; Starr is
    named by later sources), and, as a reported experiment, Swan's glowing carbon rod of December 1878.
    On the third, the courts found Edison's lamp "practically operative and successful" and upheld his patent on a high-resistance carbon
    filament in an all-glass exhausted bulb; Swan, by his own account, showed a very thin carbon lamp in October 1880 and Swan lamps lit
    Cragside (1880, per an archive blog, a proposed claim only) and the Savoy stage (28 December 1881, per a transcription of The Times), both before Edison's Pearl
    Street service began on 4 September 1882, but no document read shows who first made or sold a practical lamp. On the fourth, Edison's
    company is the one documented. Two national stories (Lodygin's, and Woodward and Evans's) each hold a real record that
    is stretched beyond what it shows (Lodygin's "first" is refuted, the Canadian sale is unsupported on the documents read), and a Latimer misattribution is refuted on his patents; the Goebel
    1854 lamps are contested, resting on affidavit testimony (about forty affidavits per Colt J.) that US courts weighed differently on preliminary
    motions, with no dated document from before 1882 either way; de Changy's 1858 lamps are known only through Fontaine and his claim to be first is not dug.
    One stated standard (S1 to S4, in the description) is applied to every claimant, but the depth differs: some anchors are patent abridgments, a blog or
    a transcription, and the one exception is named: the Cragside date rests on a blog about a letter nobody read, so it is filed as its own proposed claim (lamp-swan-cragside),
    not as established. We therefore say "partly", not "Edison" and not "Swan".
  key_points:
    - "An 1841 British patent (de Moleyns) covers an electric light in an exhausted globe, an 1845 one (King) a heated carbon conductor: Edison was not first to patent one."
    - "US courts upheld Edison's 1880 patent for a high-resistance carbon filament in an all-glass bulb; his company began Pearl Street service on 4 September 1882."
    - "Swan reported a glowing carbon rod in 1878; Swan lamps lit Cragside (per a blog) and the Savoy (per a transcript) before Pearl Street; no document shows who sold first."
  basis: [lamp-edison-sole-inventor, lamp-de-moleyns-patent, lamp-starr-king-patent, lamp-earliest-patent, lamp-edison-patent-upheld, lamp-first-practical-priority, lamp-swan-before-edison, lamp-pearl-street, lamp-goebel-claim]
  would_settle: "A dated sale, order, price list or company record showing which of Swan's or Edison's lamps was first made and sold for ordinary use, and a dated pre-1882 document for or against Goebel's lamps."

subject: incandescent-lamp
question: "Who invented the light bulb?"
title: "Who invented the light bulb? (the invention era, 1802-1895)"
description: >
  "Who invented the light bulb?" has a famous answer (Edison) and several national counter-answers
  (Swan for Britain, Woodward and Evans for Canada, Göbel for Germany, Lodygin for Russia, de Changy
  for Belgium). This dig treats every one of those answers the same way: each is a claim that must
  be anchored to a dated document from the time. The founding core runs from Davy's battery lights
  to the 1895 Supreme Court ruling that closed the patent fight. Later metal filaments (tungsten,
  1900s) are out of scope for now except where a claimant's own patent reaches into them.
  THE STANDARD, stated so that it can be checked (and applied to Edison's side as well): (S1) a claim that someone did something by a
  date is "established" only if a dated document of the time that records it was read directly; a document known only as quoted in
  one later book, or a later self-account, is a single channel (filed as proposed, contested or a searched gap, never established).
  (S2) A claim that someone was "first" is refuted only by a dated document, read directly, that shows an earlier person did the same
  thing; the absence of an earlier document never refutes it (that is a searched gap, capped at provisional). (S3) A patent proves what
  was claimed and described on its date, not that a lamp was built or worked; "built" needs a report of the lamp. (S4) A court's
  finding on affidavits is primary text for what the court found, not a document of the period it describes. Under S1 to S4 the
  claims for de Changy and Lodygin are single-channel (Fontaine), Cragside is single-channel (an archive blog about a letter not read), Goebel's 1854 lamps are contested, and Swan's 1850s work is a gap.
  Two established claims are still anchored below primary (the Savoy report, read in a transcription; the 22 Oct 1879 notebook entry, read in the Edison Papers' transcription) and are shown as limits.

# ---------------------------------------------------------------------------
# VERIFICATION LEVELS (as in apollo-landings):
#   V0 single source | V1 2+ independent secondary sources agree | V2 primary document opened and read
# What was opened at V2 in the first session (2026-10-02):
#   US patents 223,898 (Edison), 181,613 (Woodward), 252,386 (Latimer), 47,632 and 266,358 (Göbel),
#     575,002 (Lodygin): USPTO image server and Google Patents
#   Court opinions: 40 F. 21 (1889), 47 F. 454 (1891), 52 F. 300 (1892), 54 F. 678, 56 F. 496,
#     57 F. 616 (all 1893), 61 F. 834 (1894): Caselaw Access Project / law.resource.org scans
#   Supreme Court, The Incandescent Lamp Patent, 159 U.S. 465 (decided 11 Nov 1895): LoC scan
#   British patent abridgments, Electricity and Magnetism (1859): de Moleyns 1841, King 1845
#   Chemical News 39 (1879) and 42 (1880): Swan's demonstrations and his own 1880 lecture
#   Scientific American 12 Sep 1874: Canadian patent 3,738 listing
#   NY Herald 21 and 31 Dec 1879; NY Tribune 1 Jan 1880 and 5 Sep 1882 (Chronicling America)
#   Davy, Elements of Chemical Philosophy (1812; the Bradford and Inskeep edition on the Internet Archive);
#     Fontaine, Electric Lighting (1878 trans.)
#   Dyer and Martin, Edison: His Life and Inventions (1910), vol. II pp. 615-616
#   Electrical World and Engineer, 14 Apr 1900
# Re-read in the revision of 2026-10-02: all the court opinions, the Supreme Court scan, the abridgments (pp. 62-63, 97-98),
#   Chemical News 39 (pp. 133, 168 and Proctor's note) and 42 (pp. 227-230), Fontaine pp. 169-173 and 186-191, the Tribune of
#   5 Sep 1882 and 1 Jan 1880, the Herald of 21 and 31 Dec 1879, both Kommersant pages, the Edison Papers essay, the
#   Edison Papers edition of Batchelor's notebook entry of 22 Oct 1879 (Doc. 1831), the Edison Papers pages on Latimer and on
#   Edison and Swan United, the Times transcription, the IET blog, and US 247,097 (new). Davy's 1812 pp. 85-86 and Edison's
#   patent text were re-read from the first session's OCR files.
# Blocked or unreachable in the revision: the Edison Papers notebook viewer (browser check; the notebook images were not opened),
#   The Canadian Encyclopedia (HTTP 403), Google Patents (intermittent), Espacenet, Library and Archives Canada.
# ---------------------------------------------------------------------------

divergence_note: >
  Adoption says "Edison" almost everywhere, and in each claimant's country it says "ours". The evidence
  says the question is badly formed: "invented" covers at least four different firsts (a patent, a lamp
  with a heated carbon conductor in a vacuum, a lamp practical to make and use, a complete wired system), and they have different
  answers. Several national stories hold one true fact (a real patent, a real report, a real demonstration) that is then stretched into
  "first": that is shown for Lodygin and for Woodward and Evans; Göbel's is contested and de Changy's first-claim is not dug. The two loudest priority claims
  against Edison, Göbel's 1854 lamps and the Canadian sale, differ in kind: for Göbel there are about forty affidavits but no dated document from before 1882
  either way (the courts split on preliminary motions); for Woodward and Evans there is a real patent and no document of a sale. Two gaps are left open and are not closed by either side: Swan's early work survives only in his own 1880 account, and nothing read shows who first sold
  a practical lamp, Swan or Edison.

claims:

  # =========================== PRECURSORS ===========================

  - id: lamp-davy-arc
    state: established
    statement: >
      Humphry Davy published an account of a brilliant arc of light between two charcoal points,
      powered by the Royal Institution's 2,000-plate battery; the charcoal itself was "ignited to whiteness". This is an arc light, not an
      incandescent lamp: the light comes mainly from a discharge across a gap, not from a solid glowing inside a bulb.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 3
    adoption_note: >
      "Davy invented the first electric light" is common in school material, often run together
      with the bulb.
    would_change_if: >
      an earlier published description of a sustained carbon arc is found (claims of earlier arcs
      by others exist and are not yet dug)
    anchor:
      type: primary_text
      description: "Davy, Elements of Chemical Philosophy (1812; the Bradford and Inskeep edition scanned on the Internet Archive), pp. 85-86, read in OCR."
      sources: [src-davy-1812]
      nodes: [{node: lamp-1812-davy-publishes-carbon-arc, verb: supports}]
    basis: >
      # V: V2 for the text. The book gives no date for the demonstration; 1808, 1809 and 1810
      #    all trace to later histories (the Supreme Court in 1895 says 1810). Date filed as a gap (lamp-davy-dates).
      Proves electricity could make useful light by 1812. Does not bear on the incandescent lamp.

  - id: lamp-davy-dates
    state: searched_gap
    statement: >
      The date of Davy's first arc demonstration (given variously as 1808, 1809 or 1810; the Supreme Court in 1895 says "as early as
      1810") and whether his 1802 papers describe wires or charcoal glowing as a light source are not yet read in the
      original.
    statement_kind: search_result
    evidence_class: primary_text
    confidence: low
    evidential_weight: 1
    anchor_checked: no
    adoption_weight: 3
    adoption_note: "Popular accounts give a single confident year; they do not agree on which."
    would_change_if: "the Journals of the Royal Institution (1802) and the Royal Institution's lecture records are read"
    next_step: >
      Read Davy's 1802 papers in the Journals of the Royal Institution, vol. 1 (the University of
      Pennsylvania transcription returned 403 from here; try the Royal Institution archive or a Google Books scan).
    anchor:
      type: search-record
      description: "Searched: Davy's 1812 book (no date for the demonstration) and the Supreme Court's passage (a court's statement, 1810). Not read: Journals of the Royal Institution, vol. 1 (1802)."
      sources: [src-davy-1812, src-scotus-1895]
    basis: "A search snippet quotes iron wire 'rendered white-hot'. Not read; V0."

  - id: lamp-de-la-rue-1840
    state: searched_gap
    statement: >
      The often-repeated claim that Warren de la Rue made a platinum-coil lamp in an evacuated tube in
      1840 has no primary record found. The trail leads to a 1927 history that dates a de la Rue lamp
      to 1820 and says its vacuum is unexplained, while a 1923 Smithsonian history credits the 1840
      platinum-coil lamp to William Grove instead.
    statement_kind: search_result
    evidence_class: synthetic
    confidence: low
    evidential_weight: 1
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: >
      Very widely repeated online and in school material as the "first light bulb", usually with
      the 1840 date and no citation.
    would_change_if: >
      a paper, notebook or lecture report by de la Rue from 1820-1850 describing the lamp is found,
      or Grove's own 1840 description is read and shows the attribution swapped
    next_step: >
      Search de la Rue's and Grove's papers in Philosophical Magazine and Proceedings of the Royal
      Society, 1838-1845, for a platinum lamp; then check which history first wrote "de la Rue, 1840".
    anchor:
      type: search-record
      description: "Howell and Schroeder, History of the Incandescent Lamp (1927): 'De la Rue ... 1820'; Schroeder, History of Electric Light (Smithsonian, 1923): Grove, 1840. Searched and not found: Fontaine (1878), the 1859 British abridgments."
      sources: [src-howell-schroeder-1927, src-schroeder-1923]
    basis: >
      # V: V2 for what the two histories say; V0 or less for the lamp itself.
      Fontaine (1878) and the 1859 British patent abridgments do not mention a de la
      Rue lamp. Absence is not refutation (S2), so this stays a gap, not refuted. The likeliest reading is a
      merge of the 1820 de la Rue story with Grove's 1840 lamp, which is itself unread.

  - id: lamp-de-moleyns-patent
    state: established
    statement: >
      Frederick de Moleyns received British patent No. 9053 on 21 August 1841. One of its heads is "a means of generating the electric light"
      by supplying pulverized charcoal to the junction of two platinum-wire coil electrodes, the whole enclosed in an exhausted glass
      globe. The Patent Office's abridgment does not use the words "glow" or "incandescent"; the Supreme Court (1895) describes the patent
      as one for an incandescent electric lamp using finely pulverized boxwood charcoal or plumbago.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Known to historians of the lamp; almost absent from popular accounts."
    would_change_if: "the full specification shows a different design from the abridgment"
    anchor:
      type: primary_text
      description: "Patents for Inventions: Abridgments of Specifications relating to Electricity and Magnetism (1859), pp. 62-63 (No. 9053, A.D. 1841, August 21): second head quoted; 159 U.S. 465 (1895), the Court's description of the patent."
      sources: [src-abridgments-1859, src-scotus-1895]
      nodes: [{node: lamp-1841-08-21-de-moleyns-patent-9053, verb: supports}]
    basis: >
      # V: V2 for the abridgment (the Patent Office's own published summary). The full specification
      #    was not read. The abridgment describes a flow of powdered charcoal at the electrodes, which reads like an arc fed with charcoal;
      #    whether the lamp glows as an incandescent body is the Supreme Court's description, not the abridgment's.
      Whether this is the first such patent is a separate, absence-based claim: lamp-earliest-patent.

  - id: lamp-earliest-patent
    state: established
    statement: >
      Two absences, not one. (1) No patent earlier than de Moleyns's of 1841 for an electric light in an enclosed globe (his: powdered charcoal fed to platinum-coil
      electrodes in an exhausted glass globe) has been found in the 1859 British abridgments. (2) No document earlier than King's 1845 patent for a heated conductor
      in a vacuum has been found: the abridgment says "intensely heated" conductors and carbon "enclosed in a Torricellian vacuum", and Fontaine's 1878 search
      found nothing before it ("The first document on the question that we have found"; he had missed de Moleyns, which he did not find).
    statement_kind: search_result
    evidence_class: primary_text
    confidence: provisional   # absence anchor: capped at provisional
    evidential_weight: 3
    anchor_checked: primary
    absence_anchor: true
    adoption_weight: 2
    adoption_note: "Histories that mention de Moleyns usually call his the first patent."
    would_change_if: >
      an earlier patent (in Britain, France, the US or elsewhere) for an electric light in an enclosed globe, or for an electrically heated
      conductor in a vacuum, is found
    anchor:
      type: primary_text
      description: "Abridgments ... Electricity and Magnetism (1859): no earlier lighting entry read; Fontaine (1878), p. 169: 'The first document on the question that we have found, is an English patent of the 4th November, 1845.'"
      sources: [src-abridgments-1859, src-fontaine-1878]
    basis: >
      Two searched absences in two countries' records (British abridgments; a French engineer's survey).
      French and US patent indexes before 1841 were not searched.

  - id: lamp-starr-king-patent
    state: established
    statement: >
      British patent No. 10,919 of 4 November 1845, issued to Edward Augustin King "(a communication)", covers "the application of
      continuous metallic and carbon conductors, intensely heated by the passage of a current of electricity, to the purposes of
      illumination": thin platinum foil, or carbon enclosed in a Torricellian vacuum (the empty space above a column
      of mercury). Judge Colt (1893) says Starr "suggested in the King patent a lamp composed of a thin pencil of carbon, inclosed in a
      Torricellian vacuum"; Fontaine (1878) draws the lamp as a carbon rod in a glass bell over mercury. The abridgment does not name
      Starr; later sources identify the inventor behind the communication as John Wellington Starr of Cincinnati.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Known to specialists; Starr is sometimes promoted as the 'American before Edison'."
    would_change_if: >
      the full specification shows something other than a carbon conductor in a vacuum, or the Starr
      identification is contradicted by a document from the 1840s
    anchor:
      type: primary_text
      description: "Abridgments ... Electricity and Magnetism (1859), pp. 97-98 (No. 10,919); 40 F. 21 (1889), quoting the specification; 54 F. 678 (1893): the court's description of Starr's lamp as prior art; Fontaine (1878), pp. 169-170."
      sources: [src-abridgments-1859, src-40f21, src-54f678, src-fontaine-1878]
      nodes: [{node: lamp-1845-11-04-king-starr-patent-10919, verb: supports}]
    basis: >
      # V: V2 for the patent abridgment and for the courts' and Fontaine's descriptions. The Starr identity is V1 (Judge Colt;
      #    Schroeder 1923; Howell and Schroeder 1927, whose authors overlap, so they are one channel). The full specification was not read.
      Carbon in a vacuum, the core idea of the later lamp, is patented here 34 years before Edison's US patent. A patent shows the design
      described on its date, not that a lamp was built (S3).

  - id: lamp-de-changy-belgium
    state: proposed
    statement: >
      Fontaine (1878) prints a communication he says "M. Jobart, of Brussels" made to the Academy of Sciences on 27 February 1858
      about the lamps of de Changy: small lamps "enclosed in hermetically sealed glass tubes", lit by "the incandescence of platinum",
      intended for mines and street lighting, one of which "was lit in the hollow of my hand". Fontaine places de Changy "in Belgium"
      and dates his substitution of platinum for carbon to 1857; Howell and Schroeder (1927) call him a French civil engineer who held a
      Belgian patent of 1856. His nationality is therefore not settled here. This is one witness (Jobard) relayed through one book.
    statement_kind: reported
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 2
    adoption_note: "Promoted in Belgium (not sourced in this dig); Howell and Schroeder (1927) call de Changy French."
    would_change_if: "Jobard's report in the Comptes rendus (1858) is read and says otherwise, or confirms it in the original"
    anchor:
      type: primary_text
      description: "Jobard's 1858 communication as quoted in Fontaine, Electric Lighting (1878), pp. 186-187; Howell and Schroeder (1927), p. 33 (nationality and patent)."
      sources: [src-fontaine-1878, src-howell-schroeder-1927]
      nodes: [{node: lamp-1858-02-27-jobard-reports-de-changy-lamps, verb: supports}]
    basis: >
      # V: V2 for Fontaine's quotation; the Comptes rendus original was not opened, so anchor_checked is secondary.
      #    Lowered from established (first version of this dig): under S1 a document known only through one later quotation is a single
      #    channel. A Belgian patent of 1856 is given by Howell and Schroeder only; Hammer (1900), cited in the first version, was not read.
      SINGLE-CHANNEL FLAG: this claim and lamp-lodygin-1872-74 both rest on one book, Fontaine (1878), which is the only channel to
      the Comptes rendus 1858 report and to the Academy's 1874 report. Re-anchor each to its original before raising either.
      Whether the tubes were exhausted is not stated in the passage read.
      A separate claim that Jobard made a carbon-in-vacuum lamp in 1838 was not found in Fontaine,
      Hammer, Schroeder or the abridgments, and is not filed as a claim here.

  # =========================== RUSSIA: LODYGIN ===========================

  - id: lamp-lodygin-1872-74
    state: proposed
    statement: >
      Fontaine (1878) says that in 1873 a Russian physicist, Lodygin, invented a new lamp in which small carbon bars are heated in a
      hermetically sealed glass receiver from which the oxygen is expelled, and that in 1874 the St Petersburg Academy of Sciences awarded
      him "a high prize" (the Lomonosov prize) on a report by Wild; Fontaine adds "Nothing is less practical nor less studied than the apparatus of this inventor."
      Kommersant (2024) gives 1872 for Lodygin's first demonstration (no place is given for it) and says the home patent office issued him privilege No. 1619 on 11 July 1874 with its priority dated "retroactively, from 2 October 1872".
    statement_kind: reported
    evidence_class: primary_text
    confidence: low
    evidential_weight: 2
    anchor_checked: secondary
    adoption_weight: 4
    adoption_note: "Standard in Russian textbooks and media; little known elsewhere."
    would_change_if: "the Academy's 1874 prize report or the privilege itself is read and disagrees or confirms"
    anchor:
      type: primary_text + secondary
      description: "Academy report by Wild, quoted in Fontaine (1878), pp. 171-173; Kommersant (St Petersburg, doc 6822124): 1872 first demonstration and petition, privilege No. 1619 of 11 July 1874 with priority from 2 Oct 1872."
      sources: [src-fontaine-1878, src-kommersant-lodygin]
      nodes:
        - {node: lamp-1873-lodygin-carbon-rod-lamps, verb: supports}
        - {node: lamp-1874-lomonosov-prize-lodygin, verb: supports}
        - {node: lamp-1874-07-11-lodygin-russian-privilege, verb: supports}
    basis: >
      # V: V2 for Fontaine's quotation, V0 for the newspaper. Lowered from established and re-scoped (first version of this dig): under S1 the
      #    Academy report is known only through one later book. Dates disagree: Fontaine says 1873, Kommersant 1872 (shown as a ghost marker).
      #    The privilege number 1619 and the backdated priority date 2 Oct 1872 ARE in Kommersant doc 6822124 ("privilege No. 1619 ... the priority was
      #    dated retroactively, from 2 October 1872"); the first version of this revision wrongly said they were not (corrected in log L-19). They rest on one later
      #    newspaper history with no scan of the privilege. The often-quoted 50,000-rouble prize is not supported by either source: Fontaine says only
      #    "a high prize"; the figure is printed in Howell and Schroeder (1927).
      SINGLE-CHANNEL FLAG: the contemporary anchor is Fontaine alone (shared with lamp-de-changy-belgium); Kommersant is a later newspaper
      history and gives dates and a privilege number without a scan. Next step: read the Academy's 1874 prize report.
      Rods in a sealed vessel are real prior art; Fontaine says they did not last. Fontaine's own phrase "capital errors" refers to the report.

  - id: lamp-lodygin-first-claim
    state: refuted
    refutes_target: "Lodygin was the first inventor of the incandescent lamp (the first to describe or patent it)"
    refutation_class: narrative_drift
    statement: >
      Lodygin was not the first to patent an electric light or lamp in an enclosed globe: a British patent of 1841 (de Moleyns) covers an electric
      light fed with pulverized charcoal in an exhausted glass globe (the Supreme Court calls it incandescent; the abridgment does not), and one of 1845
      (King, for Starr) covers carbon and metal conductors "intensely heated" by a current, the carbon "enclosed in a Torricellian vacuum". The 1845 patent
      is the sound anchor for a heated carbon conductor in a vacuum.
      Those patents show earlier published designs, not that a lamp was built or worked (S3), so this does not show that anyone built a
      carbon lamp before Lodygin; the claim "first to build a working lamp" is not tested here.
    statement_kind: judgment
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 4
    adoption_note: >
      Widely taught in Russia. A Russian newspaper history (Kommersant, doc 5338615, read) places the
      "Lodygin before Edison" push in the 1947-48 campaign against "kowtowing to the West": it says that within a year of May 1947 Soviet newspapers
      reported that Lodygin made the lamp before Edison. That placement is V0, rests on one newspaper history, and is not used as evidence here.
    would_change_if: "the 1845 patent is shown not to describe a heated carbon conductor in a vacuum (or the 1841 patent not to describe a light in an exhausted globe), or a document earlier than Lodygin's records a working carbon lamp"
    anchor:
      type: primary_text
      description: "British patents 9053 (1841) and 10,919 (1845), as abridged by the Patent Office (1859), pp. 62-63 and 97-98."
      sources: [src-abridgments-1859]
      nodes:
        - {node: lamp-1841-08-21-de-moleyns-patent-9053, verb: supports}
        - {node: lamp-1845-11-04-king-starr-patent-10919, verb: supports}
    basis: >
      The true part ("before Edison") is kept in lamp-lodygin-1872-74. The drift is from "before
      Edison" to "first". Class narrative_drift, not institutional_propaganda: the Soviet campaign
      is reported by one newspaper history and is not anchored here.

  - id: lamp-lodygin-refractory-metals
    state: established
    statement: >
      Lodygin's US patent 575,002 (filed 4 January 1893, granted 12 January 1897; Lodygin "a citizen of Russia, residing in the city of
      Pittsburg") covers lamp filaments of refractory metals including molybdenum and tungsten.
    statement_kind: reported
    evidence_class: primary_text
    confidence: high
    evidential_weight: 5
    anchor_checked: primary
    adoption_weight: 2
    adoption_note: "Cited in Russian accounts as 'Lodygin invented the tungsten filament'."
    would_change_if: "the patent text is shown to cover something other than metal filaments"
    anchor:
      type: primary_text
      description: "US 575,002, Illuminant for incandescent lamps (Google Patents rendering of the USPTO record)."
      sources: [src-us575002]
      nodes: [{node: lamp-1897-01-12-lodygin-patent-575002, verb: supports}]
    basis: >
      # V: V2. Outside this dig's founding core (metal filaments are the 1900s); filed because it is
      #    Lodygin's own record. The story that he sold tungsten rights to General Electric in 1906 is

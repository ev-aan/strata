subject: incandescent-lamp

discriminating_tests:

  - id: dt-which-first
    question: >
      "Invented the light bulb" can mean five different firsts. For each, which dated document comes first?
      (1) electricity making light by heating a solid; (2) a patent on an incandescent lamp; (3) a carbon
      conductor in a vacuum; (4) a lamp practical to make and sell; (5) a lamp run from a central supply.
    retires: lamp-edison-sole-inventor
    predicts:
      single-inventor: >
        IF one person invented the light bulb, the same name should come first on all five, or at least
        on the first three.
      cumulative-invention: >
        IF the lamp was built up by many people, different names should come first on different questions,
        and the later names should be first only on the practical and system questions.
    result:
      type: primary_text
      finding: >
        (1) Davy, by 1812 for the arc; glowing wires reportedly 1802 (gap). (2) de Moleyns, 1841, an electric light fed with powdered charcoal in an exhausted globe (the Supreme Court calls it incandescent; the Patent Office abridgment does not), the
        earliest found for an electric light in an exhausted globe (an absence-based result, provisional); row (3) is the earliest found for a heated carbon conductor in a vacuum. (3) King for Starr, 1845. (4) Edison's laboratory had "the first lamp that answers
        the purpose" by 16 Nov 1879 and the courts called his lamp "practically operative and successful"; Swan lamps lit Cragside in 1880 (per a blog only)
        and the Savoy stage on 28 Dec 1881; nothing read shows who first made or sold a practical lamp, so row 4 is contested
        (lamp-first-practical-priority). (5) Edison, Pearl Street, 4 Sep 1882. Different names lead different questions.
      accessible: true
    resolves: >
      The single-inventor story fails on questions 1 to 3, which are answered by patents and printed
      reports that anyone can read (patents show earlier designs, not that lamps were built). Edison is the one documented on 5; row 4 is
      open between Edison and Swan. Verification: V2 for every row except Davy's 1802 papers, and V1 or V2 for Cragside and the Savoy.
    note: >
      Retired by documents, not by the number of historians who say "it was gradual". The test does not
      decide the Swan versus Edison question on 4, which stays contested (the first version of this test said Edison "shares 4" with Swan,
      which was too settled).

  - id: dt-goebel-paper-trail
    question: >
      Does any document dated before 1879 record Göbel's carbon-filament lamps?
    retires: lamp-goebel-claim
    predicts:
      goebel-lamps-1854: >
        IF Göbel lit his New York shop with practical lamps in the 1850s, there should be some trace from
        the time: a newspaper notice, an advertisement, a letter, a patent caveat, or witnesses whose
        accounts agree on details.
      story-built-later: >
        IF the story was assembled for litigation, the record should begin around 1882, when the rights were
        being sold, and exhibits should show features from after 1879.
    result:
      type: primary_text
      finding: >
        The earliest dated traces are all of 1882, as recorded in 54 F. 678: Curtis first heard the story "in the early part of 1882", the
        Dickersons told Eaton of it in May 1882, Dreyer took an option on Göbel's lighting inventions in 1882, and Göbel's son offered them to
        the Edison company for $20,000 on 28 Nov 1882. The Boston court found exhibit lamp No. 4 could not have
        been made before 1872 (a credibility finding), and neighbours' affidavits denied lamp displays around 1860. Göbel's own
        1882 patent covers only a socket detail.
      accessible: true
    resolves: >
      Does NOT retire the 1854 claim (revised 2026-10-02: the first version said it retired it at moderate confidence). No dated document
      from before 1882 was found for or against it, and the court rulings are preliminary findings on affidavits, under different burdens
      of proof; two cases (Boston; Wisconsin with its Seventh Circuit appeal) went against Göbel and one (St. Louis) for him. The claim is
      filed as contested at low confidence. Rests on primary court records and patents, read in full.
    note: >
      The absence of dated documents before 1882 is searched absence within the court record and this session's
      searches, not an exhaustive archive search, and it cannot refute (S2). A dated 1850s document would settle it one way or the other.

  - id: dt-woodward-design
    question: >
      Does the Woodward and Evans patent describe the lamp that Edison patented?
    retires: lamp-canada-invented-claim
    predicts:
      edison-built-on-it: >
        IF Edison's lamp derived from Woodward's, the 1876 patent should describe a thin carbon filament in
        a high vacuum, sealed in all-glass, or Edison's records should show use of its design.
      separate-designs: >
        IF the designs are different, Woodward's patent should describe something else.
    result:
      type: primary_text
      finding: >
        US 181,613 describes a piece of carbon between two electrodes in a globe emptied of air and refilled with a rarefied
        gas that does not combine with hot carbon, which it says "becomes luminous". Edison's US 223,898 claims a thin high-resistance
        carbon filament in an all-glass globe exhausted to about one-millionth of an atmosphere.
      accessible: true
    resolves: >
      The designs differ on every point Edison's patent claims. Whether Edison bought the rights is a
      separate question and stays a gap (lamp-edison-bought-woodward); buying a patent would not make it
      the source of a different design.
    note: "Both patents read in full (V2)."

subject: incandescent-lamp

threads:

  - id: thread-national-priority
    type: reception-overlay
    title: "'Our inventor came first': the national light-bulb stories"
    confers_weight: false   # T4: required for reception overlays
    description: >
      Six countries have a light-bulb inventor story: the United States (Edison), Britain (Swan), Canada
      (Woodward and Evans), Germany (Göbel), Russia (Lodygin) and Belgium (de Changy). Each story takes one
      real record and stretches it into "first". The pattern is the same in every country, which is why
      every claimant is dug to the same standard here.
    members:
      - {claim: lamp-edison-sole-inventor, attestation: preserved}
      - {claim: lamp-swan-before-edison, attestation: preserved}
      - {claim: lamp-canada-invented-claim, attestation: preserved}
      - {claim: lamp-goebel-claim, attestation: preserved}
      - {claim: lamp-lodygin-first-claim, attestation: preserved}
      - {claim: lamp-de-changy-belgium, attestation: interpretive}
    overlay_notes:
      - >
        United States: the true core is the practical lamp and the Pearl Street system. The drift is to
        "invented the bulb".
      - >
        Britain: the true core is Swan's 1878-79 demonstrations and his 1880 lamp. The drift is to "Edison
        copied Swan", which no record read here supports.
      - >
        Canada: the true core is an 1874 patent. The drift is a sale with no document and a design that
        differs from Edison's.
      - >
        Germany: the true core is a real immigrant mechanic with a real 1882 lamp-part patent. The story of
        1854 lamps has no record before 1882 and was built in litigation. It later served national pride,
        including under the Nazi state (V0).
      - >
        Russia: the true core is a real 1872-74 lamp and Academy prize. The drift is from "before Edison"
        to "first", reportedly pushed hardest in the Soviet priority campaigns of 1947-48 (V0).
    firewall: >
      This thread records how priority stories travel and why they persist. It is mechanically barred
      (confers_weight: false) from adding evidential weight to any member claim. National pride and
      repetition are adoption weight; the patents and reports in claims.yaml are the evidence.

  - id: thread-edison-legend
    type: reception-overlay
    title: "The Edison legend: lone genius, ten thousand failures, New Year's Eve"
    confers_weight: false
    description: >
      The popular Edison story compresses a laboratory team, borrowed prior art, patent fights and a
      business into one man and one night. Its fixtures are the "10,000 ways" quote, a 40-hour first lamp,
      a grand New Year's Eve 1879 unveiling, and Edison as sole inventor.
    members:
      - {claim: lamp-10000-ways-quote, attestation: preserved}
      - {claim: lamp-edison-oct-1879-test, attestation: preserved}
      - {claim: lamp-menlo-park-dec-1879, attestation: preserved}
      - {claim: lamp-sawyer-man-priority, attestation: preserved}
    overlay_notes:
      - "The quote is about the storage battery (1910 text) and grew from 'several thousand' to '10,000' much later."
      - "The first long test ran 13 1/2 hours (Batchelor notebook), not 40."
      - "The 'public demonstration' was announced by one paper and denied by another the same week."
      - "Edison lost the Patent Office interference over paper carbons to Sawyer and Man (1885), a fact the legend omits."
    firewall: >
      Records reception only. Barred from lending weight to any claim (confers_weight: false). Correcting
      the legend does not shrink what the record shows Edison's team did; that is filed separately.

  - id: thread-corrective-overshoot
    type: reception-overlay
    title: "Corrective stories that overshoot: 'it was really Latimer' and 'it was really Tesla'"
    confers_weight: false
    description: >
      Modern stories that push back against the Edison legend sometimes replace one lone inventor with
      another. Latimer's real filament-making patent becomes "he invented the light bulb". Tesla, who did
      not work on the incandescent lamp in this period, is also named online; no record ties him to it and
      no claim is filed for him.
    members:
      - {claim: lamp-latimer-invented-claim, attestation: preserved}
    overlay_notes:
      - "Latimer's 1882 patent is a manufacturing process, assigned to a rival of Edison's."
      - "The Tesla attribution has no anchor at all; noted here so readers who arrive with it find an answer."
    firewall: >
      Barred from lending weight (confers_weight: false). The neglect these stories react to is real; the
      replacement attribution is not.

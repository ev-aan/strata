subject: incandescent-lamp

# Reception overlays (rule T4): confers_weight: false, and members may only be contested or
# interpretive claims. Refuted priority myths are NOT members; how they spread is traced in
# transmission.yaml and pointed to with `see_transmission` (a pointer, not membership).
# Member ids use the subject:claim form (rule T1).

threads:

  - id: thread-national-priority
    type: reception-overlay
    title: "'Our inventor came first': the national light-bulb stories"
    confers_weight: false   # T4
    description: >
      Six countries have an answer to "Who invented the light bulb?": the United States (Edison), Britain
      (Swan), Canada (Woodward and Evans), Germany (Göbel), Russia (Lodygin) and Belgium (de Changy). Each
      story takes one real record and stretches it into "first". The pattern is the same in every country,
      which is why every claimant is dug to the same standard here. Only the Swan-versus-Edison question is
      still live; the others are settled in claims.yaml and their spread is traced in transmission.yaml.
    members:
      - {claim: "incandescent-lamp:lamp-swan-before-edison", attestation: preserved}
    see_transmission: [tx-goebel-legend, tx-canada-sale, tx-lodygin-priority]
    overlay_notes:
      - "United States: the true core is the practical lamp and the Pearl Street system; the drift is to 'invented the bulb'."
      - "Britain: the true core is Swan's 1878-79 demonstrations and his 1880 lamp; the drift is to 'Edison copied Swan', which no record read here supports."
      - "Canada: the true core is an 1874 patent; the drift is a sale with no document and a design that differs from Edison's."
      - "Germany: the true core is a real mechanic with a real 1882 lamp-part patent; the 1854 lamps have no record before 1882."
      - "Russia: the true core is a real 1872-74 lamp and Academy prize; the drift is from 'before Edison' to 'first'."
      - "Belgium: de Changy's sealed platinum lamps (1858) are real; Belgian 'first' claims are not dug further here."
    firewall: >
      Records how priority stories travel and why they persist. Mechanically barred (confers_weight: false)
      from adding evidential weight to any claim. National pride and repetition are adoption weight; the
      patents and reports in claims.yaml are the evidence.

  - id: thread-edison-legend
    type: reception-overlay
    title: "The Edison legend: lone genius, ten thousand failures, New Year's Eve"
    confers_weight: false
    description: >
      The popular Edison story compresses a laboratory team, borrowed prior art, patent fights and a business
      into one man and one night. Its fixtures are the "10,000 ways" quote, a 40-hour first lamp, a grand
      New Year's Eve 1879 unveiling, and Edison as sole inventor. Only the New Year's Eve question is still
      contested; the rest are settled in claims.yaml.
    members:
      - {claim: "incandescent-lamp:lamp-menlo-park-dec-1879", attestation: preserved}
    see_transmission: [tx-10000-ways]
    overlay_notes:
      - "The quote is about the storage battery (1910 text) and grew from 'several thousand' to '10,000' by 1982."
      - "The first long test ran 13 1/2 hours (Batchelor notebook), not 40 (lamp-edison-oct-1879-test)."
      - "Edison lost the Patent Office interference over paper carbons to Sawyer and Man in 1885 (lamp-sawyer-man-priority)."
      - >
        Corrective stories can overshoot in the other direction: Latimer's real filament-making patent becomes
        "Latimer invented the bulb" (refuted: lamp-latimer-invented-claim), and Tesla, who did not work on the
        incandescent lamp in this period, is also named online. No record ties Tesla to it, so no claim is filed.
    firewall: >
      Records reception only. Barred from lending weight to any claim (confers_weight: false). Correcting the
      legend does not shrink what the record shows Edison's team did; that is filed separately.

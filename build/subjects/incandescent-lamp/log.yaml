  - id: L-11
    date: 2026-10-02
    entry: >
      BLOCKING 1 and 2. The headline was 115 characters and settled what the dig leaves open. Replaced by a 95-character headline that says
      what the documents show (patents from 1841, no one inventor) and what stays open (Edison's priority over Swan); headline_status stays
      draft because its second half rests on a contested claim, not on the headline claim. The search_summary and the headline had said at least
      six people "built" lamps before Edison, citing patents and "four 1890s court cases". Patents show designs, not builds; the "four
      court cases" were the Goebel rulings, which are now two cases against one (below) and no longer refute anything; and Swan's 1878
      lamp was a rod that blackened its globe (Chemical News 39). Reworded to what the anchors support: earlier patents describe the lamp; Swan
      reported a glowing rod; the courts upheld Edison's filament patent; whether Edison or Swan first made a practical lamp is unsettled.
      A new assessment block was added (answer: partly; three key points; no lean, because no basis claim at moderate or high confidence supports one).
  - id: L-12
    date: 2026-10-02
    entry: >
      BLOCKING 3, lamp-10000-ways-quote. "Not documented in Edison's lifetime" cannot rest on Dyer and Martin (1910): that book was
      published in his lifetime and gives Mallory's "I know several thousand things that won't work" about the storage battery after "over nine
      thousand experiments", with experiments later "over ten thousand". Reworded to "earliest version found"; confidence held at provisional
      (absence_anchor); confidence_reasons now say why (absence not searched in Edison's papers; a recollection in an authorised biography;
      one anchor); weight lowered from 4 to 3.
  - id: L-13
    date: 2026-10-02
    entry: >
      CORRECTION to L-04, to claim lamp-sawyer-man-priority and to timeline event a16 (BLOCKING 4a). L-04 stays as written and is itself wrong in part:
      it says the 1895 opinion "affirms that the patent was invalid and dismisses the bill". The opinion (read in full at tile.loc.gov) says
      that "the claims of this patent, with the exception of the third, are too indefinite to be the subject of a valid monopoly"; that
      the third claim (carbonised paper) was admitted not to be infringed; that priority "becomes unnecessary"; and that "the decree of the Circuit
      Court is Affirmed". The Circuit Court (Bradley J., 40 F. 21, 5 Oct 1889) had held the claims, apart from the third, invalid. The timeline
      label "holds the Sawyer-Man patent invalid" is corrected in the node, and the claim now states the holding in the Court's words. The scan
      prints the decision date as "November 11, 1815" (a misprint for 1895: October Term 1895, argued 29-30 Oct 1894) and the headnote prints
      the patent date as May 14 where the text says May 12, 1885; both noted in the manifest.
  - id: L-14
    date: 2026-10-02
    entry: >
      BLOCKING 4 (b) to (f), wording corrected in claims.yaml. (b) Bamboo: the Court says Edison "despatched a man to Japan" and that the
      messenger sent "to different parts of Japan and China" sent about forty kinds of bamboo; the opinion does not date the commercial lamps to
      1880 (that date is dropped) and its account rests on trial testimony. (c) de Moleyns: the Patent Office abridgment (pp. 62-63) says only
      "a means of generating the electric light, by constantly supplying the electrodes at their junction, with pulverized charcoal" between
      platinum coils "enclosed in an exhausted glass globe"; it does not say "glows" or "incandescent", which are the Supreme Court's words for
      the patent. (d) de Changy: Fontaine places him "in Belgium" (and Jobard "of Brussels"); Howell and Schroeder (1927) call him a French civil
      engineer holding a Belgian patent; his nationality is now stated as unsettled; Fontaine says Jobard's communication was made to the Academy
      on 27 Feb 1858 (not "a letter dated" that day). (e) Kommersant: the "1947-48 campaign" claim is in doc 5338615 (read this session; it says the
      campaign began on 9 May 1947 and that within the following year Soviet newspapers reported that Lodygin made the lamp before Edison), not
      in doc 6822124, which is the Lodygin article; 5338615 is now in the manifest, and 6822124 does not contain the privilege number 1619, the
      priority date 2 Oct 1872 or the Lomonosov prize, which the first version attributed to "Kommersant; lamptech": they are dropped.
      (f) Swan: "shortly before Christmas 1878" was the chairman's remark that his was the meeting "immediately preceding Christmas", plus
      Proctor's "our meeting in December, 1878"; no day is printed, so the 18 Dec date (from secondary summaries) is demoted to a window. "Almost two
      years ago" in the 1880 lecture refers to his previous lecture on electric lighting, "two years ago in action" to the little lamp, and "about
      twenty years ago" to the carbonised-paper arch (about 1860, not "the 1850s"). The first version's "large audience" is not in the lecture.

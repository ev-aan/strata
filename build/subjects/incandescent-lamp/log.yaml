      the 22 Oct 1879 test claim stays secondary.
  - id: L-16
    date: 2026-10-02
    entry: >
      NON-BLOCKING findings. A1 Goebel courts counted as two cases against one (Boston, 54 F. 678; Wisconsin, 57 F. 616, with its Seventh Circuit appeal,
      61 F. 834, the same case on a discretionary preliminary ruling) against one (St. Louis, 56 F. 496); precise quotations used (Colt:
      "extremely improbable"; lamp No. 4 "simply impossible, under the circumstances, to believe ... before 1872", a credibility finding); the Seventh Circuit says it
      is "without designing to suggest what result should be reached upon final hearing"; the courts applied different burdens (Colt, Seaman: a
      new defence against an upheld patent needs convincing proof; Hallett: a defence that "puts the case in doubt" suffices). A2 "no record before
      1882" is now "no dated document before 1882"; Colt notes about forty affidavits covering 1850 to 1882 and says the weight of evidence on the motion was
      that Goebel made lamps 1-3 or similar ones, which "at most" were "experimental toys". A3 the rejected second claim of US 266,358 is recorded in 54 F. 678, not in
      the patent (moved to the node and the claim's basis); US 47,632 (1865 hemmer) is now an anchor and a node. A4 Curtis heard the story "in the early
      part of 1882", inquired again in 1892 and the defence was put forward in the 1893 suits. A5 "Hiram Maxim's firm and a rival of Edison's" is not in US 252,386
      (the patent names only the United States Electric Lighting Company of New York); the Queens Library essay hosted by the Edison Papers (secondary, read) says
      Maxim was chief engineer and the company one of Edison's competitors; anchored there. A6 US 247,097 (Nichols and Latimer, 13 Sep 1881) added as a source and node;
      King 1845 is now an anchor of lamp-latimer-invented-claim. A8 lamp-edison-high-resistance and lamp-edison-sole-inventor now quote the courts: Wallace J.
      ("the first to make a carbon of materials and by a process which was especially designed to impart high specific resistance to it ... a lamp which was
      practically operative and successful") and Colt J.'s paraphrase of the earlier ruling ("a broad and fundamental invention, namely, an incandescent lamp,
      composed of a carbon filament, hermetically sealed in an all glass chamber exhausted to a practically perfect vacuum"). A9 the "built", "manufacture and sell"
      and "central station by 1882" facts are removed from lamp-edison-sole-inventor or moved to the claims that carry them. lamp-latimer-edison-role: the anchor
      is now the Queens Library essay (the earlier citation to the Edison Papers carbon-filament essay did not mention Latimer), evidence class synthetic, anchor_checked
      secondary. B3 tx-g-01 (28 Nov 1882) is no longer called the earliest trace and the "about 1850" detail moves to Curtis (new events tx-g-10 to tx-g-12); tx-g-07, tx-g-08
      and tx-g-09 are marked read: no with a note; tx-l-04 now cites the Kommersant page that was read and says no Soviet text was; the thread notes now carry source ids.
      Manifest: Davy 1812 is the American (Bradford and Inskeep) edition, not London; springe.de is unverified; The Canadian Encyclopedia and the Edison Papers notebook viewer are
      recorded as unreachable.
  - id: L-17
    date: 2026-10-02
    entry: >
      DATES AND PLACES (added requirement). Every dated event is now a shared node (build/nodes/lamp-*.yaml, 41 nodes) with time, precision, date_basis and, where uncertain, a window;
      timeline.yaml refers to them (node and rev), and the HTML was regenerated. Dates corrected against the sources: (1) 22 Oct 1879: Batchelor's entry is "[Menlo Park,] Oct 22nd 1879 9 A.M.";
      the lamp was "on from 1.30 AM till 3 pm 13 1/2 hour", raised for an hour, then cracked; the first version's notebook id N052105 was wrong (the edition gives N-79-07-31:105, TAED N052:52).
      (2) 4 Nov 1879: the first version cited 52 F. 300 for "application filed November 4, 1879"; those words were not found in the text of that opinion read; 40 F. 21 says
      "applied for November 4, 1879"; the patent is signed 1 November. (3) The 52 F. 300 phrase "not gained until October, 1879" was likewise not found and is dropped.
      (4) 31 Dec 1879: the Tribune of 1 Jan 1880 reports the evening of 31 Dec, the Herald of 31 Dec is datelined 30 Dec. (5) Pearl Street: "3 p.m. on 4 Sep 1882" confirmed in the
      Tribune of 5 Sep ("yesterday"), but it says the light was turned on "in part of the first of the districts". (6) Savoy: the Times describes an experiment at one performance on the afternoon
      of 28 Dec 1881, the first time the stage was lit electrically; the auditorium had had electric light since the opening. (7) Cragside: the IET blog gives 1880 for the lamps and 17 Jan 1881 for Armstrong's
      letter; "17 January 1881" is the letter's date. (8) Early 1885: the interference was "not finally decided until the beginning of 1885"; amendments followed in Feb-Mar 1885; the node is set to
      mid-January 1885 inside a window (it was 1 Feb). (9) Edison and Swan United: the page says "October 1883"; the "26 Oct" day had no source. (10) Woodward: the US patent says
      assignees "of same place" (Toronto) and Lindsay, Canada; not "Ontario". (11) The 1891 judgment in 47 F. 454 is dated July 1891 by 57 F. 616. (12) The Lodygin privilege number and priority date were
      not in the Kommersant pages and are dropped. Places are recorded only where a source names them, from the Nominatim gazetteer as orientation: Menlo Park, Pearl Street at Fulton Street,
      Newcastle, Cragside, the Savoy Theatre, Toronto, St Petersburg, Pittsburgh (Lodygin's patent), Bridgeport (Latimer, per the Queens Library essay), New York City, Belgium (de Changy, per
      Fontaine), the Royal Institution. Where the instruction expected more specific places the sources do not give them: the opinions name only "D. Massachusetts", "E.D. Missouri" and "E.D. Wisconsin" (not
      Boston, St. Louis or Milwaukee; Oconto is named only as the defendants' town), so those rulings are placed at state level with the uncertainty stated; Latimer's patents give New York, not Bridgeport,
      which comes from the secondary essay; Goebel's workshop is given only as New York in the patents and opinions (street addresses appear in 54 F. 678 but are not used).

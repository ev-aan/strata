      1882" is now "no dated document before 1882"; Colt notes about forty affidavits covering 1850 to 1882 and says the weight of evidence on the motion was
      that Goebel made lamps 1-3 or similar ones, which "at most" were "experimental toys". A3 the rejected second claim of US 266,358 is recorded in 54 F. 678, not in
      the patent (moved to the node and the claim's basis); US 47,632 (1865 hemmer) is now an anchor and a node. A4 Curtis heard the story "in the early
      part of 1882", inquired again in 1892 and the defence was put forward in the 1893 suits. A5 "Hiram Maxim's firm and a rival of Edison's" is not in US 252,386
      (the patent names only the United States Electric Lighting Company of New York); the Queens Library essay hosted by the Edison Papers (secondary, read) says

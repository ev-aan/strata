timeline:
  id: incandescent-lamp
  title: "The incandescent lamp: who did what, and when (1812 to 1895)"
  as_of: "2026-10-02"
  note: >
    Every event is a shared node (build/nodes/lamp-*.yaml) that holds the date, its basis and precision, the place where a source names one, and the
    sources; this file only says where each dot sits. Times are set to noon UTC and are drawn at day, month or year precision; the node's
    `date_basis` and, where the date is uncertain, its `window` say how the date was reached. A patent's grant date is used unless the label says filed.
    Events marked disputed have sources that disagree, as named in the detail. Claimed events with no dated record (Goebel 1854, Swan 1850s,
    de la Rue 1840) are not drawn as events; the earliest dated traces of the Goebel claim (1882) are. Places are given only where a source names them;
    the court rulings are placed at state level because the opinions do not name the sitting city.
panels:
  - id: century
    title: "Panel A: 1810 to 1895 (one tick per five years)"
    start: "1810-01-01T00:00:00Z"
    end:   "1896-01-01T00:00:00Z"
    tick_years: 5
    lanes: [britain, europe, russia, canada, usa, courts]
  - id: race
    title: "Panel B: 1878 to 1885, the race and the patent fight (one tick per year)"
    start: "1878-01-01T00:00:00Z"
    end:   "1886-01-01T00:00:00Z"
    tick_years: 1
    lanes: [britain, usa, press, courts]
lanes:
  britain: {label: "Britain (Davy, de Moleyns, King/Starr, Swan)"}
  europe:  {label: "Belgium and Germany"}
  russia:  {label: "Russia (Lodygin)"}
  canada:  {label: "Canada (Woodward and Evans)"}
  usa:     {label: "United States (Edison and rivals)"}
  press:   {label: "Newspapers"}
  courts:  {label: "Patent offices and courts"}
people:
  - {who: "Humphry Davy", detail: "Royal Institution chemist; his 1812 book describes the carbon arc."}
  - {who: "Frederick de Moleyns", detail: "British patent No. 9053, 1841: the earliest patent found for an electric light in an exhausted globe (powdered charcoal at platinum-coil electrodes)."}
  - {who: "John Wellington Starr / Edward Augustin King", detail: "British patent No. 10,919, 1845, issued to King as a communication; a later court and later sources name Starr as the inventor."}
  - {who: "de Changy", detail: "Worked in Belgium per Fontaine (Howell and Schroeder 1927 call him a French civil engineer with a Belgian patent); sealed platinum lamps reported by Jobard in 1858."}
  - {who: "Alexander Lodygin", detail: "Russian; carbon-rod lamps reported 1872-73; Academy prize 1874; later metal-filament patents."}
  - {who: "Henry Woodward and Matthew Evans", detail: "Toronto; Canadian patent 3,738 (1874); Woodward's US patent 181,613 (1876)."}
  - {who: "Joseph Swan", detail: "Newcastle; carbon-rod lamp described Dec 1878; a lamp shown at the Lit and Phil about two years before Oct 1880 (his own account); a lamp with a very thin carbon shown in his Oct 1880 lecture."}
  - {who: "Thomas Edison and his laboratory", detail: "Menlo Park; Charles Batchelor kept the notebook of the 22 Oct 1879 test."}
  - {who: "William Sawyer and Albon Man", detail: "New York; won the Patent Office interference on paper carbons (early 1885); their patent was held invalid in 1889 and the Supreme Court affirmed in 1895."}
  - {who: "Lewis Latimer", detail: "Carbon-making patent 252,386 (1882) and, with J. V. Nichols, a lamp-mounting patent (1881); only 252,386 names an assignee, the United States Electric Lighting Company (US 247,097 has no assignment line in the OCR read)."}
  - {who: "Heinrich (Henry) Goebel", detail: "New York mechanic; said he made lamps in the 1850s; the earliest dated traces of that claim in the court record are from 1882."}
  - {who: "Judges Wallace, Lacombe, Colt, Hallett, Seaman, Bradley, Brown", detail: "Wrote the opinions read for this dig (Brown for the Supreme Court)."}
sources: {}
events:
  - {id: a1, panel: century, lane: britain, node: lamp-1812-davy-publishes-carbon-arc, rev: 1, note: "An arc, not an incandescent lamp. The demonstration date (1808-1810) is not in the book."}
  - {id: a2, panel: century, lane: britain, node: lamp-1841-08-21-de-moleyns-patent-9053, rev: 1, note: "Earliest patent found for an electric light in an enclosed globe (not shown to be heated or glowing); the search was not exhaustive (see lamp-earliest-patent)."}
  - {id: a3, panel: century, lane: britain, node: lamp-1845-11-04-king-starr-patent-10919, rev: 1}
  - {id: a4, panel: century, lane: europe, node: lamp-1858-02-27-jobard-reports-de-changy-lamps, rev: 1, note: "Known only through Fontaine's 1878 quotation; Fontaine is the only channel for this and for Lodygin."}
  - {id: a5, panel: century, lane: russia, node: lamp-1873-lodygin-carbon-rod-lamps, rev: 3, note: "Fontaine judges the apparatus impractical."}
  - {id: a6, panel: century, lane: russia, node: lamp-1874-07-11-lodygin-russian-privilege, rev: 2, note: "Kommersant only (a later newspaper history; no scan of the privilege)."}
  - {id: a6b, panel: century, lane: russia, node: lamp-1874-lomonosov-prize-lodygin, rev: 1, note: "Prize per Fontaine; the amount is not given."}
  - {id: a7, panel: century, lane: canada, node: lamp-1874-08-03-woodward-evans-canadian-patent, rev: 1, note: "The Canadian specification was not read."}
  - {id: a8, panel: century, lane: canada, node: lamp-1876-08-29-woodward-us-patent-181613, rev: 1, note: "No document of an Edison purchase was found."}
  - {id: a9, panel: century, lane: britain, node: lamp-1878-12-swan-rod-lamp-newcastle-chemical-society, rev: 2, note: "A rod that blackened its globe; no lasting lamp."}
  - {id: a10, panel: century, lane: usa, node: lamp-1879-10-22-batchelor-cotton-thread-lamp, rev: 1, note: "13 1/2 hours, not 40."}
  - {id: a11, panel: century, lane: usa, node: lamp-1880-01-27-edison-patent-223898-granted, rev: 1, note: "Filed 4 Nov 1879 (node lamp-1879-11-04-edison-files-patent-223898)."}
  - {id: a12, panel: century, lane: usa, node: lamp-1882-09-04-pearl-street-district-service-begins, rev: 1, note: "Generation, wiring and metering were the commercial invention; the lamp was one part."}
  - {id: a13, panel: century, lane: courts, node: lamp-1885-early-sawyer-man-win-interference, rev: 1}
  - {id: a13b, panel: century, lane: courts, node: lamp-1889-10-05-bradley-holds-sawyer-man-claims-invalid, rev: 1}
  - {id: a13c, panel: century, lane: courts, node: lamp-1891-47f454-wallace-upholds-edison-lamp-patent, rev: 1}
  - {id: a14, panel: century, lane: courts, node: lamp-1892-10-04-appeals-court-affirms-edison-patent, rev: 1}
  - {id: a15, panel: century, lane: courts, node: lamp-1893-02-18-colt-rules-on-goebel-defence-boston, rev: 1, note: "Preliminary ruling on affidavits."}
  - {id: a15b, panel: century, lane: courts, node: lamp-1893-04-21-hallett-refuses-injunction-goebel-defence-st-louis, rev: 1, note: "Preliminary ruling on affidavits; the other way."}
  - {id: a15c, panel: century, lane: courts, node: lamp-1893-07-20-seaman-grants-injunction-goebel-defence-wisconsin, rev: 1, note: "Preliminary ruling; the Seventh Circuit appeal below is the same case."}
  - {id: a15d, panel: century, lane: courts, node: lamp-1894-05-01-seventh-circuit-affirms-wisconsin-goebel-ruling, rev: 1}
  - {id: a16, panel: century, lane: courts, node: lamp-1895-11-11-supreme-court-affirms-sawyer-man-decree, rev: 1, note: "Holds the Sawyer-Man claims other than the third too indefinite; does not decide priority."}
  - {id: a17, panel: century, lane: usa, node: lamp-1865-05-09-goebel-sewing-machine-hemmer-patent, rev: 1, note: "Shows only that Goebel held a patent in 1865; nothing about lamps."}
  - {id: b1, panel: race, lane: britain, node: lamp-1878-12-swan-rod-lamp-newcastle-chemical-society, rev: 2}
  - {id: b2, panel: race, lane: britain, node: lamp-1879-02-03-swan-shows-lamp-lit-and-phil, rev: 2, note: "Swan's own 1880 reference; date uncertain; no 1879 report found."}

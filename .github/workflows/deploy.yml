name: Check and deploy to GitHub Pages

# Every push and pull request runs the conformance check (build/conformance.py).
# The site deploys only from main, and only if the check passes.

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the append-only log check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml

      - name: Run conformance check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 build/conformance.py --base "$BASE"
          else
            echo "No earlier commit to compare against; skipping history rules."
            python3 build/conformance.py
          fi

  deploy:
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: python3 -m pip install --quiet pyyaml

      - name: Build the site from YAML (only digs listed in build/site.yaml are published)
        run: python3 build/tools/build_site.py

      - name: "Refuse to publish data exports (owner decision: downloads are private for now)"
        run: |
          if find site -type f \( -name '*.csv' -o -name '*.geojson' -o -name '*.graphml' -o -name 'SHA256SUMS*' \) | grep -q .; then
            echo "Data export files found in site/; refusing to deploy."; exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
